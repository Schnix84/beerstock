<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaltes Bier</title>
<meta name="description" content="Wie viele kalte Biere gerade im Kühlschrank stehen.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<style>
  :root {
    --page:           #0a0a0c;
    --page-2:         #121216;
    --surface-1:      #17171b;
    --text-primary:   #ffffff;
    --text-secondary: #b9b8b2;
    --text-muted:     #7d7c77;
    --border:         rgba(255,255,255,0.09);
    --border-hi:      rgba(255,255,255,0.16);

    --beer:      #e8912f;
    --beer-deep: #c96a12;
    --beer-lite: #ffc766;
    --foam:      #fff6e2;

    --cold:      #4aa3f0;
    --good:      #23c552;
    --gridline:  #2a2a30;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --page:           #f2f1ee;
      --page-2:         #fbfbf9;
      --surface-1:      #ffffff;
      --text-primary:   #0b0b0b;
      --text-secondary: #55544f;
      --text-muted:     #8b8a84;
      --border:         rgba(11,11,11,0.09);
      --border-hi:      rgba(11,11,11,0.14);

      --beer:      #e07c15;
      --beer-deep: #b45f08;
      --beer-lite: #ffb84d;
      --foam:      #fff3dd;

      --cold:      #2a78d6;
      --good:      #0e9c3c;
      --gridline:  #e3e2dc;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1000px 600px at 15% -10%, rgba(232,145,47,0.10), transparent 60%),
      radial-gradient(900px 600px at 85% 105%, rgba(74,163,240,0.10), transparent 60%),
      linear-gradient(180deg, var(--page), var(--page-2));
    background-attachment: fixed;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 100%; max-width: 360px;
    border-radius: 26px;
    border: 1px solid var(--border);
    background:
      linear-gradient(165deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 42%),
      var(--surface-1);
    box-shadow:
      0 1px 0 0 var(--border-hi) inset,
      0 24px 50px -24px rgba(0,0,0,0.75),
      0 2px 10px -4px rgba(0,0,0,0.4);
    padding: 32px 26px 26px;
    text-align: center;
    overflow: hidden;
  }
  @media (prefers-color-scheme: light) {
    .card { box-shadow: 0 1px 0 0 rgba(255,255,255,0.9) inset, 0 20px 42px -26px rgba(0,0,0,0.35), 0 2px 8px -4px rgba(0,0,0,0.12); }
  }
  .card::before {
    content: ""; position: absolute; inset: -55% 15% 45% 15%;
    background: radial-gradient(closest-side, rgba(232,145,47,0.30), transparent);
    pointer-events: none; filter: blur(6px);
  }
  .card > * { position: relative; }

  .eyebrow {
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 16px;
  }

  .stage { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .num {
    font-size: 100px; font-weight: 700; line-height: 0.92; letter-spacing: -0.035em;
    background: linear-gradient(170deg, var(--beer-lite), var(--beer) 45%, var(--beer-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(232,145,47,0.28));
  }
  .glass { filter: drop-shadow(0 10px 22px rgba(232,145,47,0.3)); flex: none; }

  /* Der Fuellstand entsteht, indem die ganze Inhaltsgruppe nach unten geschoben
     wird; das Bier-Rechteck ist deshalb absichtlich viel zu hoch. */
  .brewLevel { transition: transform 900ms cubic-bezier(.22,.8,.3,1); }

  /* Taktung inline am Kreis: nth-of-type wuerde hier die Schaumkuppen mitzaehlen. */
  .bub { animation: rise 3.4s linear infinite; transform-origin: center; }
  @keyframes rise {
    0%   { transform: translateY(0);     opacity: 0; }
    12%  { opacity: 0.85; }
    85%  { opacity: 0.65; }
    100% { transform: translateY(-10px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bub { animation: none; opacity: 0.5; }
    .brewLevel { transition: none; }
    .livedot { animation: none; }
  }

  .cap { font-size: 15px; color: var(--text-secondary); margin-top: 12px; font-weight: 500; }

  .footline {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--gridline);
    display: flex; justify-content: center; align-items: center; gap: 12px;
    font-size: 11.5px; color: var(--text-muted); flex-wrap: wrap;
  }
  .sep { color: var(--gridline); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px 6px 8px; border-radius: 999px;
    font-size: 13px; font-weight: 650; color: var(--text-primary);
    background: linear-gradient(160deg, color-mix(in srgb, var(--cold) 26%, transparent), color-mix(in srgb, var(--cold) 10%, transparent));
    border: 1px solid color-mix(in srgb, var(--cold) 34%, transparent);
    box-shadow: 0 0 18px -6px color-mix(in srgb, var(--cold) 55%, transparent);
  }
  .chip svg { width: 14px; height: 14px; }
  .chip.off {
    background: none; border-color: var(--border-hi);
    box-shadow: none; color: var(--text-muted); font-weight: 500;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Im Kühlschrank warten</div>
    <div class="stage">
      <div class="num" id="num">–</div>
      <svg class="glass" width="84" height="103" viewBox="0 0 62 76" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="var(--beer-lite)"/>
            <stop offset="55%"  stop-color="var(--beer)"/>
            <stop offset="100%" stop-color="var(--beer-deep)"/>
          </linearGradient>
          <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#fff" stop-opacity="0.34"/>
            <stop offset="26%"  stop-color="#fff" stop-opacity="0.06"/>
            <stop offset="72%"  stop-color="#fff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0.18"/>
          </linearGradient>
          <clipPath id="cup">
            <path d="M12 8h34l-3.4 54.5A7 7 0 0 1 35.6 69H22.4a7 7 0 0 1-7-6.5L12 8Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#cup)">
          <g class="brewLevel" id="brewLevel" transform="translate(0 48)">
            <rect x="8" y="20" width="46" height="150" fill="url(#brew)"/>
            <rect x="8" y="11" width="46" height="10" fill="var(--foam)"/>
            <circle cx="19" cy="12" r="5.5" fill="var(--foam)"/>
            <circle cx="30" cy="10" r="6.5" fill="var(--foam)"/>
            <circle cx="41" cy="12" r="5.5" fill="var(--foam)"/>
            <circle class="bub" cx="23" cy="32" r="2.1" fill="#fff" opacity="0.55"/>
            <circle class="bub" cx="33" cy="38" r="1.5" fill="#fff" opacity="0.5"  style="animation-duration:4.3s;animation-delay:-1.2s"/>
            <circle class="bub" cx="39" cy="34" r="2.4" fill="#fff" opacity="0.45" style="animation-duration:3.9s;animation-delay:-2.4s"/>
            <circle class="bub" cx="28" cy="44" r="1.3" fill="#fff" opacity="0.55" style="animation-duration:4.8s;animation-delay:-0.6s"/>
          </g>
          <rect x="8" y="0" width="46" height="76" fill="url(#gloss)"/>
        </g>
        <path d="M12 8h34l-3.4 54.5A7 7 0 0 1 35.6 69H22.4a7 7 0 0 1-7-6.5L12 8Z"
              stroke="var(--text-secondary)" stroke-opacity="0.5" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 8h34" stroke="var(--text-secondary)" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cap">kalte Biere</div>

    <div class="footline">
      <span class="chip" id="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--cold)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13.6V4.2a2 2 0 1 1 4 0v9.4a4 4 0 1 1-4 0Z"/>
        </svg>
        <span id="temp">–</span>
      </span>
      <span class="sep">·</span>
      <span id="stand">wird geladen …</span>
    </div>
  </main>

<script>
  // 12 Flaschen = randvolles Glas. Gezeichnet ist der volle Zustand; weniger Bier
  // entsteht, indem die Inhaltsgruppe nach unten geschoben wird.
  const KAPAZITAET  = 12;
  const OBERFLAECHE = { voll: 20, leer: 68 };   // y der Bieroberflaeche im SVG

  const el = {
    num:   document.getElementById('num'),
    level: document.getElementById('brewLevel'),
    temp:  document.getElementById('temp'),
    chip:  document.getElementById('chip'),
    stand: document.getElementById('stand'),
  };

  function zeichne(daten) {
    const n = Number(daten.biere);
    if (Number.isFinite(n)) {
      const anteil = Math.max(0, Math.min(n / KAPAZITAET, 1));
      const dy = (1 - anteil) * (OBERFLAECHE.leer - OBERFLAECHE.voll);
      el.level.setAttribute('transform', `translate(0 ${dy.toFixed(1)})`);
      el.num.textContent = n;
    }

    const t = Number(daten.temperatur);
    if (Number.isFinite(t)) {
      el.temp.textContent = t.toFixed(1).replace('.', ',') + ' °C';
      el.chip.classList.remove('off');
    } else {
      el.chip.classList.add('off');
      el.temp.textContent = 'keine Messung';
    }

    el.stand.textContent = standText(daten.stand);
  }

  // Absichtlich nur auf Tage genau - eine Uhrzeit wuerde verraten, wann jemand
  // am Kuehlschrank war.
  function standText(datum) {
    if (!datum) return 'Stand unbekannt';
    const d = new Date(datum + 'T12:00:00');
    if (isNaN(d)) return 'Stand unbekannt';
    const heute = new Date(); heute.setHours(12, 0, 0, 0);
    const tage = Math.round((heute - d) / 86400000);
    if (tage <= 0) return 'Stand: heute';
    if (tage === 1) return 'Stand: gestern';
    return `Stand: vor ${tage} Tagen`;
  }

  fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(zeichne)
    .catch(() => {
      el.num.textContent = '?';
      el.chip.classList.add('off');
      el.temp.textContent = 'keine Daten';
      el.stand.textContent = 'gerade nicht erreichbar';
    });
</script>
</body>
</html>
