<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaltes Bier</title>
<meta name="description" content="Wie viele kalte Biere gerade im Kühlschrank stehen.">
<meta name="theme-color" content="#1a120c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<style>
  /* ==========================================================================
     Ein Bierdeckel auf einem Wirtshaustisch.
     Bewusst eine einzige, festgelegte Welt statt hell/dunkel: das Motiv ist ein
     Gegenstand, der auf etwas liegt. Ein "heller Modus" waere hier kein Thema,
     sondern ein anderer Tisch - und der zweite Tisch macht das Bild nicht besser.

     Auf dem Deckel stehen zwei Dinge nebeneinander, und beide sagen dasselbe
     auf verschiedene Weise: das Glas zeigt den Bestand als Fuellstand und die
     Temperatur als Verhalten (Perlen, Krone, Schwitzwasser), die Strichliste
     zeigt die genaue Zahl. Das Glas liest man von weitem, die Striche zaehlt
     man aus der Naehe.
     ========================================================================== */
  :root {
    --tisch-hell:  #2a211a;
    --tisch-tief:  #150e09;
    --pappe-hell:  #e3d8c1;
    --pappe:       #d9cdb4;
    --pappe-tief:  #c6b898;
    --pappe-kante: #b3a684;
    --tinte:       #1d2a24;   /* Druckerschwarz, leicht gruenstichig */
    --gruen:       #2f5d4a;   /* Brauereigruen */
    --rot:         #a8342a;   /* Registerrot, nur fuer den Querstrich */
    --blass:       #6f6653;

    /* Von der Temperatur gesetzt (siehe STUFEN im Skript) */
    --ampel:       var(--blass);
    --schaum:      1;      /* Kronenhoehe, 0..1                       */
    --sprudel:     4.2s;   /* Steigzeit einer Blase                   */
    --sprudel-op:  0.6;    /* wie deutlich es perlt                   */
    --kondens:     0;      /* Schwitzwasser aussen am Glas            */
    --frost:       0;      /* Reif, nur ganz unten in der Skala       */

    /* Vom Bestand gesetzt. Startwert 0: das Glas ist beim ersten Bild leer und
       fuellt sich, sobald die Messung da ist - der Ladevorgang wird zum
       Einschenken statt zu einem Sprung. */
    --fuell:       0;
    --schaum-voll: 0;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(120% 90% at 50% 8%, var(--tisch-hell), var(--tisch-tief) 70%);
    display: grid; place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  /* Holzmaserung des Tisches - flach, sie soll nicht mit der Pappe konkurrieren */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(
      93deg, #ffffff06 0 1px, transparent 1px 3px, #00000010 3px 4px, transparent 4px 11px);
    mix-blend-mode: overlay;
  }

  .deckel {
    position: relative;
    width: min(86vw, 86vh, 430px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(85% 85% at 30% 22%, var(--pappe-hell), var(--pappe) 55%, var(--pappe-tief));
    box-shadow:
      0 26px 48px -20px rgba(0,0,0,0.85),
      0 3px 0 0 var(--pappe-kante) inset,
      0 -4px 0 0 #cdc0a2 inset;
    transform: rotate(-4deg);
    display: grid; place-items: center;
    color: var(--tinte);
  }
  /* gestanzter Innenring */
  .deckel::before {
    content: ""; position: absolute; inset: 5.5%; border-radius: 50%;
    border: 1.5px solid var(--gruen); opacity: 0.5;
  }
  /* Papierfaser */
  .deckel::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background-image:
      radial-gradient(#00000012 1px, transparent 1px),
      radial-gradient(#ffffff1c 1px, transparent 1px);
    background-size: 5px 5px, 7px 7px;
    background-position: 0 0, 3px 4px;
    pointer-events: none;
  }

  .inhalt { position: relative; z-index: 1; width: 78%; text-align: center; }

  .marke {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(11px, 3.1vmin, 16px);
    letter-spacing: 0.28em; text-indent: 0.28em; text-transform: uppercase;
    color: var(--gruen);
  }
  .regel { height: 1px; background: var(--gruen); opacity: 0.38; margin: 9px auto 14px; width: 60%; }

  /* --- Glas links, Strichliste rechts ------------------------------------ */
  .buehne { display: flex; align-items: center; justify-content: center; gap: 6%; }
  .buehne .glas  { width: 26%; flex: none; }
  .buehne .liste { flex: 1; min-width: 0; }
  .glas svg, .liste svg { width: 100%; height: auto; display: block; }
  /* Ohne Messung sagt das Glas nichts - dann tritt es zurueck, statt einen
     Fuellstand zu behaupten, den niemand kennt. */
  .glas.ungewiss { opacity: 0.3; }
  .glas { transition: opacity .5s; }

  /* --- Strichliste -------------------------------------------------------- */
  .strich {
    stroke: var(--tinte); stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 82; stroke-dashoffset: 82;
    animation: schreiben .28s ease-out forwards;
  }
  .strich.quer { stroke: var(--rot); }
  @keyframes schreiben { to { stroke-dashoffset: 0; } }

  .aus {
    font-family: ui-serif, Georgia, serif; font-style: italic;
    font-size: clamp(20px, 6vmin, 34px); fill: var(--rot); opacity: 0.85;
  }
  /* Das Gegenstueck zu "ausgetrunken", und darum bewusst nicht im Registerrot:
     ein voller Kuehlschrank ist keine Meldung, sondern der Idealzustand -
     also das Brauereigruen der Ueberschrift. */
  .voll {
    font-family: ui-serif, Georgia, serif; font-style: italic;
    font-size: clamp(24px, 7vmin, 40px); letter-spacing: 0.04em;
    fill: var(--gruen); opacity: 0.9;
  }

  /* --- Das Glas ----------------------------------------------------------- */
  .glas-riss  { fill: none; stroke: var(--tinte); stroke-width: 2.1; stroke-linejoin: round; }
  .glas-innen { fill: none; stroke: var(--gruen); stroke-width: 0.9; opacity: 0.45; }
  .glas-korpus{ fill: #ffffff; opacity: 0.26; }

  /* Der Bierspiegel. Voll steht er bei y=46, leer auf dem Boden bei y=150 -
     also 104 Einheiten Weg. Bier, Raster und Krone haengen in derselben
     Gruppe und wandern gemeinsam; die Blasen werden am selben Spiegel
     abgeschnitten, damit sie an der Oberflaeche zerplatzen. */
  .spiegel {
    transform-box: view-box;
    transform: translateY(calc((1 - var(--fuell)) * 104px));
    transition: transform .8s cubic-bezier(.2,.7,.3,1);
  }

  /* Die Krone sitzt auf dem Bierspiegel und schrumpft nach unten weg, wenn das
     Bier warm wird - warmes Bier traegt keinen Schaum. Im fast leeren Glas
     verschwindet sie ganz, sonst schwebt ein Schaumring ueber dem Boden. */
  .krone {
    transform-box: view-box; transform-origin: 50px 46px;
    transform: scaleY(calc(var(--schaum) * var(--schaum-voll)));
    transition: transform .6s cubic-bezier(.2,.7,.3,1);
  }

  .blase {
    transform-box: view-box;
    fill: #fffdf4;
    opacity: 0;
    animation: steigen var(--sprudel) linear infinite;
  }
  /* Die halbe Perlung faellt weg, sobald das Bier lau wird. */
  .blase.spaerlich { animation-name: steigen-spaerlich; }

  @keyframes steigen {
    0%   { transform: translate(0, 0);         opacity: 0; }
    12%  { opacity: var(--sprudel-op); }
    55%  { transform: translate(2.5px, -54px); }
    88%  { opacity: calc(var(--sprudel-op) * .55); }
    100% { transform: translate(-1.5px, -98px); opacity: 0; }
  }
  @keyframes steigen-spaerlich {
    0%   { transform: translate(0, 0);         opacity: 0; }
    12%  { opacity: calc(var(--sprudel-op) * .5); }
    55%  { transform: translate(2.5px, -54px); }
    88%  { opacity: calc(var(--sprudel-op) * .28); }
    100% { transform: translate(-1.5px, -98px); opacity: 0; }
  }

  /* Schwitzwasser: zwei Tropfen laufen, der Rest steht. */
  .kondens { fill: #ffffff; opacity: var(--kondens); transition: opacity .5s; }
  .kondens.laeuft { transform-box: view-box; animation: rinnen 9s ease-in infinite; }
  @keyframes rinnen {
    0%, 55% { transform: translateY(0); }
    92%     { transform: translateY(17px); opacity: 0; }
    93%,100%{ transform: translateY(0); opacity: 0; }
  }
  .reif { fill: #ffffff; opacity: var(--frost); transition: opacity .5s; }

  /* Ein Lichtstreifen wandert alle paar Sekunden ueber das Glas. */
  .glanz { transform-box: view-box; animation: wischen 7.5s ease-in-out infinite; }
  @keyframes wischen {
    0%, 62%   { transform: translateX(-70px); }
    88%, 100% { transform: translateX(120px); }
  }

  /* --- Fusszeile mit Ampel ------------------------------------------------ */
  .meta {
    margin-top: clamp(10px, 2.6vmin, 18px);
    font-size: clamp(9px, 2.3vmin, 12px);
    letter-spacing: 0.09em; color: var(--blass);
    white-space: nowrap;              /* der Einzeiler bleibt einzeilig */
  }
  .wort {
    font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ampel);
    transition: color .45s ease;
  }
  .meta .trenn { opacity: 0.45; margin: 0 0.5em; }
  .zahlen { font-variant-numeric: tabular-nums; }

  /* Die Ampel als gedruckte Skala: sechs Felder von eiskalt bis pisswarm,
     eine Nadel zeigt, wo der Kuehlschrank gerade steht. Sie macht sichtbar,
     warum das Wort daneben gerade so heisst. */
  .skala {
    position: relative; width: 74%; margin: 9px auto 0; height: 4px;
    border-radius: 2px; opacity: 0.85;
    background: linear-gradient(90deg,
      #2f86c4 0 10%, #2f5d4a 10% 30%, #5f7a33 30% 45%,
      #b08a1c 45% 60%, #c4661f 60% 80%, #a8342a 80% 100%);
    box-shadow: 0 0 0 1px #00000018 inset;
  }
  .nadel {
    position: absolute; top: -4px; left: 50%; width: 3px; height: 12px;
    border-radius: 2px; background: var(--tinte);
    box-shadow: 0 0 0 1.5px var(--pappe-hell);
    transform: translateX(-50%); opacity: 0;
    transition: left .45s cubic-bezier(.2,.7,.3,1), opacity .45s;
  }

  @media (prefers-reduced-motion: reduce) {
    .strich { animation: none; stroke-dashoffset: 0; }
    .blase, .glanz, .kondens.laeuft { animation: none; }
    .blase { opacity: calc(var(--sprudel-op) * .5); }
  }

  /* ==========================================================================
     BESTENLISTE
     Der Rechnungsblock des Wirts unter dem Deckel. Bewusst anderes Papier als
     die Pappe - heller und glatter -, damit man sieht, dass zwei Dinge
     uebereinanderliegen, statt dass eines ausfranst.

     Der Deckel oben gehoert dem AKTUELLEN ERSTEN, nicht diesem Kuehlschrank:
     er ist der Siegerplatz und wechselt den Besitzer. Der eigene Bestand steht
     in der Liste wie jeder andere, nur mit der Marke "gemessen".
     ========================================================================== */
  body { display: block; place-items: unset; padding: 0; }
  .seite { max-width: 430px; margin: 0 auto; padding: 20px 16px 40px; }
  main.deckel { margin: 0 auto; }

  .krone-zeile {
    text-align: center; font-size: 10px; letter-spacing: .24em;
    text-transform: uppercase; color: #c9a24a; margin: 2px 0 12px; min-height: 13px;
  }

  .block {
    position: relative; margin-top: 26px; border-radius: 3px; padding-bottom: 16px;
    background: linear-gradient(#efe7d3, #e2d8c0);
    box-shadow: 0 18px 34px -16px #000d, 0 1px 0 #fff6 inset;
    color: var(--tinte);
  }
  /* Abrisskante oben */
  .block::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: radial-gradient(circle at 4px 0, transparent 3.4px, #efe7d3 3.6px) 0 0/9px 7px repeat-x;
  }
  .block-kopf {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 18px 16px 8px; border-bottom: 1.5px solid var(--gruen);
  }
  .block-kopf .titel {
    font-family: ui-serif, Georgia, serif; font-size: 12.5px;
    letter-spacing: .24em; text-transform: uppercase; color: var(--gruen);
  }
  .block-kopf .datum { font-size: 9.5px; letter-spacing: .12em; color: var(--blass); }

  .zeile {
    display: grid; grid-template-columns: 22px 1fr auto;
    align-items: center; gap: 10px; padding: 11px 16px 10px;
    border-bottom: 1px solid #2f5d4a1f;
  }
  .zeile.ich { background: #2f5d4a0e; }
  .z-rang {
    font-family: ui-serif, Georgia, serif; font-size: 15px; color: var(--gruen);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .zeile.ich .z-rang { color: var(--rot); }
  .z-name {
    font-family: ui-serif, Georgia, serif; font-size: 14.5px;
    letter-spacing: .1em; text-transform: uppercase; line-height: 1;
    overflow-wrap: anywhere;
  }
  .z-striche { margin-top: 6px; height: 17px; }
  .z-striche svg { height: 17px; width: auto; display: block; }
  .z-rechts { text-align: right; line-height: 1.35; }
  .z-zahl {
    font-family: ui-serif, Georgia, serif; font-size: 21px;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  /* Das Temperaturwort traegt dieselbe Ampelfarbe wie oben auf dem Deckel -
     nur wird sie hier je Zeile gesetzt, nicht global ueber :root. */
  .z-wort { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; }
  .z-unten { font-size: 9.5px; letter-spacing: .07em; color: var(--blass); white-space: nowrap; margin-top: 4px; }
  .z-spark { margin-top: 5px; }
  .z-spark svg { display: block; margin-left: auto; }
  .z-marke {
    display: inline-block; font-size: 8px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gruen); border: 1px solid #2f5d4a55; border-radius: 2px;
    padding: 1px 4px; margin-left: 7px; vertical-align: 2px;
  }
  .leer-hinweis {
    padding: 22px 16px; text-align: center; font-size: 11.5px; line-height: 1.6;
    color: var(--blass);
  }

  /* --- Formulare ---------------------------------------------------------- */
  .block-fuss { padding: 16px 16px 0; }
  .melde { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px; }
  .melde.eins { grid-template-columns: 1fr; }
  .melde label { display: block; }
  .feld {
    display: block; width: 100%;
    border: none; border-bottom: 1.5px solid #2f5d4a55; background: transparent;
    padding: 7px 2px 5px; font: inherit; font-size: 13px; color: var(--tinte);
    font-variant-numeric: tabular-nums; border-radius: 0;
  }
  .feld:focus { outline: none; border-bottom-color: var(--gruen); }
  .feld::placeholder { color: #6f665366; }
  .feld-label {
    display: block; font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--blass); margin-bottom: 1px;
  }
  .knopf {
    width: 100%; border: none; border-radius: 2px; padding: 11px;
    background: var(--gruen); color: var(--pappe-hell);
    font-family: ui-serif, Georgia, serif; font-size: 12px;
    letter-spacing: .22em; text-transform: uppercase; cursor: pointer;
  }
  .knopf[disabled] { opacity: .5; cursor: default; }
  .knopf.leer {
    background: transparent; color: var(--gruen);
    box-shadow: inset 0 0 0 1.5px #2f5d4a66; margin-top: 7px;
  }
  .zeile-klein {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 9px; font-size: 9.5px; letter-spacing: .08em; color: var(--blass);
  }
  .zeile-klein button {
    border: none; background: none; padding: 0; font: inherit; color: var(--blass);
    text-decoration: underline; cursor: pointer;
  }
  .sagt {
    margin: 10px 0 0; padding: 8px 10px; border-radius: 2px; font-size: 11px;
    line-height: 1.5; background: #2f5d4a14; color: var(--gruen);
  }
  .sagt.schlecht { background: #a8342a14; color: var(--rot); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="seite">
  <div class="krone-zeile" id="krone"></div>
  <main class="deckel">
    <div class="inhalt">
      <div class="marke" id="marke">Kühlschrank</div>
      <div class="regel"></div>

      <div class="buehne">

        <!-- ============ Das Glas ============================================
             Ein Willibecher, gezeichnet wie der Rest des Deckels: Strichriss in
             Druckerschwarz, das Bier als Rasterflaeche. Es ist kein Foto und
             soll auch keines sein - es liegt gedruckt auf der Pappe.
             Es zaehlt nicht, das machen die Striche. Es zeigt den Bestand als
             Fuellstand und die Temperatur als Verhalten: kaltes Bier perlt
             schnell, traegt eine hohe Krone und beschlaegt aussen, pisswarmes
             steht still und flach da.
             ============================================================== -->
        <div class="glas" id="glas">
          <svg viewBox="0 0 100 172" role="img" aria-labelledby="glas-titel">
            <title id="glas-titel">Bierglas: Fuellstand nach Bestand, Zustand nach Temperatur</title>
            <defs>
              <path id="innenform" d="M27.5,20 C23,46 21.2,60 22,74 C23,99 29.5,130 31.5,150 L68.5,150 C70.5,130 77,99 78,74 C78.8,60 77,46 72.5,20 Z"/>
              <clipPath id="innen"><use href="#innenform"/></clipPath>
              <!-- alles unterhalb des Bierspiegels; wandert mit dem Bestand -->
              <clipPath id="unterm-spiegel">
                <rect class="spiegel" x="10" y="46" width="80" height="170"/>
              </clipPath>

              <linearGradient id="bier" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0"   stop-color="#e0a327"/>
                <stop offset=".55" stop-color="#cf8b16"/>
                <stop offset="1"   stop-color="#a86b0d"/>
              </linearGradient>
              <!-- Rasterpunkte: das Bier ist gedruckt, nicht gegossen -->
              <pattern id="raster" width="4" height="4" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="0.75" fill="#00000022"/>
                <circle cx="3" cy="3" r="0.55" fill="#ffffff22"/>
              </pattern>
              <linearGradient id="glanzfarbe" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"  stop-color="#ffffff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>
                <stop offset="1"  stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- Schatten auf der Pappe -->
            <ellipse cx="50" cy="156" rx="27" ry="5" fill="#00000018"/>

            <!-- Glaskoerper -->
            <path class="glas-korpus" d="M24,17 C19,45 17,60 18,75 C19,101 26,133 28,153 Q28,157 32,157 L68,157 Q72,157 72,153 C74,133 81,101 82,75 C83,60 81,45 76,17 Z"/>

            <g clip-path="url(#innen)">
              <!-- Bier samt Krone: eine Gruppe, die mit dem Bestand sinkt.
                   Die Flaeche reicht weit unter den Boden, damit im leeren
                   Glas nichts nachrutscht, was nicht mehr da ist. -->
              <g class="spiegel">
                <rect x="16" y="46" width="68" height="170" fill="url(#bier)"/>
                <rect x="16" y="46" width="68" height="170" fill="url(#raster)"/>

                <!-- Schaumkrone: Vollflaeche plus ausgefranster Rand -->
                <g class="krone">
                  <rect x="16" y="30" width="68" height="16" fill="#f2ead6"/>
                  <g fill="#f7f1e1">
                    <circle cx="26" cy="31" r="5.5"/><circle cx="36" cy="28.5" r="6.5"/>
                    <circle cx="47" cy="30" r="5.8"/><circle cx="58" cy="28" r="6.8"/>
                    <circle cx="69" cy="31" r="5.6"/><circle cx="78" cy="32.5" r="4.6"/>
                  </g>
                  <g fill="#00000012">
                    <circle cx="33" cy="38" r="1.5"/><circle cx="52" cy="41" r="1.2"/>
                    <circle cx="64" cy="37" r="1.7"/><circle cx="43" cy="35" r="1.1"/>
                  </g>
                </g>
              </g>

              <!-- Perlen. Sie steigen immer vom Boden auf, werden aber am
                   Bierspiegel abgeschnitten - im halbvollen Glas ist der Weg
                   entsprechend kurz. -->
              <g clip-path="url(#unterm-spiegel)">
                <circle class="blase"            cx="34" cy="146" r="1.5" style="animation-delay:-0.2s"/>
                <circle class="blase"            cx="47" cy="150" r="2.1" style="animation-delay:-1.4s"/>
                <circle class="blase"            cx="61" cy="147" r="1.3" style="animation-delay:-2.6s"/>
                <circle class="blase"            cx="40" cy="152" r="1.1" style="animation-delay:-0.9s"/>
                <circle class="blase"            cx="55" cy="149" r="1.8" style="animation-delay:-2.1s"/>
                <circle class="blase spaerlich"  cx="30" cy="151" r="1.2" style="animation-delay:-1.7s"/>
                <circle class="blase spaerlich"  cx="66" cy="152" r="1.6" style="animation-delay:-0.5s"/>
                <circle class="blase spaerlich"  cx="50" cy="148" r="1.0" style="animation-delay:-3.0s"/>
              </g>

              <!-- Reif, nur bei eiskalt - und nur dort, wo Bier hinter dem
                   Glas steht; die leere Haelfte beschlaegt nicht. -->
              <g class="reif" clip-path="url(#unterm-spiegel)">
                <circle cx="30" cy="62" r="1.1"/><circle cx="41" cy="84" r="0.9"/>
                <circle cx="66" cy="70" r="1.2"/><circle cx="57" cy="104" r="1"/>
                <circle cx="36" cy="118" r="1.3"/><circle cx="70" cy="97" r="0.9"/>
                <circle cx="47" cy="66" r="0.8"/><circle cx="62" cy="127" r="1.1"/>
              </g>

              <!-- Lichtstreifen -->
              <g class="glanz">
                <rect x="24" y="8" width="13" height="160" fill="url(#glanzfarbe)" transform="rotate(8 30 88)"/>
              </g>
            </g>

            <!-- Schwitzwasser aussen -->
            <g class="kondens">
              <ellipse cx="29" cy="70" rx="1.5" ry="2.1"/>
              <ellipse cx="73" cy="92" rx="1.3" ry="1.9"/>
              <ellipse cx="33" cy="112" rx="1.1" ry="1.6"/>
              <ellipse cx="69" cy="130" rx="1.6" ry="2.3"/>
            </g>
            <ellipse class="kondens laeuft" cx="26" cy="52" rx="1.7" ry="2.5" style="animation-delay:-2s"/>
            <ellipse class="kondens laeuft" cx="76" cy="66" rx="1.4" ry="2.1" style="animation-delay:-6s"/>

            <!-- Riss -->
            <path class="glas-riss" d="M24,17 C19,45 17,60 18,75 C19,101 26,133 28,153 Q28,157 32,157 L68,157 Q72,157 72,153 C74,133 81,101 82,75 C83,60 81,45 76,17 Z"/>
            <ellipse class="glas-riss" cx="50" cy="17" rx="26" ry="5"/>
            <use class="glas-innen" href="#innenform"/>
          </svg>
        </div>

        <div class="liste">
          <svg viewBox="0 0 300 120" role="img" aria-labelledby="titel">
            <title id="titel">Strichliste der kalten Biere</title>
            <g id="striche"></g>
          </svg>
        </div>
      </div>

      <!-- Einzeiler. Die Menge steht ausschliesslich in den Strichen - eine
           Ziffer daneben waere dieselbe Zahl zweimal und nimmt der Strichliste
           genau die Aufgabe weg, fuer die sie da ist. Das erste Wort spricht
           dafuer mit: es faerbt sich und heisst je nach Messung anders. -->
      <div class="meta">
        <span class="wort" id="wort">kalt</span><span class="trenn">·</span><span
          class="zahlen" id="temp">–</span><span class="trenn">·</span><span
          id="stand">wird geladen</span>
      </div>
      <div class="skala" aria-hidden="true"><span class="nadel" id="nadel"></span></div>
    </div>
  </main>

  <section class="block" id="block" hidden>
    <div class="block-kopf">
      <div class="titel">Wer hat kalt</div>
      <div class="datum" id="block-datum"></div>
    </div>

    <div id="rangliste"></div>

    <div class="block-fuss">
      <!-- Angemeldet: melden. -->
      <form id="melde-form" hidden>
        <div class="melde">
          <label><span class="feld-label">Biere</span>
            <input class="feld" id="f-biere" inputmode="numeric" autocomplete="off"
                   placeholder="9" required></label>
          <label><span class="feld-label">Grad</span>
            <input class="feld" id="f-grad" inputmode="decimal" autocomplete="off"
                   placeholder="4,9" required></label>
        </div>
        <button class="knopf" type="submit">Eintragen</button>
        <div class="zeile-klein">
          <span id="wer-bin-ich"></span>
          <button type="button" id="abmelden">abmelden</button>
        </div>
      </form>

      <!-- Nicht angemeldet: erst der Knopf, dann das Formular. -->
      <button class="knopf leer" id="zeig-anmeldung" hidden>Mit Einladungscode anmelden</button>
      <form id="anmelde-form" hidden>
        <div class="melde eins">
          <label><span class="feld-label">Einladungscode</span>
            <input class="feld" id="f-code" autocomplete="off"
                   placeholder="BIER-XXXXX-XXXXX" required></label>
          <label><span class="feld-label">Name für die Liste</span>
            <input class="feld" id="f-name" autocomplete="nickname" maxlength="20"
                   placeholder="Basti" required></label>
        </div>
        <button class="knopf" type="submit">Anmelden</button>
      </form>

      <p class="sagt" id="sagt" hidden></p>
    </div>
  </section>
</div>


<script>
  const NS = 'http://www.w3.org/2000/svg';

  // So weit reicht die Strichliste, und ab so vielen Flaschen ist auch das Glas
  // voll - beide dieselbe Grenze, sonst stuende das Glas die halbe Skala lang
  // stumm auf Anschlag. Vierundzwanzig, weil fuenf Buendel das letzte sind, was
  // man auf einen Blick liest; darueber sieht man ohnehin nur noch "viel".
  const VOLL_AB = 24;

  // --------------------------------------------------------------------------
  // Die Ampel. Sechs Stufen, und die Farben sind keine Thermometerfarben,
  // sondern ein Urteil: gruen ist das Brauereigruen des Deckels (so soll es
  // sein), rot ist das Registerrot des Querstrichs (so soll es nicht sein).
  // Blau darunter heisst nicht "besser", sondern "kaelter als noetig".
  // --------------------------------------------------------------------------
  const STUFEN = [
    // bis °C, Wort,        Farbe,     Krone, Steigzeit, Perlen, Kondens, Reif
    [  2, 'eiskalt',   '#2f86c4', 1.00, '2.7s', 0.90, 0.60, 0.55],
    [  6, 'kalt',      '#2f5d4a', 0.94, '3.2s', 0.85, 0.50, 0.00],
    [  9, 'kühl',      '#5f7a33', 0.78, '4.2s', 0.70, 0.30, 0.00],
    [ 12, 'lauwarm',   '#b08a1c', 0.55, '5.6s', 0.50, 0.10, 0.00],
    [ 16, 'warm',      '#c4661f', 0.34, '7.4s', 0.32, 0.00, 0.00],
    [ 99, 'pisswarm',  '#a8342a', 0.16, '9.5s', 0.16, 0.00, 0.00],
  ];

  function stufe(t) {
    for (const s of STUFEN) if (t < s[0]) return s;
    return STUFEN[STUFEN.length - 1];
  }

  // --------------------------------------------------------------------------
  // Der Bestand steht doppelt da, und das mit Absicht: die Striche sind die
  // genaue Zahl, der Bierspiegel der Blick von weitem. Ein halb leeres Glas
  // sieht man auch dann, wenn man die Striche gar nicht liest.
  // --------------------------------------------------------------------------
  function fuellstand(anzahl) {
    const el = document.documentElement.style;
    const f = Number.isFinite(anzahl)
      ? Math.max(0, Math.min(1, anzahl / VOLL_AB))
      : 0.5;                       // ohne Messung: halb, dazu das gedimmte Glas
    el.setProperty('--fuell', f.toFixed(3));
    // Die Krone blendet ueber das erste Achtel ein - darunter schwebte sonst
    // ein Schaumring knapp ueber dem Boden.
    el.setProperty('--schaum-voll', Math.min(1, f * 8).toFixed(3));
    document.getElementById('glas').classList.toggle('ungewiss', !Number.isFinite(anzahl));
  }

  // --------------------------------------------------------------------------
  // Strichliste, wie sie der Wirt anschreibt: Vierergruppe plus Querstrich.
  // Die Gruppen brechen ab drei Stueck in mehrere Reihen um, sonst laufen sie
  // bei zwoelf Flaschen ueber den Rand des Deckels hinaus.
  // --------------------------------------------------------------------------
  function striche(anzahl) {
    const g = document.getElementById('striche');
    g.textContent = '';

    if (!Number.isFinite(anzahl) || anzahl <= 0) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 150); t.setAttribute('y', 74);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'aus');
      // Kein "0": eine leere Strichliste sagt dasselbe freundlicher.
      t.textContent = anzahl === 0 ? 'ausgetrunken' : '?';
      g.appendChild(t);
      return;
    }

    // Das andere Ende: mehr, als die Liste tragen kann.
    if (anzahl > VOLL_AB) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 150); t.setAttribute('y', 74);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'voll');
      t.textContent = 'voll';
      g.appendChild(t);
      return;
    }

    const gruppen  = Math.ceil(anzahl / 5);
    const proReihe = gruppen <= 2 ? gruppen : gruppen <= 4 ? 2 : 3;
    const reihen   = Math.ceil(gruppen / proReihe);

    const gBreite = 74, gAbstand = 24, zAbstand = 44;
    const yMitte  = 60;
    const yStart  = yMitte - ((reihen - 1) * zAbstand) / 2;

    let stift = 0;   // fuer den zeitlichen Versatz beim Anschreiben
    for (let gi = 0; gi < gruppen; gi++) {
      const imBund   = Math.min(5, anzahl - gi * 5);
      const reihe    = Math.floor(gi / proReihe);
      const spalte   = gi % proReihe;
      const inReihe  = Math.min(proReihe, gruppen - reihe * proReihe);
      const gesamt   = inReihe * gBreite + (inReihe - 1) * gAbstand;
      const x0 = 150 - gesamt / 2 + spalte * (gBreite + gAbstand);
      const y  = yStart + reihe * zAbstand;

      for (let s = 0; s < Math.min(imBund, 4); s++) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', 'strich');
        l.setAttribute('x1', x0 + 9 + s * 16); l.setAttribute('y1', y - 15);
        l.setAttribute('x2', x0 + 13 + s * 16); l.setAttribute('y2', y + 15);
        l.style.animationDelay = (stift++ * 0.075) + 's';
        g.appendChild(l);
      }
      if (imBund === 5) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', 'strich quer');
        l.setAttribute('x1', x0 + 2);  l.setAttribute('y1', y + 13);
        l.setAttribute('x2', x0 + 66); l.setAttribute('y2', y - 13);
        l.style.animationDelay = (stift++ * 0.075) + 's';
        g.appendChild(l);
      }
    }
  }

  // --------------------------------------------------------------------------
  // `stand` ist der Zeitpunkt des letzten brauchbaren Kuehlschrankfotos, auf die
  // volle Stunde gerundet und mit Zeitzonen-Offset: die Minute bleibt damit
  // privat, waehrend die Rechnung auch in einer anderen Zeitzone stimmt.
  // --------------------------------------------------------------------------
  function standText(zeit) {
    if (!zeit) return 'Stand unbekannt';
    const d = new Date(zeit);
    if (isNaN(d)) return 'Stand unbekannt';
    const stunden = (Date.now() - d) / 3600000;
    if (stunden < 24) return 'aktuell';
    const tage = Math.floor(stunden / 24);
    return tage === 1 ? 'vor 1 Tag' : 'vor ' + tage + ' Tagen';
  }

  function temperatur(t) {
    const el = document.documentElement.style;
    const messung = Number.isFinite(t);
    const s = stufe(messung ? t : 99);

    document.getElementById('temp').textContent =
      messung ? t.toFixed(1).replace('.', ',') + ' °C' : 'keine Messung';

    // Ohne Messung bleibt das Wort neutral - die Ampel darf nicht behaupten,
    // etwas zu wissen.
    document.getElementById('wort').textContent = messung ? s[1] : 'Bier';
    el.setProperty('--ampel', messung ? s[2] : 'var(--blass)');
    el.setProperty('--schaum',     messung ? s[3] : 0.8);
    el.setProperty('--sprudel',    messung ? s[4] : '4.2s');
    el.setProperty('--sprudel-op', messung ? s[5] : 0.6);
    el.setProperty('--kondens',    messung ? s[6] : 0);
    el.setProperty('--frost',      messung ? s[7] : 0);

    const nadel = document.getElementById('nadel');
    nadel.style.left = (messung ? Math.max(0, Math.min(100, (t / 20) * 100)) : 50) + '%';
    nadel.style.opacity = messung ? 1 : 0;
  }

  function zeichne(daten) {
    const n = Number(daten.biere);
    striche(n);
    fuellstand(n);
    temperatur(Number(daten.temperatur));
    document.getElementById('stand').textContent = standText(daten.stand);
  }


  // ==========================================================================
  // Die Bestenliste. Sie kommt vom Worker; `status.json` bleibt als Rueckfall
  // liegen, damit der eigene Bestand auch dann noch dasteht, wenn die API
  // gerade nicht antwortet. Die Seite selbst bleibt statisch - sie fragt nur.
  // ==========================================================================
  const API = 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';

  const merke  = () => localStorage.getItem(SPEICHER);
  const nimm   = t => localStorage.setItem(SPEICHER, t);
  const wirf   = () => localStorage.removeItem(SPEICHER);

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };

  let meinName = null;   // steht nach der ersten Antwort fest

  function sagt(text, schlecht) {
    const p = $('sagt');
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  /* Kleine, einreihige Strichliste fuer eine Listenzeile. Dieselbe Regel wie
     oben - Vierergruppe plus roter Querstrich -, nur klein und ohne Umbruch.
     Ueber VOLL_AB steht auch hier nur noch das Wort. */
  function stricheKlein(anzahl) {
    const svg = document.createElementNS(NS, 'svg');
    const wort = t => {
      svg.setAttribute('viewBox', '0 0 120 30'); svg.setAttribute('height', 17);
      const n = document.createElementNS(NS, 'text');
      n.setAttribute('x', 0); n.setAttribute('y', 23); n.setAttribute('font-size', 20);
      n.setAttribute('font-style', 'italic');
      n.setAttribute('font-family', 'ui-serif, Georgia, serif');
      n.setAttribute('fill', t === 'voll' ? 'var(--gruen)' : 'var(--rot)');
      n.setAttribute('opacity', .85);
      n.textContent = t;
      svg.appendChild(n);
      return svg;
    };
    if (!Number.isFinite(anzahl) || anzahl <= 0) return wort('ausgetrunken');
    if (anzahl > VOLL_AB) return wort('voll');

    const gruppen = Math.ceil(anzahl / 5), gB = 34, gA = 14;
    const w = gruppen * gB + (gruppen - 1) * gA;
    svg.setAttribute('viewBox', '0 0 ' + w + ' 30'); svg.setAttribute('height', 17);
    for (let gi = 0; gi < gruppen; gi++) {
      const imBund = Math.min(5, anzahl - gi * 5), x0 = gi * (gB + gA);
      for (let s = 0; s < Math.min(imBund, 4); s++) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', 'strich'); l.setAttribute('stroke-width', 3.4);
        l.setAttribute('x1', x0 + 4 + s * 7.5); l.setAttribute('y1', 6);
        l.setAttribute('x2', x0 + 6 + s * 7.5); l.setAttribute('y2', 24);
        svg.appendChild(l);
      }
      if (imBund === 5) {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('class', 'strich quer'); l.setAttribute('stroke-width', 3.4);
        l.setAttribute('x1', x0 + 1); l.setAttribute('y1', 22);
        l.setAttribute('x2', x0 + 31); l.setAttribute('y2', 8);
        svg.appendChild(l);
      }
    }
    return svg;
  }

  /* Verlauf der letzten Wochen. Klein genug, um Beiwerk zu bleiben. */
  function sparkline(werte, farbe) {
    const w = 62, h = 20;
    if (!werte || werte.length < 2) return document.createComment('kein Verlauf');
    const max = Math.max(...werte, 1);
    const px = werte.map((v, i) => [
      (i / (werte.length - 1)) * (w - 2) + 1,
      h - 2 - (v / max) * (h - 4),
    ]);
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('aria-hidden', 'true');
    const f = document.createElementNS(NS, 'path');
    f.setAttribute('d', 'M' + px[0][0] + ',' + h + ' ' +
      px.map(p => 'L' + p[0] + ',' + p[1]).join(' ') + ' L' + px[px.length - 1][0] + ',' + h + ' Z');
    f.setAttribute('fill', farbe); f.setAttribute('opacity', .13);
    svg.appendChild(f);
    const l = document.createElementNS(NS, 'polyline');
    l.setAttribute('points', px.map(p => p.join(',')).join(' '));
    l.setAttribute('fill', 'none'); l.setAttribute('stroke', farbe);
    l.setAttribute('stroke-width', 1.4);
    l.setAttribute('stroke-linejoin', 'round'); l.setAttribute('stroke-linecap', 'round');
    svg.appendChild(l);
    const p = document.createElementNS(NS, 'circle');
    p.setAttribute('cx', px[px.length - 1][0]); p.setAttribute('cy', px[px.length - 1][1]);
    p.setAttribute('r', 1.9); p.setAttribute('fill', farbe);
    svg.appendChild(p);
    return svg;
  }

  function rangliste(feld) {
    const ziel = $('rangliste');
    ziel.textContent = '';

    if (!feld.length) {
      ziel.appendChild(el('div', 'leer-hinweis',
        'Noch hat niemand gemeldet. Der erste Eintrag bekommt den Deckel.'));
      return;
    }

    feld.forEach((p, i) => {
      // Dieselbe Ampel wie oben auf dem Deckel - Wort und Farbe kommen aus
      // STUFEN, nicht aus einer zweiten Tabelle.
      const s = stufe(p.temperatur);
      const ich = meinName && p.name === meinName;

      const z = el('div', 'zeile' + (ich ? ' ich' : ''));
      z.appendChild(el('div', 'z-rang', String(i + 1)));

      const mitte = el('div');
      const name = el('div', 'z-name');
      name.textContent = p.name;
      if (p.gemessen) name.appendChild(el('span', 'z-marke', 'gemessen'));
      mitte.appendChild(name);
      const str = el('div', 'z-striche');
      str.appendChild(stricheKlein(p.biere));
      mitte.appendChild(str);
      z.appendChild(mitte);

      const rechts = el('div', 'z-rechts');
      rechts.appendChild(el('div', 'z-zahl', String(p.biere)));
      const unten = el('div', 'z-unten');
      const wort = el('span', 'z-wort', s[1]);
      wort.style.color = s[2];
      unten.appendChild(wort);
      unten.appendChild(document.createTextNode(
        ' · ' + p.temperatur.toFixed(1).replace('.', ',') + ' °C · ' + standText(p.gemeldet)));
      rechts.appendChild(unten);
      const sp = el('div', 'z-spark');
      sp.appendChild(sparkline(p.verlauf, s[2]));
      rechts.appendChild(sp);
      z.appendChild(rechts);

      ziel.appendChild(z);
    });
  }

  function formular() {
    const drin = !!merke();
    $('melde-form').hidden = !drin;
    $('zeig-anmeldung').hidden = drin;
    if (drin) {
      $('anmelde-form').hidden = true;
      $('wer-bin-ich').textContent = meinName ? 'angemeldet als ' + meinName : 'angemeldet';
    }
  }

  function zeichneFeld(feld) {
    $('block').hidden = false;
    $('block-datum').textContent =
      new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });

    if (feld.length) {
      // Der Deckel gehoert dem Ersten. `zeichne` rechnet wie immer, nur mit
      // seinen Werten - Glas, Striche, Ampel und Nadel bleiben unangetastet.
      const erster = feld[0];
      $('marke').textContent = erster.name;
      $('krone').textContent = '① Führt das Feld an';
      zeichne({ biere: erster.biere, temperatur: erster.temperatur, stand: erster.gemeldet });
    } else {
      $('krone').textContent = '';
      $('marke').textContent = 'Kühlschrank';
      rueckfall();
    }
    rangliste(feld);
    formular();
  }

  /* Rueckfall: der eigene Kuehlschrank aus status.json, wie die Seite es vor
     der Bestenliste gemacht hat. */
  function rueckfall() {
    return fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
      .then(zeichne)
      .catch(() => {
        striche(NaN); fuellstand(NaN); temperatur(NaN);
        $('temp').textContent = 'keine Daten';
        $('stand').textContent = 'gerade nicht erreichbar';
      });
  }

  async function hole() {
    try {
      const r = await fetch(API + '/api/leaderboard', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      zeichneFeld(d.feld || []);
    } catch (e) {
      // API weg: der Deckel zeigt wieder den eigenen Kuehlschrank, der Block
      // bleibt draussen. Lieber weniger als eine leere Tabelle.
      $('block').hidden = true;
      $('krone').textContent = '';
      $('marke').textContent = 'Kühlschrank';
      await rueckfall();
    }
  }

  async function ruf(pfad, rumpf) {
    const kopf = { 'Content-Type': 'application/json' };
    const token = merke();
    if (token) kopf['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + pfad, {
      method: 'POST', headers: kopf, body: JSON.stringify(rumpf),
    });
    let d = {};
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.fehler || ('Fehler ' + r.status));
    return d;
  }

  // --- Bedienung ------------------------------------------------------------
  $('zeig-anmeldung').addEventListener('click', () => {
    $('zeig-anmeldung').hidden = true;
    $('anmelde-form').hidden = false;
    $('f-code').focus();
  });

  $('anmelde-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    knopf.disabled = true; sagt('');
    try {
      const d = await ruf('/api/register', {
        code: $('f-code').value, name: $('f-name').value,
      });
      nimm(d.token);
      meinName = d.name;
      $('anmelde-form').hidden = true;
      sagt('Angemeldet als ' + d.name + '. Jetzt eintragen, wie viel kalt steht.');
      formular();
      $('f-biere').focus();
    } catch (e) {
      sagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  $('melde-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    knopf.disabled = true; sagt('');
    try {
      const d = await ruf('/api/report', {
        biere: parseInt($('f-biere').value, 10),
        temperatur: $('f-grad').value,
      });
      meinName = d.name;
      sagt(d.rang === 1
        ? 'Eingetragen — du führst das Feld an.'
        : 'Eingetragen. Platz ' + d.rang + '.');
      await hole();
    } catch (e) {
      sagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  $('abmelden').addEventListener('click', () => {
    // Nur das Token hier im Browser. Der Eintrag in der Liste bleibt - eine
    // Abmeldung ist kein Austritt aus dem Wettbewerb.
    wirf();
    meinName = null;
    sagt('Abgemeldet. Dein Eintrag bleibt in der Liste stehen.');
    formular();
  });

  /* Wer schon angemeldet ist, soll seinen Namen kennen, BEVOR die Liste
     gezeichnet wird - sonst faerbt sich die eigene Zeile erst nach der ersten
     Meldung. Ein 401 heisst: das Token gilt nicht mehr (Nutzer geloescht), dann
     hier gleich wegwerfen, statt den Anmeldeknopf zu verstecken. */
  async function werBinIch() {
    const token = merke();
    if (!token) return;
    try {
      const r = await fetch(API + '/api/me', {
        headers: { Authorization: 'Bearer ' + token }, cache: 'no-store',
      });
      if (r.status === 401) { wirf(); return; }
      if (!r.ok) return;
      meinName = (await r.json()).name;
    } catch { /* offline - dann eben ohne Hervorhebung */ }
  }
