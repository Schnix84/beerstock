<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaltes Bier</title>
<meta name="description" content="Wer gerade am meisten kaltes Bier hat — angeschrieben an der Kneipentafel.">
<meta name="theme-color" content="#20262a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<style>
  /* ==========================================================================
     ENTWURF „TAFEL“ — die Kneipentafel neben dem Zapfhahn.

     Eine Welt, kein Hell/Dunkel: das Motiv ist ein Gegenstand im Raum, und der
     Wirt stellt die Tafel nicht tagsüber auf Weiß um. Alles ist angeschrieben,
     nichts ist gedruckt — Kreide franst, Kreide sitzt schief, Kreide wischt man
     weg. Deshalb ist auch die Rangfolge eine Speisekarte: Name, Punktreihe,
     Zahl. Genau so, wie das Tagesgericht dort steht.

     Der Kopf gehört dem AKTUELLEN ERSTEN, nicht diesem Kühlschrank. Er ist der
     Siegerplatz und wechselt den Besitzer.
     ========================================================================== */
  :root {
    --schiefer:    #262c2e;
    --schiefer-t:  #191d1f;
    --holz:        #6b4a2c;
    --holz-t:      #3f2a17;
    --kreide:      #eef1ea;
    --kreide-matt: #cfd6cd;
    --kreide-weg:  #93a09a;   /* halb weggewischt: Nebentext            */
    --gelb:        #e8c766;   /* die gelbe Kreide, nur für den Ersten   */
    --rot:         #d9705f;   /* rote Kreide: Querstrich, Warnung       */
    --ampel:       var(--kreide-matt);
    --hand: 'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;

    /* Von der Temperatur gesetzt (die Spalten 4..8 von STUFEN) */
    --schaum:      1;      /* Kronenhoehe, 0..1                       */
    --sprudel:     4.2s;   /* Steigzeit einer Blase                   */
    --sprudel-op:  0.6;    /* wie deutlich es perlt                   */
    --kondens:     0;      /* Schwitzwasser aussen am Glas            */
    --frost:       0;      /* Reif, nur ganz unten in der Skala       */

    /* Vom Bestand gesetzt. Startwert 0: das Glas ist beim ersten Bild leer und
       fuellt sich, sobald die Messung da ist - der Ladevorgang wird zum
       Einschenken statt zu einem Sprung. */
    --fuell:       0;
    --schaum-voll: 0;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--kreide);
    background: #14181a;
    padding: clamp(10px, 3vw, 28px);
    -webkit-font-smoothing: antialiased;
  }

  /* --- Der Holzrahmen ----------------------------------------------------- */
  .brett {
    max-width: 520px; margin: 0 auto; border-radius: 6px;
    padding: clamp(9px, 2.4vw, 15px);
    background:
      repeating-linear-gradient(97deg, #ffffff0a 0 2px, transparent 2px 7px, #0006 7px 8px, transparent 8px 19px),
      linear-gradient(160deg, var(--holz), var(--holz-t) 60%, #2c1c0f);
    box-shadow:
      0 30px 60px -24px #000d,
      0 1px 0 #ffffff22 inset,
      0 -2px 0 #0008 inset;
  }
  .tafel {
    position: relative; border-radius: 3px; overflow: hidden;
    padding: clamp(18px, 5vw, 30px) clamp(15px, 4.5vw, 26px) clamp(18px, 4vw, 26px);
    background:
      radial-gradient(120% 80% at 22% 8%, #37403f 0%, var(--schiefer) 45%, var(--schiefer-t) 100%);
    box-shadow: 0 0 0 1px #0009 inset, 0 14px 30px -14px #000a inset;
  }
  /* Schiefer ist nie glatt: feines Korn plus die Schlieren vom letzten Wischen */
  .tafel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(#ffffff0d 1px, transparent 1.4px),
      radial-gradient(#00000030 1px, transparent 1.6px);
    background-size: 4px 4px, 6px 6px;
    background-position: 0 0, 2px 3px;
  }
  .tafel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .22;
    background:
      radial-gradient(60% 30% at 18% 34%, #ffffff28, transparent 70%),
      radial-gradient(45% 22% at 76% 62%, #ffffff20, transparent 70%),
      radial-gradient(70% 18% at 50% 88%, #ffffff14, transparent 70%);
    mix-blend-mode: screen;
  }
  .tafel > * { position: relative; z-index: 1; }

  /* Alles Angeschriebene bekommt denselben leichten Kreidesaum. */
  .kr { text-shadow: 0 0 1px #ffffff5c, 0 1px 2px #00000055; }

  /* --- Kopf: der Erste ---------------------------------------------------- */
  .krone-zeile {
    font-family: var(--hand); font-size: 12.5px; letter-spacing: .12em;
    color: var(--gelb); opacity: .92; min-height: 15px; transform: rotate(-.7deg);
  }
  .hero-name {
    font-family: var(--hand); font-weight: 400;
    font-size: clamp(30px, 10.5vw, 50px); line-height: 1.18;
    margin: 4px 0 7px; transform: rotate(-1.2deg); transform-origin: left;
    overflow-wrap: anywhere;
  }
  .hero-unter {
    font-family: var(--hand); font-size: 13px; color: var(--kreide-weg);
    transform: rotate(-.6deg); transform-origin: left;
  }
  .hero-unter .marke-gemessen {
    color: var(--gelb); border-bottom: 1px solid #e8c76655; padding-bottom: 1px;
  }

  /* Oben zwei Dinge nebeneinander, und beide sagen dasselbe auf verschiedene
     Weise: die Striche nennen die genaue Zahl, das Glas zeigt den Bestand als
     Fuellstand und die Temperatur als Verhalten. Die Striche zaehlt man aus der
     Naehe, das Glas liest man von weitem. */
  .hero-oben { display: flex; align-items: center; gap: 5%; }
  .hero-text { flex: 1; min-width: 0; }
  .hero-glas { flex: none; width: 26%; max-width: 116px; }
  .hero-glas svg { width: 100%; height: auto; display: block; }
  /* Ohne Messung sagt das Glas nichts - dann tritt es zurueck, statt einen
     Fuellstand zu behaupten, den niemand kennt. */
  .hero-glas { transition: opacity .5s; }
  .hero-glas.ungewiss { opacity: .28; }

  .hero-striche { margin: clamp(12px, 3.4vw, 20px) 0 4px; }
  .hero-striche svg { width: 100%; height: auto; display: block; }

  /* --- Das Glas, mit Kreide gezeichnet ------------------------------------
     Uebernommen von der Live-Seite; hier nur andere Farben, weil auf einer
     Tafel nichts gedruckt ist. Das Bier bleibt bernstein - es ist die einzige
     bunte Kreide auf dem Brett und darf das auch sein. */
  .glas-riss  { fill: none; stroke: var(--kreide); stroke-width: 2.1; stroke-linejoin: round; }
  .glas-innen { fill: none; stroke: var(--kreide-weg); stroke-width: 0.9; opacity: .5; }
  .glas-korpus{ fill: #ffffff; opacity: .07; }

  /* Der Bierspiegel. Voll steht er bei y=46, leer auf dem Boden bei y=150 -
     also 104 Einheiten Weg. Bier, Raster und Krone haengen in derselben Gruppe
     und wandern gemeinsam; die Blasen werden am selben Spiegel abgeschnitten,
     damit sie an der Oberflaeche zerplatzen. */
  .spiegel {
    transform-box: view-box;
    transform: translateY(calc((1 - var(--fuell)) * 104px));
    transition: transform .8s cubic-bezier(.2,.7,.3,1);
  }
  /* Die Krone sitzt auf dem Bierspiegel und schrumpft nach unten weg, wenn das
     Bier warm wird - warmes Bier traegt keinen Schaum. Im fast leeren Glas
     verschwindet sie ganz, sonst schwebt ein Schaumring ueber dem Boden. */
  .krone {
    transform-box: view-box; transform-origin: 50px 46px;
    transform: scaleY(calc(var(--schaum) * var(--schaum-voll)));
    transition: transform .6s cubic-bezier(.2,.7,.3,1);
  }
  .blase {
    transform-box: view-box; fill: #fffdf4; opacity: 0;
    animation: steigen var(--sprudel) linear infinite;
  }
  /* Die halbe Perlung faellt weg, sobald das Bier lau wird. */
  .blase.spaerlich { animation-name: steigen-spaerlich; }
  @keyframes steigen {
    0%   { transform: translate(0, 0);         opacity: 0; }
    12%  { opacity: var(--sprudel-op); }
    55%  { transform: translate(2.5px, -54px); }
    88%  { opacity: calc(var(--sprudel-op) * .55); }
    100% { transform: translate(-1.5px, -98px); opacity: 0; }
  }
  @keyframes steigen-spaerlich {
    0%   { transform: translate(0, 0);         opacity: 0; }
    12%  { opacity: calc(var(--sprudel-op) * .5); }
    55%  { transform: translate(2.5px, -54px); }
    88%  { opacity: calc(var(--sprudel-op) * .28); }
    100% { transform: translate(-1.5px, -98px); opacity: 0; }
  }
  /* Schwitzwasser: zwei Tropfen laufen, der Rest steht. */
  .kondens { fill: #ffffff; opacity: var(--kondens); transition: opacity .5s; }
  .kondens.laeuft { transform-box: view-box; animation: rinnen 9s ease-in infinite; }
  @keyframes rinnen {
    0%, 55% { transform: translateY(0); }
    92%     { transform: translateY(17px); opacity: 0; }
    93%,100%{ transform: translateY(0); opacity: 0; }
  }
  .reif { fill: #ffffff; opacity: var(--frost); transition: opacity .5s; }
  /* Ein Lichtstreifen wandert alle paar Sekunden ueber das Glas. */
  .glanz { transform-box: view-box; animation: wischen 7.5s ease-in-out infinite; }
  @keyframes wischen {
    0%, 62%   { transform: translateX(-70px); }
    88%, 100% { transform: translateX(120px); }
  }

  /* Die Fußzeile ist die Ampel in Worten: das erste Wort färbt sich. */
  .hero-fuss {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .55em;
    font-family: var(--hand); font-size: clamp(13px, 3.7vw, 16px);
    color: var(--kreide-weg); margin-top: 2px;
  }
  .hero-fuss .wort { color: var(--ampel); transition: color .45s ease; }
  .hero-fuss .pkt { opacity: .45; }
  .zahlen { font-variant-numeric: tabular-nums; }

  /* Die gedruckte Skala von eiskalt bis pisswarm, mit Kreide nachgezogen:
     sie macht sichtbar, warum das Wort daneben gerade so heißt. */
  .skala {
    position: relative; height: 5px; border-radius: 3px; margin: 14px 0 0;
    opacity: .8;
    background: linear-gradient(90deg,
      #4f9ed6 0 10%, #6fb08a 10% 30%, #93b06a 30% 45%,
      #d7bb6a 45% 60%, #dd9a63 60% 80%, #d9705f 80% 100%);
    box-shadow: 0 0 0 1px #ffffff1f inset;
  }
  .nadel {
    position: absolute; top: -5px; left: 50%; width: 2px; height: 15px;
    background: var(--kreide); border-radius: 2px; transform: translateX(-50%);
    box-shadow: 0 0 4px #fff9; opacity: 0;
    transition: left .5s cubic-bezier(.2,.7,.3,1), opacity .4s;
  }

  .strich-linie {
    height: 1px; margin: clamp(18px, 4.4vw, 26px) 0 0;
    background: linear-gradient(90deg, transparent, #ffffff40 8%, #ffffff40 92%, transparent);
  }

  /* --- Das Glücksrad: Flaschendrehen ---------------------------------------
     Gezogen wird auf dem Worker, einmal am Tag, für alle dasselbe. Die Flasche
     dreht sich also nicht, um zu entscheiden — sie fährt an, was schon
     feststeht. Die Chance sitzt in der Länge des Bogens am Rand; die Namen
     stehen außen und waagerecht, damit sie auch bei sieben Meldern lesbar
     bleiben. Das ist der Grund für diese Form und nicht für das Tortenrad.
     --------------------------------------------------------------------- */
  .rad-block { margin-top: clamp(14px, 3.6vw, 20px); }
  .rad-buehne { position: relative; width: 100%; max-width: 320px; margin: 2px auto 4px; }
  .rad-buehne svg { display: block; width: 100%; }
  .rad-flasche { transform-origin: 150px 150px; }
  .rad-bogen { fill: none; stroke-width: 7; stroke-linecap: butt; opacity: .55; }
  .rad-name { font-family: var(--hand); fill: var(--kreide); font-size: 12.5px; }
  .rad-zahl { font-family: var(--hand); fill: var(--kreide-weg); font-size: 10.5px; }

  /* Die Flasche. Braunglas gibt es an der Tafel nicht — es bleibt gelbe
     Kreide, nur die Deckkraft trennt Glas, Korken und Etikett. Ohne das
     Etikett liest sich die Silhouette bei dieser Größe wie ein Fläschchen. */
  .fl-glas    { fill: #e8c76626; stroke: var(--gelb); stroke-width: 2.2; stroke-linejoin: round; }
  .fl-korken  { fill: var(--gelb); fill-opacity: .82; stroke: var(--gelb); stroke-width: 1.4; }
  .fl-kniff   { stroke: #2a2f2c; stroke-width: 1.1; opacity: .55; }
  .fl-band    { fill: var(--gelb); fill-opacity: .38; stroke: var(--gelb); stroke-width: 1.1; }
  .fl-etikett { fill: var(--kreide); fill-opacity: .17; stroke: var(--kreide); stroke-width: 1.3; }
  .fl-schrift { stroke: var(--kreide); stroke-width: 1.3; stroke-linecap: round; opacity: .75; }
  .fl-glanz   { stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; opacity: .22; }

  /* Der Anschrieb: was die Auslosung ergeben hat. */
  .erg { text-align: center; margin: 12px 0 4px; }
  .erg-oben {
    font-family: var(--hand); font-size: 12.5px; letter-spacing: .13em;
    color: var(--gelb); opacity: .9; transform: rotate(-.7deg);
  }
  .erg-name {
    position: relative; display: inline-block; margin: 6px 0 4px;
    font-family: var(--hand); font-size: clamp(28px, 8.6vw, 38px); line-height: 1.15;
    color: var(--gelb); transform: rotate(-1.1deg);
    /* Ein langer Name darf umbrechen, aber nicht aus der Tafel laufen. */
    max-width: 100%; overflow-wrap: anywhere;
  }
  /* Der Kringel, den der Wirt um das Tagesgericht zieht. */
  .erg-name svg {
    position: absolute; inset: -13px -20px; width: calc(100% + 40px);
    height: calc(100% + 26px); overflow: visible; pointer-events: none;
  }
  .erg-kringel {
    fill: none; stroke: var(--gelb); stroke-width: 2.1; stroke-linecap: round;
    opacity: .8; stroke-dasharray: 620; stroke-dashoffset: 620;
    animation: kringeln .8s .25s ease-out forwards;
  }
  @keyframes kringeln { to { stroke-dashoffset: 0; } }
  .erg-unter { font-size: 12px; color: var(--kreide-weg); margin-top: 9px; }
  /* Der Stand der Sache: gezogen und wartend, oder zugesagt. Steht eine Zeile
     über dem Kleingedruckten, weil das die eigentliche Nachricht ist. */
  .erg-stand {
    font-family: var(--hand); font-size: 14px; letter-spacing: .04em;
    color: var(--kreide-matt); margin-top: 7px;
  }
  .erg-stand.ja { color: var(--gelb); }

  /* Die Entscheidung des Gewinners. Sieht nur er, und nur solange sie aussteht. */
  .los-antwort { margin-top: 14px; }
  .los-frage {
    text-align: center; font-family: var(--hand); font-size: 15px;
    color: var(--kreide-matt); margin-bottom: 10px;
  }
  .los-knoepfe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Die Uhrzeit gehört zur Zusage, nicht in ein zweites Formular danach: wer
     „Ich richte aus" drückt, sagt damit auch, ab wann. 19 Uhr steht vor. */
  .los-zeit {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    margin-bottom: 12px; font-family: var(--hand); font-size: 14px;
    color: var(--kreide-weg);
  }
  .los-zeit input {
    width: auto; min-width: 92px; text-align: center; padding: 4px 6px 3px;
    font-size: 16px; color: var(--gelb);
  }
  /* Das Feld für den Grund steht offen da, statt sich erst nach einem Klick zu
     zeigen: eine Absage soll EIN Tippen kosten, der Grund ist die Zugabe. */
  .los-grund { margin-top: 10px; font-size: 15px; }

  .rad-note {
    margin: 10px 0 0; font-size: 12px; color: var(--kreide-weg);
    text-align: center; line-height: 1.5;
  }
  .rad-note.schlecht { color: #f0c6be; }

  /* Der Gewinner in der Liste: der Wirt hat einen Haken danebengesetzt. */
  .z-heute {
    font-family: var(--hand); font-size: 10.5px; letter-spacing: .1em;
    color: var(--gelb); border: 1px solid #e8c76688; border-radius: 999px;
    padding: 1px 7px; margin-left: 7px; white-space: nowrap; vertical-align: 1px;
  }
  .zeile.heute .z-rang, .zeile.heute .z-name { color: var(--gelb); }

  /* --- Termine: der Kalender an der Tafel ---------------------------------
     Kommende oben, Gewesenes darunter und blasser — dieselbe Ordnung, in der
     ein Wirt seine Tafel liest. Das Datum steht links in einer eigenen Spalte,
     damit man die Liste am Rand entlang überfliegen kann.
     --------------------------------------------------------------------- */
  .termin-block { margin-top: clamp(14px, 3.6vw, 20px); }
  .block-kopf .neben {
    border: none; background: none; padding: 0; font: inherit; font-size: 12px;
    color: var(--kreide-weg); text-decoration: underline; cursor: pointer;
  }
  .t-zeile {
    display: grid; grid-template-columns: 58px 1fr auto; gap: 0 11px;
    align-items: baseline; padding: 10px 0 9px;
    border-bottom: 1px dashed #ffffff1f;
  }
  .t-zeile:last-child { border-bottom: none; }
  .t-tag {
    font-family: var(--hand); font-size: 13px; line-height: 1.25; color: var(--gelb);
  }
  .t-tag span { display: block; font-size: 11px; color: var(--kreide-weg); }
  .t-mitte { min-width: 0; }
  .t-titel {
    font-family: var(--hand); font-size: clamp(15px, 4vw, 17px); line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .t-unter {
    display: flex; align-items: center; gap: .45em; flex-wrap: wrap;
    margin-top: 4px; font-size: 10.5px; letter-spacing: .04em; color: var(--kreide-weg);
  }
  .t-marke {
    font-family: system-ui, sans-serif; font-size: 8px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gelb); border: 1px solid #e8c76655;
    border-radius: 2px; padding: 1px 4px;
  }
  .t-weg {
    border: none; background: none; padding: 0; font: inherit; font-size: 10.5px;
    color: var(--kreide-weg); text-decoration: underline; cursor: pointer;
  }
  /* Gewesen: blasser, aber lesbar — daran hängen später die Bewertungen. */
  .t-zeile.vorbei { opacity: .62; }
  .t-zeile.vorbei .t-tag { color: var(--kreide-weg); }
  /* Abgesagt: durchgestrichen, wie an einer Tafel. Die Zeile bleibt stehen. */
  .t-zeile.ab .t-titel { text-decoration: line-through; text-decoration-color: var(--rot); }
  .t-zeile.ab .t-tag { color: var(--rot); opacity: .8; }
  .t-trenner {
    font-family: var(--hand); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--kreide-weg);
    margin: 14px 0 2px; opacity: .8;
  }

  /* --- Sterne und Flyout ---------------------------------------------------
     Ein Bauteil für beide Ziele: einen Nutzer bewertet man dauerhaft, einen
     Abend einmalig. Es fährt von unten ein, weil es auf dem Handy gelesen und
     mit dem Daumen bedient wird — oben wäre beides schlechter.
     --------------------------------------------------------------------- */
  .stern-kurz {
    display: inline-flex; align-items: center; gap: 3px; vertical-align: 1px;
    font-size: 11px; color: var(--kreide-weg); white-space: nowrap;
  }
  .stern-kurz svg { width: 11px; height: 11px; display: block; }
  .stern-kurz .st-voll { fill: var(--gelb); }
  .stern-kurz.hat { color: var(--gelb); }
  /* Der Knopf ist unsichtbar — angetippt wird der Sternschnitt selbst.
     Kein "· " davor wie bei den Geschwistern: die Zeile bricht um, und der
     Trennpunkt stünde dann allein am Anfang der neuen. Der Abstand der
     Flex-Lücke trennt hier genauso gut. */
  .z-bewerten {
    border: none; background: none; padding: 0; margin: 0 0 0 .25em; font: inherit;
    cursor: pointer; line-height: inherit;
  }

  .flyout { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; }
  .fly-schirm { position: absolute; inset: 0; background: #05080799; }
  .fly-blatt {
    position: relative; width: 100%; max-width: 520px; margin: 0 auto;
    max-height: 88vh; overflow-y: auto; padding: 18px 16px 22px;
    border-radius: 8px 8px 0 0; border-top: 1px solid #ffffff26;
    background:
      radial-gradient(120% 80% at 22% 8%, #37403f 0%, var(--schiefer) 45%, var(--schiefer-t) 100%);
    box-shadow: 0 -18px 40px #0009;
    animation: hoch .22s ease-out;
  }
  @keyframes hoch { from { transform: translateY(14px); opacity: .4; } }
  .fly-kopf { display: flex; align-items: baseline; gap: 12px; }
  /* Die Überschrift nimmt den Platz, das Kreuz sitzt am Rand — sonst klebt es
     am Namen und trifft daneben, wer es mit dem Daumen sucht. */
  .fly-kopf > div:first-child { flex: 1; min-width: 0; }
  .fly-titel { font-family: var(--hand); font-size: 19px; overflow-wrap: anywhere; }
  .fly-zu {
    border: none; background: none; padding: 0 2px; cursor: pointer;
    font-size: 24px; line-height: 1; color: var(--kreide-weg);
  }
  .fly-unter { font-size: 11px; color: var(--kreide-weg); margin-top: 3px; }
  .fly-gesamt {
    display: flex; align-items: baseline; gap: 9px; margin: 12px 0 4px;
    font-family: var(--hand);
  }
  .fly-note { font-size: 30px; color: var(--gelb); line-height: 1; }
  .fly-note.leer { color: var(--kreide-weg); font-size: 19px; }
  .fly-wieviele { font-size: 11px; color: var(--kreide-weg); font-family: system-ui, sans-serif; }

  .st-reihe {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    align-items: center; padding: 9px 0; border-bottom: 1px dashed #ffffff1a;
  }
  /* Spalten und Zeilen ausdrücklich: sonst setzt die automatische Platzierung
     die Sternreihe vor die Beschriftung, weil sie über zwei Zeilen geht. */
  .st-name { grid-column: 1; grid-row: 1; font-family: var(--hand); font-size: 15px; }
  .st-mittel { grid-column: 1; grid-row: 2; font-size: 10.5px; color: var(--kreide-weg); }
  .st-knoepfe { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 3px; }
  .st-knopf {
    border: none; background: none; padding: 3px 1px; cursor: pointer; line-height: 0;
  }
  .st-knopf svg { width: 25px; height: 25px; display: block; }
  /* Kreide, kein Gold: leer ist der Umriss, gesetzt die Füllung. */
  .st-knopf path { fill: transparent; stroke: #ffffff55; stroke-width: 1.4; }
  .st-knopf.an path { fill: var(--gelb); stroke: var(--gelb); }
  .st-reihe.fremd .st-knopf { cursor: default; }
  .fly-hinweis {
    font-size: 11px; color: var(--kreide-weg); line-height: 1.5; margin: 12px 0 0;
  }

  /* --- Der Thread ----------------------------------------------------------
     Karten untereinander, Antworten eingerückt und nur eine Ebene tief — bei
     Stufe drei ist die Spalte auf dem Handy vierzig Pixel breit.
     --------------------------------------------------------------------- */
  .ko-titel {
    font-family: var(--hand); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--kreide-weg);
    margin: 20px 0 2px; opacity: .85;
  }
  .ko { padding: 10px 0 8px; border-bottom: 1px dashed #ffffff16; }
  .ko:last-child { border-bottom: none; }
  .ko-kopf { display: flex; align-items: baseline; gap: 8px; }
  .ko-autor { font-family: var(--hand); font-size: 14px; }
  .ko-zeit { font-size: 10px; color: var(--kreide-weg); }
  .ko-noten {
    display: flex; flex-wrap: wrap; gap: 3px 9px; margin: 5px 0 0;
    font-size: 10.5px; color: var(--gelb); opacity: .85;
  }
  .ko-text {
    margin-top: 5px; font-size: 13.5px; line-height: 1.5; color: var(--kreide-matt);
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .ko-text.weg { color: var(--kreide-weg); font-style: italic; }
  .ko-fuss { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 7px; }
  .ko-re {
    border: 1px solid #ffffff22; border-radius: 999px; background: transparent;
    padding: 2px 8px 3px; font-size: 11px; color: var(--kreide-weg); cursor: pointer;
    line-height: 1.4;
  }
  .ko-re.an { border-color: #e8c76688; color: var(--gelb); background: #e8c7661a; }
  .ko-re .zahl { margin-left: 4px; font-variant-numeric: tabular-nums; }
  .ko-tat {
    border: none; background: none; padding: 2px 4px; font-size: 10.5px;
    color: var(--kreide-weg); text-decoration: underline; cursor: pointer;
  }
  /* Die Antworten hängen sichtbar an der Wurzel: ein Kreidestrich am Rand. */
  .ko-antw { margin: 6px 0 0 14px; padding-left: 12px; border-left: 1px dashed #ffffff26; }
  .ko-antw .ko { padding: 8px 0 6px; border-bottom: none; }

  .ko-schreib { margin-top: 14px; }
  .ko-an {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;
    font-size: 11px; color: var(--gelb);
  }
  .ko-feld {
    width: 100%; border: 1.5px solid #ffffff30; border-radius: 3px; padding: 9px 10px;
    background: #00000026; color: var(--kreide); font-family: var(--hand); font-size: 15px;
    line-height: 1.45; resize: vertical; min-height: 62px;
  }
  .ko-feld:focus { outline: none; border-color: var(--gelb); }
  .ko-feld::placeholder { color: #ffffff30; }
  .ko-ab { margin-top: 8px; }

  /* --- Die Karte: Rangfolge als Speisekarte ------------------------------- */
  .block { margin-top: clamp(14px, 3.6vw, 20px); }
  .block-kopf {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-family: var(--hand); margin-bottom: 6px;
  }
  .block-kopf .titel { font-size: 17px; letter-spacing: .04em; }
  .block-kopf .datum { font-size: 12px; color: var(--kreide-weg); }

  .zeile {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 0 10px;
    align-items: baseline; padding: 10px 0 9px;
    border-bottom: 1px dashed #ffffff1f;
  }
  .zeile:last-child { border-bottom: none; }
  .z-rang {
    font-family: var(--hand); font-size: 14px; color: var(--kreide-weg);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .zeile.erster .z-rang, .zeile.erster .z-name { color: var(--gelb); }
  /* Die eigene Zeile ist nicht farbig markiert, sondern umkringelt - so, wie
     man an einer Tafel etwas markiert. */
  .zeile.ich .z-name::after {
    content: "du"; font-size: 11px; color: var(--rot); margin-left: 8px;
    border: 1px solid #d9705f80; border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%;
    padding: 1px 7px 2px; vertical-align: 2px; letter-spacing: .04em;
  }
  .z-mitte { min-width: 0; }
  .z-name {
    font-family: var(--hand); font-size: clamp(16px, 4.4vw, 19px); line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .z-marke {
    font-family: system-ui, sans-serif; font-size: 8px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gelb); border: 1px solid #e8c76655;
    border-radius: 2px; padding: 1px 4px; margin-left: 7px; vertical-align: 3px;
  }
  .z-unter {
    display: flex; align-items: center; gap: .45em; flex-wrap: wrap;
    margin-top: 5px; font-size: 10.5px; letter-spacing: .04em; color: var(--kreide-weg);
  }
  .z-unter .wort { font-family: var(--hand); font-size: 12.5px; letter-spacing: 0; }
  .z-striche { margin-top: 7px; height: 18px; }
  .z-striche svg { height: 18px; width: auto; display: block; }

  /* Die Punktreihe der Speisekarte: sie führt das Auge vom Namen zur Zahl. */
  .z-rechts { display: flex; align-items: baseline; gap: 8px; }
  .z-zahl {
    font-family: var(--hand); font-size: clamp(21px, 6vw, 26px); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .zeile.erster .z-zahl { color: var(--gelb); }
  .z-spark { opacity: .75; }
  .z-spark svg { display: block; }

  .leer-hinweis {
    font-family: var(--hand); font-size: 15px; line-height: 1.6;
    color: var(--kreide-weg); padding: 16px 0 6px;
  }

  /* --- Formulare ---------------------------------------------------------- */
  .block-fuss { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #ffffff26; }
  .melde { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .melde.eins { grid-template-columns: 1fr; }
  .feld-label {
    display: block; font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--kreide-weg); margin-bottom: 3px;
  }
  .feld {
    display: block; width: 100%; border: none; border-bottom: 1.5px dashed #ffffff44;
    background: transparent; padding: 6px 2px 5px; border-radius: 0;
    font-family: var(--hand); font-size: 17px; color: var(--kreide);
    font-variant-numeric: tabular-nums;
  }
  .feld:focus { outline: none; border-bottom-color: var(--gelb); border-bottom-style: solid; }
  .feld::placeholder { color: #ffffff30; }
  .knopf {
    width: 100%; border: 1.5px solid #ffffff55; border-radius: 3px; padding: 11px;
    background: #ffffff0d; color: var(--kreide); cursor: pointer;
    font-family: var(--hand); font-size: 16px; letter-spacing: .04em;
    transition: background .2s, border-color .2s, transform .06s;
  }
  .knopf:hover { background: #ffffff1a; border-color: var(--gelb); }
  .knopf:active { transform: translateY(1px); }
  .knopf[disabled] { opacity: .45; cursor: default; }
  .knopf.leer { background: transparent; }
  .zeile-klein {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    margin-top: 11px; font-size: 10px; letter-spacing: .08em; color: var(--kreide-weg);
  }
  .zeile-klein button {
    border: none; background: none; padding: 0; font: inherit; color: var(--kreide-weg);
    text-decoration: underline; cursor: pointer;
  }
  .sagt {
    margin: 13px 0 0; padding: 9px 11px; border-radius: 3px; font-size: 12px;
    line-height: 1.5; background: #ffffff10; color: var(--kreide-matt);
    border-left: 2px solid var(--gelb);
  }
  .sagt.schlecht { border-left-color: var(--rot); color: #f0c6be; }

  /* --- Kreide zeichnen ----------------------------------------------------- */
  .strich {
    /* Keine stroke-width hier: CSS schlaegt das Praesentationsattribut, und die
       Zeilenfassung braucht duennere Striche als der Kopf. */
    stroke: var(--kreide); stroke-linecap: round;
    stroke-dasharray: 82; stroke-dashoffset: 82;
    animation: schreiben .3s ease-out forwards;
  }
  .strich.quer { stroke: var(--rot); }
  @keyframes schreiben { to { stroke-dashoffset: 0; } }
  .wort-gross {
    font-family: var(--hand); font-size: 34px; fill: var(--kreide-matt);
  }
  .wort-gross.voll { fill: var(--gelb); }

  @media (prefers-reduced-motion: reduce) {
    .strich { animation: none; stroke-dashoffset: 0; }
    .blase, .glanz, .kondens.laeuft { animation: none; }
    .blase { opacity: calc(var(--sprudel-op) * .5); }
    /* Das Rad springt auf sein Feld, statt sich zu drehen. Das Ergebnis steht
       ohnehin fest, bevor sich das erste Bild bewegt — es geht nichts verloren. */
    .erg-kringel { animation: none; stroke-dashoffset: 0; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="brett">
    <div class="tafel">

      <!-- ============ Der Siegerplatz =================================== -->
      <div class="hero-oben">
        <div class="hero-text">
          <div class="krone-zeile kr" id="krone"></div>
          <h1 class="hero-name kr" id="marke">Kühlschrank</h1>
          <div class="hero-unter kr" id="hero-unter"></div>

          <!-- Die Menge steht in den Strichen, nicht als Ziffer daneben: eine
               Strichliste, die eine Zahl neben sich hat, ist Zierrat. -->
          <div class="hero-striche" id="hero-striche" role="img" aria-label="Strichliste"></div>
        </div>

        <!-- ============ Das Glas ========================================
             Ein Willibecher, an die Tafel gezeichnet. Es zaehlt nicht, das
             machen die Striche. Es zeigt den Bestand als Fuellstand und die
             Temperatur als Verhalten: kaltes Bier perlt schnell, traegt eine
             hohe Krone und beschlaegt aussen, pisswarmes steht still und
             flach da.
             ========================================================== -->
        <div class="hero-glas" id="glas">
          <svg viewBox="0 0 100 172" role="img" aria-labelledby="glas-titel">
            <title id="glas-titel">Bierglas: Füllstand nach Bestand, Zustand nach Temperatur</title>
            <defs>
              <path id="innenform" d="M27.5,20 C23,46 21.2,60 22,74 C23,99 29.5,130 31.5,150 L68.5,150 C70.5,130 77,99 78,74 C78.8,60 77,46 72.5,20 Z"/>
              <clipPath id="innen"><use href="#innenform"/></clipPath>
              <!-- alles unterhalb des Bierspiegels; wandert mit dem Bestand -->
              <clipPath id="unterm-spiegel">
                <rect class="spiegel" x="10" y="46" width="80" height="170"/>
              </clipPath>

              <linearGradient id="bier" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0"   stop-color="#e0a327"/>
                <stop offset=".55" stop-color="#cf8b16"/>
                <stop offset="1"   stop-color="#a86b0d"/>
              </linearGradient>
              <!-- Rasterpunkte: auch das Bier ist gezeichnet, nicht gegossen -->
              <pattern id="raster" width="4" height="4" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="0.75" fill="#00000022"/>
                <circle cx="3" cy="3" r="0.55" fill="#ffffff22"/>
              </pattern>
              <linearGradient id="glanzfarbe" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"  stop-color="#ffffff" stop-opacity="0"/>
                <stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>
                <stop offset="1"  stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- Glaskoerper -->
            <path class="glas-korpus" d="M24,17 C19,45 17,60 18,75 C19,101 26,133 28,153 Q28,157 32,157 L68,157 Q72,157 72,153 C74,133 81,101 82,75 C83,60 81,45 76,17 Z"/>

            <g clip-path="url(#innen)">
              <!-- Bier samt Krone: eine Gruppe, die mit dem Bestand sinkt. Die
                   Flaeche reicht weit unter den Boden, damit im leeren Glas
                   nichts nachrutscht, was nicht mehr da ist. -->
              <g class="spiegel">
                <rect x="16" y="46" width="68" height="170" fill="url(#bier)"/>
                <rect x="16" y="46" width="68" height="170" fill="url(#raster)"/>

                <!-- Schaumkrone: Vollflaeche plus ausgefranster Rand -->
                <g class="krone">
                  <rect x="16" y="30" width="68" height="16" fill="#eceadf"/>
                  <g fill="#f4f2e8">
                    <circle cx="26" cy="31" r="5.5"/><circle cx="36" cy="28.5" r="6.5"/>
                    <circle cx="47" cy="30" r="5.8"/><circle cx="58" cy="28" r="6.8"/>
                    <circle cx="69" cy="31" r="5.6"/><circle cx="78" cy="32.5" r="4.6"/>
                  </g>
                  <g fill="#00000012">
                    <circle cx="33" cy="38" r="1.5"/><circle cx="52" cy="41" r="1.2"/>
                    <circle cx="64" cy="37" r="1.7"/><circle cx="43" cy="35" r="1.1"/>
                  </g>
                </g>
              </g>

              <!-- Perlen. Sie steigen immer vom Boden auf, werden aber am
                   Bierspiegel abgeschnitten - im halbvollen Glas ist der Weg
                   entsprechend kurz. -->
              <g clip-path="url(#unterm-spiegel)">
                <circle class="blase"           cx="34" cy="146" r="1.5" style="animation-delay:-0.2s"/>
                <circle class="blase"           cx="47" cy="150" r="2.1" style="animation-delay:-1.4s"/>
                <circle class="blase"           cx="61" cy="147" r="1.3" style="animation-delay:-2.6s"/>
                <circle class="blase"           cx="40" cy="152" r="1.1" style="animation-delay:-0.9s"/>
                <circle class="blase"           cx="55" cy="149" r="1.8" style="animation-delay:-2.1s"/>
                <circle class="blase spaerlich" cx="30" cy="151" r="1.2" style="animation-delay:-1.7s"/>
                <circle class="blase spaerlich" cx="66" cy="152" r="1.6" style="animation-delay:-0.5s"/>
                <circle class="blase spaerlich" cx="50" cy="148" r="1.0" style="animation-delay:-3.0s"/>
              </g>

              <!-- Reif, nur bei eiskalt - und nur dort, wo Bier hinter dem Glas
                   steht; die leere Haelfte beschlaegt nicht. -->
              <g class="reif" clip-path="url(#unterm-spiegel)">
                <circle cx="30" cy="62" r="1.1"/><circle cx="41" cy="84" r="0.9"/>
                <circle cx="66" cy="70" r="1.2"/><circle cx="57" cy="104" r="1"/>
                <circle cx="36" cy="118" r="1.3"/><circle cx="70" cy="97" r="0.9"/>
                <circle cx="47" cy="66" r="0.8"/><circle cx="62" cy="127" r="1.1"/>
              </g>

              <!-- Lichtstreifen -->
              <g class="glanz">
                <rect x="24" y="8" width="13" height="160" fill="url(#glanzfarbe)" transform="rotate(8 30 88)"/>
              </g>
            </g>

            <!-- Schwitzwasser aussen -->
            <g class="kondens">
              <ellipse cx="29" cy="70" rx="1.5" ry="2.1"/>
              <ellipse cx="73" cy="92" rx="1.3" ry="1.9"/>
              <ellipse cx="33" cy="112" rx="1.1" ry="1.6"/>
              <ellipse cx="69" cy="130" rx="1.6" ry="2.3"/>
            </g>
            <ellipse class="kondens laeuft" cx="26" cy="52" rx="1.7" ry="2.5" style="animation-delay:-2s"/>
            <ellipse class="kondens laeuft" cx="76" cy="66" rx="1.4" ry="2.1" style="animation-delay:-6s"/>

            <!-- Riss -->
            <path class="glas-riss" d="M24,17 C19,45 17,60 18,75 C19,101 26,133 28,153 Q28,157 32,157 L68,157 Q72,157 72,153 C74,133 81,101 82,75 C83,60 81,45 76,17 Z"/>
            <ellipse class="glas-riss" cx="50" cy="17" rx="26" ry="5"/>
            <use class="glas-innen" href="#innenform"/>
          </svg>
        </div>
      </div>

      <div class="hero-fuss kr">
        <span class="wort" id="wort">Bier</span>
        <span class="pkt">·</span>
        <span class="zahlen" id="temp">–</span>
        <span class="pkt">·</span>
        <span id="stand">wird geladen</span>
      </div>
      <div class="skala" aria-hidden="true"><span class="nadel" id="nadel"></span></div>

      <div class="strich-linie"></div>

      <!-- ============ Das Glücksrad =====================================
           Steht zwischen dem Ersten und der Karte, weil es die Frage des
           Abends beantwortet — der Kopf gehört weiter dem, der am meisten
           kalt hat, der wechselt nach Bestand und nicht nach Losglück.
           ============================================================= -->
      <section class="rad-block" id="rad-block" hidden>
        <div class="block-kopf kr">
          <span class="titel">Wo wird heute getrunken</span>
          <span class="datum" id="rad-datum"></span>
        </div>

        <div class="rad-buehne" id="rad-buehne" hidden>
          <!-- Links und rechts 45 Einheiten Luft im viewBox: dort stehen die
               Namen, und sie sollen nicht aus der Tafel laufen. -->
          <svg viewBox="-45 0 390 300" role="img" aria-labelledby="rad-titel">
            <title id="rad-titel">Flaschendrehen: ein Bogen je Melder, so lang wie sein Bestand</title>
            <g id="rad-ring"></g>

            <!-- Eine Longneck, an die Tafel gezeichnet. Der Hals zeigt, wer
                 dran ist, also muss oben eindeutig oben sein: Kronkorken,
                 Halsband, Schulter, Etikett. -->
            <g class="rad-flasche" id="rad-flasche">
              <path class="fl-glas" d="M144.5,104 L144.5,132 C144.5,142 132,146 132,158
                                       L132,199 Q132,204 137,204 L163,204 Q168,204 168,199
                                       L168,158 C168,146 155.5,142 155.5,132 L155.5,104 Z"/>
              <path class="fl-korken" d="M141.5,104 L141.5,99 Q141.5,95.5 145,95.5 L155,95.5
                                         Q158.5,95.5 158.5,99 L158.5,104 Z"/>
              <g class="fl-kniff">
                <path d="M144,104 L144,100 M147,104 L147,100 M150,104 L150,100
                         M153,104 L153,100 M156,104 L156,100"/>
              </g>
              <rect class="fl-band" x="143.6" y="108" width="12.8" height="10" rx="1"/>
              <rect class="fl-etikett" x="133.4" y="163" width="33.2" height="32" rx="1.5"/>
              <circle class="fl-schrift" cx="150" cy="172" r="4.6" fill="none"/>
              <g class="fl-schrift"><path d="M139.5,182.5 H160.5 M143,187 H157"/></g>
              <g class="fl-glanz"><path d="M137.5,160 L137.5,200 M148,108 L148,128"/></g>
            </g>

            <circle cx="150" cy="150" r="3" fill="#ffffff30"/>
          </svg>
        </div>

        <button class="knopf" id="rad-knopf" hidden>Flasche drehen</button>
        <div class="erg" id="rad-erg" aria-live="polite" hidden></div>

        <!-- Nur der Gezogene sieht das, und nur solange er nicht geantwortet
             hat. Sagt er ab, ist der Tag wieder frei und die Flasche kommt
             zurück — deshalb steht hier kein "endgültig" irgendwo. -->
        <div class="los-antwort" id="los-antwort" hidden>
          <div class="los-frage kr">Die Flasche zeigt auf dich. Richtest du aus?</div>
          <div class="los-zeit">
            <span>ab</span>
            <input class="feld" id="f-zeit" type="time" value="19:00"
                   aria-label="Ab wann der Abend losgeht">
          </div>
          <div class="los-knoepfe">
            <button class="knopf" id="los-ja">Ich richte aus</button>
            <button class="knopf leer" id="los-nein">Heute nicht</button>
          </div>
          <input class="feld los-grund" id="f-grund" maxlength="120" autocomplete="off"
                 placeholder="Warum nicht? — freiwillig">
        </div>

        <p class="rad-note" id="rad-note" hidden></p>

        <div class="strich-linie"></div>
      </section>

      <!-- ============ Termine ==========================================
           Was aus den Zusagen geworden ist, plus was von Hand eingetragen
           wurde. Steht hinter dem Rad, weil es dessen Folge ist.
           ============================================================= -->
      <section class="termin-block" id="termin-block" hidden>
        <div class="block-kopf kr">
          <span class="titel">Termine</span>
          <button class="neben" id="termin-neu" type="button" hidden>eintragen</button>
        </div>

        <div id="termin-liste"></div>

        <form id="termin-form" hidden>
          <div class="melde">
            <label><span class="feld-label">Gastgeber</span>
              <select class="feld" id="t-gast" required></select></label>
            <label><span class="feld-label">Tag</span>
              <input class="feld" id="t-datum" type="date" required></label>
          </div>
          <div class="melde">
            <label><span class="feld-label">Ab</span>
              <input class="feld" id="t-zeit" type="time" value="19:00" required></label>
            <label><span class="feld-label">Anlass — freiwillig</span>
              <input class="feld" id="t-titel" maxlength="60" autocomplete="off"
                     placeholder="Tatort"></label>
          </div>
          <button class="knopf" type="submit">Eintragen</button>
        </form>

        <p class="sagt" id="termin-sagt" hidden></p>

        <div class="strich-linie"></div>
      </section>

      <!-- ============ Die Karte ========================================= -->
      <section class="block" id="block" hidden>
        <div class="block-kopf kr">
          <span class="titel">Wer hat kalt</span>
          <span class="datum" id="block-datum"></span>
        </div>

        <div id="rangliste"></div>

        <div class="block-fuss">
          <form id="melde-form" hidden>
            <div class="melde">
              <label><span class="feld-label">Biere</span>
                <input class="feld" id="f-biere" inputmode="numeric" autocomplete="off"
                       placeholder="9" required></label>
              <label><span class="feld-label">Grad</span>
                <input class="feld" id="f-grad" inputmode="decimal" autocomplete="off"
                       placeholder="4,9" required></label>
            </div>
            <button class="knopf" type="submit">Anschreiben</button>
            <div class="zeile-klein">
              <span id="wer-bin-ich"></span>
              <button type="button" id="abmelden">abmelden</button>
            </div>
          </form>

          <!-- Erster Klick nach dem Magic Link: der Nutzer steht in der
               Datenbank, hat aber noch keinen Namen für die Karte. -->
          <form id="name-form" hidden>
            <div class="melde eins">
              <label><span class="feld-label">Name für die Karte</span>
                <input class="feld" id="f-name" autocomplete="nickname" maxlength="20"
                       placeholder="Basti" required></label>
            </div>
            <button class="knopf" type="submit">Merken</button>
          </form>

          <button class="knopf leer" id="zeig-anmeldung" hidden>Mitschreiben</button>
          <form id="anmelde-form" hidden>
            <div class="melde eins">
              <label><span class="feld-label">Deine E-Mail</span>
                <input class="feld" id="f-mail" type="email" inputmode="email"
                       autocomplete="email" placeholder="du@beispiel.de" required></label>
            </div>
            <button class="knopf" type="submit">Link schicken</button>
          </form>

          <p class="sagt" id="sagt" hidden></p>
        </div>
      </section>
    </div>
  </div>

  <!-- ============ Das Flyout =========================================
       Ein Bauteil für beide Ziele — Nutzer wie Termin. Der Inhalt wird
       beim Öffnen gezeichnet, das Gerüst steht hier.
       ============================================================= -->
  <div class="flyout" id="flyout" hidden>
    <div class="fly-schirm" id="fly-schirm"></div>
    <div class="fly-blatt" role="dialog" aria-labelledby="fly-titel" aria-modal="true">
      <div class="fly-kopf">
        <div>
          <div class="fly-titel kr" id="fly-titel"></div>
          <div class="fly-unter" id="fly-unter"></div>
        </div>
        <button class="fly-zu" id="fly-zu" type="button" aria-label="Schließen">×</button>
      </div>

      <div class="fly-gesamt" id="fly-gesamt"></div>
      <div id="fly-sterne"></div>
      <p class="fly-hinweis" id="fly-hinweis"></p>

      <div class="ko-titel" id="fly-thread-kopf" hidden>Gesagt</div>
      <div id="fly-thread"></div>

      <div class="ko-schreib" id="fly-schreib" hidden>
        <div class="ko-an" id="fly-an" hidden>
          <span id="fly-an-text"></span>
          <button class="ko-tat" id="fly-an-weg" type="button">abbrechen</button>
        </div>
        <textarea class="ko-feld" id="fly-feld" maxlength="400"
                  placeholder="Etwas dazu sagen …"></textarea>
        <button class="knopf ko-ab" id="fly-ab" type="button">Abschicken</button>
      </div>

      <p class="sagt" id="fly-sagt" hidden></p>
    </div>
  </div>

<script>
  // ==========================================================================
  // ENTWURF „TAFEL“ — was dieser Entwurf selbst zeichnet.
  // ==========================================================================

  /* Strichliste, wie sie der Wirt anschreibt: Vierergruppe plus Querstrich.
     `gross` ist der Kopf (mehrzeilig, damit fünf Bündel nicht über den Rand
     laufen), `klein` die einreihige Fassung in der Karte. */
  function striche(anzahl, gross) {
    const svg = document.createElementNS(NS, 'svg');
    /* Über der Grenze und unter null zählt niemand mehr - dann steht dort ein
       Wort, in derselben Kreide. */
    const wort = t => {
      if (gross) {
        svg.setAttribute('viewBox', '0 0 300 56');
        svg.setAttribute('preserveAspectRatio', 'xMinYMid meet');
      } else {
        // Breit genug fuer „ausgetrunken“ - das laengste Wort, das hier steht.
        svg.setAttribute('viewBox', '0 0 300 34');
        svg.setAttribute('height', 18);
      }
      const n = s_el('text', {
        x: 2, y: gross ? 40 : 26, class: 'wort-gross' + (t === 'voll' ? ' voll' : ''),
      });
      if (!gross) n.setAttribute('font-size', 22);
      n.textContent = t;
      svg.appendChild(n);
      return svg;
    };
    if (!Number.isFinite(anzahl)) return wort('?');
    if (anzahl <= 0) return wort('ausgetrunken');
    if (anzahl > VOLL_AB) return wort('voll');

    const B = gross ? { g: 74, a: 26, s: 16, h: 15, w: 7, zeile: 46 }
                    : { g: 34, a: 14, s: 7.5, h: 9, w: 3.4, zeile: 30 };
    const gruppen = Math.ceil(anzahl / 5);
    // Im Kopf brechen die Bündel um, in der Karte bleibt alles in einer Reihe.
    const proReihe = gross ? (gruppen <= 3 ? gruppen : 3) : gruppen;
    const reihen = Math.ceil(gruppen / proReihe);
    const breite = proReihe * B.g + (proReihe - 1) * B.a;
    const hoehe = reihen * B.zeile;
    svg.setAttribute('viewBox', '0 0 ' + breite + ' ' + hoehe);
    if (gross) { svg.setAttribute('width', '100%'); svg.setAttribute('preserveAspectRatio', 'xMinYMid meet'); }
    else svg.setAttribute('height', 18);

    let stift = 0;
    for (let gi = 0; gi < gruppen; gi++) {
      const imBund = Math.min(5, anzahl - gi * 5);
      const reihe = Math.floor(gi / proReihe), spalte = gi % proReihe;
      const x0 = spalte * (B.g + B.a), y = reihe * B.zeile + B.zeile / 2;
      for (let s = 0; s < Math.min(imBund, 4); s++) {
        const l = s_el('line', {
          class: 'strich', 'stroke-width': B.w,
          x1: x0 + B.w + s * B.s, y1: y - B.h, x2: x0 + B.w + 4 + s * B.s, y2: y + B.h,
        });
        l.style.animationDelay = (stift++ * 0.07) + 's';
        svg.appendChild(l);
      }
      if (imBund === 5) {
        const l = s_el('line', {
          class: 'strich quer', 'stroke-width': B.w,
          x1: x0 + 1, y1: y + B.h - 2, x2: x0 + B.g - 8, y2: y - B.h + 2,
        });
        l.style.animationDelay = (stift++ * 0.07) + 's';
        svg.appendChild(l);
      }
    }
    return svg;
  }

  /* Der Bestand steht doppelt da, und das mit Absicht: die Striche sind die
     genaue Zahl, der Bierspiegel der Blick von weitem. Ein halb leeres Glas
     sieht man auch dann, wenn man die Striche gar nicht liest. */
  function fuellstand(anzahl) {
    const el = document.documentElement.style;
    const f = Number.isFinite(anzahl)
      ? Math.max(0, Math.min(1, anzahl / VOLL_AB))
      : 0.5;                       // ohne Messung: halb, dazu das gedimmte Glas
    el.setProperty('--fuell', f.toFixed(3));
    // Die Krone blendet ueber das erste Achtel ein - darunter schwebte sonst
    // ein Schaumring knapp ueber dem Boden.
    el.setProperty('--schaum-voll', Math.min(1, f * 8).toFixed(3));
    $('glas').classList.toggle('ungewiss', !Number.isFinite(anzahl));
  }

  /* --- Flaschendrehen -------------------------------------------------------
     Ein Bogen je Melder, die Länge proportional zum Gewicht. 0° ist oben,
     dorthin zeigt der Flaschenhals im Ruhezustand; gerechnet wird im
     Uhrzeigersinn, in die Richtung, in die man eine Flasche anstößt. */
  const RAD_KREIDE = ['#e8c766', '#cfd6cd', '#93a09a', '#e8c76699', '#cfd6cd88'];
  let radFelder = [];   // Segmentgrenzen des zuletzt gezeichneten Rades
  let radStand = 0;     // aktueller Drehwinkel, damit die nächste Drehung anschließt

  const radPunkt = (winkel, r) => {
    const b = (winkel - 90) * Math.PI / 180;
    return [150 + r * Math.cos(b), 150 + r * Math.sin(b)];
  };
  const kuerze = (s, n) => s.length <= n ? s : s.slice(0, n - 1) + '…';

  /* Ein regelmäßiger Fünfstern, gerechnet statt geraten: äußerer Radius 10,2,
     innerer 4,3, Mittelpunkt 12/12 in einem 24er-Feld. */
  const STERN = 'M12.0,1.8 L14.5,8.5 L21.7,8.8 L16.1,13.3 L18.0,20.3 L12.0,16.3 ' +
                'L6.0,20.3 L7.9,13.3 L2.3,8.8 L9.5,8.5 Z';

  const sternSvg = (klasse) => {
    const svg = s_el('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    svg.appendChild(s_el('path', { d: STERN, class: klasse || '' }));
    return svg;
  };

  /* Der Schnitt in einer Zeile: ein Stern und die Zahl. Ohne Bewertung bleibt
     die Stelle leer statt "0,0" zu behaupten — null Sterne ist ein Urteil,
     "noch keiner hat" ist keines. */
  // Immer eine Kommastelle: "4" neben "3,8" liest sich wie eine andere Skala.
  const notenText = n => n == null ? '–' : n.toFixed(1).replace('.', ',');

  function sternKurz(b, kommentare) {
    const n = b && b.anzahl ? b : null;
    const s = el('span', 'stern-kurz' + (n ? ' hat' : ''));
    s.appendChild(sternSvg(n ? 'st-voll' : ''));
    s.appendChild(el('span', null, n ? notenText(n.schnitt) + ' · ' + n.anzahl : 'noch keine'));
    // Der Kommentarzähler reitet mit, damit man sieht, ob sich das Antippen
    // lohnt — ohne dass die Seite dafür jeden Thread laden müsste.
    if (kommentare) s.appendChild(el('span', null, '· 💬 ' + kommentare));
    return s;
  }

  const KRINGEL = 'M28,16 C8,26 6,50 40,58 C86,68 172,60 186,42 C196,28 168,10 116,8 ' +
                  'C74,6 40,10 26,20';

  const VARIANTE = {
    kopf(p, modus) {
      const ziel = $('hero-striche');
      ziel.textContent = '';
      const messung = p && Number.isFinite(p.temperatur);
      const s = stufe(messung ? p.temperatur : 99);

      // Kurz halten: die Ueberschrift bricht bei Bedarf mitten im Wort um
      // (das braucht sie fuer lange Namen), und „nichts angeschrieben“ tat das.
      $('marke').textContent = p ? p.name : 'kein Netz';
      $('krone').textContent =
        modus === 'fuehrend' ? 'Führt das Feld an' :
        modus === 'eigen' ? 'Aus dem eigenen Kühlschrank' : '';
      const unter = $('hero-unter');
      unter.textContent = '';
      if (modus === 'fuehrend' && p.gemessen) {
        unter.appendChild(el('span', 'marke-gemessen', 'gemessen, nicht behauptet'));
      } else if (modus === 'fuehrend' && Number.isFinite(p.best) && p.best > p.biere) {
        unter.textContent = 'Bestmarke ' + p.best;
      } else if (modus === 'nichts') {
        unter.textContent = 'Die Tafel ist gerade nicht zu erreichen.';
      }

      const n = p ? Number(p.biere) : NaN;
      ziel.appendChild(striche(n, true));
      ziel.setAttribute('aria-label',
        Number.isFinite(n) ? n + ' kalte Biere' : 'kein Bestand bekannt');
      fuellstand(n);

      $('wort').textContent = messung ? s[1] : 'Bier';
      // Die letzten fuenf Spalten von STUFEN gehoeren dem Glas: Krone,
      // Steigzeit, Perlung, Schwitzwasser, Reif.
      const st = document.documentElement.style;
      st.setProperty('--ampel', messung ? s[2] : 'var(--kreide-matt)');
      st.setProperty('--schaum',     messung ? s[3] : 0.8);
      st.setProperty('--sprudel',    messung ? s[4] : '4.2s');
      st.setProperty('--sprudel-op', messung ? s[5] : 0.6);
      st.setProperty('--kondens',    messung ? s[6] : 0);
      st.setProperty('--frost',      messung ? s[7] : 0);
      $('temp').textContent = messung ? grad(p.temperatur) : 'keine Messung';
      $('stand').textContent = p ? standText(p.gemeldet) : 'gerade nicht erreichbar';

      const nadel = $('nadel');
      nadel.style.left = (messung ? Math.max(0, Math.min(100, (p.temperatur / 20) * 100)) : 50) + '%';
      nadel.style.opacity = messung ? 1 : 0;
    },

    zeile(p, i, s, ich, heute) {
      const z = el('div', 'zeile' + (ich ? ' ich' : '') + (i === 0 ? ' erster' : '') +
                          (heute ? ' heute' : ''));
      z.appendChild(el('div', 'z-rang kr', String(i + 1)));

      const mitte = el('div', 'z-mitte');
      const name = el('div', 'z-name kr');
      name.textContent = p.name;
      if (p.gemessen) name.appendChild(el('span', 'z-marke', 'gemessen'));
      /* Wer ausgelost wurde, steht auch hier — sonst müsste man scrollen, um
         von der Zeile zurück zum Anschrieb zu finden. `heute` ist die Aufschrift
         selbst: „gezogen" solange die Antwort aussteht, „heute hier" erst nach
         der Zusage. Ein Haken für einen Abend, der noch abgesagt werden kann,
         wäre eine Behauptung. */
      if (heute) name.appendChild(el('span', 'z-heute', heute));
      mitte.appendChild(name);
      const str = el('div', 'z-striche');
      str.appendChild(striche(p.biere, false));
      mitte.appendChild(str);
      const unter = el('div', 'z-unter');
      const wort = el('span', 'wort kr', s[1]);
      wort.style.color = s[2];
      unter.appendChild(wort);
      unter.appendChild(el('span', null, '· ' + grad(p.temperatur) + ' · ' + standText(p.gemeldet)));
      /* Der Sternschnitt steht hinter dem Wetterbericht, nicht davor: wie kalt
         einer hat, ist die Frage der Seite; wie er als Gastgeber ist, die
         Zugabe. Ein Tap öffnet das Flyout. */
      if (p.id) {
        const b = el('button', 'z-bewerten');
        b.type = 'button';
        b.dataset.ziel = 'user:' + p.id;
        b.dataset.name = p.name;
        b.appendChild(sternKurz(p.bewertung, p.kommentare));
        unter.appendChild(b);
      }
      mitte.appendChild(unter);
      z.appendChild(mitte);

      const rechts = el('div', 'z-rechts');
      const sp = el('div', 'z-spark');
      sp.appendChild(sparkline(p.verlauf, s[2], 46, 18));
      rechts.appendChild(sp);
      rechts.appendChild(el('div', 'z-zahl kr', String(p.biere)));
      z.appendChild(rechts);
      return z;
    },

    leer() {
      return el('div', 'leer-hinweis kr',
        'Noch hat niemand angeschrieben. Der erste Eintrag bekommt den Kopf der Tafel.');
    },

    /* Ein Abend. Das Datum links, damit man die Liste am Rand entlangliest;
       der Titel ist frei, sonst heißt er nach dem Gastgeber. Absagen darf, wer
       ihn ausrichtet oder eingetragen hat — und nur, solange er nicht läuft. */
    termin(t, darfWeg) {
      const d = new Date(t.beginnt_am);
      const vorbei = d.getTime() <= Date.now();
      const z = el('div', 't-zeile' + (vorbei ? ' vorbei' : '') + (t.abgesagt ? ' ab' : ''));

      const tag = el('div', 't-tag kr');
      tag.textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
      tag.appendChild(el('span', null,
        d.toLocaleDateString('de-DE', { weekday: 'short' })));
      z.appendChild(tag);

      const mitte = el('div', 't-mitte');
      mitte.appendChild(el('div', 't-titel kr', t.titel || 'Bierabend bei ' + t.gastgeber));

      const unter = el('div', 't-unter');
      unter.appendChild(el('span', null,
        d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'));
      if (t.titel) unter.appendChild(el('span', null, '· bei ' + t.gastgeber));
      // Woher der Abend kommt: ausgelost oder von jemandem eingetragen.
      if (t.aus_ziehung) unter.appendChild(el('span', 't-marke', 'ausgelost'));
      else if (t.von && t.von !== t.gastgeber) {
        unter.appendChild(el('span', null, '· eingetragen von ' + t.von));
      }
      if (t.abgesagt) unter.appendChild(el('span', null, '· abgesagt'));
      /* Bewertet wird ein Abend, der stattgefunden hat — vorher wäre es eine
         Erwartung. Abgesagte bleiben stumm. */
      if (vorbei && !t.abgesagt) {
        const b = el('button', 'z-bewerten');
        b.type = 'button';
        b.dataset.ziel = 'termin:' + t.id;
        b.dataset.name = t.titel || 'Bierabend bei ' + t.gastgeber;
        b.appendChild(sternKurz(t.bewertung, t.kommentare));
        unter.appendChild(b);
      }
      mitte.appendChild(unter);
      z.appendChild(mitte);

      const rechts = el('div', 't-rechts');
      if (darfWeg && !t.abgesagt && !vorbei) {
        const weg = el('button', 't-weg', 'absagen');
        weg.type = 'button';
        weg.dataset.termin = t.id;
        rechts.appendChild(weg);
      }
      z.appendChild(rechts);
      return z;
    },

    /* Das Rad zeichnen. `segmente` kommt so vom Worker: [{name, gewicht}, …] in
       Segmentreihenfolge — vor der Ziehung das aktuelle Feld, danach das
       eingefrorene. Nur deshalb zeigt das Rad um 23 Uhr dieselben Felder wie
       um 19 Uhr, und die Animation landet auf einem Feld, das es noch gibt. */
    rad(segmente) {
      const g = $('rad-ring'), R = 110;
      g.textContent = '';
      radFelder = [];
      const summe = segmente.reduce((a, s) => a + s.gewicht, 0) || 1;
      let von = 0;

      segmente.forEach((seg, i) => {
        const weite = seg.gewicht / summe * 360;
        radFelder.push({ name: seg.name, von, bis: von + weite });

        /* Der Bogen trägt die Chance. Eine kleine Lücke an beiden Enden, damit
           man sieht, wo ein Feld aufhört — bei schmalen Bögen anteilig, sonst
           bliebe vom kürzesten gar nichts übrig. */
        const luecke = Math.min(1.5, weite * .12);
        const [x0, y0] = radPunkt(von + luecke, R);
        const [x1, y1] = radPunkt(von + weite - luecke, R);
        g.appendChild(s_el('path', {
          class: 'rad-bogen', stroke: RAD_KREIDE[i % RAD_KREIDE.length],
          d: `M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ` +
             `${weite > 180 ? 1 : 0},1 ${x1.toFixed(1)},${y1.toFixed(1)}`,
        }));

        /* Name außen und waagerecht — das ist der ganze Punkt dieser Form.
           Auf der linken Hälfte hängt er nach innen, sonst liefe er aus dem
           Bild. Lange Namen werden gekürzt, die Liste darunter hat den vollen. */
        const mitte = von + weite / 2, [tx, ty] = radPunkt(mitte, R + 16);
        const anker = mitte > 180 ? 'end' : 'start';
        const name = s_el('text', {
          x: tx.toFixed(1), y: ty.toFixed(1), class: 'rad-name',
          'text-anchor': anker, 'dominant-baseline': 'middle',
        });
        name.textContent = kuerze(seg.name, 12);
        const zahl = s_el('text', {
          x: tx.toFixed(1), y: (ty + 13).toFixed(1), class: 'rad-zahl',
          'text-anchor': anker, 'dominant-baseline': 'middle',
        });
        zahl.textContent = seg.gewicht + ' kalt';
        g.append(name, zahl);
        von += weite;
      });
    },

    /* Die Flasche auf ein Feld fahren. Der Gewinner steht vor dem ersten Bild
       fest — er kommt vom Worker —, hier wird er nur angefahren. Der Hals zeigt
       im Ruhezustand nach oben, also ist der Zielwinkel die Feldmitte selbst. */
    radDrehen(name) {
      const i = radFelder.findIndex(f => f.name === name);
      if (i < 0) return Promise.resolve();
      const f = radFelder[i], mitte = (f.von + f.bis) / 2;
      // Nicht immer mittig halten, das sähe nach Raster aus statt nach Zufall.
      const ziel = mitte + (Math.random() - .5) * (f.bis - f.von) * .7;
      // Vorwärts weiter, mindestens fünf volle Runden ab dem Ist-Stand.
      radStand = ziel + 360 * (Math.ceil((radStand - ziel) / 360) + 5);

      const sparsam = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const g = $('rad-flasche');
      g.style.transition = sparsam ? 'none' : 'transform 4.2s cubic-bezier(.16,.9,.24,1)';
      g.style.transform = `rotate(${radStand.toFixed(2)}deg)`;
      return new Promise(fertig => setTimeout(fertig, sparsam ? 60 : 4300));
    },

    /* Eine Kommentarkarte. `tief` ist true für eine Antwort — die bekommt
       keinen eigenen Antworten-Knopf, es gibt nur eine Ebene. */
    kommentar(k, kategorien, tief) {
      const z = el('div', 'ko');
      z.dataset.id = k.id;

      const kopf = el('div', 'ko-kopf');
      kopf.appendChild(el('span', 'ko-autor kr', k.autor));
      kopf.appendChild(el('span', 'ko-zeit',
        kurzZeit(k.erstellt) + (k.geaendert ? ' · geändert' : '')));
      z.appendChild(kopf);

      /* Hing eine Bewertung am selben Absenden, steht sie über dem Text —
         so liest man, worauf sich das Lob bezieht. */
      if (k.sterne) {
        const n = el('div', 'ko-noten');
        kategorien.forEach(kat => {
          const v = k.sterne[kat.feld];
          if (Number.isFinite(v)) n.appendChild(el('span', null, kat.name + ' ' + v + '★'));
        });
        if (n.childNodes.length) z.appendChild(n);
      }

      z.appendChild(el('div', 'ko-text' + (k.geloescht ? ' weg' : ''),
        k.geloescht ? 'gelöscht' : k.text));

      const fuss = el('div', 'ko-fuss');
      if (!k.geloescht) {
        REAKTIONSARTEN.forEach(([art, bild]) => {
          const vor = k.reaktionen.find(r => r.art === art);
          // Ungedrückte Reaktionen stehen nur an der eigenen Karte nicht im
          // Weg — überall sonst braucht man sie zum Draufdrücken.
          const b = el('button', 'ko-re' + (vor && vor.meins ? ' an' : ''));
          b.type = 'button';
          b.dataset.art = art;
          b.dataset.id = k.id;
          b.appendChild(el('span', null, bild));
          if (vor && vor.anzahl) b.appendChild(el('span', 'zahl', String(vor.anzahl)));
          fuss.appendChild(b);
        });
        if (!tief) {
          const a = el('button', 'ko-tat', 'Antworten');
          a.type = 'button'; a.dataset.antwort = k.id; a.dataset.wer = k.autor;
          fuss.appendChild(a);
        }
        if (k.meins) {
          const ae = el('button', 'ko-tat', 'ändern');
          ae.type = 'button'; ae.dataset.aendern = k.id;
          const we = el('button', 'ko-tat', 'löschen');
          we.type = 'button'; we.dataset.weg = k.id;
          fuss.append(ae, we);
        }
      }
      z.appendChild(fuss);

      if (k.antworten && k.antworten.length) {
        const unten = el('div', 'ko-antw');
        k.antworten.forEach(a => unten.appendChild(VARIANTE.kommentar(a, kategorien, true)));
        z.appendChild(unten);
      }
      return z;
    },

    /* Der Anschrieb: das Tagesgericht, umkringelt.

       Zwei Zustände, ein Bild: eine frische Ziehung wartet noch auf die
       Antwort des Gezogenen, erst die Zusage macht daraus den Abend. Der
       Kringel ist die Geste des Wirts um das Tagesgericht — er gehört deshalb
       erst dahin, wenn es auch wirklich stattfindet. */
    losErgebnis(los) {
      const ziel = $('rad-erg');
      const zugesagt = los.status === 'zugesagt';
      ziel.textContent = '';
      ziel.appendChild(el('div', 'erg-oben kr',
        zugesagt ? 'Heute wird getrunken bei' : 'Die Flasche zeigt auf'));

      const name = el('div', 'erg-name kr');
      name.textContent = los.gewinner;
      if (zugesagt) {
        const svg = s_el('svg', { viewBox: '0 0 200 70', preserveAspectRatio: 'none' });
        svg.appendChild(s_el('path', { class: 'erg-kringel', d: KRINGEL }));
        name.appendChild(svg);
      }
      ziel.appendChild(name);

      const uhrzeit = z => new Date(z)
        .toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      const stand = el('div', 'erg-stand kr');
      if (zugesagt) {
        stand.classList.add('ja');
        // Mit Uhrzeit, sobald die Zusage einen Termin angelegt hat — das ist
        // die eine Angabe, wegen der man abends noch einmal nachsieht.
        stand.textContent = los.beginnt_am
          ? 'hat zugesagt — ab ' + uhrzeit(los.beginnt_am) + ' Uhr'
          : 'hat zugesagt';
      } else {
        stand.textContent = los.frist
          ? 'wartet auf Antwort — bis ' + uhrzeit(los.frist)
          : 'wartet auf Antwort';
      }
      ziel.appendChild(stand);

      const summe = los.feld.reduce((a, s) => a + s.gewicht, 0);
      const meins = (los.feld.find(s => s.name === los.gewinner) || {}).gewicht;
      ziel.appendChild(el('div', 'erg-unter',
        (los.von ? 'gedreht von ' + los.von + ' um ' : 'gedreht um ') + uhrzeit(los.gedreht) +
        (meins ? ' · ' + meins + ' von ' + summe + ' Losen' : '')));

      ziel.hidden = false;
    },
  };

  // ==========================================================================
  // DATENSCHICHT
  // Sie holt Bestenliste und Ziehung vom Worker, haelt die Anmeldung (Magic
  // Link, Geraete-Token) und ruft nach oben nur diese Funktionen, die der
  // Entwurf selbst mitbringt:
  //
  //     VARIANTE.kopf(p, modus)   der Siegerplatz. modus: 'fuehrend' | 'eigen' | 'nichts'
  //     VARIANTE.zeile(p, i, s, ich, heute)   eine Zeile der Liste (s = Ampelstufe)
  //     VARIANTE.leer()           was dasteht, wenn noch niemand gemeldet hat
  //     VARIANTE.rad(segmente)    das Gluecksrad zeichnen
  //     VARIANTE.radDrehen(name)  es auf ein Feld fahren; Promise, wenn es steht
  //     VARIANTE.losErgebnis(los) der Anschrieb der Ziehung
  //
  // Alles, was ueber Daten entscheidet, steht damit genau einmal; alles, was
  // ueber das Bild entscheidet, steht im Entwurf.
  // ==========================================================================
  const NS = 'http://www.w3.org/2000/svg';

  // So weit reicht die Strichliste, und ab so vielen Flaschen ist auch das Glas
  // voll - beide dieselbe Grenze, sonst stuende das Glas die halbe Skala lang
  // stumm auf Anschlag. Vierundzwanzig, weil das ein Kasten ist.
  const VOLL_AB = 24;

  // Die Ampel. Sechs Stufen, und die Farben sind keine Thermometerfarben,
  // sondern ein Urteil: gruen ist "so soll es sein", rot "so nicht".
  // Blau darunter heisst nicht "besser", sondern "kaelter als noetig".
  const STUFEN = [
    // bis °C, Wort,      Farbe,     Krone, Steigzeit, Perlen, Kondens, Reif
    [  2, 'eiskalt',  '#2f86c4', 1.00, '2.7s', 0.90, 0.60, 0.55],
    [  6, 'kalt',     '#2f5d4a', 0.94, '3.2s', 0.85, 0.50, 0.00],
    [  9, 'kühl',     '#5f7a33', 0.78, '4.2s', 0.70, 0.30, 0.00],
    [ 12, 'lauwarm',  '#b08a1c', 0.55, '5.6s', 0.50, 0.10, 0.00],
    [ 16, 'warm',     '#c4661f', 0.34, '7.4s', 0.32, 0.00, 0.00],
    [ 99, 'pisswarm', '#a8342a', 0.16, '9.5s', 0.16, 0.00, 0.00],
  ];

  function stufe(t) {
    for (const s of STUFEN) if (t < s[0]) return s;
    return STUFEN[STUFEN.length - 1];
  }

  // `gemeldet` ist bei der eigenen Wohnung der Zeitpunkt des letzten brauchbaren
  // Kuehlschrankfotos, auf die volle Stunde gerundet und mit Zeitzonen-Offset:
  // die Minute bleibt privat, die Rechnung stimmt trotzdem in jeder Zeitzone.
  function standText(zeit) {
    if (!zeit) return 'Stand unbekannt';
    const d = new Date(zeit);
    if (isNaN(d)) return 'Stand unbekannt';
    const stunden = (Date.now() - d) / 3600000;
    if (stunden < 24) return 'aktuell';
    const tage = Math.floor(stunden / 24);
    return tage === 1 ? 'vor 1 Tag' : 'vor ' + tage + ' Tagen';
  }

  const grad = t => Number.isFinite(t) ? t.toFixed(1).replace('.', ',') + ' °C' : '–';

  /* Die vier Reaktionen, wie bei WhatsApp. Mehr wären eine Tastatur, weniger
     ließen "nein, aber lieb gemeint" nicht ausdrücken. */
  const REAKTIONSARTEN = [
    ['daumen_hoch', '👍'], ['daumen_runter', '👎'], ['herz', '❤️'], ['bier', '🍺'],
  ];

  /* Alter eines Kommentars. Feiner als `standText`: in einem Thread ist der
     Unterschied zwischen "gerade" und "vor zwei Stunden" die halbe Information. */
  function kurzZeit(zeit) {
    const d = new Date(zeit);
    if (isNaN(d)) return '';
    const min = (Date.now() - d) / 60000;
    if (min < 2) return 'gerade';
    if (min < 60) return 'vor ' + Math.floor(min) + ' Min.';
    if (min < 60 * 24) return 'vor ' + Math.floor(min / 60) + ' Std.';
    if (min < 60 * 24 * 7) return 'vor ' + Math.floor(min / 1440) + ' Tagen';
    return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  }

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };
  const s_el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* Verlauf der letzten Tage. Klein genug, um Beiwerk zu bleiben. */
  function sparkline(werte, farbe, w = 62, h = 20) {
    const svg = s_el('svg', {
      viewBox: '0 0 ' + w + ' ' + h, width: w, height: h, 'aria-hidden': 'true',
    });
    if (!werte || werte.length < 2) return svg;   // leeres Kaestchen haelt die Zeile ruhig
    const max = Math.max(...werte, 1);
    const px = werte.map((v, i) => [
      (i / (werte.length - 1)) * (w - 2) + 1,
      h - 2 - (v / max) * (h - 4),
    ]);
    svg.appendChild(s_el('path', {
      d: 'M' + px[0][0] + ',' + h + ' ' + px.map(p => 'L' + p[0] + ',' + p[1]).join(' ') +
         ' L' + px[px.length - 1][0] + ',' + h + ' Z',
      fill: farbe, opacity: .13,
    }));
    svg.appendChild(s_el('polyline', {
      points: px.map(p => p.join(',')).join(' '), fill: 'none', stroke: farbe,
      'stroke-width': 1.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    svg.appendChild(s_el('circle', {
      cx: px[px.length - 1][0], cy: px[px.length - 1][1], r: 1.9, fill: farbe,
    }));
    return svg;
  }

  // --------------------------------------------------------------------------
  // Anmeldung und Abruf
  // --------------------------------------------------------------------------
  const API = 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';

  const merke = () => { try { return localStorage.getItem(SPEICHER); } catch { return null; } };
  const nimm  = t => { try { localStorage.setItem(SPEICHER, t); } catch {} };
  const wirf  = () => { try { localStorage.removeItem(SPEICHER); } catch {} };

  let meinName = null;      // steht nach der ersten Antwort fest
  let brauchtNamen = false; // angemeldet, aber noch ohne Namen fuer die Liste

  let heuteBei = null;      // Gewinner der geltenden Ziehung, faerbt die Liste
  let heuteStatus = null;   // 'offen' (wartet auf Antwort) oder 'zugesagt'
  /* Der Bierabend-Tag der Ziehung, nicht das Datum des Browsers: um ein Uhr
     nachts gehoert die Zusage noch zum Abend davor. */
  let losTag = null;
  let letzteTermine = [];   // fuer das Neuzeichnen nach einer Absage
  let letztesFeld = [];     // die Bestenliste, fuer "wer ist nicht im Topf"
  let selbstGedreht = false;// in DIESER Sitzung gedreht: dann bleibt das Rad stehen
  let dreht = false;        // waehrend der Animation nichts neu zeichnen

  function sagt(text, schlecht) {

  /* Drei Zustaende, und immer ist genau einer sichtbar:
       draussen        -> Knopf "Anmelden", dahinter das Adressfeld
       drin, namenlos  -> Namensfeld (direkt nach dem ersten Magic Link)
       drin, benannt   -> Meldeformular */
  function formular() {

  function liste(feld) {
    const ziel = $('rangliste');
    ziel.textContent = '';
    if (!feld.length) { ziel.appendChild(VARIANTE.leer()); return; }
    feld.forEach((p, i) => {
      // Dieselbe Ampel wie oben auf dem Siegerplatz - Wort und Farbe kommen aus
      // STUFEN, nicht aus einer zweiten Tabelle.
      const marke = p.name === heuteBei
        ? (heuteStatus === 'zugesagt' ? 'heute hier' : 'gezogen') : null;
      ziel.appendChild(VARIANTE.zeile(p, i, stufe(p.temperatur),

  function zeichneFeld(feld, los, termine) {

    heuteStatus = los && los.status || null;

    if (feld.length) VARIANTE.kopf(feld[0], 'fuehrend'); else rueckfall();
    // Vor der Liste: dort faerbt der Gewinner schon eine Zeile ein.

  // --- Termine --------------------------------------------------------------
  function terminSagt(text, schlecht) {
    const p = $('termin-sagt');

    p.classList.toggle('schlecht', !!schlecht);
