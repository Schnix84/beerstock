  /* Aus einem Tag ('YYYY-MM-DD') und einer Uhrzeit ('HH:MM') den Zeitpunkt in
     UTC. Ohne Zonenangabe liest der Browser das als ORTSZEIT — genau das ist
     hier gewollt: der Nutzer tippt 19:00 und meint seine 19:00. `toISOString`
     macht daraus, was die API will. Der Worker rechnet nie um, er hat kein ICU. */
  function alsUTC(tag, zeit) {
    const d = new Date(tag + 'T' + zeit + ':00');
    return isNaN(d) ? null : d.toISOString();
  }

  function zeichneTermine(termine) {
    letzteTermine = termine;
    const block = $('termin-block'), ziel = $('termin-liste');
    const darf = !!merke() && !!meinName;

    // Ohne Termine und ohne Anmeldung hat die Sektion nichts zu sagen.
    block.hidden = !termine.length && !darf;
    $('termin-neu').hidden = !darf;
    if (block.hidden) return;

    ziel.textContent = '';
    const jetzt = Date.now();
    const kommend = termine.filter(t => new Date(t.beginnt_am).getTime() > jetzt);
    // Rückwärts: der letzte Abend steht oben, nicht der älteste.
    const gewesen = termine.filter(t => new Date(t.beginnt_am).getTime() <= jetzt).reverse();

    const darfWeg = t => darf && (t.gastgeber === meinName || t.von === meinName);

    if (!kommend.length) {
      ziel.appendChild(el('div', 'leer-hinweis kr',
        'Kein Abend in Sicht. Das Rad drehen oder einen eintragen.'));
    }
    kommend.forEach(t => ziel.appendChild(VARIANTE.termin(t, darfWeg(t))));

    if (gewesen.length) {
      ziel.appendChild(el('div', 't-trenner', 'gewesen'));
      gewesen.forEach(t => ziel.appendChild(VARIANTE.termin(t, false)));
    }
  }

  /* Das Formular füllt sich aus der Bestenliste — Gastgeber ist, wer in der
     Liste steht. Ids kennt die Seite nicht, sie schickt den Namen. */
  function terminFormular() {
    const gast = $('t-gast');
    const gewaehlt = gast.value;
    gast.textContent = '';
    letztesFeld.forEach(p => {
      const o = el('option', null, p.name);
      o.value = p.name;
      gast.appendChild(o);
    });
    gast.value = gewaehlt || meinName || (letztesFeld[0] || {}).name || '';
    if (!$('t-datum').value) {
      // Vorgabe: heute. Ortszeit, nicht UTC — sonst steht abends schon morgen da.
      const d = new Date();
      $('t-datum').value =
        [d.getFullYear(), d.getMonth() + 1, d.getDate()]
          .map((n, i) => i ? String(n).padStart(2, '0') : n).join('-');
    }
  }

  // --- Das Glücksrad --------------------------------------------------------
  function radSagt(text, schlecht) {
    const p = $('rad-note');
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  function zeichneRad(los) {
    const block = $('rad-block');
    if (!los) { block.hidden = true; return; }
    block.hidden = false;
    losTag = los.tag;
    $('rad-datum').textContent =
      new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });

    const gezogen = !!los.gewinner;
    /* Ob gedreht werden darf, entscheidet der Worker — er kennt die Mindest-
       größe des Topfes, und die ist ab der zweiten Drehung eines Tages eine
       andere. `offen` ist die ältere Schreibweise desselben Werts. */
    const genug = los.darf_drehen !== undefined ? los.darf_drehen : los.offen;
    const darf = !!merke() && !!meinName;
    // Bewusst auf 'offen' geprüft und nicht auf „nicht zugesagt": fehlt das
    // Feld, sind die Knöpfe aus — sie riefen sonst eine Route, die es nicht gibt.
    const wartet = gezogen && los.status === 'offen';
    const binGewinner = gezogen && !!meinName && los.gewinner === meinName;
    const abgesagt = los.abgesagt || [];

    /* Das Rad steht, solange nichts gezogen ist — und danach nur noch für den,
       der eben selbst gedreht hat. Wer später dazukommt, liest das Ergebnis;
       ein Rad, das schon steht, will niemand noch einmal anschauen. */
    const zeigeRad = gezogen ? selbstGedreht : genug;
    $('rad-buehne').hidden = !zeigeRad;
    // Waehrend der Animation nicht neu zeichnen: eine Meldung, die dazwischen
    // eintrudelt, wuerde die Felder verschieben und den Zeiger danebenstellen.
    if (zeigeRad && !dreht) VARIANTE.rad(los.feld);

    if (gezogen) VARIANTE.losErgebnis(los); else $('rad-erg').hidden = true;

    /* Entscheiden darf nur der Gezogene selbst. Alle anderen lesen bloß, worauf
       die Flasche zeigt — auch der, der gedreht hat. */
    const frage = $('los-antwort');
    frage.hidden = !(binGewinner && wartet);
    if (!frage.hidden) $('los-ja').disabled = $('los-nein').disabled = false;

    const knopf = $('rad-knopf');
    knopf.hidden = gezogen || !genug || !darf;
    knopf.disabled = false;

    const teile = [];

    /* Was aus einer Absage folgt, gehört unter das Rad — sonst steht da bloß
       ein Knopf und niemand weiß, warum er wieder da ist. */
    const z = !gezogen ? los.zuletzt : null;
    if (z) {
      const selbst = !!meinName && z.name === meinName;
      teile.push((z.status === 'verfallen'
        ? (selbst ? 'Du hast nicht geantwortet' : z.name + ' hat nicht geantwortet')
        : (selbst ? 'Du hast abgesagt' : z.name + ' hat abgesagt') +
          (z.grund ? ' („' + z.grund + '“)' : '')) + ' — die Flasche ist wieder frei.');
    }

    if (!gezogen && !genug) {
      teile.push(abgesagt.length
        ? 'Heute hat abgesagt, wer da war. Morgen wieder.'
        : 'Noch zu wenig gemeldet — ausgelost wird ab ' + los.mindestens +
          ', die heute etwas Kaltes haben.');
    } else if (!gezogen) {
      /* Wer im Topf ist, entscheidet allein der Bestand — das Alter einer
         Meldung spielt keine Rolle. Draußen ist also nur, wer null gemeldet
         hat, und das ist eine Aussage über ihn und keine über die Uhr. */
      const topf = new Set(los.feld.map(s => s.name));
      const schonRaus = new Set(abgesagt);
      // Wer heute schon abgesagt hat, fehlt ebenfalls im Topf - aber aus einem
      // ganz anderen Grund, und der steht eine Zeile weiter unten.
      let raus = letztesFeld
        .filter(p => !topf.has(p.name) && !schonRaus.has(p.name)).map(p => p.name);

      if (!darf) {
        teile.push('Zum Drehen anmelden.');
      } else if (meinName && !topf.has(meinName) && !schonRaus.has(meinName)) {
        // Wer gleich persönlich angesprochen wird, muss nicht auch noch in der
        // Aufzählung darunter stehen.
        raus = raus.filter(n => n !== meinName);
        teile.push('Du bist nicht im Topf — du hast nichts Kaltes stehen. ' +
                   'Drehen darfst du trotzdem.');
      }
      if (raus.length) teile.push('Nicht im Topf: ' + raus.join(', ') + '.');
    }

    /* Gilt in jeder Lage: wer heute raus ist, wird nicht wieder gezogen. Wen
       der Satz davor schon beim Namen genannt hat, steht hier nicht noch
       einmal — bei genau einer Absage bliebe sonst dieselbe Auskunft zweimal
       untereinander stehen. */
    const rest = abgesagt.filter(n => !z || n !== z.name);
    if (rest.length) teile.push('Raus für heute: ' + rest.join(', ') + '.');

    radSagt(teile.join(' '));
  }

  async function dreh() {
    $('rad-knopf').disabled = true;
    radSagt('');
    dreht = true;
    try {
      const d = await ruf('/api/drehen', {});
      if (d.schon) {
        /* Jemand war in derselben Minute schneller. Dann gibt es nichts
           anzufahren — das Ergebnis steht schon fest und wird nur gelesen. */
        dreht = false;
        zeichneRad(d);
        radSagt('Das Rad hatte sich heute schon gedreht.');
        return;
      }
      selbstGedreht = true;
      await VARIANTE.radDrehen(d.gewinner);
      dreht = false;
      heuteBei = d.gewinner;
      heuteStatus = d.status;
      zeichneRad(d);
      liste(letztesFeld);          // die Zeile des Gewinners einfärben
    } catch (e) {
      dreht = false;
      $('rad-knopf').disabled = false;
      radSagt(e.message, true);
    }
  }

  /* Zusagen oder absagen. Nur der Gezogene kommt hier überhaupt hin — der
     Worker prüft es noch einmal, die Knöpfe sind nur die halbe Miete. */
  async function antwortLos(ja) {
    $('los-ja').disabled = $('los-nein').disabled = true;
    radSagt('');
    try {
      /* Das Datum ist der Bierabend-Tag der Ziehung, nicht „heute" im Browser:
         wer um ein Uhr nachts zusagt, meint den Abend, der gerade läuft. */
      const d = await ruf('/api/los/antwort', ja
        ? { antwort: 'ja', beginnt_am: alsUTC(losTag, $('f-zeit').value || '19:00') }
        : { antwort: 'nein', grund: $('f-grund').value });

      /* Nach einer Absage steht die Flasche wieder bereit. `selbstGedreht`
         muss dabei zurück auf false: sonst zeigt die Bühne weiter das alte
         Feld — mit dem Absager noch darin — und die nächste Drehung fährt ein
         Segment an, das es nicht mehr gibt. */
      if (!ja) { selbstGedreht = false; $('f-grund').value = ''; }

      heuteBei = d.gewinner || null;
      heuteStatus = d.status || null;
      zeichneRad(d);
      liste(letztesFeld);
      // Der Termin aus der Zusage steht sofort in der Liste — die Antwort
      // bringt sie mit, dafür braucht es keinen zweiten Ruf.
      if (d.termine) zeichneTermine(d.termine);
      radSagt(ja
        ? 'Zugesagt. Die anderen sehen es binnen einer halben Minute.'
        : 'Abgesagt. Die Flasche ist wieder frei — und dich zieht sie heute nicht mehr.');
    } catch (e) {
      $('los-ja').disabled = $('los-nein').disabled = false;
      radSagt(e.message, true);
    }
  }

  }

  function flyZu() {
    $('flyout').hidden = true;
    document.body.style.overflow = '';
    flyZiel = null;
  }

  async function flyLaden() {
    const ziel = flyZiel;
    try {
      const kopf = {};
      const token = merke();
      if (token) kopf['Authorization'] = 'Bearer ' + token;
      const r = await fetch(API + '/api/bewertungen?ziel=' + encodeURIComponent(ziel),
        { headers: kopf, cache: 'no-store' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.fehler || ('Fehler ' + r.status));
      // Zwischenzeitlich geschlossen oder umgeschaltet: die Antwort ist alt.
      if (flyZiel !== ziel) return;
      flyDaten = d;
      flyMeins = { ...(d.meins || {}) };
      flyZeichnen();
    } catch (e) {
      if (flyZiel === ziel) flySagt(e.message, true);
    }
  }

  function flyZeichnen() {
    const d = flyDaten;
    if (!d) return;

    const g = $('fly-gesamt');
    g.textContent = '';
    g.appendChild(el('div', 'fly-note' + (d.schnitt == null ? ' leer' : ''),
      d.schnitt == null ? 'noch keine Bewertung' : notenText(d.schnitt)));
    if (d.anzahl) {
      g.appendChild(el('div', 'fly-wieviele',
        d.anzahl === 1 ? 'von einem' : 'von ' + d.anzahl));
    }

    const ziel = $('fly-sterne');
    ziel.textContent = '';
    d.kategorien.forEach(k => {
      const reihe = el('div', 'st-reihe' + (d.darf ? '' : ' fremd'));
      reihe.appendChild(el('div', 'st-name kr', k.name));

      const knoepfe = el('div', 'st-knoepfe');
      const meins = flyMeins[k.feld];
      for (let i = 1; i <= 5; i++) {
        const b = el('button', 'st-knopf' + (meins >= i ? ' an' : ''));
        b.type = 'button';
        b.disabled = !d.darf;
        b.setAttribute('aria-label', k.name + ': ' + i + ' von 5');
        b.appendChild(sternSvg());
        /* Noch einmal auf denselben Stern nimmt die Kategorie zurück. Das ist
           der ganze Weg zurück — ein eigener Knopf dafür je Zeile wären vier
           weitere Ziele in einer Reihe, die schon fünf hat. */
        if (d.darf) b.addEventListener('click', () => {
          flyMeins[k.feld] = meins === i ? null : i;
          flySpeichern();
        });
        knoepfe.appendChild(b);
      }
      reihe.appendChild(knoepfe);

      reihe.appendChild(el('div', 'st-mittel', k.anzahl
        ? 'Schnitt ' + notenText(k.schnitt) + ' aus ' + k.anzahl
        : 'noch nicht bewertet'));
      ziel.appendChild(reihe);
    });

    $('fly-hinweis').textContent = d.darf
      ? 'Ein Tap setzt, derselbe Stern noch einmal nimmt zurück. Keine Kategorie ist Pflicht.'
      : (merke() && meinName ? 'Sich selbst bewertet man nicht.' : 'Zum Bewerten anmelden.');

    flyThread();
  }

  /* Der Thread. Wurzeln untereinander, Antworten eingerückt darunter — beides
     aufsteigend, ein Gespräch liest man von oben nach unten. */
  function flyThread() {
    const d = flyDaten;
    const ziel = $('fly-thread');
    const kommentare = (d && d.kommentare) || [];
    ziel.textContent = '';
    $('fly-thread-kopf').hidden = !kommentare.length;
    kommentare.forEach(k => ziel.appendChild(VARIANTE.kommentar(k, d.kategorien, false)));

    $('fly-schreib').hidden = !(d && d.darf_schreiben);
    flyAnZeigen();
  }

  // Was das Feld unten gerade tut: ein neuer Kommentar, eine Antwort, oder das
  // Ändern eines eigenen. Ein Feld für drei Aufgaben — mehr braucht es nicht.
  let flyModus = { art: 'neu', id: null, wer: null };

  function flyAnZeigen() {
    const an = $('fly-an');
    an.hidden = flyModus.art === 'neu';
    if (!an.hidden) {
      $('fly-an-text').textContent = flyModus.art === 'antwort'
        ? 'Antwort an ' + flyModus.wer
        : 'Kommentar ändern';
    }
    $('fly-ab').textContent = flyModus.art === 'aendern' ? 'Übernehmen' : 'Abschicken';
    $('fly-feld').placeholder = flyModus.art === 'antwort'
      ? 'Antwort an ' + flyModus.wer + ' …' : 'Etwas dazu sagen …';
  }

  function flyModusZurueck() {
    flyModus = { art: 'neu', id: null, wer: null };
    $('fly-feld').value = '';
    flyAnZeigen();
  }

  /* Einen Kommentar im geladenen Baum finden — für "ändern" braucht das Feld
     den bisherigen Text, und der steht schon da. */
  function flyFinden(id) {
    for (const k of (flyDaten && flyDaten.kommentare) || []) {
      if (k.id === id) return k;
      for (const a of k.antworten) if (a.id === id) return a;
    }
    return null;
  }

  async function flyAbschicken() {
    const text = $('fly-feld').value.trim();
    if (!text) { flySagt('Ohne Text kein Kommentar.', true); return; }
    const [art, id] = flyZiel.split(':');
    $('fly-ab').disabled = true;
    flySagt('');
    try {
      /* Ein eigener Wurzelkommentar von jemandem, der hier schon Sterne
         vergeben hat, geht MIT ihnen raus — dann trägt die Karte die Note, auf
         die sie sich bezieht. In der Datenbank bleiben es zwei Zeilen: eine
         geänderte Note soll den Kommentar nicht mitreißen. Antworten und
         Änderungen laufen immer über die Kommentarroute. */
      const mitSternen = flyModus.art === 'neu' && flyDaten && flyDaten.darf &&
        Object.values(flyMeins).some(v => Number.isFinite(v));

      if (flyModus.art === 'aendern') {
        await ruf('/api/kommentar/aendern', { id: flyModus.id, text });
      } else if (mitSternen) {
        await ruf('/api/bewerten', {
          ziel_art: art, ziel_id: Number(id), sterne: flyMeins, text,
        });
      } else {
        await ruf('/api/kommentar', {
          ziel_art: art, ziel_id: Number(id), text,
          antwort_auf: flyModus.art === 'antwort' ? flyModus.id : undefined,
        });
      }
      flyModusZurueck();
      await flyLaden();
      await hole();                 // der Zähler in der Liste dahinter
    } catch (e) {
      flySagt(e.message, true);
    } finally {
      $('fly-ab').disabled = false;
    }
  }

  /* Reagieren wird SOFORT gezeichnet, bevor die Antwort da ist — ein Daumen,
     der eine halbe Sekunde überlegt, fühlt sich kaputt an. Scheitert der Ruf,
     springt er zurück und die Fehlerzeile erscheint. */
  async function flyReagieren(id, art) {
    const k = flyFinden(id);
    if (!k) return;
    const vor = k.reaktionen.find(r => r.art === art);
    const anJetzt = !(vor && vor.meins);
    if (vor) {
      vor.meins = anJetzt;
      vor.anzahl += anJetzt ? 1 : -1;
      if (vor.anzahl <= 0) k.reaktionen = k.reaktionen.filter(r => r !== vor);
    } else {
      k.reaktionen.push({ art, anzahl: 1, meins: true });
    }
    flyThread();
    flySagt('');
    try {
      const d = await ruf('/api/reaktion', { kommentar_id: id, art });
      // Was der Server sagt, gilt: zwei Geräte können sich überholt haben.
      const jetzt = flyFinden(id);
      if (!jetzt) return;
      jetzt.reaktionen = jetzt.reaktionen.filter(r => r.art !== art);
      if (d.anzahl > 0) jetzt.reaktionen.push({ art, anzahl: d.anzahl, meins: d.meins });
      flyThread();
    } catch (e) {
      flySagt(e.message, true);
      await flyLaden();
    }
  }

  /* Gespeichert wird sofort bei jedem Tap — kein Knopf darunter. Wer eine Note
     ändert, will sie geändert haben, nicht bestätigen. Die Sperre im Worker
     fängt das Trommelfeuer ab; deshalb steht die Fehlerzeile bereit. */
  async function flySpeichern() {
    if (!flyZiel) return;
    const [art, id] = flyZiel.split(':');
    flyZeichnen();                       // sofort zeichnen, bevor die Antwort da ist
    flySagt('');
    try {
      await ruf('/api/bewerten', { ziel_art: art, ziel_id: Number(id), sterne: flyMeins });
      await flyLaden();                  // Schnitt und Anzahl kommen vom Server
      await hole();                      // ... und die Zeile in der Liste dahinter
    } catch (e) {
      flySagt(e.message, true);
      // Zurück auf den letzten bestätigten Stand, sonst zeigt das Blatt etwas,
      // was in der Datenbank nicht steht.
      flyMeins = { ...((flyDaten && flyDaten.meins) || {}) };
      flyZeichnen();
    }
  }

  /* Rueckfall: der eigene Kuehlschrank aus status.json, wie die Seite es vor der
     Bestenliste gemacht hat. Lieber ein Kuehlschrank als eine leere Tabelle.
     Der Pfad gilt fuer die Datei im Wurzelverzeichnis (also als index.html). */
  function rueckfall() {
    return fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
      .then(d => VARIANTE.kopf({
        name: 'Kühlschrank', biere: Number(d.biere),
        temperatur: Number(d.temperatur), gemeldet: d.stand,
      }, 'eigen'))
      .catch(() => VARIANTE.kopf(null, 'nichts'));
  }

  async function hole() {
    try {
      const r = await fetch(API + '/api/leaderboard', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      zeichneFeld(d.feld || [], d.los || null, d.termine || []);
    } catch (e) {
      // API weg: der Siegerplatz zeigt wieder den eigenen Kuehlschrank, Liste,
      // Rad und Termine bleiben draussen - ohne Worker gibt es keine Ziehung.
      $('block').hidden = true;
      $('rad-block').hidden = true;
      $('termin-block').hidden = true;
      await rueckfall();
    }
  }

  async function ruf(pfad, rumpf) {
    const kopf = { 'Content-Type': 'application/json' };
    const token = merke();
    if (token) kopf['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + pfad, {
      method: 'POST', headers: kopf, body: JSON.stringify(rumpf),
    });
    let d = {};
    try { d = await r.json(); } catch {}
    if (!r.ok) throw new Error(d.fehler || ('Fehler ' + r.status));
    return d;
  }

  // --- Bedienung ------------------------------------------------------------
  $('rad-knopf').addEventListener('click', dreh);
  $('los-ja').addEventListener('click', () => antwortLos(true));
  $('los-nein').addEventListener('click', () => antwortLos(false));
  /* Enter im Grundfeld ist eine Absage — es steht unter keinem Formular, also
     tut die Taste sonst gar nichts, und genau das erwartet dort niemand. */
  $('f-grund').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); antwortLos(false); }
  });

  /* Das Flyout hängt an den Listen, nicht an der einzelnen Zeile: beide werden
     bei jedem Nachfassen neu gebaut, ein Zuhörer je Zeile ginge dabei verloren. */
  ['rangliste', 'termin-liste'].forEach(id => {
    $(id).addEventListener('click', ev => {
      const b = ev.target.closest('.z-bewerten');
      if (b) flyAuf(b.dataset.ziel, b.dataset.name);
    });
  });
  $('fly-zu').addEventListener('click', flyZu);
  $('fly-schirm').addEventListener('click', flyZu);

  /* Alles am Thread hängt an einem Zuhörer: der Baum wird bei jeder Antwort
     neu gebaut, ein Zuhörer je Karte ginge dabei verloren. */
  $('fly-thread').addEventListener('click', async ev => {
    const re = ev.target.closest('.ko-re');
    if (re) { flyReagieren(Number(re.dataset.id), re.dataset.art); return; }

    const tat = ev.target.closest('.ko-tat');
    if (!tat) return;

    if (tat.dataset.antwort) {
      flyModus = { art: 'antwort', id: Number(tat.dataset.antwort), wer: tat.dataset.wer };
      $('fly-feld').value = '';
      flyAnZeigen();
      $('fly-feld').focus();
    } else if (tat.dataset.aendern) {
      const k = flyFinden(Number(tat.dataset.aendern));
      flyModus = { art: 'aendern', id: Number(tat.dataset.aendern), wer: null };
      $('fly-feld').value = (k && k.text) || '';
      flyAnZeigen();
      $('fly-feld').focus();
    } else if (tat.dataset.weg) {
      tat.disabled = true;
      flySagt('');
      try {
        await ruf('/api/kommentar/aendern', { id: Number(tat.dataset.weg), loeschen: true });
        if (flyModus.id === Number(tat.dataset.weg)) flyModusZurueck();
        await flyLaden();
        await hole();
      } catch (e) {
        tat.disabled = false;
        flySagt(e.message, true);
      }
    }
  });

  $('fly-ab').addEventListener('click', flyAbschicken);
  $('fly-an-weg').addEventListener('click', flyModusZurueck);
  /* Strg/Cmd + Enter schickt ab. Enter allein bleibt der Zeilenumbruch — in
     einem mehrzeiligen Feld erwartet das jeder so. */
  $('fly-feld').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); flyAbschicken(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !$('flyout').hidden) flyZu();
  });

  /* Das Eintrageformular klappt auf, statt dauerhaft dazustehen: die Liste ist
     das Wichtige, das Formular braucht man selten. */
  $('termin-neu').addEventListener('click', () => {
    const f = $('termin-form');
    f.hidden = !f.hidden;
    $('termin-neu').textContent = f.hidden ? 'eintragen' : 'abbrechen';
    if (!f.hidden) { terminFormular(); $('t-datum').focus(); }
    terminSagt('');
  });

  $('termin-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    const wann = alsUTC($('t-datum').value, $('t-zeit').value || '19:00');
    if (!wann) { terminSagt('Tag und Uhrzeit fehlen.', true); return; }
    knopf.disabled = true; terminSagt('');
    try {
      const d = await ruf('/api/termin', {
        gastgeber: $('t-gast').value, beginnt_am: wann, titel: $('t-titel').value,
      });
      $('t-titel').value = '';
      $('termin-form').hidden = true;
      $('termin-neu').textContent = 'eintragen';
      zeichneTermine(d.termine || letzteTermine);
      terminSagt('Eingetragen — Bierabend bei ' + d.gastgeber + '.');
    } catch (e) {
      terminSagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  /* Absagen hängt an der Liste, nicht am einzelnen Knopf: die Liste wird bei
     jedem Nachfassen neu gebaut, ein Zuhörer je Zeile ginge dabei verloren. */
  $('termin-liste').addEventListener('click', async ev => {
    const knopf = ev.target.closest('.t-weg');
    if (!knopf) return;
    knopf.disabled = true;
    terminSagt('');
    try {
      const d = await ruf('/api/termin/aendern', { id: Number(knopf.dataset.termin), absagen: true });
      zeichneTermine(d.termine || letzteTermine);
      terminSagt('Abgesagt.');
      // Hing eine Zusage daran, ist der Tag wieder frei - dann muss auch das
      // Rad zurück auf Anfang, samt Bühne für den, der zuletzt gedreht hat.
      if (d.los_frei) { selbstGedreht = false; await hole(); }
    } catch (e) {
      knopf.disabled = false;
      terminSagt(e.message, true);
    }
  });

  $('zeig-anmeldung').addEventListener('click', () => {
    $('zeig-anmeldung').hidden = true;
    $('anmelde-form').hidden = false;
    $('f-mail').focus();
  });

  /* Adresse rein, Link raus. Die Antwort ist bewusst dieselbe, egal ob die
     Adresse bekannt ist - sonst verriete die Seite, wer mitspielt. */
  $('anmelde-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    knopf.disabled = true; sagt('');
    try {
      await ruf('/api/anmelden', { email: $('f-mail').value });
      $('anmelde-form').hidden = true;
      $('zeig-anmeldung').hidden = false;
      sagt('Link ist unterwegs. Schau ins Postfach — auch im Spam. Er gilt 15 Minuten.');
    } catch (e) {
      sagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  /* Der Name fuer die Liste, einmalig nach dem ersten Link. */
  $('name-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    knopf.disabled = true; sagt('');
    try {
      const d = await ruf('/api/name', { name: $('f-name').value });
      meinName = d.name;
      brauchtNamen = false;
      sagt('Willkommen, ' + d.name + '. Jetzt eintragen, wie viel kalt steht.');
      formular();
      $('f-biere').focus();
      await hole();
    } catch (e) {
      sagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  $('melde-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const knopf = ev.target.querySelector('button[type=submit]');
    knopf.disabled = true; sagt('');
    try {
      const d = await ruf('/api/report', {
        biere: parseInt($('f-biere').value, 10),
        temperatur: $('f-grad').value,
      });
      meinName = d.name;
      sagt(d.rang === 1
        ? 'Eingetragen — du führst das Feld an.'
        : 'Eingetragen. Platz ' + d.rang + '.');
      await hole();
    } catch (e) {
      sagt(e.message, true);
    } finally {
      knopf.disabled = false;
    }
  });

  $('abmelden').addEventListener('click', async () => {
    /* Nur DIESES Geraet. Die anderen bleiben angemeldet, und der Eintrag in der
       Liste bleibt sowieso - abmelden ist kein Austritt aus dem Wettbewerb.
       Der Ruf raus darf scheitern, das Token fliegt hier trotzdem weg. */
    try { await ruf('/api/abmelden', {}); } catch {}
    wirf();
    meinName = null;
    brauchtNamen = false;
    sagt('Abgemeldet. Dein Eintrag bleibt in der Liste stehen.');
    formular();
  });

  /* Wer schon angemeldet ist, soll seinen Namen kennen, BEVOR die Liste
     gezeichnet wird - sonst faerbt sich die eigene Zeile erst nach der ersten
     Meldung. Ein 401 heisst: das Token gilt nicht mehr, dann hier gleich
     wegwerfen, statt den Anmeldeknopf zu verstecken. */
  async function werBinIch() {
    const token = merke();
    if (!token) return;
    try {
      const r = await fetch(API + '/api/me', {
        headers: { Authorization: 'Bearer ' + token }, cache: 'no-store',
      });
      if (r.status === 401) { wirf(); return; }
      if (!r.ok) return;
      const d = await r.json();
      meinName = d.name;
      brauchtNamen = !!d.braucht_namen;
    } catch { /* offline - dann eben ohne Hervorhebung */ }
  }

  /* Der Magic Link landet als `#anmelden=...` im Adressfragment. Ein Fragment
     wird nie an einen Server geschickt, steht also in keinem Zugriffsprotokoll -
     deshalb dort und nicht als Suchparameter. Direkt nach dem Einloesen fliegt
     es aus der Adresszeile, damit ein Screenshot oder ein zurueckgeblaettertes
     Fenster ihn nicht weiterreicht (er ist dann ohnehin verbraucht). */
  async function magicEinloesen() {
    const treffer = /[#&]anmelden=([a-f0-9]{32,})/i.exec(location.hash || '');
    if (!treffer) return;
    const roh = treffer[1];
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const r = await fetch(API + '/api/magic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: roh }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { sagt(d.fehler || 'Der Link hat nicht funktioniert.', true); return; }
      nimm(d.token);
      meinName = d.name;
      brauchtNamen = !!d.braucht_namen;
      sagt(brauchtNamen
        ? 'Drin. Wie sollst du in der Liste heißen?'
        : 'Willkommen zurück, ' + d.name + '.');
    } catch {
      sagt('Der Link ließ sich gerade nicht einlösen. Netz weg?', true);
    }
  }

  /* Die Seite steht oft lange offen - auf einem Tisch, auf einem Tablet. Also
     nachfassen, aber nur, solange jemand hinsieht: ein Hintergrundtab fragt
     nichts. */
  function nachfassen() {
    let letzte = Date.now();
    const frisch = () => { letzte = Date.now(); hole(); };
    setInterval(() => {
      if (document.visibilityState === 'visible' && Date.now() - letzte > 60000) frisch();
    }, 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - letzte > 60000) frisch();
    });
  }

  /* Reihenfolge: erst den Link einloesen (der setzt das Token), dann wissen,
     wer man ist, dann zeichnen. */
  magicEinloesen()
    .then(() => merke() && !meinName && !brauchtNamen ? werBinIch() : null)
    .then(hole)
    .then(nachfassen);

</script>
</body>
</html>
