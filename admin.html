<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kontor — beerstock</title>
<style>
  /* ==========================================================================
     DAS KONTOR

     Das Hinterzimmer derselben Kneipe — und seit dem Umbau auf Register auch
     im selben Kleid: Schiefer im Holzrahmen, Kreide darauf. Jedes Blatt ist
     eine Tafel, die man aufschlägt; die Zungen oben sagen, welche.

     Vorher lag hier ein Kontorbuch aus Papier und Tinte. Der Grund dafür war
     gut („das Kontor ist kein Gegenstand, sondern ein Buch, und es spart, den
     ganzen Kreide-Stil zu duplizieren") — er hat nur nicht gehalten: die
     Statistikseite (`statistik.html`) zeigt dieselben Bilder längst auf
     Schiefer, und wer aus der Tafel ins Kontor ging, wechselte auf halbem Weg
     das Haus. Der Stil ist auch nicht dupliziert: `bilder.js` bekommt seine
     Farben als Palette gereicht, und die paar Dutzend Zeilen hier sind die
     Haut, nicht die Bedienung.

     Was NICHT mit auf die Tafel wandert, ist die Mail-Vorschau: eine Mail
     wird in einem fremden Programm auf hellem Grund gelesen. Bliebe sie
     dunkel, löge sie.

     Kein Hell/Dunkel-Umschalter — wie drüben. Eine Tafel hat eine Farbe.
     ========================================================================== */
  :root {
    --schiefer:    #262c2e;
    --schiefer-t:  #191d1f;
    --holz:        #6b4a2c;
    --holz-t:      #3f2a17;
    --kreide:      #eef1ea;
    --kreide-matt: #cfd6cd;
    --kreide-weg:  #93a09a;
    --gelb:        #e8c766;
    --rot:         #d9705f;
    --gruen:       #7fc08c;
    --linie:       #ffffff22;   /* die Haarlinie auf Schiefer            */
    --karte:       #ffffff08;   /* eine Karte ist hier ein Hauch Kreide  */
    --hand: 'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
    /* Die Breite des Buches. Steht als Variable da, weil sie an ZWEI Stellen
       gebraucht wird — Register und Blätter. Gingen sie auseinander, endete
       die letzte Zunge am Fenster- statt am Tafelrand. */
    --rand: 940px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 60px;
    background: #14181a;
    color: var(--kreide);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  /* Der obere Rand steht jetzt fest. Er hing einmal an einer Regel
     `.register[hidden] + .buch` — das Register lag über dem Buch, und den
     Platz, den es einnahm, musste das Buch selbst hergeben, sobald es fehlte.
     Seit die Zungen IM Blatt stehen, gibt es nichts mehr darüber, und der
     Abstand gilt für jeden Fall gleich. */
  .buch { max-width: var(--rand); margin: 0 auto; padding: 16px 14px 0; }

  /* --- Das Register --------------------------------------------------------
     Drei Zungen und der Weg hinaus. Vorher lagen alle Blätter untereinander
     auf einer Endlos-Rolle; wer ins Protokoll wollte, scrollte an elf
     Grafiken vorbei.

     Es hing lange als Reihe HÖLZERNER Zungen über dem Buch, klebend am
     Fensterrand — ein Register am Einband, aus dem Material des Einbands.
     Das war in sich stimmig und trotzdem falsch: über der Tafel lag damit ein
     brauner Streifen, der bei jedem Scrollen mitfuhr, und das Erste, was man
     vom Kontor sah, war Holz. Die Tafel ist aber das, was man liest.

     Jetzt steht das Register IM Blatt, in Kreide, in der Form der Reiter
     weiter unten (`.reiter` — Sieb und Zeitraum): dieselbe Pille, dieselbe
     gefüllte Marke für das Gewählte. Zwei Formen für „hier wird umgeschaltet"
     wären eine zu viel, und die Kreide-Pille war schon da.

     Verwechselbar wird das nicht, weil zwischen beiden IMMER eine Überschrift
     steht: das Register, dann `h1`/`h2` mit ihrer Haarlinie, dann erst der
     Reiter, der siebt. Wer die Reihenfolge einmal umstellt, muss sich das hier
     wieder ansehen.

     Mittig auf dem Blatt, auf jeder Breite. Sie standen kurz links, mit dem
     Argument, im Blatt fange alles am linken Rand an (Überschrift, Reiter,
     Karten) — das stimmt für Text, und die Reihe ist keiner: sie ist die
     Navigation der ganzen Seite und steht quer über allem, was folgt. Vier
     kurze Pillen linksbündig lassen rechts daneben ein Loch, das aussieht,
     als fehlte dort noch etwas.

     Hier geht `justify-content: center`, und das ist der Unterschied zu
     früher: solange die Reihe eine Scrollfläche war (`overflow-x: auto`, die
     hölzerne Fassung), schob `center` beim Überlaufen den ANFANG nach links
     aus dem Bild, und dorthin scrollt kein Mensch zurück — deswegen standen
     dort einmal zwei Auto-Ränder. Eine umbrechende Reihe hat das Problem
     nicht: sie läuft nie über, sie bricht um, und `center` zentriert dann
     jede Zeile für sich. Wer `flex-wrap` je wieder wegnimmt, muss die
     Auto-Ränder zurückholen.
     --------------------------------------------------------------------- */
  .register {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    justify-content: center; margin-bottom: 16px;
  }
  .register[hidden] { display: none; }
  /* Wortgleich zu `.reiter button` weiter unten, nur trägt die Regel hier auch
     das <a> des Rückwegs — ein Link ist kein Knopf und erbt weder die
     Grundform noch das `font: inherit`. */
  .register button, .register .zur-tafel {
    font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
    text-decoration: none;
    border: 1px solid #ffffff40; border-radius: 999px;
    background: #ffffff0a; color: var(--kreide-weg);
    padding: 4px 12px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .register button:hover, .register .zur-tafel:hover {
    background: #ffffff1c; border-color: #ffffff77; color: var(--kreide);
  }
  /* Das aufgeschlagene Blatt. Es war kurz voll ausgemalt — Kreidefläche,
     dunkle Schrift, die Marke von `.reiter`. Das ist an einem Sieb richtig,
     wo drei gleich große Wörter nebeneinander liegen, und war hier falsch:
     eine helle Fläche zieht am oberen Rand der Tafel das Auge ganz auf sich,
     noch bevor man die Überschrift darunter liest. Der gewählte Reiter ist
     eine Auskunft, kein Anschlag.

     Also bleibt der Grund, wie er ist, und heller werden nur Rand und Schrift:
     `--kreide` statt `--kreide-weg`, dazu ein volles statt eines halben Weiß
     am Rand, und der Rand wird dicker.

     2 px und NICHT 1,5. Hier stand erst 1,5 px, und das war eine Regel ohne
     Wirkung: Chrome rundet Randbreiten auf ganze CSS-Pixel ab, `1.5px` kommt
     als 1 px heraus. Gemessen bei `deviceScaleFactor` 1, 2 und 3 — auch auf
     Retina bleibt es 1 px, der Bruch wird also nicht etwa in Gerätepixeln
     gerettet. Wer hier eine krumme Breite hinschreibt, ändert nichts und sieht
     es nicht.

     Die Pille wird dadurch zwei Pixel breiter (`box-sizing: border-box` hilft
     nicht: ohne feste Breite bestimmt der Inhalt das Maß, Polsterung und Rand
     kommen obendrauf). Die REIHE bleibt trotzdem konstant, weil immer genau
     eine Zunge gewählt ist — die zwei Pixel wandern nur mit.

     Der dickere STRICH kommt über einen Schatten und nicht über
     `font-weight: 600`. Das war der erste Versuch und er hat sich gerächt: der
     fette Schnitt ist breiter, jede Zunge trägt ein anderes Wort, und damit
     hing die Breite der ganzen Reihe daran, WELCHE gerade gewählt ist. Bei
     375 px passte sie unter „Übersicht" in eine Zeile und brach unter
     „Statistiken" um — gemessen, ein Umbruch, der beim Blättern kommt und
     geht. Ein Schatten in der eigenen Farbe verdickt die Striche und rührt die
     Maße nicht an; auf Kreide ist er ohnehin die richtige Sprache (die Tafel
     drüben zeichnet ihre Schrift mit demselben Mittel, siehe `.kr`).

     Der Zeiger-Zustand bleibt unverändert: der gewählte Reiter ist schon da,
     wo er hinführt, und ein Aufleuchten verspräche eine Handlung. */
  .register button.an {
    border-color: var(--kreide); border-width: 2px; color: var(--kreide);
    text-shadow: 0 0 .6px currentColor, 0 0 .6px currentColor;
  }
  .register button.an:hover {
    background: #ffffff0a; border-color: var(--kreide); color: var(--kreide);
  }
  /* Der Zähler tritt zurück, aber nicht aus dem Bild: auf der umrissenen Pille
     sind .65 Deckkraft gegen `--kreide-weg` noch lesbar, und er sitzt auf
     Schiefer und nicht mehr auf Holz, wo dieselbe Zurücknahme einmal auf 2,8:1
     fiel. Dieselbe Zahl wie an `.reiter button i`. */
  .register button i { font-style: normal; opacity: .65; margin-left: 5px; }

  /* Der Rückweg trägt nur den Pfeil. Das Wort stand einmal dabei und kostete
     die Reihe: im Blatt eines 390er-Handys bleiben 307 px nutzbare Breite,
     und mit „← zur Tafel" brauchten die vier Pillen 387 — also zwei Reihen
     für vier Ziele. Ohne das Wort passen sie in eine.

     Das geht, weil der Pfeil neben drei Substantiven eindeutig ist: die
     anderen drei führen INS Kontor, dieser eine hinaus. Runde Pille statt
     eines nackten Zeichens, damit er ein Ziel bleibt, das ein Daumen trifft —
     daher die Mindestbreite. Der Name für Vorleseprogramme kommt aus dem
     `aria-label` im JS; ein Pfeil allein ist dort keine Auskunft. */
  .register .zur-tafel {
    min-width: 40px; justify-content: center;
    display: inline-flex; align-items: center;
    padding: 4px 10px;
  }

  /* Der Pfeil allein reichte noch nicht ganz: bei 390 px brauchten die vier
     Pillen gemessen 323 px und hatten 308. Der Rest kommt aus der Polsterung
     (12 → 8 px, dreimal beidseitig) und dem Zwischenraum (6 → 4); gemessen
     sind es jetzt 278 plus 12 Zwischenraum. Damit passen sie auch bei 375 px,
     der zweiten verbreiteten Handybreite — dort sind nur 293 px da, und
     darunter zu bleiben war das, was den engeren Schnitt entschieden hat.

     Bewusst NICHT über die Schriftgröße: die Zungen sind die Navigation dieser
     Seite, und was man mit dem Daumen trifft, soll man auch lesen können. Eine
     engere Pille bleibt gleich gut lesbar, eine kleinere Schrift nicht. Der
     Pfeil behält seine Mindestbreite aus demselben Grund — er ist das kleinste
     Ziel der Reihe und darf nicht das erste sein, das schrumpft.

     Bei 320 px reicht auch das nicht (238 px verfügbar), dort bricht die Reihe
     um. Ein Umbruch bei vier Zielen ist kein Schaden; das Ziel war, ihn auf
     den üblichen Handybreiten loszuwerden. */
  @media (max-width: 430px) {
    .register { gap: 4px; }
    .register button { padding: 4px 8px; }
  }

  /* Ein Blatt ist hier eine Tafel: Schiefer im Holzrahmen, wie das Brett der
     Hauptseite — samt Korn und den Schlieren vom letzten Wischen. Der Rahmen
     hat bewusst dieselbe Breite und Maserung wie `.brett` in `index.html`;
     gemalt als durchsichtige Border, in deren Streifen die Holz-Hintergründe
     per `border-box` laufen. Drüben sind das zwei Elemente, hier reicht so
     eines. */
  .blatt {
    position: relative;
    border: clamp(9px, 2.4vw, 15px) solid transparent;
    border-radius: 6px;
    background:
      radial-gradient(120% 80% at 22% 8%, #37403f 0%, var(--schiefer) 45%, var(--schiefer-t) 100%) padding-box,
      repeating-linear-gradient(97deg, #ffffff0a 0 2px, transparent 2px 7px, #0006 7px 8px, transparent 8px 19px) border-box,
      linear-gradient(160deg, var(--holz), var(--holz-t) 60%, #2c1c0f) border-box;
    box-shadow:
      0 30px 60px -24px #000d,
      0 0 0 1px #0009 inset,
      0 0 40px #0006 inset;
    padding: 18px 16px 20px 20px;
    /* KEINE Einblendung. Vorher lief hier ein `aufschlagen` von 0,28 s, aus
       der Zeit, als die fünf Blätter untereinander lagen und nacheinander
       hereinkamen. Unter dem Register wird daraus etwas anderes: das
       Umschalten von `hidden` startet die Animation JEDES MAL neu (gemessen:
       `currentTime` 0 und `opacity` 0 bei jedem Klick auf eine Zunge). Jeder
       Registerwechsel hätte also 0,28 s Warten gekostet — auf einer Seite,
       deren ganzer Zweck es ist, schneller zwischen den Blättern zu kommen. */
  }

  /* Das Korn der Tafel. Liegt über allem und fängt nichts ab. */
  .blatt::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    border-radius: 2px;
    background-image:
      radial-gradient(#ffffff0d 1px, transparent 1.4px),
      radial-gradient(#00000030 1px, transparent 1.6px);
    background-size: 4px 4px, 6px 6px;
    background-position: 0 0, 2px 3px;
  }
  .blatt[hidden] { display: none; }

  h1 {
    font-family: var(--hand); font-size: 27px; font-weight: normal;
    margin: 0 0 2px; letter-spacing: .01em;
  }
  .unter { font-size: 12px; color: var(--kreide-weg); margin: 0 0 16px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--kreide-weg); margin: 0 0 12px;
    padding-bottom: 5px; border-bottom: 1px solid var(--linie);
  }
  h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--kreide-matt); }

  /* Ein Zwischentitel im Statistikblatt. Elf Bilder hintereinander sind eine
     Halde; drei benannte Gruppen sind eine Gliederung. Der Strich läuft bis
     zum Rand aus, damit der Titel eine Zeile anfängt und nicht in der Luft
     hängt. */
  .gruppe {
    display: flex; align-items: baseline; gap: 10px;
    margin: 26px 0 10px; font-size: 12px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--kreide-weg);
  }
  .gruppe::after { content: ''; flex: 1; border-bottom: 1px solid var(--linie); }
  .gruppe:first-child { margin-top: 2px; }

  /* --- Der Kopf ------------------------------------------------------------
     Vier Zahlen und eine Ampel. Sie stehen ganz oben, weil sie die Frage
     beantworten, mit der man das Kontor überhaupt aufschlägt: läuft alles.
     --------------------------------------------------------------------- */
  .zahlen { display: flex; flex-wrap: wrap; gap: 10px; }
  .zahl {
    flex: 1 1 110px; padding: 10px 12px;
    border: 1px solid var(--linie); border-radius: 3px; background: var(--karte);
  }
  .zahl b { display: block; font-family: var(--hand); font-size: 26px; line-height: 1.1; font-weight: normal; }
  .zahl span { font-size: 11px; color: var(--kreide-weg); }
  .zahl.warn b { color: var(--rot); }
  /* Der Verlauf unter der Zahl. Eine einzelne Zahl sagt nicht, ob sie viel
     ist — „12 Mails" ist ein ruhiger Tag oder ein Ausbruch, je nachdem, was
     davor war. Die Linie steht nur an den Kacheln, für die es wirklich eine
     Reihe gibt; die übrigen bleiben nackt, statt eine zu erfinden. */
  .zahl svg { display: block; width: 100%; height: 22px; margin-top: 7px; }
  .zahl em { display: block; font-size: 10.5px; font-style: normal; color: var(--kreide-weg); }

  /* Die Ampel ist die wichtigste Auskunft des Kopfes und sah als Fließtext mit
     Punkten davor aus wie eine Aufzählung. Als Pillen ist sie eine Reihe von
     Lampen. Was der Worker wörtlich geantwortet hat, steht im Tooltip: eine
     rote Pille mit angehängtem Fehlertext wäre dreimal so lang wie die
     anderen und risse die Zeile auseinander. */
  .ampel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; font-size: 12px; }
  .ampel span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 9px; border-radius: 999px;
    border: 1px solid #ffffff26; background: #ffffff0a; color: var(--kreide-matt);
    cursor: default;
  }
  .ampel span::before { content: '●'; font-size: 9px; color: var(--gruen); }
  .ampel span.aus { border-color: #d9705f66; background: #d9705f14; color: #f0c6be; }
  .ampel span.aus::before { color: var(--rot); }
  .ampel span.egal::before { color: var(--kreide-weg); }

  /* Sechs Lampen, sechs verschieden lange Wörter: im Fluss ergab das auf dem
     Handy DREI Reihen mit 2, 3 und 1 Lampe — eine Treppe, und die letzte
     Lampe stand allein da, als wäre sie etwas anderes als die fünf darüber.
     Ein festes Raster aus drei Spalten macht daraus zwei volle Reihen.

     `minmax(0, 1fr)` und nicht `1fr`: die Grundbreite eines Rasterfeldes ist
     `auto`, also der Inhalt, und „MAIL_GEHEIM" hätte seine Spalte breiter
     gemacht als die beiden daneben — drei gleiche Spalten gibt es erst mit der
     ausdrücklichen Null als Untergrenze.

     Enger gesetzt als im Fluss, weil drei Spalten in 307 px Blattbreite je
     98 px lassen und „MAIL_GEHEIM" bei 12 px mehr braucht. Gemessen passt es
     bei 11 px mit 6 px Polsterung; die Wörter stehen mittig in ihrer Spalte,
     sonst klebten die kurzen links und das Raster sähe aus wie ein Versehen.

     Die Grenze steht dort, wo die Reihe im Fluss ohnehin umbricht: sechs
     Lampen brauchen rund 640 px, das Blatt hat bei einem 700er-Fenster 617.

     Und darunter noch eine zweite Grenze: bei 320 px bleiben je Spalte 75 px,
     „MAIL_GEHEIM" braucht gemessen 80 und wurde beschnitten. Dort also zwei
     Spalten statt drei — drei volle Reihen zu zweit sind eine Ordnung, eine
     Treppe aus 2/3/1 war keine, und ein abgeschnittenes Wort ist schlimmer
     als beides. Noch kleinere Schrift wäre der dritte Weg und der schlechteste:
     die Ampel ist die wichtigste Auskunft des Kopfes.

     „Zustand unbekannt" (wenn `/api/health` schweigt) ist EINE Lampe und
     nimmt die ganze Zeile — in einem Drittel stünde der Satz abgeschnitten. */
  @media (max-width: 700px) {
    .ampel {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      font-size: 11px;
    }
    .ampel span { justify-content: center; gap: 4px; padding: 3px 6px; }
    .ampel span.egal { grid-column: 1 / -1; }
  }
  @media (max-width: 360px) {
    .ampel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* Der Stand darunter ist keine Ampel-Lampe — kein gut/schlecht, nur eine
     Auskunft, wann und als was zuletzt aufgeschlagen wurde.

     Zwei Stände stehen hier nebeneinander, Worker und Seite. Nebeneinander
     und nicht untereinander, weil man sie vergleicht: gehen sie auseinander,
     ist nur eines von beidem geworfen. Auf dem Handy bricht die Zeile um,
     dafür der großzügige Abstand quer — sonst läsen sich „Worker: abc1234"
     und „Seite: def5678" wie ein einziger Satz. */
  .wurf {
    display: flex; flex-wrap: wrap; gap: 3px 16px;
    font-size: 11px; color: var(--kreide-weg); margin-top: 8px;
  }
  /* Rot, aber ohne Pille: ein Stand, der nicht zu erfahren ist, ist keine
     kaputte Lampe am Dienst. Er darf nur nicht aussehen wie einer, der eben
     nicht weitergezählt hat — und genau so sähe er aus, wenn er fehlte. */
  .wurf .fehlt { color: var(--rot); }

  /* --- Die Querverweise ----------------------------------------------------
     Drei Karten unter dem Kopf. Sie erfinden nichts nach: alles darin ist
     schon geladen (Protokoll, geplante Rundmails, das Wachstum) — sie sagen
     nur, was in den anderen Blättern wartet, damit man sie nicht der Reihe
     nach aufschlagen muss, um es zu erfahren.

     Baugleich, ausdrücklich: Titelzeile, Inhalt, unten derselbe schlichte
     Knopf. Eine Karte mit eigenem Anstrich wäre eine Anzeige.
     --------------------------------------------------------------------- */
  .quer { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 18px; }
  @media (min-width: 720px) { .quer { grid-template-columns: repeat(3, 1fr); } }
  .quer .karte { display: flex; flex-direction: column; gap: 8px; }
  .quer .k-titel {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--kreide-weg);
  }
  .quer .mini-log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .quer .mini-log li { display: flex; gap: 7px; padding: 3px 0; align-items: baseline; }
  .quer .mini-log .zeichen { flex: 0 0 14px; text-align: center; color: var(--kreide-weg); }
  .quer .mini-log .zeichen.rot { color: var(--rot); }
  .quer .mini-log .zeichen.gruen { color: var(--gruen); }
  .quer .mini-log time { color: var(--kreide-weg); font-size: 11px; flex: 0 0 66px; }
  .quer .mini-log .wen { overflow-wrap: anywhere; }
  /* Der Knopf sitzt unten bündig, auch wenn die Karte daneben länger ist —
     drei Knöpfe auf drei Höhen sähen aus wie drei verschiedene Angebote. */
  .quer .spring { margin-top: auto; align-self: flex-start; }

  /* --- Die Runde -----------------------------------------------------------
     Eine Karte je Mensch, kein Tabellengitter. Zehn Spalten bekommt man auf
     einem Handy nicht unter, und zwei Fassungen (Tabelle breit, Karten schmal)
     wären zweimal dieselbe Wahrheit — das läuft auseinander. Die Karten
     ordnen sich ab 680 px zu zweit nebeneinander, mehr Unterschied braucht es
     nicht.
     --------------------------------------------------------------------- */
  .runde { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .runde { grid-template-columns: 1fr 1fr; } }

  /* --- Werkzeugzeile: Suche und Sieb ---------------------------------------
     Beides ist dieselbe Handlung — „zeig mir einen Ausschnitt" — und steht
     deshalb in EINER Zeile und ÜBER dem, was es einschränkt. Die Suche kommt
     zuerst: sie ist die feinere Frage, und wer einen Namen im Kopf hat, tippt
     ihn, statt sich durch Siebe zu klicken.
     --------------------------------------------------------------------- */
  .werkzeug { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .werkzeug .suche { flex: 1 1 180px; max-width: 260px; position: relative; }
  .werkzeug .suche input {
    width: 100%; font: inherit; font-size: 13px;
    border: 1px solid #ffffff33; border-radius: 999px; background: #00000033;
    color: var(--kreide); padding: 5px 12px 5px 28px;
  }
  .werkzeug .suche::before {
    content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-54%);
    color: var(--kreide-weg); font-size: 15px; pointer-events: none;
  }
  .werkzeug .suche input:focus { outline: none; border-color: var(--gruen); }

  /* --- Reiter --------------------------------------------------------------
     Zweimal dieselbe Form: das Sieb über der Runde und der Zeitraum über den
     Bildern. Sie stehen ÜBER dem, was sie filtern, weil man sonst erst liest
     und dann erfährt, dass man das Falsche gelesen hat.
     --------------------------------------------------------------------- */
  .reiter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .reiter button {
    border-radius: 999px; padding: 4px 12px; background: #ffffff0a;
    font-size: 12px; color: var(--kreide-weg);
  }
  /* Das gewählte Sieb, wortgleich zur gewählten Zunge oben (`.register
     button.an`, siehe dort für die Begründung): heller Rand, helle Schrift,
     Grund unverändert. Voll ausgemalt war es bis 0385291, und dieselbe
     Beobachtung gilt hier wie oben — eine Kreidefläche ist auf Schiefer das
     Lauteste, was es gibt, und ein Filter, der lauter ist als das, was er
     filtert, hat die Rangfolge umgedreht.

     Der dicke Strich kommt über den Schatten, nicht über `font-weight`: fett
     ist breiter, und die Reiter dahinter rückten bei jeder Wahl. Bei den
     Zungen oben hat genau das auf einem 375er-Handy einen Umbruch erzeugt,
     der beim Blättern kam und ging. */
  .reiter button.an {
    border-color: var(--kreide); border-width: 2px; color: var(--kreide);
    text-shadow: 0 0 .6px currentColor, 0 0 .6px currentColor;
  }
  .reiter button.an:hover { background: #ffffff0a; color: var(--kreide); }
  .reiter button i { font-style: normal; opacity: .65; margin-left: 5px; }
  .reiter .wozu {
    font-size: 11px; color: var(--kreide-weg); letter-spacing: .08em;
    text-transform: uppercase; margin-right: 2px;
  }

  .karte {
    border: 1px solid var(--linie); border-radius: 3px; background: var(--karte);
    padding: 12px 13px 11px;
  }
  .karte.gesperrt { background: #d9705f10; border-color: #d9705f55; }
  .karte.weg { opacity: .55; }
  .k-kopf { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .k-name { font-family: var(--hand); font-size: 20px; }
  /* Das Monogramm. Nicht Zierde: die Karten unterscheiden sich sonst erst
     beim Lesen des Namens, und im Kontor sucht man eine bestimmte. Ein
     Buchstabe in Kreide ist das, was ein Wirt auch an die Tafel schreiben
     würde — ein Foto hat hier niemand hinterlegt. */
  .k-mono {
    flex: 0 0 auto; align-self: center;
    width: 27px; height: 27px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--hand); font-size: 14px; line-height: 1;
    background: #399c69; color: var(--kreide);
  }
  .karte.gesperrt .k-mono { background: #b15041; }
  .karte.weg .k-mono { background: #5a635f; }
  .marke {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px;
    color: var(--kreide-weg);
  }
  .marke.admin { color: var(--gruen); }
  .marke.rot { color: var(--rot); }
  .marke.ich { color: var(--gelb); }
  .k-mail {
    font-size: 12px; color: var(--kreide-weg); margin: 3px 0 0; overflow-wrap: anywhere;
  }
  /* Die Zahlen einer Karte: Beschriftung klein darüber, Wert darunter. Als
     Gitter, damit sie in beiden Karten einer Zeile auf derselben Höhe stehen.

     Drei feste Spalten, nicht `auto-fit`: sechs Zahlen ergeben so zwei saubere
     Reihen. Automatisch verteilt setzte die Karte je nach Breite fünf in die
     erste Zeile und eine allein darunter — das sieht aus wie ein Umbruchfehler. */
  .k-zahlen {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px; margin: 11px 0 0;
    padding-top: 10px; border-top: 1px solid var(--linie);
  }
  /* Auf einem schmalen Handy zwei statt drei. Nicht, weil es sonst überliefe
     — es läuft nicht über —, sondern weil „BEWERTET VON" bei drei Spalten
     umbricht und dann eine Zeile höher steht als seine Nachbarn. */
  @media (max-width: 430px) { .k-zahlen { grid-template-columns: 1fr 1fr; } }
  .k-zahlen div { font-size: 15px; font-family: var(--hand); }
  .k-zahlen div span {
    display: block; font: 10px/1.3 system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase; color: var(--kreide-weg);
  }
  .k-grund {
    margin: 9px 0 0; padding: 7px 9px; font-size: 12px; line-height: 1.45;
    background: #d9705f14; border-left: 2px solid var(--rot); border-radius: 2px;
  }
  .k-tat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }

  /* --- Knöpfe --------------------------------------------------------------
     Die Kreide-Umrissform der Tafel (`.knopf` in `index.html`), nur kleiner:
     das Kontor ist eine Verwaltung, keine Bedienoberfläche. Wer eine
     zerstörende Handlung anfasst, bekommt den zweiten Klick in derselben
     Zeile — wie am Rad drüben, und ausdrücklich kein confirm(): ein
     Systemdialog reißt einen aus dem Blatt.
     --------------------------------------------------------------------- */
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid #ffffff40; border-radius: 3px;
    background: #ffffff0d; color: var(--kreide-matt);
    padding: 5px 10px;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #ffffff1c; border-color: #ffffff77; color: var(--kreide); }
  button[disabled] { opacity: .4; cursor: default; }
  button.sicher { border-color: var(--rot); color: var(--rot); background: #d9705f1a; }
  button.gross {
    font-size: 14px; padding: 9px 18px; font-family: var(--hand);
    border: 1.5px solid #ffffff55; letter-spacing: .04em;
    background: #ffffff0d; color: var(--kreide);
  }
  button.gross:hover { background: #ffffff22; }
  /* Auch der große Knopf wird rot, wenn er zurückfragt. Eigene Regel, weil
     `.gross` sonst Rand und Grund von `.sicher` überschriebe — sie steht
     danach im Blatt. */
  button.gross.sicher { border-color: var(--rot); color: var(--rot); background: #d9705f1a; }

  input[type="text"], input[type="email"], input[type="date"], input[type="time"],
  textarea {
    font: inherit; font-size: 14px; width: 100%;
    border: 1px solid #ffffff33; border-radius: 3px; background: #00000033;
    color: var(--kreide); padding: 7px 9px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gruen); }
  textarea { resize: vertical; min-height: 130px; line-height: 1.55; }
  label.feld-titel {
    display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--kreide-weg); margin: 12px 0 4px;
  }

  /* --- Die Rundmail --------------------------------------------------------
     Zweispaltig, sobald es reicht: die Maske links, die Vorschau rechts, und
     die Vorschau bleibt beim Scrollen stehen. Vorher stand sie unter dem
     Formular und erschien erst auf Knopfdruck — man schrieb also blind und
     sah das Ergebnis erst, als es schon zu spät zum Umformulieren war.
     --------------------------------------------------------------------- */
  .post { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .post { grid-template-columns: 1fr 1fr; align-items: start; } }
  /* Datum und Uhrzeit, nur unter „Später planen". Die Regel steht hier und
     nicht als `style`-Attribut am Element: ein `display` dort schlägt das
     `hidden`-Attribut, und die zwei Felder standen deshalb auch unter
     „Jetzt" da — sichtbar, aber ohne Wirkung. */
  #r-spaeter { display: flex; gap: 8px; margin-top: 4px; }
  #r-spaeter[hidden] { display: none; }
  /* Die Vorschau ist WEISS und bleibt es. Dasselbe Aussehen wie `mailRumpf`
     und `mailKnopf` im Worker (`worker/src/index.js`) — eine Mail wird in
     einem fremden Programm auf hellem Grund gelesen, nicht auf der Tafel.
     Ändert sich dort etwas an Schrift oder Farbe, muss es hier nachgezogen
     werden, sonst lügt die Vorschau. */
  .mail-vorschau {
    border: 1px solid #0006; border-radius: 3px; overflow: hidden; background: #fff;
  }
  @media (min-width: 860px) { .mail-vorschau { position: sticky; top: 56px; } }
  .mv-kopf {
    padding: 10px 16px; background: #f4efe3; border-bottom: 1px solid #d9cfb8;
    font-size: 12px; color: #6f6653; display: flex; gap: 8px; align-items: baseline;
    flex-wrap: wrap;
  }
  .mv-kopf strong { font-size: 14px; color: #1d2a24; font-weight: 600; }
  .mv-rumpf {
    padding: 18px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6; color: #1d2a24;
  }
  .mv-bild { max-width: 100%; border-radius: 4px; display: block; margin: 0 0 12px; }
  .mv-knopf {
    display: inline-block; background: #2f5d4a; color: #f4efe3;
    padding: 12px 22px; border-radius: 3px; text-decoration: none;
    letter-spacing: .15em; text-transform: uppercase; font-size: 13px;
  }
  /* Solange Betreff oder Text fehlen, hat die Vorschau nichts zu zeigen —
     ein leeres weißes Rechteck sähe aus wie ein Ladefehler. */
  .mv-leer {
    padding: 26px 16px; font-size: 13px; color: #6f6653; font-style: italic;
  }

  /* --- Die Grafiken --------------------------------------------------------
     Das Raster gehört der Seite: wie viele nebeneinander passen, weiß sie,
     nicht das Bild. Alles, was IN einem Bild steckt — Kärtchen, Legende,
     Tabelle, Tooltip — bringt `bilder.js` selbst mit, samt Farben aus der
     Palette, die `Bilder.aufsetzen` unten übergibt.
     --------------------------------------------------------------------- */
  .bilder { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .bilder { grid-template-columns: 1fr 1fr; } }

  /* --- Das Skelett ---------------------------------------------------------
     Bis die vier Abrufe da sind, stand hier eine leere Seite — die sieht aus
     wie ein Fehler. Ein paar Balken sagen „gleich", ohne etwas zu behaupten,
     was noch niemand weiß.
     --------------------------------------------------------------------- */
  .skelett b { display: block; height: 22px; width: 40%; margin-bottom: 14px; }
  .skelett i { display: block; height: 12px; margin-bottom: 9px; }
  .skelett b, .skelett i {
    border-radius: 2px;
    background: linear-gradient(90deg, #ffffff0f 25%, #ffffff22 50%, #ffffff0f 75%);
    background-size: 280% 100%;
    animation: schimmer 1.5s linear infinite;
  }
  @keyframes schimmer { from { background-position: 140% 0; } to { background-position: -140% 0; } }
  @media (prefers-reduced-motion: reduce) { .skelett b, .skelett i { animation: none; } }

  .zwei-zahlen {
    display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 16px;
    padding-top: 12px; border-top: 1px solid var(--linie); font-size: 13px;
  }
  .zwei-zahlen b { font-family: var(--hand); font-size: 18px; font-weight: normal; }

  /* --- Das Protokoll -------------------------------------------------------
     Ein Verlauf, keine Tabelle. Deshalb steht vorn die Zeichnung der Handlung
     und dann „vor drei Stunden" — so liest ein Mensch eine Vorgeschichte. Das
     genaue Datum ist damit nicht weg, es steht im Tooltip: man braucht es
     selten, aber wenn, dann auf die Minute. Gestrichelt getrennt wie die
     Listen der Tafel.
     --------------------------------------------------------------------- */
  .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px;
    padding: 7px 0; border-bottom: 1px dashed #ffffff1f;
  }
  .log li:last-child { border-bottom: none; }
  .log time { font-size: 11px; color: var(--kreide-weg); flex: 0 0 92px; }
  .log .was { font-weight: 600; }
  .log .zeichen {
    flex: 0 0 17px; text-align: center; color: var(--kreide-weg); font-size: 13px;
  }
  .log .zeichen.rot { color: var(--rot); }
  .log .zeichen.gruen { color: var(--gruen); }

  .sagt {
    margin: 13px 0 0; padding: 9px 11px; border-radius: 3px; font-size: 13px;
    background: #7fc08c14; border-left: 2px solid var(--gruen); line-height: 1.5;
  }
  .sagt.schlecht { background: #d9705f14; border-left-color: var(--rot); color: #f0c6be; }
  .leer-hinweis { font-size: 13px; color: var(--kreide-weg); font-style: italic; }

  /* --- Die Jahr-Wahl -------------------------------------------------------
     Der Rückblick liegt drüben auf der Tafel, nicht hier: er ist nichts, was
     man verwaltet. Das Kontor fragt nur, WELCHES Jahr, und schickt einen dann
     hinüber. Auf dem Blatt steht darum nichts als die Frage und die Jahre.

     Ein Satz stand hier einmal mit: „Der Rückblick geht auch unterjährig,
     beim laufenden Jahr zählt er bis heute." Er erklärte eine Eigenschaft des
     Workers an der Stelle, an der man wählt und nicht liest — und die Zeile
     neben dem laufenden Jahr sagt dasselbe noch einmal, nur dort, wo es
     zählt. Zwei Sätze für eine Auskunft sind einer zu viel.

     Zwei Formen, eine Ebene, dieselbe Trennung wie bei den Blättern drüben:
     am Zeigergerät eine mittige Karte, die das × schließt; am Finger ein
     Bogen von unten, den man wegwischt. Der Knopf „doch nicht" war der
     Ersatz für beides und fällt mit ihnen weg.
     --------------------------------------------------------------------- */
  .wahl-ebene {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .wahl-ebene[hidden] { display: none; }
  .wahl-schirm { position: absolute; inset: 0; background: #000000aa; }
  .wahl-blatt {
    position: relative; width: min(340px, 92vw);
    max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    background: radial-gradient(120% 80% at 22% 8%, #37403f 0%, var(--schiefer) 45%, var(--schiefer-t) 100%);
    border: 6px solid #4a3527; border-radius: 8px;
    padding: 14px 18px 16px; box-shadow: 0 14px 44px #000c, 0 0 0 1px #0009 inset;
    animation: wahl-kommt .2s ease-out;
  }
  @keyframes wahl-kommt { from { transform: translateY(12px); opacity: .4; } }
  .wahl-kopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .wahl-blatt h3 {
    flex: 1; font-family: var(--hand); font-size: 19px; font-weight: normal;
    color: var(--kreide); margin: 0;
  }
  .wahl-zu {
    border: none; background: none; padding: 0 2px; cursor: pointer;
    font-size: 24px; line-height: 1; color: var(--kreide-weg);
  }
  .wahl-zu:hover { color: var(--kreide); }
  .jahr-zeile {
    display: flex; width: 100%; text-align: left; align-items: baseline; gap: 10px;
    background: #ffffff0a; border: 1px solid #ffffff26; border-radius: 3px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 14px; color: var(--kreide);
  }
  .jahr-zeile b { font-family: var(--hand); font-size: 18px; font-weight: normal; }
  .jahr-zeile span { font-size: 11.5px; color: var(--kreide-weg); flex: 1; }
  .jahr-zeile:hover { border-color: #ffffff66; background: #ffffff12; }
  .jahr-zeile:last-child { margin-bottom: 0; }

  /* Der Griff. Wortgleich zu dem der Tafel (`.fly-griff` in `index.html`),
     samt des waagrecht nachgezeichneten Verlaufs: das Blatt liegt auf
     demselben Rundverlauf, also passen dieselben Stützstellen. Er klebt oben,
     weil die Jahre bei einer langen Runde scrollen können — und ein
     Schließknopf, der wegscrollt, ist keiner. Ein <button> und kein Strich
     aus einem <div>, damit am Finger, wo das × fehlt, VoiceOver einen Weg
     aus dem Blatt behält. */
  .wahl-griff {
    display: none; position: sticky; top: 0; z-index: 3;
    box-sizing: border-box; width: calc(100% + 36px); margin: 0 -18px;
    padding: 13px 0 11px; border: none; cursor: pointer;
    background: linear-gradient(90deg,
      #303738 0%, #343d3c 25%, #2e3536 50%, #262c2e 75%, #212628 100%);
    touch-action: none;
  }
  .wahl-griff::before {
    content: ''; display: block; width: 38px; height: 4px; margin: 0 auto;
    border-radius: 999px; background: #ffffff38;
  }
  .wahl-griff:active::before { background: #ffffff5c; }

  @media (hover: none), (pointer: coarse) {
    .wahl-ebene { align-items: flex-end; padding: 0; }
    /* Ohne Rahmen. Am Rechner ist das Blatt eine Tafel, die im Raum hängt, und
       eine Tafel hat einen Rahmen. Am Finger ist es ein Bogen, der von unten
       hochkommt — da wäre der Holzbalken oben kein Rahmen mehr, sondern ein
       Balken quer über der Oberkante, genau dort, wo der Griff liegt. */
    .wahl-blatt {
      width: 100%; max-width: 520px; margin: 0 auto;
      border-width: 0; border-radius: 10px 10px 0 0;
      padding-top: 0; animation: wahl-hoch .22s ease-out;
    }
    .wahl-griff { display: block; }
    .wahl-zu { display: none; }
  }
  @keyframes wahl-hoch { from { transform: translateY(18px); opacity: .4; } }

  /* Gezogen wird ohne Überblendung, die Rückfahrt und der Abgang mit ihr —
     wie drüben am Blatt. */
  .wahl-blatt { transition: transform .22s ease-out; }
  .wahl-schirm { transition: opacity .22s ease-out; }
  .wahl-ebene.zieht .wahl-blatt, .wahl-ebene.zieht .wahl-schirm { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .wahl-blatt, .wahl-schirm { transition: none; animation: none; }
  }

  /* Wer hier nichts verloren hat, sieht das — und nicht eine leere Seite, die
     wie ein Fehler aussieht. Das Tor selbst sitzt im Worker, das hier ist die
     Auskunft darüber. Das Register steht dabei NICHT da: fünf Zungen über
     „Nicht dein Zimmer" wären fünf Türen, die alle zu sind. */
  .tuer { text-align: center; padding: 50px 20px; margin-top: 14px; }
  .tuer p { color: var(--kreide-weg); font-size: 14px; }
  .zurueck { display: inline-block; margin-top: 14px; color: var(--gruen); font-size: 13px; }
</style>
</head>
<body>

<div class="buch">

  <!-- Das einzige, was ohne `hidden` startet: bis der erste Abruf da ist, ist
       das hier die ganze Seite. Es verschwindet in `laden()`, egal ob Zahlen
       kommen oder die verschlossene Tür. -->
  <div class="blatt skelett" id="skelett">
    <b></b>
    <i style="width:88%"></i>
    <i style="width:64%"></i>
    <i style="width:76%"></i>
  </div>

  <!-- Die Übersicht. Titel und Anmeldung stehen hier oben und nicht in einer
       eigenen Leiste: eine Kopfleiste gab es zwischenzeitlich, sie war eine
       zweite Navigation neben dem Register und flog wieder raus. Der Weg
       zurück zur Tafel hängt als letzte Zunge im Register.

       Das Register steht HIER im Markup und nicht mehr über dem Buch. Es
       wandert von hier aus in das jeweils aufgeschlagene Blatt — das besorgt
       `registerZeichnen()`, siehe dort. Im Markup muss es trotzdem irgendwo
       stehen, und das erste Blatt ist auch das erste, das aufgeschlagen wird.
       Leer bleibt es, bis `laden()`
       weiß, ob überhaupt jemand hereindarf: ein Register über dem Skelett
       verspräche Blätter, die es vielleicht gar nicht gibt, und in der
       verschlossenen Tür wären es Türen, die alle zu sind. -->
  <section class="blatt" id="kopf-blatt" aria-label="Übersicht" hidden>
    <nav class="register" id="register" aria-label="Blätter des Kontors" hidden></nav>
    <h1>Kontor</h1>
    <p class="unter" id="wer"></p>
    <div class="zahlen" id="zahlen"></div>
    <div class="ampel" id="ampel"></div>
    <div class="wurf" id="wurf"></div>
    <div class="quer" id="quer"></div>
  </section>

  <section class="blatt" id="runde-blatt" aria-label="Mitglieder" hidden>
    <h2>Mitglieder</h2>
    <div class="werkzeug">
      <span class="suche"><input type="text" id="suche" placeholder="Name oder Adresse…"
                                 aria-label="Mitglieder durchsuchen"></span>
      <span class="reiter" id="filter"></span>
    </div>
    <div class="runde" id="runde"></div>
    <p class="sagt" id="runde-sagt" hidden></p>
  </section>

  <section class="blatt" id="stat-blatt" aria-label="Statistiken" hidden>
    <h2>Statistiken</h2>
    <div class="werkzeug">
      <span class="reiter" id="zeitraum"></span>
    </div>
    <div id="bilder"></div>
    <div class="zwei-zahlen" id="zwei-zahlen"></div>
    <p class="sagt" id="stat-sagt" hidden></p>
  </section>

  <section class="blatt" id="rund-blatt" aria-label="Rundmail" hidden>
    <h2>Rundmail</h2>
    <div class="post">
      <div>
        <label class="feld-titel" for="r-betreff">Betreff</label>
        <input type="text" id="r-betreff" maxlength="120" placeholder="Freitag steht">
        <label class="feld-titel" for="r-text">Text</label>
        <textarea id="r-text" maxlength="4000"
                  placeholder="Was der Wirt zu sagen hat. Leerzeile trennt Absätze."></textarea>
        <p class="unter" id="r-zaehler" style="margin:6px 0 0"></p>

        <label class="feld-titel" for="r-bild">Bild (Adresse, freiwillig)</label>
        <input type="text" id="r-bild" placeholder="https://…">

        <label class="feld-titel" for="r-knopf-text">Knopf (freiwillig)</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="r-knopf-text" maxlength="40" placeholder="Zur Tafel"
                 style="flex:1 1 40%">
          <input type="text" id="r-knopf-link" placeholder="https://…" style="flex:1 1 60%">
        </div>

        <label class="feld-titel">Versand</label>
        <div class="reiter" id="r-wann"></div>
        <!-- Das `display:flex` steht ABSICHTLICH im Blatt und nicht hier als
             Stil-Attribut: ein `display` am Element schlägt das `hidden`, und
             die beiden Felder standen dadurch auch unter „Jetzt" da. -->
        <div id="r-spaeter" hidden>
          <input type="date" id="r-datum" style="flex:1 1 auto">
          <input type="time" id="r-zeit" style="flex:0 0 110px">
        </div>

        <div class="k-tat" style="margin-top:14px">
          <button class="gross" id="r-ab" type="button">Schicken</button>
          <button id="r-test" type="button">Testmail an mich</button>
        </div>
        <p class="sagt" id="rund-sagt" hidden></p>
      </div>

      <!-- Die Vorschau steht daneben und schreibt beim Tippen mit. Kein
           eigenes Gerüst darin: `mailVorschau()` baut den Kasten, und zwar
           denselben, der vorher auf Knopfdruck erschien — zwei Zeichner
           liefen auseinander, sobald der Worker seine Mail änderte. -->
      <div>
        <label class="feld-titel" style="margin-top:12px">Vorschau</label>
        <div id="r-vorschau"></div>
      </div>
    </div>

    <div id="r-geplant" hidden style="margin-top:24px;padding-top:14px;border-top:1px solid var(--linie)">
      <h3>Geplant</h3>
      <div id="r-geplant-liste" style="display:grid;gap:10px"></div>
    </div>
  </section>

  <section class="blatt" id="log-blatt" aria-label="Protokoll" hidden>
    <h2>Protokoll</h2>
    <ul class="log" id="log"></ul>
  </section>

  <div class="blatt tuer" id="tuer" hidden>
    <h1>Nicht dein Zimmer</h1>
    <p id="tuer-text">Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.</p>
    <a class="zurueck" href="./">← zurück zur Tafel</a>
  </div>

</div>

<!-- Die Jahr-Wahl. Sie steht außerhalb des Buches, weil sie über allem liegt;
     gewählt wird hier nur, GEZEIGT wird der Rückblick drüben auf der Tafel. -->
<div class="wahl-ebene" id="wahl-ebene" hidden>
  <div class="wahl-schirm" id="wahl-schirm" data-wahl-zu></div>
  <div class="wahl-blatt" id="wahl-blatt" role="dialog" aria-modal="true" aria-label="Jahr wählen">
    <button class="wahl-griff" type="button" aria-label="Schließen" data-wahl-zu></button>
    <div class="wahl-kopf">
      <h3>Dein Jahr — welches?</h3>
      <button class="wahl-zu" type="button" aria-label="Schließen" data-wahl-zu>×</button>
    </div>
    <div id="jahr-liste"></div>
  </div>
</div>

<script src="bilder.js"></script>
<script>
  // ==========================================================================
  // Dieselbe Herkunft wie die Tafel, also DASSELBE localStorage und dasselbe
  // Token: wer dort angemeldet ist, ist es hier auch. Kein zweiter Login, kein
  // zweiter Anmeldeweg — und damit auch kein zweiter Angriffsweg.
  // ==========================================================================
  const API = location.hostname === 'localhost'
    ? 'http://localhost:8787'
    : 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';
  const TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const NS = 'http://www.w3.org/2000/svg';

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };
  const s_el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const merke = () => { try { return localStorage.getItem(SPEICHER); } catch { return null; } };

  const mitToken = (kopf = {}) => {
    const t = merke();
    return t ? { ...kopf, Authorization: 'Bearer ' + t } : kopf;
  };

  /* Jeder Ruf geht hier durch — eine Stelle für Kopf, Fehlerform und die
     Umwandlung in eine Ausnahme, die oben als Satz landet. */
  async function ruf(pfad, rumpf) {
    const r = await fetch(API + pfad, {
      method: rumpf ? 'POST' : 'GET',
      headers: mitToken(rumpf
        ? { 'Content-Type': 'application/json', 'X-Tab': TAB }
        : {}),
      body: rumpf ? JSON.stringify(rumpf) : undefined,
      cache: 'no-store',
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fehler || 'Das ging nicht (' + r.status + ')');
    return d;
  }

  function sagt(id, text, schlecht) {
    const p = $(id);
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  const zahl = n => (n ?? 0).toLocaleString('de-DE');
  const datum = iso => iso
    ? new Date(iso).toLocaleString('de-DE',
        { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  const nurTag = iso => iso
    ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
    : '—';

  /* „vor drei Stunden" statt „03.08.26, 16:14". Im Protokoll ist die Frage
     nicht, wann etwas war, sondern wie lange es her ist — das genaue Datum
     steht daneben im Tooltip. Ab einer Woche kippt es zurück aufs Datum:
     „vor 23 Tagen" muss man umrechnen, um es einzuordnen. */
  function vorhin(iso) {
    if (!iso) return '—';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 90) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'vor ' + Math.round(s / 3600) + ' h';
    if (s < 7 * 86400) {
      const t = Math.round(s / 86400);
      return t === 1 ? 'gestern' : 'vor ' + t + ' Tagen';
    }
    return nurTag(iso);
  }

  // ==========================================================================
  // Die Bilder kommen aus `bilder.js` — dieselbe Datei, die die Statistikseite
  // benutzt. Beide Seiten sind jetzt Schiefer, also bekommen beide DIESELBE
  // Palette; sie steht trotzdem an beiden Stellen ausgeschrieben, weil die
  // Vorgabe der Datei Papier ist und ein vergessenes `aufsetzen` sonst
  // aussieht wie ein Stilbruch statt wie ein Fehler.
  //
  // `grund` ist hier der KARTENGRUND, nicht der Schiefer dahinter: mit ihm
  // werden die Punkte auf den Kurven ausgestanzt, und ein Loch in der Farbe
  // der Tafel läge neben der Karte, auf der es sitzt.
  // `stark` ist HELL — der Wisch, der eine Säule hinterlegt, muss auf
  // Schiefer aufhellen, nicht abdunkeln. Der Tooltip dreht sich mit um:
  // drüben Papier auf Tinte, hier ein Kreidezettel auf Schiefer.
  // ==========================================================================
  Bilder.aufsetzen({
    /* Die durch den Sechs-Prüfungen-Lauf gezogene Kreide-Reihe. Die alte
       (`#8fc9a6 #e8c766 #d9705f #94c8ea #a1519e`) fiel durch: Grün↔Gelb lagen
       auch für Normalsichtige zu nah beieinander, drei der fünf standen
       außerhalb des Helligkeitsbands.

       Die ORDNUNG ist die von `bilder.js` — Grün, Gelb, Rot, Blau, Lila, und
       auf Platz 6 der Zurückhaltungston. Sie ist keine Geschmacksfrage: die
       Datei setzt darauf die Los-Ausgänge (`losFarbenSetzen`, abgesagt =
       Platz 3, offen = Platz 2). Wer Rot und Gelb tauscht, färbt „abgesagt"
       gelb und „offen" rot. */
    reihe:      ['#399c69', '#b29126', '#b15041', '#4c9bcb', '#994d96', '#8a938f'],
    linie:      '#ffffff33',
    text:       '#cfd6cd',
    textWeg:    '#93a09a',
    grund:      '#2d3335',
    stark:      '#eef1ea',
    karteGrund: '#ffffff08',
    karteRand:  '#ffffff22',
    titel:      '#cfd6cd',
    tippGrund:  '#eef1ea',
    tippText:   '#4a5450',
    tippKopf:   '#1b2220',
    tippStrich: '#00000022',
    /* Der Fokusrahmen ist ausdrücklich KEINE Serienfarbe: ein Rahmen in der
       Farbe einer Kurve läse sich wie eine Hervorhebung dieser Kurve. `--gelb`
       ist auf beiden Seiten der Ton für Bedienung statt Daten (hier die Marke
       „du", drüben der aktive Zeitraum-Reiter). */
    ring:       '#e8c766',
    hand:       "'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive",
  });
  const REIHE = Bilder.reihe;


  // ==========================================================================
  // Zeichnen
  // ==========================================================================
  let stand = null;        // die letzte Antwort von /api/admin/nutzer
  let mich = null;         // /api/me — für das Neuzeichnen des Kopfes
  let letzteAmpel = null;  // die letzte Antwort von /api/health, dito
  let letzteStat = null;   // /api/admin/statistik — die Übersicht liest daraus
                           // die Jahre für den Rückblick

  function kopfZeichnen(kopf, ich, health, s) {
    $('wer').textContent = 'Angemeldet als ' + (ich.name || 'namenlos') + ' · ' + ich.email;
    const z = $('zahlen');
    z.textContent = '';
    /* `reihe` ist freiwillig: nur zwei der fünf Kacheln haben wirklich eine
       Zeitreihe hinter sich. „Davon aktiv" und „gesperrt" sind Zustände, kein
       Verlauf — dort eine Linie hinzumalen hieße, eine zu erfinden. */
    const kachel = (wert, was, warn, reihe, dazu) => {
      const d = el('div', 'zahl' + (warn ? ' warn' : ''));
      d.appendChild(el('b', null, zahl(wert)));
      d.appendChild(el('span', null, was));
      if (reihe && reihe.length > 1) {
        d.appendChild(Bilder.funke(reihe, warn ? REIHE[2] : REIHE[0]));
        if (dazu) d.appendChild(el('em', null, dazu));
      }
      z.appendChild(d);
    };

    const tage = (s && s.tage) || zeitraum;
    const seit = `in ${tage} Tagen`;

    /* Wieviele davon in diesem Zeitraum dazugekommen sind: `wachstum` ist
       kumuliert, also ist es die Differenz zum letzten Stand VOR der Grenze —
       nicht die Summe der Tage im Fenster, denn die Reihe hat nur Einträge an
       Tagen, an denen sich überhaupt jemand angemeldet hat. */
    const w = (s && s.wachstum) || [];
    const grenze = new Date(Date.now() - tage * 864e5).toISOString().slice(0, 10);
    const davor = w.filter(x => x.tag <= grenze).pop();
    const neu = w.length ? w[w.length - 1].n - (davor ? davor.n : 0) : 0;

    const mails = ((s && s.mails_je_tag) || []).map(x => x.n);
    const mailSumme = mails.reduce((a, n) => a + n, 0);

    kachel(kopf.melder, 'Melder', false, w.map(x => x.n),
      (neu > 0 ? '+' + zahl(neu) : 'keiner dazu') + ' ' + seit);
    kachel(kopf.aktiv, 'davon aktiv');
    kachel(kopf.gesperrt, 'gesperrt', kopf.gesperrt > 0);
    kachel(kopf.mails_24h, 'Mails, 24 h', false, mails, zahl(mailSumme) + ' ' + seit);
    if (kopf.mails_kaputt_24h) kachel(kopf.mails_kaputt_24h, 'davon kaputt', true);

    /* Die Ampel: was der Worker über sich selbst sagt. `admin` und
       `mail_geheim` stehen dort seit dieser Ausbaustufe — ohne sie käme
       niemand ins Kontor und trüge keine Mail einen Abmeldelink, und beides
       sähe von außen wie ein Fehler im Browser aus. */
    const a = $('ampel');
    a.textContent = '';
    const st = $('wurf');
    st.textContent = '';
    if (!health) {
      const s = el('span', 'egal', 'Zustand unbekannt');
      Bilder.tippAm(s, { titel: 'Zustand unbekannt', zeilen: [],
        fuss: '/api/health hat nicht geantwortet. Das ist die Ampel, nicht der Inhalt — '
            + 'die Zahlen daneben stimmen trotzdem.' });
      a.appendChild(s);
      return;
    }
    [['db', 'Datenbank'], ['mail', 'Mailversand'], ['admin', 'ADMIN_MAIL'],
     ['mail_geheim', 'MAIL_GEHEIM'], ['bilder', 'Bilder'], ['tafel', 'Verteiler']]
      .forEach(([k, titel]) => {
        const wert = String(health[k] ?? '');
        const gut = wert === 'ok' || wert === 'Schluessel liegt an';
        /* Die Pille bleibt kurz, der Wortlaut des Workers steht im Tooltip.
           Angehängt war er dreimal so lang wie die Pille selbst und schob die
           übrigen Lampen aus der Zeile. */
        const s = el('span', gut ? '' : 'aus', titel);
        Bilder.tippAm(s, {
          titel,
          zeilen: [{ farbe: gut ? REIHE[0] : REIHE[2], was: 'Antwort', wert: wert || '—' }],
        });
        a.appendChild(s);
      });

    /* ZWEI Stände, nicht einer. Der Worker stempelt sich beim Deploy selbst
       (--var, siehe CLAUDE.md, Ausrollen); die Seite liegt auf GitHub Pages
       und kommt am Worker nie vorbei, ihren Stand holt er bei GitHub
       (`seitenStand` in src/index.js). Die beiden gehen auseinander, sobald
       nur eines von beidem geworfen wurde — und genau das war die Frage, aus
       der diese Zeile entstand: ein Push der Seite ließ den einen Stempel
       stehen und sah aus, als sei nichts angekommen.

       Keine Ampel-Pille: das ist kein gut/schlecht am Dienst, sondern eine
       Auskunft. Aber auch nicht mehr stillschweigend weg, wenn nichts kommt —
       ein fehlender Stand sähe sonst aus wie ein Stand, der eben nicht
       weitergezählt hat. Fehlt er, steht rot da, warum. */
    const standZeile = (titel, version, wann, warum) => {
      /* Ein frisches <span> je Durchlauf, aus demselben Grund wie bei den
         Ampel-Pillen oben: `tippAm` haengt Listener an den Knoten, den man
         ihm gibt. Am bleibenden `#wurf` selbst haengten sie sich bei jedem
         `laden()` neu an und stapelten sich - irgendwann oeffnete Hovern
         uebers leere Div einen Tooltip, der zu keinem Text mehr gehoerte. */
      const fehlt = !version;
      const z = el('span', fehlt ? 'fehlt' : null,
        titel + ': ' + (fehlt ? 'unbekannt'
          : version + (wann ? ' · ' + datum(wann) : '')));
      Bilder.tippAm(z, {
        titel: 'Stand: ' + titel,
        zeilen: fehlt ? [{ farbe: REIHE[2], was: 'Grund', wert: warum || '—' }] : [
          { was: 'Version', wert: version },
          { was: wann ? 'Vom' : 'Deployt', wert: wann ? datum(wann) : '—' },
        ],
        fuss: warum,
      });
      st.appendChild(z);
    };

    /* Der Worker ohne Stempel ist KEIN Fehler: so läuft er lokal unter
       `wrangler dev`, wo es keine --var gibt. Darum bleibt seine Zeile in dem
       Fall ganz weg, statt rot zu werden — anders als die der Seite, die der
       Worker immer beantworten kann, und sei es mit einem Grund. */
    if (health.version) standZeile('Worker', health.version, health.deployed_at);
    standZeile('Seite', health.seite_version, health.seite_deployed_at,
      health.seite_stand && health.seite_stand !== 'ok' ? health.seite_stand
        : 'Letzter Commit auf main, bei GitHub erfragt.');
  }

  /* Der Filter über der Runde. Er steht erst da, seit die Runde wächst: bei
     drei Karten ist er Verwaltung von Verwaltung, ab einem Dutzend sucht man
     den einen Gesperrten sonst mit den Augen. Die Zahl in der Pille sagt, was
     einen erwartet — ein Reiter, der auf eine leere Liste führt, ist eine
     Falle. Leere Reiter stehen deshalb gar nicht erst da. */
  const SIEBE = {
    alle:     { titel: 'alle',     passt: () => true },
    aktiv:    { titel: 'aktiv',    passt: u => !u.gesperrt && !u.entfernt },
    gesperrt: { titel: 'gesperrt', passt: u => !!u.gesperrt },
    entfernt: { titel: 'entfernt', passt: u => !!u.entfernt },
  };
  let sieb = 'alle';

  /* Das Suchwort. Es filtert ZUSÄTZLICH zum Sieb und ruft nichts nach: die
     ganze Runde liegt seit `laden()` da, und ein Abruf je Tastendruck wäre
     eine Anfrage pro Buchstabe für eine Liste, die in den Speicher passt.

     Name ODER Adresse, weil man mal das eine und mal das andere im Kopf hat —
     und ohne Groß/Klein, weil niemand „Micha" tippt, wenn er sucht. */
  let suchwort = '';
  $('suche').addEventListener('input', ev => {
    suchwort = ev.target.value.trim().toLowerCase();
    if (stand) runde(stand.nutzer);
  });

  const passtZurSuche = u => !suchwort
    || (u.name + ' ' + (u.email || '')).toLowerCase().includes(suchwort);

  function filterZeichnen(nutzer) {
    const ziel = $('filter');
    ziel.textContent = '';
    /* Die Zahlen an den Sieben zählen die GANZE Runde, nicht das Suchergebnis:
       ein Sieb, dessen Zahl beim Tippen mitwandert, sieht aus, als hätte sich
       die Runde geändert. Was das Suchwort übrig lässt, steht darunter. */
    const sichtbar = Object.entries(SIEBE)
      .map(([k, v]) => [k, v, nutzer.filter(v.passt).length])
      .filter(([k, , n]) => n > 0 || k === 'alle');
    // Ein einziger Reiter ist kein Filter, sondern eine Beschriftung.
    if (sichtbar.length < 2) return;
    ziel.appendChild(el('span', 'wozu', 'zeige'));
    sichtbar.forEach(([k, v, n]) => {
      const b = el('button', k === sieb ? 'an' : null, v.titel);
      b.type = 'button';
      b.appendChild(el('i', null, String(n)));
      b.addEventListener('click', () => {
        sieb = k;
        runde(stand.nutzer);
      });
      ziel.appendChild(b);
    });
  }

  function runde(nutzer) {
    const ziel = $('runde');
    ziel.textContent = '';
    filterZeichnen(nutzer);
    nutzer.filter(u => SIEBE[sieb].passt(u) && passtZurSuche(u)).forEach(u => {
      const k = el('div', 'karte'
        + (u.gesperrt ? ' gesperrt' : '') + (u.entfernt ? ' weg' : ''));

      const kopf = el('div', 'k-kopf');
      // Der erste Buchstabe des Namens. `Array.from`, nicht `[0]`: ein Name
      // darf mit einem Zeichen anfangen, das aus zwei Codeeinheiten besteht.
      kopf.appendChild(el('span', 'k-mono',
        (Array.from(u.name || '?')[0] || '?').toUpperCase()));
      kopf.appendChild(el('span', 'k-name', u.name || 'Ehemaliger'));
      if (u.rolle === 'admin') kopf.appendChild(el('span', 'marke admin', 'Admin'));
      if (u.gemessen) kopf.appendChild(el('span', 'marke', 'gemessen'));
      if (u.ich) kopf.appendChild(el('span', 'marke ich', 'du'));
      if (u.gesperrt) kopf.appendChild(el('span', 'marke rot', 'gesperrt'));
      if (u.entfernt) kopf.appendChild(el('span', 'marke', 'entfernt'));
      if (u.stumm) kopf.appendChild(el('span', 'marke', 'stumm'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', u.email || (u.gemessen
        ? 'kein Postfach — meldet aus der Wohnung'
        : 'keine Adresse mehr')));

      if (u.gesperrt) {
        k.appendChild(el('p', 'k-grund',
          (u.gesperrt.grund || 'Ohne Grund gesperrt.')
          + ' — ' + u.gesperrt.von + ', ' + datum(u.gesperrt.seit)));
      }

      const zahlen = el('div', 'k-zahlen');
      const feld = (was, wert) => {
        const d = el('div');
        d.appendChild(el('span', null, was));
        d.appendChild(document.createTextNode(wert));
        zahlen.appendChild(d);
      };
      feld('Geräte', zahl(u.geraete));
      feld('Meldungen', zahl(u.meldungen));
      feld('zuletzt', u.zuletzt ? nurTag(u.zuletzt) : '—');
      feld('Kommentare', zahl(u.kommentare));
      feld('Gastgeber', zahl(u.gastgeber));
      feld('bewertet von', zahl(u.bewertet));
      k.appendChild(zahlen);

      if (!u.entfernt) k.appendChild(knoepfe(u));
      ziel.appendChild(k);
    });
    /* Ein leeres Raster sieht aus wie ein Ladefehler. Der Satz sagt beides,
       Sieb UND Suchwort — wer das eine vergisst, sucht sonst den Fehler beim
       anderen. */
    if (!ziel.children.length) {
      ziel.appendChild(el('p', 'leer-hinweis', suchwort
        ? 'Niemand passt auf Sieb und Suchwort.'
        : 'Hier steht gerade niemand.'));
    }
  }

  /* Jede zerstörende Handlung fragt zurück — als zweiter Klick auf denselben
     Knopf, mit dem Namen im Satz darüber. Kein confirm(): der Systemdialog
     reißt einen aus dem Blatt, und man klickt ihn weg, ohne ihn zu lesen. */
  let sicher = null;   // 'id:aktion', solange die Rückfrage steht
  let sicherUhr = null;

  function knoepfe(u) {
    const zeile = el('div', 'k-tat');
    const tat = (aktion, wort, zerstoerend) => {
      const b = el('button', null, wort);
      const schluessel = u.id + ':' + aktion;
      if (sicher === schluessel) { b.className = 'sicher'; b.textContent = 'wirklich?'; }
      b.addEventListener('click', () => handeln(u, aktion, schluessel, zerstoerend));
      zeile.appendChild(b);
    };

    if (u.gesperrt) tat('entsperren', 'entsperren', false);
    else if (!u.ich) tat('sperren', 'sperren', true);

    if (!u.ich && !u.gemessen) {
      tat('rolle', u.rolle === 'admin' ? 'zu User machen' : 'zu Admin machen', true);
      tat('entfernen', 'entfernen', true);
    }

    // Das Feld für den Sperrgrund steht erst da, wenn die Rückfrage steht:
    // vorher wäre es ein leeres Kästchen an jeder Karte.
    if (sicher === u.id + ':sperren') {
      const f = el('input');
      f.type = 'text';
      f.id = 'grund-' + u.id;
      f.maxLength = 120;
      f.placeholder = 'Grund (freiwillig, er liest ihn)';
      f.style.marginTop = '6px';
      zeile.appendChild(f);
      setTimeout(() => f.focus(), 0);
    }
    return zeile;
  }

  async function handeln(u, aktion, schluessel, zerstoerend) {
    if (zerstoerend && sicher !== schluessel) {
      sicher = schluessel;
      clearTimeout(sicherUhr);
      // Die Rückfrage verfällt von selbst: ein „wirklich?" das eine Stunde
      // stehen bleibt, wird irgendwann versehentlich getroffen.
      sicherUhr = setTimeout(() => {
        sicher = null;
        runde(stand.nutzer);
        // Der Satz muss mit weg. Bleibt er stehen, während die Knöpfe schon
        // wieder harmlos aussehen, liest man ihn als Zustand statt als Frage.
        sagt('runde-sagt', '');
      }, 8000);
      runde(stand.nutzer);
      sagt('runde-sagt', worte(u, aktion));
      return;
    }
    const grundFeld = $('grund-' + u.id);
    const grund = grundFeld ? grundFeld.value : '';
    sicher = null;
    clearTimeout(sicherUhr);
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion, grund });
      await laden();
      sagt('runde-sagt', getan(u, aktion));
    } catch (e) {
      runde(stand.nutzer);
      sagt('runde-sagt', e.message, true);
    }
  }

  const worte = (u, aktion) => ({
    sperren: `${u.name} sperren? Er sieht die Tafel weiter, kann aber nichts mehr `
           + 'eintragen und fällt aus dem Rad.',
    rolle: u.rolle === 'admin'
      ? `${u.name} die Adminrechte nehmen?`
      : `${u.name} zum Admin machen? Er sieht dann alle Adressen und kann sperren.`,
    entfernen: `${u.name} entfernen? Name und Adresse verschwinden, seine Beiträge `
             + 'bleiben als „Ehemaliger" stehen. Zurückholen geht nicht.',
  }[aktion] || '');

  const getan = (u, aktion) => ({
    sperren: `${u.name} ist gesperrt.`,
    entsperren: `${u.name} darf wieder.`,
    rolle: `Die Rolle von ${u.name} ist getauscht.`,
    entfernen: `${u.name} ist entfernt. Die Beiträge stehen als „Ehemaliger" da.`,
  }[aktion] || 'Erledigt.');

  /* Der Zeitraum. Dieselbe Liste wie im Worker — sie steht an zwei Stellen,
     weil die Seite die Reiter zeichnen muss, bevor sie eine Antwort hat. Der
     Worker prüft trotzdem selbst: was von hier kommt, ist ein Wunsch, keine
     Erlaubnis. Was er tatsächlich genommen hat, sagt er in `tage` zurück, und
     danach richten sich die Überschriften.

     Die Wahl überlebt das Neuladen — wer sich für 90 Tage entschieden hat,
     will nicht bei jedem Aufschlagen wieder klicken. */
  const STAT_TAGE = [30, 60, 90];
  const ZEITRAUM_SPEICHER = 'beerstock-kontor-tage';
  let zeitraum = (() => {
    try {
      const g = Number(localStorage.getItem(ZEITRAUM_SPEICHER));
      return STAT_TAGE.includes(g) ? g : STAT_TAGE[0];
    } catch { return STAT_TAGE[0]; }
  })();

  function zeitraumZeichnen() {
    const ziel = $('zeitraum');
    ziel.textContent = '';
    ziel.appendChild(el('span', 'wozu', 'Zeitraum'));
    STAT_TAGE.forEach(t => {
      const b = el('button', t === zeitraum ? 'an' : null, t + ' Tage');
      b.type = 'button';
      b.addEventListener('click', () => zeitraumWechseln(t));
      ziel.appendChild(b);
    });
  }

  async function zeitraumWechseln(t) {
    if (t === zeitraum) return;
    zeitraum = t;
    try { localStorage.setItem(ZEITRAUM_SPEICHER, String(t)); } catch {}
    zeitraumZeichnen();
    /* Die alten Bilder bleiben blass stehen, statt zu verschwinden: ein
       Abschnitt, der beim Umschalten leer wird und dann wieder aufpoppt,
       springt — und die neuen Bilder stehen ohnehin an derselben Stelle. */
    const ziel = $('bilder');
    ziel.style.opacity = '.35';
    try {
      const s = await ruf('/api/admin/statistik?tage=' + t);
      statistik(s);
      // Der Kopf hängt mit dran: „+2 in 30 Tagen" unter der Melderzahl wäre
      // sonst der Satz zum vorigen Zeitraum.
      if (stand && mich) kopfZeichnen(stand.kopf, mich, letzteAmpel, s);
      /* Die Querverweise NICHT: das einzige, was sie aus der Statistik ziehen,
         sind die Jahre für den Rückblick, und `wachstum` läuft über die ganze
         Geschichte statt über das Fenster (Abfrage 6 im Worker, ohne
         Zeitgrenze). Sie stünden nach dem Neuzeichnen wortgleich da. Wer hier
         je etwas Fensterabhängiges hineinschreibt, muss `querZeichnen`
         mitnehmen — die Protokollzeilen dafür lägen dann allerdings auch nicht
         mehr vor. */
    } catch (e) {
      sagt('stat-sagt', 'Der Zeitraum ließ sich nicht wechseln: ' + e.message, true);
    } finally {
      ziel.style.opacity = '';
    }
  }

  function statistik(s) {
    letzteStat = s;
    zeitraumZeichnen();
    const ziel = $('bilder');
    ziel.textContent = '';
    /* Der Zeitraum steht in jeder einzelnen Überschrift, nicht nur oben am
       Schalter — und bei den beiden Ranglisten steht „insgesamt". Sie folgen
       dem Schalter absichtlich nicht (der Worker begründet es an der Route):
       wer der Gastgeber dieser Runde ist, beantworten 30 Tage nicht. Ohne das
       Wort in der Überschrift müsste man das raten. */
    // `s.tage` kommt vom Worker, `zeitraum` ist der Wunsch von hier. Der
    // Rückfall ist nicht theoretisch: zwischen Seiten-Push und Worker-Deploy
    // liegen Minuten, in denen die neue Seite die alte Antwort bekommt.
    const fenster = ', ' + (s.tage || zeitraum) + ' Tage';

    /* Elf Bilder in einem Raster sind eine Halde: man sucht das eine, das man
       wollte, und liest zehn Überschriften. In drei benannten Gruppen sucht
       man erst die Gruppe. Die Namen sind keine Kategorien der Datenbank,
       sondern die drei Fragen, mit denen man hierherkommt: was macht der
       Kühlschrank, was macht die Runde, was macht der Betrieb. */
    const gruppe = (name, ...bilder) => {
      ziel.appendChild(el('div', 'gruppe', name));
      const g = el('div', 'bilder');
      bilder.forEach(b => g.appendChild(b));
      ziel.appendChild(g);
    };

    gruppe('Der Kühlschrank',
      Bilder.flaeche('Meldungen je Tag' + fenster,
        s.meldungen, z => z.n, z => nurTag(z.tag), 'Meldungen'),
      Bilder.schar('Bestand je Melder' + fenster, s.bestand),
      // Direkt hinter dem Bestand: beide Kurven kommen aus derselben Meldung,
      // und nebeneinander sieht man, ob der Kühlschrank mit dem Nachlegen
      // hochgeht. `|| []` — die alte Antwort kennt das Feld noch nicht.
      Bilder.grad('Temperatur je Melder' + fenster, s.grad || []));

    gruppe('Runde & Rad',
      Bilder.liegend('Wer war wie oft Gastgeber, insgesamt',
        s.gastgeber, z => z.name, z => z.n, 'Abende'),
      // `|| []` — die alte Antwort kennt das Feld noch nicht.
      Bilder.liegend('Wer wie oft einen Notruf abgesetzt hat, insgesamt',
        s.notrufe || [], z => z.name, z => z.n, 'Notrufe'),
      Bilder.band('Ausgang der Ziehungen, insgesamt', s.lose),
      Bilder.losJeMelder('Ausgang der Ziehungen je Melder, insgesamt',
        s.lose_je_melder || []));

    // Die Farbe kommt von hier, nicht vom Worker: der kennt die Palette des
    // Kontors nicht, nur die Reihenfolge (meistbeschaeftigt zuerst).
    const aufrufeReihen = (s.aufrufe_nutzer_reihen || [])
      .map((r, i) => ({ ...r, farbe: REIHE[i % REIHE.length] }));

    gruppe('Betrieb & Post',
      Bilder.saeulen('Betrieb je Woche' + fenster, s.betrieb, [
        { feld: 'kommentare', titel: 'Kommentare', farbe: REIHE[0] },
        { feld: 'reaktionen', titel: 'Reaktionen', farbe: REIHE[1] },
        { feld: 'sterne',     titel: 'Sterne',     farbe: REIHE[3] },
      ], g => 'KW ' + String(g.woche).slice(-2)),
      Bilder.saeulen('Mails je Art' + fenster, s.mails, [
        { feld: 'n',      titel: 'verschickt', farbe: REIHE[0] },
        // Platz 3 ist das Rot der Reihe. Nicht Platz 2 — das ist das Gelb,
        // und eine Mail, die nicht rausging, ist kein halber Erfolg.
        { feld: 'kaputt', titel: 'ging nicht raus', farbe: REIHE[2] },
      ], g => g.art.replace(/_/g, ' ')),
      Bilder.saeulen('Seitenaufrufe je Tag, nach Nutzer' + fenster,
        s.aufrufe_je_tag || [], aufrufeReihen, g => nurTag(g.tag)),
      Bilder.liegend('Seitenaufrufe je Nutzer, insgesamt',
        s.aufrufe_je_nutzer || [], z => z.name, z => z.n, 'Aufrufe'));

    /* Jedes Bild bekommt seine Überschrift als Namen. `role="img"` ohne
       Beschriftung ist für einen Screenreader ein leeres Bild — und seit die
       Bilder ein Tabstop sind, landet man dort auch tatsächlich. An einer
       Stelle für alle sechs, statt sechsmal dasselbe Attribut. */
    [...ziel.querySelectorAll('.bild')].forEach(b => {
      const svg = b.querySelector('svg'), h3 = b.querySelector('h3');
      if (svg && h3) {
        svg.setAttribute('aria-label',
          h3.textContent + (svg.hasAttribute('tabindex')
            ? ' — mit den Pfeiltasten durch die Werte' : ''));
      }
    });

    const zz = $('zwei-zahlen');
    zz.textContent = '';
    const paar = (was, wert) => {
      const d = el('span');
      d.appendChild(el('b', null, wert));
      d.appendChild(document.createTextNode(' ' + was));
      zz.appendChild(d);
    };
    const w = s.wachstum.length ? s.wachstum[s.wachstum.length - 1].n : 0;
    paar('Angemeldete insgesamt', zahl(w));
    paar('von ' + zahl(s.postwillig.alle) + ' mit Adresse wollen noch Post',
      zahl(s.postwillig.willig));
    paar('Seitenaufrufe insgesamt', zahl(s.aufrufe_insgesamt || 0));
  }

  /* Ein Zeichen je Handlung. Keine Emoji: die kämen aus einer fremden
     Schrift, wären bunt und säßen auf einer Schiefertafel wie ein Aufkleber.
     Diese hier sind Zeichen, die auch ein Setzer gehabt hätte. */
  const LOG_ZEICHEN = {
    sperren:    ['⊘', 'rot'],
    entsperren: ['⊙', 'gruen'],
    rolle:      ['⇅', ''],
    entfernen:  ['✕', 'rot'],
    rundmail:   ['✉', ''],
  };

  // Wen oder was die Handlung betraf, in einem Satzstück.
  const logWen = z => z.aktion === 'rundmail'
    ? '„' + (z.detail || '') + '"'
    : z.wen + (z.detail && z.aktion !== 'entfernen' ? ' (' + z.detail + ')' : '');

  /* EINE Zeile für zwei Orte: das Protokollblatt und die Vorschaukarte auf der
     Übersicht. `kurz` lässt dort das „wer → was" weg — in einer drittel Karte
     ist für drei Spalten kein Platz, und die Frage dort ist ohnehin nur, ob
     seit dem letzten Blick etwas passiert ist. */
  function logZeile(z, kurz) {
    const li = el('li');
    const [glyph, ton] = LOG_ZEICHEN[z.aktion] || ['·', ''];
    li.appendChild(el('span', 'zeichen ' + ton, glyph));
    const t = el('time', null, vorhin(z.wann));
    t.dateTime = z.wann;
    // Das genaue Datum bleibt erreichbar — im selben Kasten wie überall
    // sonst auf dieser Seite, nicht als grauer Systemtooltip.
    Bilder.tippAm(t, { titel: datum(z.wann), zeilen: [] });
    li.appendChild(t);
    if (!kurz) li.appendChild(el('span', 'was', z.wer + ' → ' + z.aktion));
    li.appendChild(el('span', kurz ? 'wen' : null, logWen(z)));
    return li;
  }

  function protokoll(zeilen) {
    const ziel = $('log');
    ziel.textContent = '';
    if (!zeilen.length) {
      ziel.appendChild(el('li', 'leer-hinweis', 'Noch hat niemand etwas verwaltet.'));
      return;
    }
    zeilen.forEach(z => ziel.appendChild(logZeile(z)));
  }

  // ==========================================================================
  // Die Querverweise auf der Übersicht
  //
  // Drei baugleiche Karten. Sie holen nichts nach: Protokoll und geplante
  // Rundmails liegen seit `laden()` ohnehin da, und das erste Jahr steht in
  // der Wachstumskurve. Sie ersparen nur das Durchblättern, um zu erfahren,
  // ob in einem der anderen Blätter überhaupt etwas wartet.
  //
  // Baugleich ist Absicht und keine Sparsamkeit: eine Karte mit eigenem
  // Anstrich oder eigenem Knopf läse sich wie eine Anzeige zwischen zwei
  // Auskünften.
  // ==========================================================================
  function querKarte(titel, inhalt, knopfWort, beiKlick) {
    const k = el('div', 'karte');
    k.appendChild(el('div', 'k-titel', titel));
    k.appendChild(inhalt);
    const b = el('button', 'spring', knopfWort);
    b.type = 'button';
    b.addEventListener('click', beiKlick);
    k.appendChild(b);
    return k;
  }

  function querZeichnen(logZeilen) {
    const ziel = $('quer');
    ziel.textContent = '';

    /* 1 — Der Jahresrückblick. Die Jahre kommen aus der Wachstumskurve: ihr
       erster Eintrag ist die erste Anmeldung überhaupt, und davor gab es
       nichts zu erzählen. Kein eigener Abruf dafür. */
    const jahre = rueckblickJahre();
    if (jahre.length) {
      const i = el('div');
      i.appendChild(el('div', 'k-name', 'Dein Jahr ' + jahre[0]));
      i.appendChild(el('p', 'k-mail', jahre.length === 1
        ? 'bis heute gezählt'
        : 'bis heute gezählt · auch ' + jahre.slice(1).join(' und ')));
      ziel.appendChild(querKarte('Jahresrückblick', i, 'Dein Jahr öffnen →', jahrWahlAuf));
    }

    /* 2 und 3 — Protokoll und Rundmail. Diese beiden Karten stehen IMMER da,
       auch wenn sie nichts zu berichten haben, und das ist keine Vorliebe:
       seit die beiden Blätter keine eigene Zunge mehr im Register haben, sind
       diese Karten der einzige Weg dorthin. Eine Karte, die sich bei leerem
       Inhalt wegräumt, räumte den Weg mit weg — und man käme an die Rundmail
       nur noch heran, solange schon eine geplant ist.

       Der Jahresrückblick oben darf dagegen fehlen: dorthin führt kein Blatt,
       nur ein Overlay, und ohne Jahre gibt es nichts zu zeigen. */

    // 2 — Was zuletzt verwaltet wurde. Drei Zeilen, mehr passt nicht in eine
    //     drittel Karte, und mehr beantwortet die Frage auch nicht.
    let inhalt;
    if (logZeilen && logZeilen.length) {
      inhalt = el('ul', 'mini-log');
      logZeilen.slice(0, 3).forEach(z => inhalt.appendChild(logZeile(z, true)));
    } else {
      inhalt = el('p', 'leer-hinweis', 'Noch hat niemand etwas verwaltet.');
    }
    ziel.appendChild(querKarte('Zuletzt im Protokoll', inhalt,
      'zum Protokoll →', () => blattAuf('log-blatt')));

    // 3 — Die nächste geplante Rundmail.
    const naechste = geplant
      .filter(g => g.status === 'geplant')
      .sort((a, b) => new Date(a.versand_am) - new Date(b.versand_am))[0];
    const rm = el('div');
    if (naechste) {
      rm.appendChild(el('div', 'k-name', naechste.betreff));
      rm.appendChild(el('p', 'k-mail', 'geplant für ' + datum(naechste.versand_am)));
    } else {
      // Kein Werbesatz und keine Aufforderung — nur die Auskunft, dass hier
      // gerade nichts wartet. Der Knopf darunter bleibt trotzdem, er ist der
      // Weg zum Blatt.
      rm.appendChild(el('div', 'k-name', 'Nichts geplant'));
      rm.appendChild(el('p', 'k-mail', 'Es steht keine Rundmail aus.'));
    }
    ziel.appendChild(querKarte('Nächste Rundmail', rm,
      'zur Rundmail →', () => blattAuf('rund-blatt')));
  }

  // ==========================================================================
  // Die Jahr-Wahl
  //
  // Der Rückblick selbst liegt drüben auf der Tafel — er ist nichts, was man
  // verwaltet, und die Kacheln zweimal zu bauen hieße, sie beim nächsten Mal
  // an einer Stelle zu ändern. Das Kontor fragt nur, WELCHES Jahr, und
  // schickt einen mit `?wrapped=JAHR` hinüber.
  //
  // Dass es überhaupt geht, konnte der Worker längst: `GET /api/wrapped`
  // zählt beim laufenden Jahr bis heute. Gefehlt hat nur der Weg dorthin —
  // die Tafel zeigt ihren Knopf nur im Dezember, und die Chronik hängt ihre
  // Jahrgänge erst an ABGESCHLOSSENE Jahre.
  // ==========================================================================
  function rueckblickJahre() {
    const w = letzteStat && letzteStat.wachstum;
    if (!w || !w.length) return [];
    const erstes = Number(String(w[0].tag).slice(0, 4));
    const heuer = new Date().getFullYear();
    if (!erstes || erstes > heuer) return [heuer];
    // Absteigend: das laufende Jahr zuerst, wie es der Mock zeigt — danach
    // fragt man am häufigsten.
    return Array.from({ length: heuer - erstes + 1 }, (_, i) => heuer - i);
