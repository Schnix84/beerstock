<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kontor — beerstock</title>
<style>
  /* ==========================================================================
     DAS KONTOR

     Das Hinterzimmer derselben Kneipe. Die Tafel (index.html) ist Kreide auf
     Schiefer; hier liegt das Kontorbuch des Wirts: Papier, Linien, Tinte.

     Warum es überhaupt anders aussehen darf: die Tafel ist die Gaststube und
     ein Gegenstand — ein zweiter Anstrich wäre eine andere Tafel. Das Kontor
     ist kein Gegenstand, sondern ein Buch, und es spart, den ganzen
     Kreide-Stil zu duplizieren.

     Die FARBWERTE sind dieselben Familien wie drüben, nur andersherum
     verwendet: Tinte auf Papier statt Kreide auf Schiefer. Grün, Sand und
     Braun stehen wortgleich schon in den Mails, die dieser Worker verschickt
     (schickeLink, meldeNeuenNutzer) — das Kontor sieht damit aus wie die Post,
     die aus ihm herausgeht.

     Kein Hell/Dunkel-Umschalter, wie drüben: ein Buch hat eine Farbe.
     ========================================================================== */
  :root {
    --papier:     #f4efe3;
    --papier-t:   #eae2d1;   /* der Rand, wo das Blatt aufliegt */
    --linie:      #d9cfb8;   /* die Linien im Kontorbuch        */
    --tinte:      #1d2a24;
    --tinte-matt: #47544d;
    --tinte-weg:  #6f6653;   /* verblasst: Nebentext            */
    --gruen:      #2f5d4a;   /* der Bezug, wie in den Mails     */
    --gelb:       #b8901f;   /* dieselbe Familie wie --gelb drüben, auf Papier lesbar */
    --rot:        #b04a38;   /* dieselbe Familie wie --rot drüben */
    --hand: 'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 14px 60px;
    background: var(--papier-t);
    color: var(--tinte);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .buch { max-width: 940px; margin: 0 auto; }

  /* Ein Block ist ein Blatt. Die Linien darin sind echt gezeichnet, nicht
     angedeutet: ein Kontorbuch ohne Linien ist ein Notizzettel. */
  .blatt {
    background: var(--papier);
    border: 1px solid var(--linie);
    border-radius: 3px;
    box-shadow: 0 1px 0 #00000008, 0 6px 18px #0000000d;
    padding: 16px 16px 18px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--hand); font-size: 27px; font-weight: normal;
    margin: 0 0 2px; letter-spacing: .01em;
  }
  .unter { font-size: 12px; color: var(--tinte-weg); margin: 0 0 16px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--tinte-weg); margin: 0 0 12px;
    padding-bottom: 5px; border-bottom: 1px solid var(--linie);
  }
  h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--tinte-matt); }

  /* --- Der Kopf ------------------------------------------------------------
     Vier Zahlen und eine Ampel. Sie stehen ganz oben, weil sie die Frage
     beantworten, mit der man das Kontor überhaupt aufschlägt: läuft alles.
     --------------------------------------------------------------------- */
  .zahlen { display: flex; flex-wrap: wrap; gap: 10px; }
  .zahl {
    flex: 1 1 110px; padding: 10px 12px;
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffff66;
  }
  .zahl b { display: block; font-family: var(--hand); font-size: 26px; line-height: 1.1; }
  .zahl span { font-size: 11px; color: var(--tinte-weg); }
  .zahl.warn b { color: var(--rot); }

  /* Die Ampel ist die wichtigste Auskunft des Kopfes und sah als Fließtext mit
     Punkten davor aus wie eine Aufzählung. Als Pillen ist sie eine Reihe von
     Lampen. Was der Worker wörtlich geantwortet hat, steht im Tooltip: eine
     rote Pille mit angehängtem Fehlertext wäre dreimal so lang wie die
     anderen und risse die Zeile auseinander. */
  .ampel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; font-size: 12px; }
  .ampel span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 9px; border-radius: 999px;
    border: 1px solid var(--linie); background: #ffffff80; color: var(--tinte-matt);
  }
  .ampel span::before { content: '●'; font-size: 9px; color: var(--gruen); }
  .ampel span.aus { border-color: #b04a3855; background: #b04a380f; color: #7d3527; }
  .ampel span.aus::before { color: var(--rot); }
  .ampel span.egal::before { color: var(--tinte-weg); }

  /* --- Die Runde -----------------------------------------------------------
     Eine Karte je Mensch, kein Tabellengitter. Zehn Spalten bekommt man auf
     einem Handy nicht unter, und zwei Fassungen (Tabelle breit, Karten schmal)
     wären zweimal dieselbe Wahrheit — das läuft auseinander. Die Karten
     ordnen sich ab 680 px zu zweit nebeneinander, mehr Unterschied braucht es
     nicht.
     --------------------------------------------------------------------- */
  .runde { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .runde { grid-template-columns: 1fr 1fr; } }

  .karte {
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffff66;
    padding: 12px 13px 11px;
  }
  .karte.gesperrt { background: #b04a380d; border-color: #b04a3844; }
  .karte.weg { opacity: .55; }
  .k-kopf { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .k-name { font-family: var(--hand); font-size: 20px; }
  .marke {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px;
    color: var(--tinte-weg);
  }
  .marke.admin { color: var(--gruen); }
  .marke.rot { color: var(--rot); }
  .marke.ich { color: var(--gelb); }
  .k-mail {
    font-size: 12px; color: var(--tinte-weg); margin: 3px 0 0; overflow-wrap: anywhere;
  }
  /* Die Zahlen einer Karte: Beschriftung klein darüber, Wert darunter. Als
     Gitter, damit sie in beiden Karten einer Zeile auf derselben Höhe stehen. */
  /* Drei feste Spalten, nicht `auto-fit`: sechs Zahlen ergeben so zwei saubere
     Reihen. Automatisch verteilt setzte die Karte je nach Breite fünf in die
     erste Zeile und eine allein darunter — das sieht aus wie ein Umbruchfehler. */
  .k-zahlen {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px; margin: 11px 0 0;
    padding-top: 10px; border-top: 1px solid var(--linie);
  }
  .k-zahlen div { font-size: 15px; font-family: var(--hand); }
  .k-zahlen div span {
    display: block; font: 10px/1.3 system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-weg);
  }
  .k-grund {
    margin: 9px 0 0; padding: 7px 9px; font-size: 12px; line-height: 1.45;
    background: #b04a3814; border-left: 2px solid var(--rot); border-radius: 2px;
  }
  .k-tat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }

  /* --- Knöpfe --------------------------------------------------------------
     Ein Knopf ist hier klein und aus Tinte gezeichnet: die Seite ist eine
     Verwaltung, keine Bedienoberfläche. Wer eine zerstörende Handlung anfasst,
     bekommt den zweiten Klick in derselben Zeile — wie am Rad drüben, und
     ausdrücklich kein confirm(): ein Systemdialog reißt einen aus dem Blatt.
     --------------------------------------------------------------------- */
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--linie); border-radius: 3px;
    background: #ffffffaa; color: var(--tinte-matt);
    padding: 5px 10px;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #fff; border-color: var(--tinte-weg); color: var(--tinte); }
  button[disabled] { opacity: .4; cursor: default; }
  button.sicher { border-color: var(--rot); color: var(--rot); background: #b04a380f; }
  button.gross {
    font-size: 14px; padding: 9px 18px; font-family: var(--hand);
    background: var(--gruen); border-color: var(--gruen); color: var(--papier);
  }
  button.gross:hover { background: #24493a; color: #fff; }

  input[type="text"], input[type="email"], textarea {
    font: inherit; font-size: 14px; width: 100%;
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffffcc;
    color: var(--tinte); padding: 7px 9px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gruen); }
  textarea { resize: vertical; min-height: 130px; line-height: 1.55; }
  label.feld-titel {
    display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--tinte-weg); margin: 12px 0 4px;
  }

  /* --- Die Grafiken --------------------------------------------------------
     Handgezeichnetes SVG, ohne Fremdbibliothek: die Seite darf keine externe
     Abhängigkeit bekommen, und `sparkline()` drüben zeigt, dass es reicht.
     Zwei nebeneinander ab 680 px.
     --------------------------------------------------------------------- */
  .bilder { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .bilder { grid-template-columns: 1fr 1fr; } }
  /* Jedes Bild sitzt auf einem eigenen Kärtchen, wie die Leute in der Runde.
     Ohne den Rahmen schwammen sechs verschieden hohe SVG frei im Blatt und
     man sah nicht, welche Beschriftung noch zu welchem Bild gehört. Die
     Karten einer Rasterzeile sind von selbst gleich hoch (`stretch`), der
     Inhalt steht oben — deshalb braucht keine Grafik eine feste Höhe. */
  .bild {
    min-width: 0; background: #ffffff66;
    border: 1px solid var(--linie); border-radius: 3px;
    padding: 11px 12px 12px;
  }
  .bild svg { display: block; width: 100%; height: auto; }
  .bild svg:focus { outline: none; }
  .bild svg:focus-visible {
    outline: 2px solid var(--gruen); outline-offset: 3px; border-radius: 2px;
  }
  .bild .leer { font-size: 12px; color: var(--tinte-weg); font-style: italic; padding: 18px 0; }
  /* Die Beschriftung einer Kurvenschar. Punkte statt eines Kastens: bei fünf
     Leuten ist eine Legende mit Rahmen mehr Rahmen als Legende. */
  .legende { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11px; }
  .legende span { display: inline-flex; align-items: center; gap: 4px; color: var(--tinte-weg); }
  .legende i { width: 9px; height: 9px; border-radius: 2px; display: block; }
  .legende span[data-heb] { cursor: default; }
  .legende span.matt { opacity: .35; }

  /* --- Der Tooltip ---------------------------------------------------------
     Einer für die ganze Seite, nicht einer je Bild: er hängt an `body` und
     wird über `position:fixed` an den Zeiger gesetzt. Innerhalb eines SVG
     ginge er nicht — er wäre auf die Zeichenfläche beschnitten und würde vom
     Nachbarbild verdeckt.

     Tinte auf Papier ist hier umgedreht (Papier auf Tinte): ein Tooltip ist
     kein Teil des Blattes, sondern liegt darüber.
     --------------------------------------------------------------------- */
  .tip {
    position: fixed; top: 0; left: 0; z-index: 30;
    pointer-events: none;   /* sonst flieht der Zeiger vor seinem eigenen Kasten */
    max-width: 240px; padding: 7px 10px;
    background: var(--tinte); color: #ded7c8;
    border-radius: 3px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 8px 22px #00000030;
    opacity: 0; transition: opacity .12s;
  }
  .tip[data-an] { opacity: 1; }
  .tip .t-kopf {
    font-family: var(--hand); font-size: 14px; color: #fff; margin-bottom: 3px;
  }
  .tip .t-z {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  /* Die Beschriftung bricht nie um, der Wert schon: links stehen zwei Wörter,
     rechts kann eine Zahl stehen — oder die Antwort des Workers, und die ist
     schon mal ein ganzer Satz. */
  .tip .t-z > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tip .t-z i { width: 7px; height: 7px; border-radius: 2px; display: block; flex: none; }
  .tip .t-z b { color: #fff; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .tip .t-fuss { margin-top: 4px; padding-top: 4px; border-top: 1px solid #ffffff26; }

  /* --- Das Skelett ---------------------------------------------------------
     Bis die vier Abrufe da sind, stand hier eine weiße Seite — die sieht aus
     wie ein Fehler. Ein paar graue Balken sagen „gleich", ohne etwas zu
     behaupten, was noch niemand weiß.
     --------------------------------------------------------------------- */
  .skelett b { display: block; height: 22px; width: 40%; margin-bottom: 14px; }
  .skelett i { display: block; height: 12px; margin-bottom: 9px; }
  .skelett b, .skelett i {
    border-radius: 2px;
    background: linear-gradient(90deg, #e9e0cc 25%, #f3ecdd 50%, #e9e0cc 75%);
    background-size: 280% 100%;
    animation: schimmer 1.5s linear infinite;
  }
  @keyframes schimmer { from { background-position: 140% 0; } to { background-position: -140% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .skelett b, .skelett i { animation: none; }
    .tip { transition: none; }
  }

  .zwei-zahlen {
    display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 14px;
    padding-top: 12px; border-top: 1px solid var(--linie); font-size: 13px;
  }
  .zwei-zahlen b { font-family: var(--hand); font-size: 18px; font-weight: normal; }

  /* --- Das Protokoll ------------------------------------------------------- */
  .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li {
    display: flex; flex-wrap: wrap; gap: 3px 8px;
    padding: 7px 0; border-bottom: 1px solid var(--linie);
  }
  .log li:last-child { border-bottom: none; }
  .log time { font-size: 11px; color: var(--tinte-weg); flex: 0 0 128px; }
  .log .was { font-weight: 600; }

  .sagt {
    margin: 13px 0 0; padding: 9px 11px; border-radius: 3px; font-size: 13px;
    background: #2f5d4a12; border-left: 2px solid var(--gruen); line-height: 1.5;
  }
  .sagt.schlecht { background: #b04a3812; border-left-color: var(--rot); color: #7d3527; }
  .leer-hinweis { font-size: 13px; color: var(--tinte-weg); font-style: italic; }

  /* Wer hier nichts verloren hat, sieht das — und nicht eine leere Seite, die
     wie ein Fehler aussieht. Das Tor selbst sitzt im Worker, das hier ist die
     Auskunft darüber. */
  .tuer { text-align: center; padding: 50px 20px; }
  .tuer p { color: var(--tinte-weg); font-size: 14px; }
  .zurueck { display: inline-block; margin-top: 14px; color: var(--gruen); font-size: 13px; }
  /* Im Kopf steht er über dem Titel statt unter einem Absatz — dort ist der
     Abstand nach oben falsch herum. */
  #kopf-blatt .zurueck { margin: 0 0 8px; }
</style>
</head>
<body>
<div class="buch">

  <!-- Das einzige, was ohne `hidden` startet: bis der erste Abruf da ist, ist
       das hier die ganze Seite. Es verschwindet in `laden()`, egal ob Zahlen
       kommen oder die verschlossene Tür. -->
  <div class="blatt skelett" id="skelett">
    <b></b>
    <i style="width:88%"></i>
    <i style="width:64%"></i>
    <i style="width:76%"></i>
  </div>

  <div class="blatt" id="kopf-blatt" hidden>
    <!-- Der Weg zurück. Stand bisher nur auf der verschlossenen Tür — wer
         hereinkam, hatte keinen mehr und musste die Adresse von Hand kürzen.
         Über den Titel, weil man ihn dort sucht und nicht unter der Ampel. -->
    <a class="zurueck" href="./">← zurück zur Tafel</a>
    <h1>Kontor</h1>
    <p class="unter" id="wer"></p>
    <div class="zahlen" id="zahlen"></div>
    <div class="ampel" id="ampel"></div>
  </div>

  <div class="blatt" id="runde-blatt" hidden>
    <h2>Die Runde</h2>
    <div class="runde" id="runde"></div>
    <p class="sagt" id="runde-sagt" hidden></p>
  </div>

  <div class="blatt" id="stat-blatt" hidden>
    <h2>Wie es läuft</h2>
    <div class="bilder" id="bilder"></div>
    <div class="zwei-zahlen" id="zwei-zahlen"></div>
  </div>

  <div class="blatt" id="rund-blatt" hidden>
    <h2>Rundmail</h2>
    <label class="feld-titel" for="r-betreff">Betreff</label>
    <input type="text" id="r-betreff" maxlength="120" placeholder="Freitag steht">
    <label class="feld-titel" for="r-text">Text</label>
    <textarea id="r-text" maxlength="4000"
              placeholder="Was der Wirt zu sagen hat. Leerzeile trennt Absätze."></textarea>
    <p class="unter" id="r-zaehler" style="margin:6px 0 0"></p>
    <div class="k-tat" style="margin-top:14px">
      <button class="gross" id="r-ab" type="button">Vorschau</button>
      <button id="r-weg" type="button" hidden>verwerfen</button>
    </div>
    <div id="r-vorschau" hidden></div>
    <p class="sagt" id="rund-sagt" hidden></p>
  </div>

  <div class="blatt" id="log-blatt" hidden>
    <h2>Protokoll</h2>
    <ul class="log" id="log"></ul>
  </div>

  <div class="blatt tuer" id="tuer" hidden>
    <h1>Nicht dein Zimmer</h1>
    <p id="tuer-text">Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.</p>
    <a class="zurueck" href="./">← zurück zur Tafel</a>
  </div>

</div>

<script>
  // ==========================================================================
  // Dieselbe Herkunft wie die Tafel, also DASSELBE localStorage und dasselbe
  // Token: wer dort angemeldet ist, ist es hier auch. Kein zweiter Login, kein
  // zweiter Anmeldeweg — und damit auch kein zweiter Angriffsweg.
  // ==========================================================================
  const API = location.hostname === 'localhost'
    ? 'http://localhost:8787'
    : 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';
  const TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const NS = 'http://www.w3.org/2000/svg';

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };
  const s_el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const merke = () => { try { return localStorage.getItem(SPEICHER); } catch { return null; } };

  const mitToken = (kopf = {}) => {
    const t = merke();
    return t ? { ...kopf, Authorization: 'Bearer ' + t } : kopf;
  };

  /* Jeder Ruf geht hier durch — eine Stelle für Kopf, Fehlerform und die
     Umwandlung in eine Ausnahme, die oben als Satz landet. */
  async function ruf(pfad, rumpf) {
    const r = await fetch(API + pfad, {
      method: rumpf ? 'POST' : 'GET',
      headers: mitToken(rumpf
        ? { 'Content-Type': 'application/json', 'X-Tab': TAB }
        : {}),
      body: rumpf ? JSON.stringify(rumpf) : undefined,
      cache: 'no-store',
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fehler || 'Das ging nicht (' + r.status + ')');
    return d;
  }

  function sagt(id, text, schlecht) {
    const p = $(id);
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  const zahl = n => (n ?? 0).toLocaleString('de-DE');
  const datum = iso => iso
    ? new Date(iso).toLocaleString('de-DE',
        { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  const nurTag = iso => iso
    ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
    : '—';

  // ==========================================================================
  // Der Tooltip
  //
  // Die Bilder beantworten Fragen nach der FORM; den konkreten Wert eines
  // Punktes las man vorher nirgends ab. Genau dafür ist das hier — und für
  // nichts sonst: es gibt EINEN Kasten für die ganze Seite, den sich alle
  // sechs Grafiken teilen. Sechs eigene Lösungen wären sechsmal derselbe
  // Fehler zu beheben.
  //
  // Er hängt an `body` und nicht im SVG: dort wäre er auf die Zeichenfläche
  // beschnitten und vom Nachbarbild verdeckt. Deshalb wird er in
  // Fenster-Koordinaten gesetzt (`clientX/clientY`) — das erspart auch jedes
  // Umrechnen aus dem viewBox-System, das ja auf die Spaltenbreite skaliert.
  // ==========================================================================
  const TIP = el('div', 'tip');
  document.body.appendChild(TIP);

  /* Am Finger bleibt der Kasten stehen, bis woanders hingetippt wird: `touch`
     schickt `pointerleave` schon beim Abheben, und ein Tooltip, der genau
     dann verschwindet, wenn man ihn lesen will, ist keiner. */
  let tipFest = false;

  function tipAn(quelle, inhalt) {
    if (!inhalt) return;
    TIP.textContent = '';
    if (inhalt.titel) TIP.appendChild(el('div', 't-kopf', inhalt.titel));
    (inhalt.zeilen || []).forEach(z => {
      const zeile = el('div', 't-z');
      const links = el('span');
      if (z.farbe) {
        const punkt = el('i');
        punkt.style.background = z.farbe;
        links.appendChild(punkt);
      }
      links.appendChild(document.createTextNode(z.was));
      zeile.appendChild(links);
      zeile.appendChild(el('b', null, z.wert));
      TIP.appendChild(zeile);
    });
    if (inhalt.fuss) TIP.appendChild(el('div', 't-fuss', inhalt.fuss));

    /* Woher die Koordinaten kommen: vom Zeiger, wenn es einen gibt, sonst vom
       Element selbst — beim Weiterschalten mit der Tastatur gibt es keinen. */
    let x, y;
    if (quelle.clientX !== undefined) {
      x = quelle.clientX + 14; y = quelle.clientY + 16;
    } else {
      const r = quelle.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.bottom + 8;
    }
    TIP.dataset.an = '1';
    // Erst sichtbar machen, dann messen: ein `hidden` Kasten hat keine Breite.
    const b = TIP.getBoundingClientRect();
    if (x + b.width > innerWidth - 8) x = Math.max(8, innerWidth - b.width - 8);
    if (y + b.height > innerHeight - 8) y = Math.max(8, y - b.height - 30);
    TIP.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }

  const tipAus = () => { delete TIP.dataset.an; };

  /* Die Trefferflächen eines Bildes. Jede Grafik übergibt eine Liste von
     Punkten; was ein „Punkt" ist, entscheidet sie selbst — ein Tag, eine
     Zeile, ein Segment.

     `flaeche` ist ein unsichtbares Rechteck, das groß genug zum Treffen ist:
     auf eine 1,6 px dünne Kurve zielt niemand, und ein Segment von vier
     Pixeln trifft man auch mit der Maus nicht. `inhalt()` liefert den Text,
     `hervor(an)` darf im Bild etwas hervorheben.

     Die ganze Reihe hängt zusätzlich an der Tastatur: das SVG ist ein einziger
     Tabstop, links/rechts wandert durch die Punkte. Jeden Punkt einzeln
     anspringbar zu machen wäre bei 60 Tagen ein Tabstop-Feld. */
  function treffer(svg, punkte) {
    if (!punkte.length) return;
    let offen = -1;

    const zeigen = (i, quelle) => {
      if (offen !== i && offen >= 0 && punkte[offen].hervor) punkte[offen].hervor(false);
      offen = i;
      if (punkte[i].hervor) punkte[i].hervor(true);
      tipAn(quelle || punkte[i].flaeche, punkte[i].inhalt());
    };
    const schliessen = () => {
      if (offen >= 0 && punkte[offen].hervor) punkte[offen].hervor(false);
      offen = -1;
      tipAus();
    };

    punkte.forEach((p, i) => {
      // `transparent`, nicht `none`: eine Fläche ohne Füllung fängt keinen
      // Zeiger. `pointer-events` sagt dasselbe noch einmal ausdrücklich.
      p.flaeche.setAttribute('fill', 'transparent');
      p.flaeche.setAttribute('pointer-events', 'all');
      p.flaeche.dataset.treffer = '1';
      p.flaeche.addEventListener('pointerenter', ev => zeigen(i, ev));
      p.flaeche.addEventListener('pointermove', ev => zeigen(i, ev));
      p.flaeche.addEventListener('pointerleave', () => { if (!tipFest) schliessen(); });
      p.flaeche.addEventListener('pointerdown', ev => {
        if (ev.pointerType === 'touch') { tipFest = true; zeigen(i, ev); }
      });
      svg.appendChild(p.flaeche);
    });

    svg.setAttribute('tabindex', '0');
    svg.addEventListener('keydown', ev => {
      const schritt = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
      if (schritt) {
        ev.preventDefault();
        const i = offen < 0
          ? (schritt > 0 ? 0 : punkte.length - 1)
          : Math.min(punkte.length - 1, Math.max(0, offen + schritt));
        zeigen(i, null);
      } else if (ev.key === 'Escape') {
        schliessen();
      }
    });
    svg.addEventListener('blur', schliessen);
  }

  /* Dasselbe für ein gewöhnliches HTML-Element — die Ampel benutzt es. */
  function tippAm(node, inhalt) {
    node.addEventListener('pointerenter', ev => tipAn(ev, inhalt));
    node.addEventListener('pointerleave', () => { if (!tipFest) tipAus(); });
    node.addEventListener('pointerdown', ev => {
      if (ev.pointerType === 'touch') { tipFest = true; tipAn(ev, inhalt); }
    });
  }

  // Wer den festgehaltenen Kasten wieder loswerden will, tippt daneben,
  // scrollt oder drückt Esc.
  document.addEventListener('pointerdown', ev => {
    if (tipFest && !(ev.target.closest && ev.target.closest('[data-treffer]'))) {
      tipFest = false;
      tipAus();
    }
  }, true);
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { tipFest = false; tipAus(); }
  });
  addEventListener('scroll', () => { if (!tipFest) tipAus(); }, true);

  // ==========================================================================
  // Die Grafiken. Alles von Hand, kein Fremdcode.
  //
  // Alle rechnen in einem festen viewBox-Koordinatensystem und lassen das SVG
  // per CSS auf die Spaltenbreite skalieren — damit muss keine einzige davon
  // wissen, wie breit sie am Ende wirklich ist, und ein Umbruch des Rasters
  // zeichnet nichts neu.
  // ==========================================================================
  const W = 300, H = 120, PAD = { l: 26, r: 6, o: 8, u: 18 };
  const IX = W - PAD.l - PAD.r;      // Innenbreite
  const IY = H - PAD.o - PAD.u;      // Innenhöhe

  /* Die Farben der Reihen. Aus den beiden Familien der Tafel abgeleitet und
     bewusst wenige: mehr als sechs Linien in einem Bild liest ohnehin
     niemand mehr auseinander. */
  const REIHE = ['#2f5d4a', '#b8901f', '#b04a38', '#4a6f8a', '#7a5c8f', '#6f6653'];

  function rahmen(titel) {
    const box = el('div', 'bild');
    box.appendChild(el('h3', null, titel));
    return box;
  }
  const leer = (box, was) => { box.appendChild(el('p', 'leer', was)); return box; };

  /* Die Grundlinie, zwei gestrichelte Hilfslinien und die Beschriftung links.
     Die Hilfslinien sind der Unterschied zwischen „die Kurve ist oben" und
     „das waren etwa neun": man braucht eine Marke auf halber Höhe, um zu
     schätzen. Gestrichelt und in der Farbe der Kontorlinien, damit sie hinter
     den Daten bleiben. */
  function achse(svg, max, beschriften = true) {
    [.5, 1].forEach(anteil => {
      svg.appendChild(s_el('line', {
        x1: PAD.l, y1: PAD.o + IY - anteil * IY, x2: PAD.l + IX, y2: PAD.o + IY - anteil * IY,
        stroke: '#d9cfb8', 'stroke-width': .6, 'stroke-dasharray': '1.5 3',
      }));
    });
    svg.appendChild(s_el('line', {
      x1: PAD.l, y1: PAD.o + IY, x2: PAD.l + IX, y2: PAD.o + IY,
      stroke: '#d9cfb8', 'stroke-width': 1,
    }));
    if (!beschriften) return;
    [0, max].forEach(v => {
      const y = PAD.o + IY - (max ? v / max : 0) * IY;
      const t = s_el('text', {
        x: PAD.l - 5, y: y + 3.5, 'text-anchor': 'end',
        'font-size': 8, fill: '#6f6653',
      });
      t.textContent = zahl(v);
      svg.appendChild(t);
    });
  }

  const beschriftung = (svg, x, y, text, anker = 'middle') => {
    const t = s_el('text', { x, y, 'text-anchor': anker, 'font-size': 8, fill: '#6f6653' });
    t.textContent = text;
    svg.appendChild(t);
  };

  const svgNeu = () => s_el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });

  /* Der Zeiger eines Bildes: die Gruppe, in der beim Überfahren die
     Führungslinie und die Punkte liegen. Eine je Bild, sie wird umgehängt
     statt neu gebaut. Sie kommt ans Ende der Zeichnung, aber vor die
     Trefferflächen — sonst läge sie unter der Kurve. */
  const zeigerNeu = svg => {
    const g = s_el('g', { opacity: 0, 'pointer-events': 'none' });
    svg.appendChild(g);
    return g;
  };

  /* Verläufe brauchen eine ID, und IDs sind auf der ganzen Seite eindeutig —
     zwei Bilder mit demselben `id` teilen sich sonst still den Verlauf des
     ersten. Deshalb ein Zähler. */
  let verlaufNr = 0;
  function verlauf(svg, farbe) {
    const id = 'v' + (++verlaufNr);
    const defs = s_el('defs');
    const g = s_el('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 });
    g.appendChild(s_el('stop', { offset: '0%', 'stop-color': farbe, 'stop-opacity': .28 }));
    g.appendChild(s_el('stop', { offset: '100%', 'stop-color': farbe, 'stop-opacity': .02 }));
    defs.appendChild(g);
    svg.appendChild(defs);
    return `url(#${id})`;
  }

  /* 1 — Meldungen je Tag. Flächenkurve: die Frage ist, ob überhaupt gemeldet
     wird, nicht wie oft genau an einem bestimmten Dienstag — und für den
     einen bestimmten Dienstag gibt es jetzt den Tooltip. */
  function bildFlaeche(titel, punkte, wertVon, markeVon, was) {
    const box = rahmen(titel);
    if (!punkte.length) return leer(box, 'Noch nichts eingetragen.');
    const svg = svgNeu();
    const werte = punkte.map(wertVon);
    const max = Math.max(...werte, 1);
    const x = i => PAD.l + (punkte.length > 1 ? i / (punkte.length - 1) : .5) * IX;
    const y = v => PAD.o + IY - (v / max) * IY;

    achse(svg, max);
    const px = werte.map((v, i) => [x(i), y(v)]);
    svg.appendChild(s_el('path', {
      d: `M${px[0][0]},${PAD.o + IY} ` + px.map(p => `L${p[0]},${p[1]}`).join(' ')
         + ` L${px[px.length - 1][0]},${PAD.o + IY} Z`,
      fill: verlauf(svg, REIHE[0]),
    }));
    svg.appendChild(s_el('polyline', {
      points: px.map(p => p.join(',')).join(' '), fill: 'none',
      stroke: REIHE[0], 'stroke-width': 1.6,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    // Punkte an den Datenstellen, aber nur solange man sie auseinanderhält:
    // bei sechzig Tagen wird daraus eine dicke Linie.
    if (punkte.length <= 20) {
      px.forEach(p => svg.appendChild(
        s_el('circle', { cx: p[0], cy: p[1], r: 1.7, fill: REIHE[0] })));
    }
    beschriftung(svg, PAD.l, H - 4, markeVon(punkte[0]), 'start');
    if (punkte.length > 1) {
      beschriftung(svg, PAD.l + IX, H - 4, markeVon(punkte[punkte.length - 1]), 'end');
    }

    /* Der Zeiger: senkrechte Führungslinie plus ein Ring auf dem Punkt. Ohne
       die Linie weiß man beim Lesen des Kastens nicht mehr, welche Stelle
       gemeint war. */
    const zeiger = zeigerNeu(svg);
    const linie = s_el('line',
      { y1: PAD.o, y2: PAD.o + IY, stroke: REIHE[0], 'stroke-width': .7, 'stroke-dasharray': '2 2' });
    // Der Ring in Papierfarbe, nicht durchsichtig: sonst schimmert die Fläche
    // durch und der Punkt sieht schmutzig aus. (Als Attribut ausgeschrieben —
    // `var(--papier)` gilt in einem Präsentationsattribut nicht überall.)
    const ring = s_el('circle',
      { r: 3, fill: '#f4efe3', stroke: REIHE[0], 'stroke-width': 1.6 });
    zeiger.appendChild(linie);
    zeiger.appendChild(ring);

    /* Die Trefferbänder: je Punkt ein Streifen über die volle Höhe, halb bis
       zum Nachbarn nach beiden Seiten. Auf die Kurve selbst zu zielen ist bei
       1,6 px Strichstärke eine Geduldsprobe. */
    const halb = punkte.length > 1 ? IX / (punkte.length - 1) / 2 : IX / 2;
    treffer(svg, punkte.map((p, i) => ({
      flaeche: s_el('rect', {
        x: Math.max(PAD.l, x(i) - halb), y: PAD.o,
        width: Math.min(halb * 2, IX), height: IY,
      }),
      hervor: an => {
        zeiger.setAttribute('opacity', an ? 1 : 0);
        linie.setAttribute('x1', x(i)); linie.setAttribute('x2', x(i));
        ring.setAttribute('cx', x(i)); ring.setAttribute('cy', y(werte[i]));
      },
      inhalt: () => ({
        titel: markeVon(p),
        zeilen: [{ farbe: REIHE[0], was: was || 'Anzahl', wert: zahl(werte[i]) }],
      }),
    })));

    box.appendChild(svg);
    return box;
  }

  /* 2 — Bestand je Melder. Eine Linie je Mensch, über eine gemeinsame
     Zeitachse: nur so sieht man, wer wann nachgelegt hat. Die Achse kommt aus
     der Vereinigung aller Tage, nicht aus der längsten Reihe — sonst säßen
     zwei Kurven mit verschiedenen Startpunkten übereinander und logen. */
  function bildSchar(titel, kurven) {
    const box = rahmen(titel);
    const mitWerten = kurven.filter(k => k.werte.length);
    if (!mitWerten.length) return leer(box, 'Noch nichts eingetragen.');

    const tage = [...new Set(mitWerten.flatMap(k => k.tage))].sort();
    const max = Math.max(...mitWerten.flatMap(k => k.werte), 1);
    const x = tag => PAD.l + (tage.length > 1 ? tage.indexOf(tag) / (tage.length - 1) : .5) * IX;
    const y = v => PAD.o + IY - (v / max) * IY;

    const svg = svgNeu();
    achse(svg, max);
    const striche = [];      // je Kurve ihr gezeichnetes Element, für das Hervorheben
    mitWerten.forEach((k, i) => {
      const px = k.tage.map((t, j) => [x(t), y(k.werte[j])]);
      const farbe = REIHE[i % REIHE.length];
      const strich = px.length === 1
        ? s_el('circle', { cx: px[0][0], cy: px[0][1], r: 2.2, fill: farbe })
        : s_el('polyline', {
            points: px.map(p => p.join(',')).join(' '), fill: 'none',
            stroke: farbe, 'stroke-width': 1.5,
            'stroke-linejoin': 'round', 'stroke-linecap': 'round',
          });
      svg.appendChild(strich);
      striche.push(strich);
    });
    beschriftung(svg, PAD.l, H - 4, nurTag(tage[0]), 'start');
    if (tage.length > 1) beschriftung(svg, PAD.l + IX, H - 4, nurTag(tage[tage.length - 1]), 'end');

    /* Ein Band je Tag, und im Kasten steht, wer an diesem Tag wieviel hatte —
       nur wer gemeldet hat. Eine Null für jeden Schweigenden wäre gelogen:
       die Kurve zieht dort schlicht durch. */
    const zeiger = zeigerNeu(svg);
    const linie = s_el('line',
      { y1: PAD.o, y2: PAD.o + IY, stroke: '#6f6653', 'stroke-width': .7, 'stroke-dasharray': '2 2' });
    zeiger.appendChild(linie);

    const halb = tage.length > 1 ? IX / (tage.length - 1) / 2 : IX / 2;
    treffer(svg, tage.map(tag => {
      const da = mitWerten
        .map((k, i) => {
          const j = k.tage.indexOf(tag);
          return j < 0 ? null : { farbe: REIHE[i % REIHE.length], was: k.name, wert: k.werte[j] };
        })
        .filter(Boolean)
        .sort((a, b) => b.wert - a.wert);
      return {
        flaeche: s_el('rect', {
          x: Math.max(PAD.l, x(tag) - halb), y: PAD.o,
          width: Math.min(halb * 2, IX), height: IY,
        }),
        hervor: an => {
          zeiger.setAttribute('opacity', an ? 1 : 0);
          linie.setAttribute('x1', x(tag)); linie.setAttribute('x2', x(tag));
          // Die Ringe wechseln mit dem Tag die Zahl — deshalb neu gesetzt
          // statt vorgehalten.
          [...zeiger.querySelectorAll('circle')].forEach(c => c.remove());
          if (!an) return;
          da.forEach(z => zeiger.appendChild(s_el('circle', {
            cx: x(tag), cy: y(z.wert), r: 2.6,
            fill: '#f4efe3', stroke: z.farbe, 'stroke-width': 1.4,
          })));
        },
        inhalt: () => ({
          titel: nurTag(tag),
          zeilen: da.map(z => ({ farbe: z.farbe, was: z.was, wert: zahl(z.wert) })),
          fuss: da.length ? null : 'Niemand hat gemeldet.',
        }),
      };
    }));
    box.appendChild(svg);

    /* Die Legende hebt hervor: bei fünf Meldern liegen die Linien
       übereinander, und „welche ist meine" beantwortet keine Farbtabelle,
       wenn zwei Grüntöne nebeneinander stehen. */
    const leg = el('div', 'legende');
    mitWerten.forEach((k, i) => {
      const s = el('span');
      s.dataset.heb = '1';
      const punkt = el('i');
      punkt.style.background = REIHE[i % REIHE.length];
      s.appendChild(punkt);
      s.appendChild(document.createTextNode(k.name));
      const heben = an => {
        striche.forEach((st, j) => st.setAttribute('opacity', !an || j === i ? 1 : .15));
        [...leg.children].forEach((c, j) => c.classList.toggle('matt', an && j !== i));
      };
      s.addEventListener('pointerenter', () => heben(true));
      s.addEventListener('pointerleave', () => heben(false));
      leg.appendChild(s);
    });
    box.appendChild(leg);
    return box;
  }

  /* 3 — Liegende Balken. Für Ranglisten mit Namen: senkrecht müsste man den
     Kopf drehen, um zu lesen, wer gemeint ist.

     Die Balken werden nach unten hin blasser. Das ist keine Zierde: acht
     gleich gefärbte Balken sind eine Liste, eine Staffel ist eine Rangfolge —
     und die Länge allein trennt Platz 1 und Platz 2 kaum, wenn beide fast
     gleich oft dran waren. */
  function bildLiegend(titel, daten, nameVon, wertVon, was) {
    const box = rahmen(titel);
    if (!daten.length) return leer(box, 'Noch nichts eingetragen.');
    const zeilen = daten.slice(0, 8);
    const summe = zeilen.reduce((a, z) => a + wertVon(z), 0);
    const max = Math.max(...zeilen.map(wertVon), 1);
    const hoch = 15, luft = 5;
    const hoehe = Math.max(zeilen.length * (hoch + luft) + 6, 40);
    const svg = s_el('svg', { viewBox: `0 0 ${W} ${hoehe}`, role: 'img' });
    const lx = 66;   // Platz für den Namen
    const stufe = i => Math.max(.34, .85 - i * .07);

    const balken = [];
    zeilen.forEach((z, i) => {
      const y = i * (hoch + luft) + 3;
      const b = (wertVon(z) / max) * (W - lx - 22);
      const r = s_el('rect', {
        x: lx, y, width: Math.max(b, 1), height: hoch, rx: 2,
        fill: REIHE[0], opacity: stufe(i),
      });
      svg.appendChild(r);
      balken.push(r);
      const n = s_el('text',
        { x: lx - 6, y: y + hoch - 4, 'text-anchor': 'end', 'font-size': 9.5, fill: '#47544d' });
      n.textContent = nameVon(z);
      svg.appendChild(n);
      const w = s_el('text',
        { x: lx + Math.max(b, 1) + 5, y: y + hoch - 4, 'font-size': 9.5, fill: '#6f6653' });
      w.textContent = zahl(wertVon(z));
      svg.appendChild(w);
    });

    // Getroffen wird die ganze Zeile, nicht der Balken: bei einem Wert von
    // eins ist der Balken drei Pixel breit.
    treffer(svg, zeilen.map((z, i) => ({
      flaeche: s_el('rect',
        { x: 0, y: i * (hoch + luft), width: W, height: hoch + luft }),
      hervor: an => balken[i].setAttribute('opacity', an ? 1 : stufe(i)),
      inhalt: () => ({
        titel: nameVon(z),
        zeilen: [{ farbe: REIHE[0], was: was || 'Anzahl', wert: zahl(wertVon(z)) }],
        fuss: summe ? Math.round((wertVon(z) / summe) * 100) + ' % der gezeigten Zeilen' : null,
      }),
    })));
    box.appendChild(svg);
    return box;
  }

  /* 4 — Ein einziger gestapelter Balken. Die Frage ist der ANTEIL: wie oft
     wird aus einer Ziehung ein Abend. Vier Zahlen nebeneinander beantworten
     das schlechter als ein Band, das man mit einem Blick teilt. */
  const LOS_TITEL = {
    zugesagt: 'zugesagt', abgelehnt: 'abgesagt',
    verfallen: 'verfallen', offen: 'offen',
  };
  const LOS_FARBE = {
    zugesagt: '#2f5d4a', abgelehnt: '#b04a38',
    verfallen: '#6f6653', offen: '#b8901f',
  };
  function bildBand(titel, daten) {
    const box = rahmen(titel);
    const summe = daten.reduce((a, z) => a + z.n, 0);
    if (!summe) return leer(box, 'Noch nicht gedreht.');
    const hoehe = 58;
    const svg = s_el('svg', { viewBox: `0 0 ${W} ${hoehe}`, role: 'img' });
    let x = 0;
    const breit = W - 2;
    const stuecke = [];
    daten.forEach(z => {
      const b = (z.n / summe) * breit;
      const r = s_el('rect', {
        x: x + 1, y: 6, width: Math.max(b, .5), height: 20,
        fill: LOS_FARBE[z.status] || REIHE[5],
      });
      svg.appendChild(r);
      stuecke.push({ z, r, von: x + 1, breite: Math.max(b, .5) });
      x += b;
    });
    /* Die Beschriftung darunter, nicht im Balken: bei einem Segment von zwei
       Prozent passt kein Wort hinein, und dann stünde es woanders als der
       Rest. Zwei Spalten zu je zwei Zeilen — vier Ausgänge gibt es, mehr
       kann `los.status` nicht annehmen. */
    daten.forEach((z, i) => {
      const t = s_el('text', {
        x: 2 + Math.floor(i / 2) * 108, y: 42 + (i % 2) * 12,
        'font-size': 9, fill: '#47544d',
      });
      // Der Punkt in der Farbe des Segments: sonst muss man raten, welcher
      // Streifen im Band zu welchem Wort gehört.
      const punkt = s_el('tspan', { fill: LOS_FARBE[z.status] || REIHE[5] });
      punkt.textContent = '● ';
      t.appendChild(punkt);
      t.appendChild(document.createTextNode(
        `${LOS_TITEL[z.status] || z.status}: ${zahl(z.n)}`));
      svg.appendChild(t);
    });

    /* Die Frage des Bildes ist der Anteil — und der stand als Zahl nirgends.
       Die Trefferfläche reicht über den Streifen hinaus nach oben und unten:
       20 Pixel Höhe im viewBox sind auf dem Handy ein schmaler Grat. */
    const umriss = s_el('rect',
      { y: 5, height: 22, fill: 'none', stroke: '#1d2a24', 'stroke-width': 1, opacity: 0 });
    svg.appendChild(umriss);
    treffer(svg, stuecke.map(s => ({
      flaeche: s_el('rect', { x: s.von, y: 0, width: s.breite, height: 32 }),
      hervor: an => {
        umriss.setAttribute('opacity', an ? .55 : 0);
        umriss.setAttribute('x', s.von); umriss.setAttribute('width', s.breite);
      },
      inhalt: () => ({
        titel: LOS_TITEL[s.z.status] || s.z.status,
        zeilen: [
          { farbe: LOS_FARBE[s.z.status] || REIHE[5], was: 'Ziehungen', wert: zahl(s.z.n) },
          { was: 'Anteil', wert: Math.round((s.z.n / summe) * 100) + ' %' },
        ],
        fuss: zahl(summe) + ' Ziehungen insgesamt',
      }),
    })));
    box.appendChild(svg);
    return box;
  }

  /* 4b — Dasselbe je Melder: ein liegender Balken je Mensch, so lang wie er
     gezogen wurde, darin die Ausgänge in denselben Farben wie im Band
     darüber. Die Länge beantwortet „wen trifft es oft", die Aufteilung „und
     was macht er daraus" — zwei Bilder nebeneinander würden dieselbe Zeile
     zweimal suchen lassen. Die Zahl am Ende ist die Summe; die einzelnen
     Ausgänge stehen im Tooltip, denn in einen Streifen von vier Pixeln passt
     keine Ziffer.

     Der Tooltip hängt an der ZEILE, nicht am Segment. Vorher war es ein
     `<title>` je Segment: der Browser braucht dafür eine Sekunde, malt seinen
     eigenen grauen Kasten — und ein Streifen von vier Pixeln ist ohnehin
     nicht anzielbar. Jetzt zeigt eine Zeile alle vier Ausgänge auf einmal,
     was sowieso die Frage ist, die man an eine Zeile hat. */
  const LOS_ORDNUNG = ['zugesagt', 'abgelehnt', 'verfallen', 'offen'];
  function bildLosJeMelder(titel, daten) {
    const box = rahmen(titel);
    const zeilen = daten.filter(z => z.gezogen).slice(0, 8);
    if (!zeilen.length) return leer(box, 'Noch nicht gedreht.');
    const max = Math.max(...zeilen.map(z => z.gezogen), 1);
    const hoch = 15, luft = 5;
    const hoehe = Math.max(zeilen.length * (hoch + luft) + 6, 40);
    const svg = s_el('svg', { viewBox: `0 0 ${W} ${hoehe}`, role: 'img' });
    const lx = 66;                   // Platz für den Namen, wie beim Balkenbild
    const voll = W - lx - 22;        // Platz für den längsten Balken

    const reihen = [];   // je Zeile ihre Segmente, fürs Hervorheben
    zeilen.forEach((z, i) => {
      const y = i * (hoch + luft) + 3;
      const laenge = (z.gezogen / max) * voll;
      let x = lx;
      const meine = [];
      LOS_ORDNUNG.forEach(status => {
        const v = z[status] || 0;
        if (!v) return;
        const b = (v / z.gezogen) * laenge;
        const r = s_el('rect',
          { x, y, width: Math.max(b, .5), height: hoch, fill: LOS_FARBE[status] });
        svg.appendChild(r);
        meine.push(r);
        x += b;
      });
      reihen.push(meine);
      const n = s_el('text',
        { x: lx - 6, y: y + hoch - 4, 'text-anchor': 'end', 'font-size': 9.5, fill: '#47544d' });
      n.textContent = z.name;
      svg.appendChild(n);
      const w = s_el('text',
        { x: lx + Math.max(laenge, 1) + 5, y: y + hoch - 4, 'font-size': 9.5, fill: '#6f6653' });
      w.textContent = zahl(z.gezogen);
      svg.appendChild(w);
    });

    treffer(svg, zeilen.map((z, i) => ({
      flaeche: s_el('rect',
        { x: 0, y: i * (hoch + luft), width: W, height: hoch + luft }),
      hervor: an => reihen[i].forEach(r => r.setAttribute('opacity', an ? 1 : .82)),
      inhalt: () => ({
        titel: z.name,
        // Nur die Ausgänge zeigen, die es bei ihm gab: vier Zeilen, von denen
        // drei „0" sagen, sind drei Zeilen zuviel.
        zeilen: LOS_ORDNUNG.filter(st => z[st]).map(st => ({
          farbe: LOS_FARBE[st], was: LOS_TITEL[st], wert: zahl(z[st]),
        })),
        fuss: zahl(z.gezogen) + '× gezogen',
      }),
    })));
    // Der Grundzustand ist leicht gedeckt, damit das Hervorheben überhaupt
    // etwas zu tun hat.
    reihen.forEach(m => m.forEach(r => r.setAttribute('opacity', .82)));
    box.appendChild(svg);

    const leg = el('div', 'legende');
    LOS_ORDNUNG.forEach(status => {
      const s = el('span');
      const punkt = el('i');
      punkt.style.background = LOS_FARBE[status];
      s.appendChild(punkt);
      s.appendChild(document.createTextNode(LOS_TITEL[status]));
      leg.appendChild(s);
    });
    box.appendChild(leg);
    return box;
  }

  /* 5/6 — Gestapelte Säulen. Eine Woche (oder eine Mailart) je Säule, die
     Schichten übereinander. */
  function bildSaeulen(titel, gruppen, reihen, markeVon) {
    const box = rahmen(titel);
    if (!gruppen.length) return leer(box, 'Noch nichts eingetragen.');
    const summen = gruppen.map(g => reihen.reduce((a, r) => a + (g[r.feld] || 0), 0));
    const max = Math.max(...summen, 1);
    const svg = svgNeu();
    achse(svg, max);

    const platz = IX / gruppen.length;
    const breit = Math.min(platz * .62, 26);

    /* Der Wisch, der die angefasste Säule hinterlegt. Er wird VOR den Säulen
       gezeichnet: darüber gelegt trübt er genau die Farben ein, um die es
       gerade geht. */
    const hinterlegt = s_el('rect',
      { y: PAD.o, height: IY, fill: '#1d2a24', opacity: 0, rx: 2, 'pointer-events': 'none' });
    svg.appendChild(hinterlegt);

    gruppen.forEach((g, i) => {
      let unten = PAD.o + IY;
      reihen.forEach((r, j) => {
        const v = g[r.feld] || 0;
        if (!v) return;
        const h = (v / max) * IY;
        unten -= h;
        svg.appendChild(s_el('rect', {
          x: PAD.l + platz * i + (platz - breit) / 2, y: unten,
          width: breit, height: h, fill: r.farbe,
        }));
      });
    });
    // Nur die erste und die letzte Säule beschriften: bei zwanzig Wochen
    // überlappen sich sonst alle, und lesbar ist am Ende keine.
    beschriftung(svg, PAD.l + platz * .5, H - 4, markeVon(gruppen[0]));
    if (gruppen.length > 1) {
      beschriftung(svg, PAD.l + platz * (gruppen.length - .5), H - 4,
        markeVon(gruppen[gruppen.length - 1]));
    }

    /* Genau hier hat die Beschriftung ihre Lücke: nur die erste und die
       letzte Säule tragen eine, alle dazwischen sind stumm. Der Kasten sagt,
       welche Woche das ist — und dazu jede Schicht einzeln, denn gestapelt
       lässt sich eine mittlere Schicht mit dem Auge nicht messen. */
    treffer(svg, gruppen.map((g, i) => ({
      flaeche: s_el('rect',
        { x: PAD.l + platz * i, y: PAD.o, width: platz, height: IY }),
      hervor: an => {
        hinterlegt.setAttribute('opacity', an ? .05 : 0);
        hinterlegt.setAttribute('x', PAD.l + platz * i);
        hinterlegt.setAttribute('width', platz);
      },
      inhalt: () => ({
        titel: markeVon(g),
        zeilen: reihen.map(r => ({
          farbe: r.farbe, was: r.titel, wert: zahl(g[r.feld] || 0),
        })),
        fuss: 'zusammen ' + zahl(summen[i]),
      }),
    })));
    box.appendChild(svg);

    const leg = el('div', 'legende');
    reihen.forEach(r => {
      const s = el('span');
      const punkt = el('i');
      punkt.style.background = r.farbe;
      s.appendChild(punkt);
      s.appendChild(document.createTextNode(r.titel));
      leg.appendChild(s);
    });
    box.appendChild(leg);
    return box;
  }

  // ==========================================================================
  // Zeichnen
  // ==========================================================================
  let stand = null;    // die letzte Antwort von /api/admin/nutzer

  function kopfZeichnen(kopf, ich, health) {
    $('wer').textContent = 'Angemeldet als ' + (ich.name || 'namenlos') + ' · ' + ich.email;
    const z = $('zahlen');
    z.textContent = '';
    const kachel = (wert, was, warn) => {
      const d = el('div', 'zahl' + (warn ? ' warn' : ''));
      d.appendChild(el('b', null, zahl(wert)));
      d.appendChild(el('span', null, was));
      z.appendChild(d);
    };
    kachel(kopf.melder, 'Melder');
    kachel(kopf.aktiv, 'davon aktiv');
    kachel(kopf.gesperrt, 'gesperrt', kopf.gesperrt > 0);
    kachel(kopf.mails_24h, 'Mails, 24 h');
    if (kopf.mails_kaputt_24h) kachel(kopf.mails_kaputt_24h, 'davon kaputt', true);

    /* Die Ampel: was der Worker über sich selbst sagt. `admin` und
       `mail_geheim` stehen dort seit dieser Ausbaustufe — ohne sie käme
       niemand ins Kontor und trüge keine Mail einen Abmeldelink, und beides
       sähe von außen wie ein Fehler im Browser aus. */
    const a = $('ampel');
    a.textContent = '';
    if (!health) {
      const s = el('span', 'egal', 'Zustand unbekannt');
      tippAm(s, { titel: 'Zustand unbekannt', zeilen: [],
        fuss: '/api/health hat nicht geantwortet. Das ist die Ampel, nicht der Inhalt — '
            + 'die Zahlen daneben stimmen trotzdem.' });
      a.appendChild(s);
      return;
    }
    [['db', 'Datenbank'], ['mail', 'Mailversand'], ['admin', 'ADMIN_MAIL'],
     ['mail_geheim', 'MAIL_GEHEIM'], ['bilder', 'Bilder'], ['tafel', 'Verteiler']]
      .forEach(([k, titel]) => {
        const wert = String(health[k] ?? '');
        const gut = wert === 'ok' || wert === 'Schluessel liegt an';
        /* Die Pille bleibt kurz, der Wortlaut des Workers steht im Tooltip.
           Angehängt war er dreimal so lang wie die Pille selbst und schob die
           übrigen Lampen aus der Zeile. */
        const s = el('span', gut ? '' : 'aus', titel);
        tippAm(s, {
          titel,
          zeilen: [{ farbe: gut ? '#2f5d4a' : '#b04a38', was: 'Antwort', wert: wert || '—' }],
        });

      });

  function runde(nutzer) {
    const ziel = $('runde');
    ziel.textContent = '';
    nutzer.forEach(u => {
      const k = el('div', 'karte'
        + (u.gesperrt ? ' gesperrt' : '') + (u.entfernt ? ' weg' : ''));

      const kopf = el('div', 'k-kopf');
      kopf.appendChild(el('span', 'k-name', u.name || 'Ehemaliger'));
      if (u.rolle === 'admin') kopf.appendChild(el('span', 'marke admin', 'Admin'));
      if (u.gemessen) kopf.appendChild(el('span', 'marke', 'gemessen'));
      if (u.ich) kopf.appendChild(el('span', 'marke ich', 'du'));
      if (u.gesperrt) kopf.appendChild(el('span', 'marke rot', 'gesperrt'));
      if (u.entfernt) kopf.appendChild(el('span', 'marke', 'entfernt'));
      if (u.stumm) kopf.appendChild(el('span', 'marke', 'stumm'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', u.email || (u.gemessen
        ? 'kein Postfach — meldet aus der Wohnung'
        : 'keine Adresse mehr')));

      if (u.gesperrt) {
        k.appendChild(el('p', 'k-grund',
          (u.gesperrt.grund || 'Ohne Grund gesperrt.')
          + ' — ' + u.gesperrt.von + ', ' + datum(u.gesperrt.seit)));
      }

      const zahlen = el('div', 'k-zahlen');
      const feld = (was, wert) => {
        const d = el('div');
        d.appendChild(el('span', null, was));
        d.appendChild(document.createTextNode(wert));
        zahlen.appendChild(d);
      };
      feld('Geräte', zahl(u.geraete));
      feld('Meldungen', zahl(u.meldungen));
      feld('zuletzt', u.zuletzt ? nurTag(u.zuletzt) : '—');
      feld('Kommentare', zahl(u.kommentare));
      feld('Gastgeber', zahl(u.gastgeber));
      feld('bewertet von', zahl(u.bewertet));
      k.appendChild(zahlen);

      if (!u.entfernt) k.appendChild(knoepfe(u));
      ziel.appendChild(k);

  /* Jede zerstörende Handlung fragt zurück — als zweiter Klick auf denselben
     Knopf, mit dem Namen im Satz darüber. Kein confirm(): der Systemdialog
     reißt einen aus dem Blatt, und man klickt ihn weg, ohne ihn zu lesen. */
  let sicher = null;   // 'id:aktion', solange die Rückfrage steht
  let sicherUhr = null;

  function knoepfe(u) {
    const zeile = el('div', 'k-tat');
    const tat = (aktion, wort, zerstoerend) => {
      const b = el('button', null, wort);
      const schluessel = u.id + ':' + aktion;
      if (sicher === schluessel) { b.className = 'sicher'; b.textContent = 'wirklich?'; }
      b.addEventListener('click', () => handeln(u, aktion, schluessel, zerstoerend));
      zeile.appendChild(b);
    };

    if (u.gesperrt) tat('entsperren', 'entsperren', false);
    else if (!u.ich) tat('sperren', 'sperren', true);

    if (!u.ich && !u.gemessen) {
      tat('rolle', u.rolle === 'admin' ? 'zu User machen' : 'zu Admin machen', true);
      tat('entfernen', 'entfernen', true);
    }

    // Das Feld für den Sperrgrund steht erst da, wenn die Rückfrage steht:
    // vorher wäre es ein leeres Kästchen an jeder Karte.
    if (sicher === u.id + ':sperren') {
      const f = el('input');
      f.type = 'text';
      f.id = 'grund-' + u.id;
      f.maxLength = 120;
      f.placeholder = 'Grund (freiwillig, er liest ihn)';
      f.style.marginTop = '6px';
      zeile.appendChild(f);
      setTimeout(() => f.focus(), 0);
    }
    return zeile;
  }

  async function handeln(u, aktion, schluessel, zerstoerend) {
    if (zerstoerend && sicher !== schluessel) {
      sicher = schluessel;
      clearTimeout(sicherUhr);
      // Die Rückfrage verfällt von selbst: ein „wirklich?" das eine Stunde
      // stehen bleibt, wird irgendwann versehentlich getroffen.
      sicherUhr = setTimeout(() => {
        sicher = null;
        runde(stand.nutzer);
        // Der Satz muss mit weg. Bleibt er stehen, während die Knöpfe schon
        // wieder harmlos aussehen, liest man ihn als Zustand statt als Frage.
        sagt('runde-sagt', '');
      }, 8000);
      runde(stand.nutzer);
      sagt('runde-sagt', worte(u, aktion));
      return;
    }
    const grundFeld = $('grund-' + u.id);
    const grund = grundFeld ? grundFeld.value : '';
    sicher = null;
    clearTimeout(sicherUhr);
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion, grund });
      await laden();
      sagt('runde-sagt', getan(u, aktion));
    } catch (e) {
      runde(stand.nutzer);
      sagt('runde-sagt', e.message, true);
    }
  }

  const worte = (u, aktion) => ({
    sperren: `${u.name} sperren? Er sieht die Tafel weiter, kann aber nichts mehr `
           + 'eintragen und fällt aus dem Rad.',
    rolle: u.rolle === 'admin'
      ? `${u.name} die Adminrechte nehmen?`
      : `${u.name} zum Admin machen? Er sieht dann alle Adressen und kann sperren.`,
    entfernen: `${u.name} entfernen? Name und Adresse verschwinden, seine Beiträge `
             + 'bleiben als „Ehemaliger" stehen. Zurückholen geht nicht.',
  }[aktion] || '');

  const getan = (u, aktion) => ({
    sperren: `${u.name} ist gesperrt.`,
    entsperren: `${u.name} darf wieder.`,
    rolle: `Die Rolle von ${u.name} ist getauscht.`,
    entfernen: `${u.name} ist entfernt. Die Beiträge stehen als „Ehemaliger" da.`,
  }[aktion] || 'Erledigt.');

  function statistik(s) {
    const ziel = $('bilder');
    ziel.textContent = '';
    ziel.appendChild(bildFlaeche('Meldungen je Tag, 60 Tage',
      s.meldungen, z => z.n, z => nurTag(z.tag), 'Meldungen'));
    ziel.appendChild(bildSchar('Bestand je Melder, 30 Tage', s.bestand));
    ziel.appendChild(bildLiegend('Wer war wie oft Gastgeber',
      s.gastgeber, z => z.name, z => z.n, 'Abende'));
    ziel.appendChild(bildBand('Ausgang der Ziehungen', s.lose));
    ziel.appendChild(bildLosJeMelder('Ausgang der Ziehungen je Melder',
      s.lose_je_melder || []));
    ziel.appendChild(bildSaeulen('Betrieb je Woche', s.betrieb, [
      { feld: 'kommentare', titel: 'Kommentare', farbe: REIHE[0] },
      { feld: 'reaktionen', titel: 'Reaktionen', farbe: REIHE[1] },
      { feld: 'sterne',     titel: 'Sterne',     farbe: REIHE[3] },
    ], g => 'KW ' + String(g.woche).slice(-2)));
    ziel.appendChild(bildSaeulen('Mails je Art, 30 Tage', s.mails, [
      { feld: 'n',      titel: 'verschickt', farbe: REIHE[0] },
      { feld: 'kaputt', titel: 'ging nicht raus', farbe: REIHE[2] },
    ], g => g.art.replace(/_/g, ' ')));

    /* Jedes Bild bekommt seine Überschrift als Namen. `role="img"` ohne
       Beschriftung ist für einen Screenreader ein leeres Bild — und seit die
       Bilder ein Tabstop sind, landet man dort auch tatsächlich. An einer
       Stelle für alle sechs, statt sechsmal dasselbe Attribut. */
    [...ziel.querySelectorAll('.bild')].forEach(b => {
      const svg = b.querySelector('svg'), h3 = b.querySelector('h3');
      if (svg && h3) {
        svg.setAttribute('aria-label',
          h3.textContent + (svg.hasAttribute('tabindex')
            ? ' — mit den Pfeiltasten durch die Werte' : ''));
      }
    });

    const zz = $('zwei-zahlen');
    zz.textContent = '';
    const paar = (was, wert) => {
      const d = el('span');
      d.appendChild(el('b', null, wert));
      d.appendChild(document.createTextNode(' ' + was));
      zz.appendChild(d);
    };
    const w = s.wachstum.length ? s.wachstum[s.wachstum.length - 1].n : 0;
    paar('Angemeldete insgesamt', zahl(w));
    paar('von ' + zahl(s.postwillig.alle) + ' mit Adresse wollen noch Post',
      zahl(s.postwillig.willig));
  }

  function protokoll(zeilen) {

  // ==========================================================================
  // Rundmail — Vorschau, dann erst der Versand mit der Zahl im Knopf
  // ==========================================================================
  let vorschauSteht = false;

  function zaehler() {
    const n = $('r-text').value.length;
    $('r-zaehler').textContent = n ? n + ' von 4000 Zeichen' : '';
  }
  $('r-text').addEventListener('input', () => { zaehler(); vorschauWeg(); });
  $('r-betreff').addEventListener('input', vorschauWeg);

  function vorschauWeg() {
    if (!vorschauSteht) return;
    vorschauSteht = false;
    $('r-vorschau').hidden = true;
    $('r-weg').hidden = true;
    $('r-ab').textContent = 'Vorschau';
    sagt('rund-sagt', '');
  }

  $('r-weg').addEventListener('click', vorschauWeg);

  $('r-ab').addEventListener('click', async () => {
    const betreff = $('r-betreff').value.trim();
    const text = $('r-text').value.trim();
    if (!betreff || !text) {
      sagt('rund-sagt', 'Betreff und Text wollen beide etwas.', true);
      return;
    }

    /* Erst zeigen, dann schicken. Eine Rundmail an die ganze Runde ist die
       eine Handlung hier, die sich nicht zurücknehmen lässt — sie liegt
       binnen Sekunden in fünf Postfächern. */
    if (!vorschauSteht) {
      const v = $('r-vorschau');
      v.textContent = '';
      v.hidden = false;
      const kasten = el('div', 'karte');
      kasten.style.marginTop = '14px';
      kasten.appendChild(el('div', 'k-name', betreff));
      text.split(/\n{2,}/).forEach(a => {
        const p = el('p', null, a);
        p.style.cssText = 'margin:8px 0 0;white-space:pre-wrap;font-size:14px';
        kasten.appendChild(p);
      });
      v.appendChild(kasten);
      vorschauSteht = true;
      $('r-weg').hidden = false;
      const wieViele = stand ? stand.nutzer.filter(u =>
        !u.entfernt && !u.gesperrt && !u.stumm && u.email && u.mail.rundmail).length : 0;
      $('r-ab').textContent = wieViele === 1
        ? 'An 1 Melder schicken'
        : 'An ' + wieViele + ' Melder schicken';
      return;
    }

    $('r-ab').disabled = true;
    try {
      const d = await ruf('/api/admin/rundmail', { betreff, text });
      $('r-betreff').value = '';
      $('r-text').value = '';
      zaehler();
      vorschauWeg();

        ? 'Raus an einen Melder.'
        : 'Raus an ' + d.empfaenger + ' Melder.');

      sagt('rund-sagt', e.message, true);

      $('r-ab').disabled = false;

  // ==========================================================================
  // Laden
  // ==========================================================================
  const BLAETTER = ['kopf-blatt', 'runde-blatt', 'stat-blatt', 'rund-blatt', 'log-blatt'];

  function zeigeTuer(text) {
    $('skelett').hidden = true;
    BLAETTER.forEach(id => { $(id).hidden = true; });
    $('tuer').hidden = false;
    if (text) $('tuer-text').textContent = text;
  }

  async function laden() {
    if (!merke()) {
      zeigeTuer('Auf diesem Gerät ist niemand angemeldet. Melde dich auf der Tafel an — '
              + 'das Kontor benutzt dasselbe Token.');
      return;
    }
    let mich;
    try {
      mich = await ruf('/api/me');
    } catch {
      zeigeTuer('Die Anmeldung gilt hier nicht mehr. Melde dich auf der Tafel neu an.');
      return;
    }
    if (mich.rolle !== 'admin') {
      zeigeTuer('Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.');
      return;
    }

    /* Alle vier auf einmal: sie hängen nicht voneinander ab, und
       nacheinander wäre das Kontor viermal so lange leer. `health` darf
       scheitern, ohne den Rest mitzureißen — es ist die Ampel, nicht der
       Inhalt. */
    const [leute, stat, log, health] = await Promise.all([
      ruf('/api/admin/nutzer'),
      ruf('/api/admin/statistik'),
      ruf('/api/admin/protokoll'),
      fetch(API + '/api/health', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
    ]);

    /* Die Blätter kommen erst JETZT, nicht schon vor dem Abruf: fünf leere
       Kästen mit Überschriften sind keine Auskunft, sondern eine Behauptung.
       Bis hierher stand das Skelett. Beim Nachladen nach einer Handlung
       ändert sich hier nichts — sichtbar bleibt sichtbar, kein Flackern. */
    $('skelett').hidden = true;
    $('tuer').hidden = true;
    BLAETTER.forEach(id => { $(id).hidden = false; });

    // Ein Tooltip, der noch offen steht, zeigt gleich auf einen Punkt, den es
    // nicht mehr gibt.
    tipFest = false;
    tipAus();

    stand = leute;
    kopfZeichnen(leute.kopf, mich, health);
    runde(leute.nutzer);
    statistik(stat);
    protokoll(log.zeilen);
  }

  laden().catch(e => zeigeTuer('Das Kontor ließ sich nicht aufschlagen: ' + e.message));
</script>
</body>
</html>
