    <!-- Das Holz. Vier Leisten, jede auf ihr Trapez beschnitten - erst dadurch
         dreht die Faser an der Gehrung. Reine Zeichnung; darum `aria-hidden`. -->
    <div class="rh" aria-hidden="true">
      <i class="rh-l rh-o"></i><i class="rh-l rh-u"></i><i class="rh-l rh-li"></i><i class="rh-l rh-re"></i>
      <i class="rh-naht"></i><i class="rh-fase"></i><i class="rh-falz"></i>
    </div>

    <h2>Statistiken</h2>
    <div class="werkzeug">
      <span class="reiter" id="zeitraum"></span>
    </div>
    <div id="bilder"></div>
    <div class="zwei-zahlen" id="zwei-zahlen"></div>
    <p class="sagt" id="stat-sagt" hidden></p>
  </section>

  <section class="blatt" id="rund-blatt" aria-label="Rundmail" hidden>
    <!-- Das Holz. Vier Leisten, jede auf ihr Trapez beschnitten - erst dadurch
         dreht die Faser an der Gehrung. Reine Zeichnung; darum `aria-hidden`. -->
    <div class="rh" aria-hidden="true">
      <i class="rh-l rh-o"></i><i class="rh-l rh-u"></i><i class="rh-l rh-li"></i><i class="rh-l rh-re"></i>
      <i class="rh-naht"></i><i class="rh-fase"></i><i class="rh-falz"></i>
    </div>

    <h2>Rundmail</h2>
    <div class="post">
      <div>
        <label class="feld-titel" for="r-betreff">Betreff</label>
        <input type="text" id="r-betreff" maxlength="120" placeholder="Freitag steht">
        <label class="feld-titel" for="r-text">Text</label>
        <textarea id="r-text" maxlength="4000"
                  placeholder="Was der Wirt zu sagen hat. Leerzeile trennt Absätze."></textarea>
        <p class="unter" id="r-zaehler" style="margin:6px 0 0"></p>

        <label class="feld-titel" for="r-bild">Bild (Adresse, freiwillig)</label>
        <input type="text" id="r-bild" placeholder="https://…">

        <label class="feld-titel" for="r-knopf-text">Knopf (freiwillig)</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="r-knopf-text" maxlength="40" placeholder="Zur Tafel"
                 style="flex:1 1 40%">
          <input type="text" id="r-knopf-link" placeholder="https://…" style="flex:1 1 60%">
        </div>

        <label class="feld-titel">Versand</label>
        <div class="reiter" id="r-wann"></div>
        <!-- Das `display:flex` steht ABSICHTLICH im Blatt und nicht hier als
             Stil-Attribut: ein `display` am Element schlägt das `hidden`, und
             die beiden Felder standen dadurch auch unter „Jetzt" da. -->
        <div id="r-spaeter" hidden>
          <input type="date" id="r-datum" style="flex:1 1 auto">
          <input type="time" id="r-zeit" style="flex:0 0 110px">
        </div>

        <div class="k-tat" style="margin-top:14px">
          <button class="gross" id="r-ab" type="button">Schicken</button>
          <button id="r-test" type="button">Testmail an mich</button>
        </div>
        <p class="sagt" id="rund-sagt" hidden></p>
      </div>

      <!-- Die Vorschau steht daneben und schreibt beim Tippen mit. Kein
           eigenes Gerüst darin: `mailVorschau()` baut den Kasten, und zwar
           denselben, der vorher auf Knopfdruck erschien — zwei Zeichner
           liefen auseinander, sobald der Worker seine Mail änderte. -->
      <div>
        <label class="feld-titel" style="margin-top:12px">Vorschau</label>
        <div id="r-vorschau"></div>
      </div>
    </div>

    <div id="r-geplant" hidden style="margin-top:24px;padding-top:14px;border-top:1px solid var(--linie)">
      <h3>Geplant</h3>
      <div id="r-geplant-liste" style="display:grid;gap:10px"></div>
    </div>
  </section>

  <section class="blatt" id="log-blatt" aria-label="Protokoll" hidden>
    <!-- Das Holz. Vier Leisten, jede auf ihr Trapez beschnitten - erst dadurch
         dreht die Faser an der Gehrung. Reine Zeichnung; darum `aria-hidden`. -->
    <div class="rh" aria-hidden="true">
      <i class="rh-l rh-o"></i><i class="rh-l rh-u"></i><i class="rh-l rh-li"></i><i class="rh-l rh-re"></i>
      <i class="rh-naht"></i><i class="rh-fase"></i><i class="rh-falz"></i>
    </div>

    <h2>Protokoll</h2>
    <div class="werkzeug">
      <!-- Suche vor Sieb, wie über der Runde — die Begründung steht bei
           `.werkzeug` im Stilteil und gilt hier unverändert. Das Feld
           verspricht „Name oder Art", nicht „alles": der Weg (Mail, Push)
           steht in den Reitern daneben, und die Stückzahlen entstehen erst
           beim Zeichnen. -->
      <span class="suche"><input type="text" id="log-suche" placeholder="Name oder Art…"
                                 aria-label="Protokoll durchsuchen"></span>
      <span class="reiter" id="log-filter"></span>
    </div>
    <ul class="log" id="log"></ul>
    <p class="sagt" id="log-sagt" hidden></p>
  </section>

  <div class="blatt tuer" id="tuer" hidden>
    <!-- Das Holz. Vier Leisten, jede auf ihr Trapez beschnitten - erst dadurch
         dreht die Faser an der Gehrung. Reine Zeichnung; darum `aria-hidden`. -->
    <div class="rh" aria-hidden="true">
      <i class="rh-l rh-o"></i><i class="rh-l rh-u"></i><i class="rh-l rh-li"></i><i class="rh-l rh-re"></i>
      <i class="rh-naht"></i><i class="rh-fase"></i><i class="rh-falz"></i>
    </div>

    <h1>Nicht dein Zimmer</h1>
    <p id="tuer-text">Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.</p>
    <a class="zurueck" href="./">← zurück zur Tafel</a>
  </div>

</div>

<!-- Die Jahr-Wahl. Sie steht außerhalb des Buches, weil sie über allem liegt;
     gewählt wird hier nur, GEZEIGT wird der Rückblick drüben auf der Tafel. -->
<div class="wahl-ebene" id="wahl-ebene" hidden>
  <div class="wahl-schirm" id="wahl-schirm" data-wahl-zu></div>
  <div class="wahl-rahmen" id="wahl-rahmen">
    <div class="rh" aria-hidden="true">
      <i class="rh-l rh-o"></i><i class="rh-l rh-u"></i><i class="rh-l rh-li"></i><i class="rh-l rh-re"></i>
      <i class="rh-naht"></i><i class="rh-fase"></i><i class="rh-falz"></i>
    </div>
    <div class="wahl-blatt" id="wahl-blatt" role="dialog" aria-modal="true" aria-label="Jahr wählen">
      <button class="wahl-griff" type="button" aria-label="Schließen" data-wahl-zu></button>
      <div class="wahl-kopf">
        <h3>Dein Jahr — welches?</h3>
        <button class="wahl-zu" type="button" aria-label="Schließen" data-wahl-zu>×</button>
      </div>
      <div id="jahr-liste"></div>
    </div>
  </div>
</div>

<script src="bilder.js"></script>
<script>
  // ==========================================================================
  // Dieselbe Herkunft wie die Tafel, also DASSELBE localStorage und dasselbe
  // Token: wer dort angemeldet ist, ist es hier auch. Kein zweiter Login, kein
  // zweiter Anmeldeweg — und damit auch kein zweiter Angriffsweg.
  // ==========================================================================
  const API = location.hostname === 'localhost'
    ? 'http://localhost:8787'
    : 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';
  const TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const NS = 'http://www.w3.org/2000/svg';

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };
  const s_el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const merke = () => { try { return localStorage.getItem(SPEICHER); } catch { return null; } };

  const mitToken = (kopf = {}) => {
    const t = merke();
    return t ? { ...kopf, Authorization: 'Bearer ' + t } : kopf;
  };

  /* Jeder Ruf geht hier durch — eine Stelle für Kopf, Fehlerform und die
     Umwandlung in eine Ausnahme, die oben als Satz landet. */
  async function ruf(pfad, rumpf) {
    const r = await fetch(API + pfad, {
      method: rumpf ? 'POST' : 'GET',
      headers: mitToken(rumpf
        ? { 'Content-Type': 'application/json', 'X-Tab': TAB }
        : {}),
      body: rumpf ? JSON.stringify(rumpf) : undefined,
      cache: 'no-store',
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fehler || 'Das ging nicht (' + r.status + ')');
    return d;
  }

  function sagt(id, text, schlecht) {
    const p = $(id);
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  const zahl = n => (n ?? 0).toLocaleString('de-DE');
  const datum = iso => iso
    ? new Date(iso).toLocaleString('de-DE',
        { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  const nurTag = iso => iso
    ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
    : '—';

  /* „vor drei Stunden" statt „03.08.26, 16:14". Im Protokoll ist die Frage
     nicht, wann etwas war, sondern wie lange es her ist — das genaue Datum
     steht daneben im Tooltip. Ab einer Woche kippt es zurück aufs Datum:
     „vor 23 Tagen" muss man umrechnen, um es einzuordnen. */
  function vorhin(iso) {
    if (!iso) return '—';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 90) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'vor ' + Math.round(s / 3600) + ' h';
    if (s < 7 * 86400) {
      const t = Math.round(s / 86400);
      return t === 1 ? 'gestern' : 'vor ' + t + ' Tagen';
    }
    return nurTag(iso);
  }

  // ==========================================================================
  // Die Bilder kommen aus `bilder.js` — dieselbe Datei, die die Statistikseite
  // benutzt. Beide Seiten sind jetzt Schiefer, also bekommen beide DIESELBE
  // Palette; sie steht trotzdem an beiden Stellen ausgeschrieben, weil die
  // Vorgabe der Datei Papier ist und ein vergessenes `aufsetzen` sonst
  // aussieht wie ein Stilbruch statt wie ein Fehler.
  //
  // `grund` ist hier der KARTENGRUND, nicht der Schiefer dahinter: mit ihm
  // werden die Punkte auf den Kurven ausgestanzt, und ein Loch in der Farbe
  // der Tafel läge neben der Karte, auf der es sitzt.
  // `stark` ist HELL — der Wisch, der eine Säule hinterlegt, muss auf
  // Schiefer aufhellen, nicht abdunkeln. Der Tooltip dreht sich mit um:
  // drüben Papier auf Tinte, hier ein Kreidezettel auf Schiefer.
  // ==========================================================================
  Bilder.aufsetzen({
    /* Die durch den Sechs-Prüfungen-Lauf gezogene Kreide-Reihe. Die alte
       (`#8fc9a6 #e8c766 #d9705f #94c8ea #a1519e`) fiel durch: Grün↔Gelb lagen
       auch für Normalsichtige zu nah beieinander, drei der fünf standen
       außerhalb des Helligkeitsbands.

       Die ORDNUNG ist die von `bilder.js` — Grün, Gelb, Rot, Blau, Lila, und
       auf Platz 6 der Zurückhaltungston. Sie ist keine Geschmacksfrage: die
       Datei setzt darauf die Los-Ausgänge (`losFarbenSetzen`, abgesagt =
       Platz 3, offen = Platz 2). Wer Rot und Gelb tauscht, färbt „abgesagt"
       gelb und „offen" rot. */
    reihe:      ['#399c69', '#b29126', '#b15041', '#4c9bcb', '#994d96', '#8a938f'],
    /* Und die Reihe für die MENSCHEN, getrennt von der für die Rollen: eine
       Kreide je Melder, dieselbe an seiner Kurve, an seinem Bogen im Rad und
       an seiner Karte in der Runde unten. Welchen Platz jemand hat, sagt der
       Worker (`farbe`, siehe migrations/0028) — und hier ist es einstellbar.

       SIEBEN UND NICHT SECHS: sieben Angemeldete auf sechs Farben hießen,
       dass sich immer ein Paar eine teilt. Und nicht acht, weil der
       Kreidebereich auf Schiefer nicht mehr hergibt (Begründung und Messwerte
       stehen an `MENSCHEN` in `index.html`). Wer die Reihe ändert, ändert sie
       an allen vier Stellen (hier, `statistik.html`, die Vorgabe in
       `bilder.js`, `MENSCHEN` in `index.html`) — und die Zahl sieben steht im
       Worker als `FARBEN`, der damit die Wahl prüft. */
    menschen:   ['#d153a2', '#be4523', '#c18705', '#017a16',
                 '#39ac6f', '#1d9af0', '#6956c2'],
    /* Und der Platz DAHINTER: der Regenbogen (Schema 29). Er steht auch hier,
       seit er eine Farbwahl unter den Kreiden ist — wer ihn heute trägt,
       trägt ihn auf jedem Blatt, und ein Melder, der in der Statistik der
       Runde bunt und im Kontor grün wäre, machte aus zwei Ansichten zwei
       Wahrheiten. Dieselben sechs wie in `--pride` weiter oben, die dort die
       Pille im Protokoll und den Punkt in der Farbreihe färben. */
    stolz:      ['#ca4638', '#d77500', '#a29600',
                 '#129231', '#4273dd', '#a551b6'],
    linie:      '#ffffff33',
    text:       '#cfd6cd',
    textWeg:    '#93a09a',
    grund:      '#2d3335',
    stark:      '#eef1ea',
    karteGrund: '#ffffff08',
    karteRand:  '#ffffff22',
    titel:      '#cfd6cd',
    tippGrund:  '#eef1ea',
    tippText:   '#4a5450',
    tippKopf:   '#1b2220',
    tippStrich: '#00000022',
    /* Der Fokusrahmen ist ausdrücklich KEINE Serienfarbe: ein Rahmen in der
       Farbe einer Kurve läse sich wie eine Hervorhebung dieser Kurve. `--gelb`
       ist auf beiden Seiten der Ton für Bedienung statt Daten (hier die Marke
       „du", drüben der aktive Zeitraum-Reiter). */
    ring:       '#e8c766',
    hand:       "'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive",
  });
  const REIHE = Bilder.reihe;


  // ==========================================================================
  // Zeichnen
  // ==========================================================================
  let stand = null;        // die letzte Antwort von /api/admin/nutzer
  let mich = null;         // /api/me — für das Neuzeichnen des Kopfes
  let letzteAmpel = null;  // die letzte Antwort von /api/health, dito
  let letzteStat = null;   // /api/admin/statistik — die Übersicht liest daraus
                           // die Jahre für den Rückblick

  function kopfZeichnen(kopf, ich, health, s) {
    $('wer').textContent = 'Angemeldet als ' + (ich.name || 'namenlos') + ' · ' + ich.email;
    const z = $('zahlen');
    z.textContent = '';
    /* `reihe` ist freiwillig: nur zwei der fünf Kacheln haben wirklich eine
       Zeitreihe hinter sich. „Davon aktiv" und „gesperrt" sind Zustände, kein
       Verlauf — dort eine Linie hinzumalen hieße, eine zu erfinden. */
    const kachel = (wert, was, warn, reihe, dazu) => {
      const d = el('div', 'zahl' + (warn ? ' warn' : ''));
      d.appendChild(el('b', null, zahl(wert)));
      d.appendChild(el('span', null, was));
      if (reihe && reihe.length > 1) {
        d.appendChild(Bilder.funke(reihe, warn ? REIHE[2] : REIHE[0]));
        if (dazu) d.appendChild(el('em', null, dazu));
      }
      z.appendChild(d);
    };

    const tage = (s && s.tage) || zeitraum;
    const seit = `in ${tage} Tagen`;

    /* Wieviele davon in diesem Zeitraum dazugekommen sind: `wachstum` ist
       kumuliert, also ist es die Differenz zum letzten Stand VOR der Grenze —
       nicht die Summe der Tage im Fenster, denn die Reihe hat nur Einträge an
       Tagen, an denen sich überhaupt jemand angemeldet hat. */
    const w = (s && s.wachstum) || [];
    const grenze = new Date(Date.now() - tage * 864e5).toISOString().slice(0, 10);
    const davor = w.filter(x => x.tag <= grenze).pop();
    const neu = w.length ? w[w.length - 1].n - (davor ? davor.n : 0) : 0;

    const mails = ((s && s.mails_je_tag) || []).map(x => x.n);
    const mailSumme = mails.reduce((a, n) => a + n, 0);

    kachel(kopf.melder, 'Melder', false, w.map(x => x.n),
      (neu > 0 ? '+' + zahl(neu) : 'keiner dazu') + ' ' + seit);
    kachel(kopf.aktiv, 'davon aktiv');
    kachel(kopf.gesperrt, 'gesperrt', kopf.gesperrt > 0);
    kachel(kopf.mails_24h, 'Mails, 24 h', false, mails, zahl(mailSumme) + ' ' + seit);
    if (kopf.mails_kaputt_24h) kachel(kopf.mails_kaputt_24h, 'davon kaputt', true);

    /* Die Ampel: was der Worker über sich selbst sagt. `admin` und
       `mail_geheim` stehen dort seit dieser Ausbaustufe — ohne sie käme
       niemand ins Kontor und trüge keine Mail einen Abmeldelink, und beides
       sähe von außen wie ein Fehler im Browser aus. */
    const a = $('ampel');
    a.textContent = '';
    const st = $('wurf');
    st.textContent = '';
    if (!health) {
      const s = el('span', 'egal', 'Zustand unbekannt');
      Bilder.tippAm(s, { titel: 'Zustand unbekannt', zeilen: [],
        fuss: '/api/health hat nicht geantwortet. Das ist die Ampel, nicht der Inhalt — '
            + 'die Zahlen daneben stimmen trotzdem.' });
      a.appendChild(s);
      return;
    }
    [['db', 'Datenbank'], ['mail', 'Mailversand'], ['admin', 'ADMIN_MAIL'],
     ['mail_geheim', 'MAIL_GEHEIM'], ['bilder', 'Bilder'], ['tafel', 'Verteiler']]
      .forEach(([k, titel]) => {
        const wert = String(health[k] ?? '');
        const gut = wert === 'ok' || wert === 'Schluessel liegt an';
        /* Die Pille bleibt kurz, der Wortlaut des Workers steht im Tooltip.
           Angehängt war er dreimal so lang wie die Pille selbst und schob die
           übrigen Lampen aus der Zeile. */
        const s = el('span', gut ? '' : 'aus', titel);
        Bilder.tippAm(s, {
          titel,
          zeilen: [{ farbe: gut ? REIHE[0] : REIHE[2], was: 'Antwort', wert: wert || '—' }],
        });
        a.appendChild(s);
      });

    /* ZWEI Stände, nicht einer. Der Worker stempelt sich beim Deploy selbst
       (--var, siehe CLAUDE.md, Ausrollen); die Seite liegt auf GitHub Pages
       und kommt am Worker nie vorbei, ihren Stand holt er bei GitHub
       (`seitenStand` in src/index.js). Die beiden gehen auseinander, sobald
       nur eines von beidem geworfen wurde — und genau das war die Frage, aus
       der diese Zeile entstand: ein Push der Seite ließ den einen Stempel
       stehen und sah aus, als sei nichts angekommen.

       Keine Ampel-Pille: das ist kein gut/schlecht am Dienst, sondern eine
       Auskunft. Aber auch nicht mehr stillschweigend weg, wenn nichts kommt —
       ein fehlender Stand sähe sonst aus wie ein Stand, der eben nicht
       weitergezählt hat. Fehlt er, steht rot da, warum. */
    const standZeile = (titel, version, wann, warum) => {
      /* Ein frisches <span> je Durchlauf, aus demselben Grund wie bei den
         Ampel-Pillen oben: `tippAm` haengt Listener an den Knoten, den man
         ihm gibt. Am bleibenden `#wurf` selbst haengten sie sich bei jedem
         `laden()` neu an und stapelten sich - irgendwann oeffnete Hovern
         uebers leere Div einen Tooltip, der zu keinem Text mehr gehoerte. */
      const fehlt = !version;
      const z = el('span', fehlt ? 'fehlt' : null,
        titel + ': ' + (fehlt ? 'unbekannt'
          : version + (wann ? ' · ' + datum(wann) : '')));
      Bilder.tippAm(z, {
        titel: 'Stand: ' + titel,
        zeilen: fehlt ? [{ farbe: REIHE[2], was: 'Grund', wert: warum || '—' }] : [
          { was: 'Version', wert: version },
          { was: wann ? 'Vom' : 'Deployt', wert: wann ? datum(wann) : '—' },
        ],
        fuss: warum,
      });
      st.appendChild(z);
    };

    /* Der Worker ohne Stempel ist KEIN Fehler: so läuft er lokal unter
       `wrangler dev`, wo es keine --var gibt. Darum bleibt seine Zeile in dem
       Fall ganz weg, statt rot zu werden — anders als die der Seite, die der
       Worker immer beantworten kann, und sei es mit einem Grund. */
    if (health.version) standZeile('Worker', health.version, health.deployed_at);
    standZeile('Seite', health.seite_version, health.seite_deployed_at,
      health.seite_stand && health.seite_stand !== 'ok' ? health.seite_stand
        : 'Letzter Commit auf main, bei GitHub erfragt.');
  }

  /* Der Filter über der Runde. Er steht erst da, seit die Runde wächst: bei
     drei Karten ist er Verwaltung von Verwaltung, ab einem Dutzend sucht man
     den einen Gesperrten sonst mit den Augen. Die Zahl in der Pille sagt, was
     einen erwartet — ein Reiter, der auf eine leere Liste führt, ist eine
     Falle. Leere Reiter stehen deshalb gar nicht erst da. */
  const SIEBE = {
    alle:     { titel: 'alle',     passt: () => true },
    aktiv:    { titel: 'aktiv',    passt: u => !u.gesperrt && !u.entfernt },
    gesperrt: { titel: 'gesperrt', passt: u => !!u.gesperrt },
    entfernt: { titel: 'entfernt', passt: u => !!u.entfernt },
  };
  let sieb = 'alle';

  /* Das Suchwort. Es filtert ZUSÄTZLICH zum Sieb und ruft nichts nach: die
     ganze Runde liegt seit `laden()` da, und ein Abruf je Tastendruck wäre
     eine Anfrage pro Buchstabe für eine Liste, die in den Speicher passt.

     Name ODER Adresse, weil man mal das eine und mal das andere im Kopf hat —
     und ohne Groß/Klein, weil niemand „Micha" tippt, wenn er sucht. */
  let suchwort = '';
  $('suche').addEventListener('input', ev => {
    suchwort = ev.target.value.trim().toLowerCase();
    if (stand) runde(stand.nutzer);
  });

  const passtZurSuche = u => !suchwort
    || (u.name + ' ' + (u.email || '')).toLowerCase().includes(suchwort);

  function filterZeichnen(nutzer) {
    const ziel = $('filter');
    ziel.textContent = '';
    /* Die Zahlen an den Sieben zählen die GANZE Runde, nicht das Suchergebnis:
       ein Sieb, dessen Zahl beim Tippen mitwandert, sieht aus, als hätte sich
       die Runde geändert. Was das Suchwort übrig lässt, steht darunter. */
    const sichtbar = Object.entries(SIEBE)
      .map(([k, v]) => [k, v, nutzer.filter(v.passt).length])
      .filter(([k, , n]) => n > 0 || k === 'alle');
    // Ein einziger Reiter ist kein Filter, sondern eine Beschriftung.
    if (sichtbar.length < 2) return;
    ziel.appendChild(el('span', 'wozu', 'filter'));
    sichtbar.forEach(([k, v, n]) => {
      const b = el('button', k === sieb ? 'an' : null, v.titel);
      b.type = 'button';
      b.appendChild(el('i', null, String(n)));
      b.addEventListener('click', () => {
        sieb = k;
        runde(stand.nutzer);
      });
      ziel.appendChild(b);
    });
  }

  function runde(nutzer) {
    const ziel = $('runde');
    ziel.textContent = '';
    filterZeichnen(nutzer);
    stolzRegelZeichnen(nutzer);
    nutzer.filter(u => SIEBE[sieb].passt(u) && passtZurSuche(u)).forEach(u => {
      const k = el('div', 'karte'
        + (u.gesperrt ? ' gesperrt' : '') + (u.entfernt ? ' weg' : ''));

      const kopf = el('div', 'k-kopf');
      // Der erste Buchstabe des Namens. `Array.from`, nicht `[0]`: ein Name
      // darf mit einem Zeichen anfangen, das aus zwei Codeeinheiten besteht.
      const mono = el('span', 'k-mono',
        (Array.from(u.name || '?')[0] || '?').toUpperCase());
      /* Das Monogramm trägt seine Kreide — dieselbe wie seine Kurve in den
         Bildern oben und sein Bogen am Rad. Damit ist die Farbe an der Stelle
         zu sehen, an der man sie ändert, und nicht bloß eine Zahl in einer
         Antwort.

         WER HEUTE DEN REGENBOGEN TRÄGT, trägt ihn auch hier — dieselbe Farbe
         auf jedem Blatt, das ist der ganze Punkt. Er steht aber in einem
         EIGENEN Feld (`stolz_heute`) und nicht als Platz 7 in `u.farbe`:
         darunter muss die Kreide sichtbar bleiben, die er gewählt hat und auf
         die er zurückfällt, sobald es den Nächsten trifft. In `u.farbe` steht
         darum immer ein Platz 0..6, und der Rest durch sieben ist sicher —
         eine 7 hier wäre nicht bunt, sondern der ERSTE Mensch. */
      const kreide = MENSCHEN[u.farbe % MENSCHEN.length];
      if (u.stolz_heute) {
        mono.style.background = 'var(--pride)';
      } else if (u.stolz) {
        /* Gewählt, heute nicht dran: Ring außen, Kreide innen. Der Ton steht
           zweimal im Verlauf, weil ein `linear-gradient` die einzige Art ist,
           eine FLÄCHE in die Ebene `padding-box` zu legen — eine schlichte
           Farbe kann dort nicht neben einem zweiten Hintergrund stehen. */
        mono.classList.add('im-kreis');
        mono.style.background =
          `linear-gradient(${kreide}, ${kreide}) padding-box, var(--pride) border-box`;
      } else {
        mono.style.background = kreide;
      }
      kopf.appendChild(mono);
      kopf.appendChild(el('span', 'k-name', u.name || 'Ehemaliger'));
      if (u.rolle === 'admin') kopf.appendChild(el('span', 'marke admin', 'Admin'));
      if (u.gemessen) kopf.appendChild(el('span', 'marke', 'gemessen'));
      if (u.ich) kopf.appendChild(el('span', 'marke ich', 'du'));
      if (u.gesperrt) kopf.appendChild(el('span', 'marke rot', 'gesperrt'));
      if (u.entfernt) kopf.appendChild(el('span', 'marke', 'entfernt'));
      if (u.stumm) kopf.appendChild(el('span', 'marke', 'stumm'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', u.email || (u.gemessen
        ? 'kein Postfach — meldet aus der Wohnung'
        : 'keine Adresse mehr')));

      if (u.gesperrt) {
        k.appendChild(el('p', 'k-grund',
          (u.gesperrt.grund || 'Ohne Grund gesperrt.')
          + ' — ' + u.gesperrt.von + ', ' + datum(u.gesperrt.seit)));
      }

      const zahlen = el('div', 'k-zahlen');
      const feld = (was, wert) => {
        const d = el('div');
        d.appendChild(el('span', null, was));
        d.appendChild(document.createTextNode(wert));
        zahlen.appendChild(d);
      };
      feld('Geräte', zahl(u.geraete));
      feld('Meldungen', zahl(u.meldungen));
      feld('zuletzt', u.zuletzt ? nurTag(u.zuletzt) : '—');
      feld('Kommentare', zahl(u.kommentare));
      feld('Gastgeber', zahl(u.gastgeber));
      feld('bewertet von', zahl(u.bewertet));
      k.appendChild(zahlen);

      if (!u.entfernt) k.appendChild(knoepfe(u));
      ziel.appendChild(k);
    });
    /* Ein leeres Raster sieht aus wie ein Ladefehler. Der Satz sagt beides,
       Sieb UND Suchwort — wer das eine vergisst, sucht sonst den Fehler beim
       anderen. */
    if (!ziel.children.length) {
      ziel.appendChild(el('p', 'leer-hinweis', suchwort
        ? 'Niemand passt auf Sieb und Suchwort.'
        : 'Hier steht gerade niemand.'));
    }
  }

  /* --- Die Regel über der Regenbogenvergabe (Schema 29) ---------------------

     ZWEI GRIFFE, UND SIE SIND NICHT DASSELBE: hier steht, OB überhaupt
     gelost wird; in der Farbreihe jeder Karte steht, wer ihn GEWÄHLT hat.
     „Niemand hat ihn gewählt" und „die Vergabe ruht" sehen von außen gleich
     aus — das eine löscht die Auswahl, das andere legt sie schlafen, und wer
     im Advent abschaltet, will im Juni nicht daneben aufgeschrieben haben,
     wer vorher drin war.

     Die Form ist die des Siebs darüber: ein Wörtchen, dann die Wahl. An/Aus
     als ZWEI Knöpfe und nicht als einer, der sich umbeschriftet — bei einem
     einzigen liest die Hälfte der Leute die Aufschrift als Zustand und die
     andere als Handlung.

     Der Satz dahinter ist die Auskunft, die ein Verbot ersetzt: eine
     eingeschaltete Vergabe ohne einen einzigen im Kreis tut nichts, und das
     soll dastehen, statt dass jemand die Tafel sucht. */
  function stolzRegelZeichnen(nutzer) {
    const reihe = $('stolz-regel');
    reihe.textContent = '';
    if (!stand) return;
    const an = !!stand.kopf.stolz_aktiv;
    /* Dieselbe Regel wie im Worker (`stolzTraeger`): entfernt fällt raus, ohne
       Namen auch — wer nie einen gesetzt hat, ist niemand, den man färben
       könnte. Zählte diese Zeile ihn mit, stünde hier „einer aus 3", während
       nur zwei drankommen können. */
    const kreis = (nutzer || []).filter(u => !u.entfernt && u.name && u.stolz);

    reihe.appendChild(el('span', 'wozu', 'regenbogen'));
    [[true, 'an'], [false, 'aus']].forEach(([wert, wort]) => {
      const b = el('button', wert === an ? 'an' : null, wort);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(wert === an));
      if (wert !== an) b.addEventListener('click', () => stolzRegelSchalten(wert));
      reihe.appendChild(b);
    });

    /* Der Satz nennt, WER ihn heute trägt — die Frage, die man an dieser
       Zeile wirklich hat. „Täglich einer aus zwei" beantwortet sie nicht, und
       an den Karten nachzusehen heißt scrollen. */
    const heute = kreis.find(u => u.stolz_heute);
    const satz = el('span', 'satz');
    satz.textContent = !an
      ? 'ruht — alle schreiben in ihrer Farbe'
      : !kreis.length
        ? 'niemand hat ihn gewählt — die Vergabe läuft leer'
        /* Bei EINEM im Kreis wird nichts ausgelost, und „heute Brunx" würde
           behaupten, dass es morgen jemand anderes sein könnte. */
        : kreis.length === 1
          ? `immer ${kreis[0].name} — allein im Kreis`
          : (heute ? `heute ${heute.name}` : 'heute niemand')
            + ` — einer aus ${kreis.length}`;
    reihe.appendChild(satz);

    /* Weiterdrehen — der Griff, der die Wahl bewegt, ohne auf die Tagesgrenze
       zu warten (04:00 Ortszeit, siehe `bierTag()`). EINEN Schritt durch den
       Kreis, nicht neu würfeln: bei zweien fiele ein echter Wurf in der
       Hälfte der Fälle wieder auf denselben, und ein Knopf, der sichtbar
       nichts tut, sieht kaputt aus.

       Er steht nur da, wenn es etwas zu drehen GIBT: bei ruhender Vergabe
       oder einem einzigen im Kreis wäre er ein Knopf ohne Wirkung. */
    if (an && kreis.length > 1) {
      /* Ein Zeichen, kein Wort — und ein SCHRIFTZEICHEN, kein Emoji: dieselbe
         Regel wie bei den Zeichen im Protokoll. Ein 🎲 käme aus einer fremden
         Schrift, wäre bunt und säße auf Schiefer wie ein Aufkleber. Das
         `︎` dahinter sagt den Systemen, die es trotzdem in Farbe hätten,
         ausdrücklich „als Text".

         GEZEICHNET UND NICHT GESETZT. Erst stand hier das Schriftzeichen
         `↻` (U+21BB), und es saß in der Pille zu hoch. Das war kein
         Einstellungsfehler, sondern die Sache selbst: eine Schrift setzt ein
         Zeichen auf die GRUNDLINIE, nicht in die Mitte seines Kastens, und
         wie weit seine Tinte darüber steht, entscheidet die Schrift — im
         Zweifel eine Ersatzschrift, die je nach Browser eine andere ist. Ein
         Nachschieben um „0,6 px" gilt dann genau in einem Browser.

         Als Form gibt es das Problem nicht: der Bogen ist in seinem
         Sichtfeld mittig gerechnet, und `align-items: center` setzt das
         Sichtfeld in die Pille. Damit sitzt er überall mittig, in jedem
         Browser und ohne eine einzige Korrekturzahl.

         Was er ZEIGT, bleibt der Kreispfeil: eine Runde weiter, kein neuer
         Wurf. Die durchprobierten Schriftzeichen stehen weiter in
         `ideas/pruefungen/wuerfel-kandidaten.html`.

         Ohne Aufschrift braucht der Knopf einen Namen für den Vorleser, und
         der nennt den Mechanismus: einen Schritt weiter. */
      const b = el('button', 'dreh');
      b.appendChild(drehZeichen());
      b.type = 'button';
      b.title = 'Einen Schritt weiter durch den Kreis — bis zur Tagesgrenze '
              + 'bliebe es sonst, wie es ist';
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', stolzWeiter);
      reihe.appendChild(b);
    }
  }

  async function stolzRegelSchalten(aktiv) {
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/stolz', { aktiv });
      await laden();
      sagt('runde-sagt', aktiv
        ? 'Der Regenbogen wird wieder täglich vergeben.'
        : 'Der Regenbogen ruht. Wer im Kreis steht, bleibt gemerkt.');
    } catch (e) {
      sagt('runde-sagt', e.message, true);
    }
  }

  /* Der Kreispfeil als FORM. Sichtfeld 24 × 24, Kreis um (12|12) mit Radius
     8: ein Bogen von 45° im Uhrzeigersinn über 270° bis 315°, die Lücke
     liegt rechts, und dort sitzt die Spitze — sie zeigt in die Richtung, in
     die der Bogen läuft.

     DIE ZAHLEN SIND GERECHNET, nicht abgeschrieben: Endpunkt (17,66|17,66)
     und (17,66|6,34) sind r·cos/sin von 45° und 315°, die Spitze steht auf
     der Tangente am Ende. Senkrecht spannt die Tinte damit von y 3 bis y 21
     — mittig im Sichtfeld, und genau darum geht es hier.

     `currentColor` an Strich und Fläche: der Knopf hellt beim Überfahren auf
     (`button:hover`), und der Pfeil geht mit. Eine feste Farbe bliebe beim
     Aufhellen zurück. */
  function drehZeichen() {
    const svg = s_el('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    svg.appendChild(s_el('path', {
      class: 'dreh-bogen', d: 'M17.66,17.66 A8,8 0 1,1 17.66,6.34',
    }));
    svg.appendChild(s_el('path', {
      class: 'dreh-spitze', d: 'M15.82,8.18 L20.63,9.31 L19.50,4.50 Z',
    }));
    return svg;
  }

  /* Der neue Träger steht danach in der frisch geladenen Runde — die Antwort
     der Route schickt zwar seine Id mit, aber den NAMEN dazu hat erst
     `stand`, und zwei Wege zu derselben Auskunft laufen früher oder später
     auseinander. */
  async function stolzWeiter() {
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/stolz', { weiter: true });
      await laden();
      const jetzt = stand.nutzer.find(u => u.stolz_heute);
      sagt('runde-sagt', jetzt
        ? `Weitergedreht — ${jetzt.name} trägt ihn jetzt.`
        : 'Weitergedreht.');
    } catch (e) {
      sagt('runde-sagt', e.message, true);
    }
  }

  async function stolzSetzen(u) {
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion: 'stolz' });
      await laden();
      sagt('runde-sagt', u.stolz
        ? `${u.name} schreibt wieder nur in seiner Farbe.`
        : `${u.name} hat den Regenbogen dazugewählt — getragen wird er immer `
          + 'nur von einem, bis dahin gilt die Farbe daneben.');
    } catch (e) {
      sagt('runde-sagt', e.message, true);
    }
  }

  /* Jede zerstörende Handlung fragt zurück — als zweiter Klick auf denselben
     Knopf, mit dem Namen im Satz darüber. Kein confirm(): der Systemdialog
     reißt einen aus dem Blatt, und man klickt ihn weg, ohne ihn zu lesen. */
  let sicher = null;   // 'id:aktion', solange die Rückfrage steht
  let sicherUhr = null;
  /* Wessen Kreidereihe gerade offen steht. Kein `sicher`: das Umfärben ist
     keine zerstörende Handlung, die einen zweiten Klick bräuchte — der Knopf
     klappt nur auf, was danach kommt, wirkt sofort und lässt sich ebenso
     sofort zurücknehmen. Immer nur eine Karte, sonst steht das Kontor nach
     drei Klicks voll Farbkästen. */
  let farbeOffen = null;

  /* Die sieben Kreiden, wortgleich mit der `menschen`-Reihe an
     `Bilder.aufsetzen` oben — beide Fassungen stehen absichtlich in derselben
     Datei zwei Bildschirme auseinander, weil die eine die Bilder färbt und
     die andere die Punkte im Bedienteil. Über `Bilder` ginge es auch, aber
     dann hinge das Kontor für eine Reihe von sieben Zeichenketten an einer
     fremden Datei. */
  const MENSCHEN = ['#d153a2', '#be4523', '#c18705', '#017a16',
                    '#39ac6f', '#1d9af0', '#6956c2'];

  function knoepfe(u) {
    const zeile = el('div', 'k-tat');
    const tat = (aktion, wort, zerstoerend) => {
      const b = el('button', null, wort);
      const schluessel = u.id + ':' + aktion;
      if (sicher === schluessel) { b.className = 'sicher'; b.textContent = 'wirklich?'; }
      b.addEventListener('click', () => handeln(u, aktion, schluessel, zerstoerend));
      zeile.appendChild(b);
    };

    if (u.gesperrt) tat('entsperren', 'entsperren', false);
    else if (!u.ich) tat('sperren', 'sperren', true);

    if (!u.ich && !u.gemessen) {
      tat('rolle', u.rolle === 'admin' ? 'zu User machen' : 'zu Admin machen', true);
      tat('entfernen', 'entfernen', true);
    }

    /* Die Kreide, an jeder Karte — auch an der eigenen. Sie war der Anlass für
       die ganze Spalte, und sie ist die einzige Handlung hier, die man mit
       sich selbst machen darf: eine Farbe kann niemanden aussperren. */
    const auf = el('button', farbeOffen === u.id ? 'offen' : null, 'Farbe');
    auf.setAttribute('aria-expanded', String(farbeOffen === u.id));
    auf.type = 'button';
    auf.addEventListener('click', () => {
      farbeOffen = farbeOffen === u.id ? null : u.id;
      runde(stand.nutzer);
    });
    zeile.appendChild(auf);

    // Das Feld für den Sperrgrund steht erst da, wenn die Rückfrage steht:
    // vorher wäre es ein leeres Kästchen an jeder Karte.
    if (sicher === u.id + ':sperren') {
      const f = el('input');
      f.type = 'text';
      f.id = 'grund-' + u.id;
      f.maxLength = 120;
      f.placeholder = 'Grund (freiwillig, er liest ihn)';
      f.style.marginTop = '6px';
      zeile.appendChild(f);
      setTimeout(() => f.focus(), 0);
    }

    if (farbeOffen === u.id) zeile.appendChild(farbreihe(u));
    return zeile;
  }

  /* Die sieben Kreiden, der Regenbogen und „automatisch". Jeder Druck wirkt
     sofort — es gibt nichts zu bestätigen, und wer sich vertut, drückt
     daneben.

     Ein Punkt darf mehrfach vergeben sein: sonst ließe sich kein Tausch
     machen, ohne einen der beiden erst auf einen dritten Platz zu schieben.
     Wer schon auf dieser Kreide sitzt, steht als Name darunter — das ist die
     Auskunft, die ein Verbot ersetzt.

     DER REGENBOGEN STEHT NEBEN DEN KREIDEN UND NICHT STATT EINER. Er ist eine
     Farbwahl wie die anderen — deshalb steht er hier und nicht als eigener
     Knopf in der Zeile darüber —, aber er ersetzt die Kreide nicht: er wird
     immer nur von EINEM zugleich getragen, und die anderen aus dem Kreis
     schreiben so lange in ihrer eigenen. Darum bleibt der gewählte Punkt
     daneben gedrückt; er ist die Farbe, auf die man zurückfällt, sobald es
     den Nächsten trifft. */
  function farbreihe(u) {
    const reihe = el('div', 'k-farben');
    MENSCHEN.forEach((ton, i) => {
      const b = el('button');
      b.type = 'button';
      b.style.background = ton;
      b.setAttribute('aria-pressed', String(u.farbe === i));
      const auch = stand.nutzer
        .filter(a => a.id !== u.id && !a.entfernt && a.farbe === i)
        .map(a => a.name);
      b.title = auch.length ? 'Farbe ' + (i + 1) + ' — auch ' + auch.join(', ')
        : 'Farbe ' + (i + 1);
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => farbeSetzen(u, i));
      reihe.appendChild(b);
    });
    /* Der achte Punkt: der Regenbogen. Er trägt die sechs Töne selbst — ein
       Punkt, der eine Farbe meint, muss sie zeigen, sonst ist er ein Rätsel
       neben sieben Antworten. Sein Titel sagt, was das Drücken bedeutet:
       gewählt heißt „kann drankommen", nicht „ist heute dran". */
    const stolz = el('button', 'stolz');
    stolz.type = 'button';
    stolz.setAttribute('aria-pressed', String(!!u.stolz));
    stolz.title = u.stolz_heute
      ? 'Trägt den Regenbogen heute'
      : u.stolz
        ? 'Im Kreis — kann täglich drankommen; bis dahin gilt der Punkt daneben'
        : 'Den Regenbogen dazuwählen — getragen wird er immer nur von einem';
    stolz.setAttribute('aria-label', stolz.title);
    stolz.addEventListener('click', () => stolzSetzen(u));
    reihe.appendChild(stolz);

    /* Zurück auf die Anmeldereihenfolge. Steht nur da, wenn es etwas
       zurückzunehmen GIBT — an einer Karte ohne Wahl wäre es ein Knopf, der
       nichts tut. */
    if (u.farbe_gewaehlt) {
      const a = el('button', 'auto', 'automatisch');
      a.type = 'button';
      a.title = 'Wieder die Farbe aus der Anmeldereihenfolge';
      a.addEventListener('click', () => farbeSetzen(u, null));
      reihe.appendChild(a);
    }
    return reihe;
  }

  async function farbeSetzen(u, platz) {
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion: 'farbe', farbe: platz });
      await laden();
      sagt('runde-sagt', platz === null
        ? `${u.name} bekommt seine Farbe wieder aus der Anmeldereihenfolge.`
        : `${u.name} schreibt jetzt mit Farbe ${platz + 1}.`);
    } catch (e) {
      sagt('runde-sagt', e.message, true);
    }
  }

  async function handeln(u, aktion, schluessel, zerstoerend) {
    if (zerstoerend && sicher !== schluessel) {
      sicher = schluessel;
      clearTimeout(sicherUhr);
      // Die Rückfrage verfällt von selbst: ein „wirklich?" das eine Stunde
      // stehen bleibt, wird irgendwann versehentlich getroffen.
      sicherUhr = setTimeout(() => {
        sicher = null;
        runde(stand.nutzer);
        // Der Satz muss mit weg. Bleibt er stehen, während die Knöpfe schon
        // wieder harmlos aussehen, liest man ihn als Zustand statt als Frage.
        sagt('runde-sagt', '');
      }, 8000);
      runde(stand.nutzer);
      sagt('runde-sagt', worte(u, aktion));
      return;
    }
    const grundFeld = $('grund-' + u.id);
    const grund = grundFeld ? grundFeld.value : '';
    sicher = null;
    clearTimeout(sicherUhr);
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion, grund });
      await laden();
      sagt('runde-sagt', getan(u, aktion));
    } catch (e) {
      runde(stand.nutzer);
      sagt('runde-sagt', e.message, true);
    }
  }

  const worte = (u, aktion) => ({
    sperren: `${u.name} sperren? Er sieht die Tafel weiter, kann aber nichts mehr `
           + 'eintragen und fällt aus dem Rad.',
    rolle: u.rolle === 'admin'
      ? `${u.name} die Adminrechte nehmen?`
      : `${u.name} zum Admin machen? Er sieht dann alle Adressen und kann sperren.`,
    entfernen: `${u.name} entfernen? Name und Adresse verschwinden, seine Beiträge `
             + 'bleiben als „Ehemaliger" stehen. Zurückholen geht nicht.',
  }[aktion] || '');

  const getan = (u, aktion) => ({
    sperren: `${u.name} ist gesperrt.`,
    entsperren: `${u.name} darf wieder.`,
    rolle: `Die Rolle von ${u.name} ist getauscht.`,
    entfernen: `${u.name} ist entfernt. Die Beiträge stehen als „Ehemaliger" da.`,
  }[aktion] || 'Erledigt.');

  /* Der Zeitraum. Dieselbe Liste wie im Worker — sie steht an zwei Stellen,
     weil die Seite die Reiter zeichnen muss, bevor sie eine Antwort hat. Der
     Worker prüft trotzdem selbst: was von hier kommt, ist ein Wunsch, keine
     Erlaubnis. Was er tatsächlich genommen hat, sagt er in `tage` zurück, und
     danach richten sich die Überschriften.

     Die Wahl überlebt das Neuladen — wer sich für 90 Tage entschieden hat,
     will nicht bei jedem Aufschlagen wieder klicken. */
  const STAT_TAGE = [30, 60, 90];
  const ZEITRAUM_SPEICHER = 'beerstock-kontor-tage';
  let zeitraum = (() => {
    try {
      const g = Number(localStorage.getItem(ZEITRAUM_SPEICHER));
      return STAT_TAGE.includes(g) ? g : STAT_TAGE[0];
    } catch { return STAT_TAGE[0]; }
  })();

  function zeitraumZeichnen() {
    const ziel = $('zeitraum');
    ziel.textContent = '';
    ziel.appendChild(el('span', 'wozu', 'Zeitraum'));
    STAT_TAGE.forEach(t => {
      const b = el('button', t === zeitraum ? 'an' : null, t + ' Tage');
      b.type = 'button';
      b.addEventListener('click', () => zeitraumWechseln(t));
      ziel.appendChild(b);
    });
  }

  async function zeitraumWechseln(t) {
    if (t === zeitraum) return;
    zeitraum = t;
    try { localStorage.setItem(ZEITRAUM_SPEICHER, String(t)); } catch {}
    zeitraumZeichnen();
    /* Die alten Bilder bleiben blass stehen, statt zu verschwinden: ein
       Abschnitt, der beim Umschalten leer wird und dann wieder aufpoppt,
       springt — und die neuen Bilder stehen ohnehin an derselben Stelle. */
    const ziel = $('bilder');
    ziel.style.opacity = '.35';
    try {
      const s = await ruf('/api/admin/statistik?tage=' + t);
      statistik(s);
      // Der Kopf hängt mit dran: „+2 in 30 Tagen" unter der Melderzahl wäre
      // sonst der Satz zum vorigen Zeitraum.
      if (stand && mich) kopfZeichnen(stand.kopf, mich, letzteAmpel, s);
      /* Die Querverweise NICHT: das einzige, was sie aus der Statistik ziehen,
         sind die Jahre für den Rückblick, und `wachstum` läuft über die ganze
         Geschichte statt über das Fenster (Abfrage 6 im Worker, ohne
         Zeitgrenze). Sie stünden nach dem Neuzeichnen wortgleich da. Wer hier
         je etwas Fensterabhängiges hineinschreibt, muss `querZeichnen`
         mitnehmen — die Protokollzeilen dafür lägen dann allerdings auch nicht
         mehr vor. */
    } catch (e) {
      sagt('stat-sagt', 'Der Zeitraum ließ sich nicht wechseln: ' + e.message, true);
    } finally {
      ziel.style.opacity = '';
    }
  }

  function statistik(s) {
    letzteStat = s;
    zeitraumZeichnen();
    const ziel = $('bilder');
    ziel.textContent = '';
    /* Der Zeitraum steht in jeder einzelnen Überschrift, nicht nur oben am
       Schalter — und bei den beiden Ranglisten steht „insgesamt". Sie folgen
       dem Schalter absichtlich nicht (der Worker begründet es an der Route):
       wer der Gastgeber dieser Runde ist, beantworten 30 Tage nicht. Ohne das
       Wort in der Überschrift müsste man das raten. */
    // `s.tage` kommt vom Worker, `zeitraum` ist der Wunsch von hier. Der
    // Rückfall ist nicht theoretisch: zwischen Seiten-Push und Worker-Deploy
    // liegen Minuten, in denen die neue Seite die alte Antwort bekommt.
    const fenster = ', ' + (s.tage || zeitraum) + ' Tage';

    /* Elf Bilder in einem Raster sind eine Halde: man sucht das eine, das man
       wollte, und liest zehn Überschriften. In drei benannten Gruppen sucht
       man erst die Gruppe. Die Namen sind keine Kategorien der Datenbank,
       sondern die drei Fragen, mit denen man hierherkommt: was macht der
       Kühlschrank, was macht die Runde, was macht der Betrieb. */
    const gruppe = (name, ...bilder) => {
      ziel.appendChild(el('div', 'gruppe', name));
      const g = el('div', 'bilder');
      bilder.forEach(b => g.appendChild(b));
      ziel.appendChild(g);
    };

    gruppe('Der Kühlschrank',
      Bilder.flaeche('Meldungen je Tag' + fenster,
        s.meldungen, z => z.n, z => nurTag(z.tag), 'Meldungen'),
      Bilder.schar('Bestand je Melder' + fenster, s.bestand),
      // Direkt hinter dem Bestand: beide Kurven kommen aus derselben Meldung,
      // und nebeneinander sieht man, ob der Kühlschrank mit dem Nachlegen
      // hochgeht. `|| []` — die alte Antwort kennt das Feld noch nicht.
      Bilder.grad('Temperatur je Melder' + fenster, s.grad || []));

    gruppe('Runde & Rad',
      Bilder.liegend('Wer war wie oft Gastgeber, insgesamt',
        s.gastgeber, z => z.name, z => z.n, 'Abende'),
      // `|| []` — die alte Antwort kennt das Feld noch nicht.
      Bilder.liegend('Wer wie oft einen Notruf abgesetzt hat, insgesamt',
        s.notrufe || [], z => z.name, z => z.n, 'Notrufe'),
      Bilder.band('Ausgang der Ziehungen, insgesamt', s.lose),
      Bilder.losJeMelder('Ausgang der Ziehungen je Melder, insgesamt',
        s.lose_je_melder || []));

    /* Die Farbe kommt weiter von HIER und nicht vom Worker: der kennt die
       Palette des Kontors nicht. Was er seit Schema 28 mitschickt, ist der
       PLATZ (`farbe`) — und den übersetzt diese Zeile, damit ein Nutzer in
       der Säule dieselbe Kreide trägt wie in seiner Kurve und an seiner
       Karte. Die Reihenfolge (meistbeschäftigt zuerst) bleibt, sie ordnet
       jetzt nur noch die Säulen und nicht mehr die Farben.

       Platz 7 ist der Regenbogen (Schema 29) und darf NICHT durch den Rest —
       er käme als Kreide des ersten Menschen wieder heraus. Statt eines
       Farbwerts geht dafür der Name `'stolz'` weiter; `bilder.js` macht
       daraus, was der Ort braucht (im SVG einen Verweis, im Tooltip einen
       CSS-Verlauf). */
    const aufrufeReihen = (s.aufrufe_nutzer_reihen || [])
      .map((r, i) => ({ ...r, farbe: r.farbe === 7
        ? 'stolz' : MENSCHEN[(r.farbe ?? i) % MENSCHEN.length] }));

    gruppe('Betrieb & Post',
      Bilder.saeulen('Betrieb je Woche' + fenster, s.betrieb, [
        { feld: 'kommentare', titel: 'Kommentare', farbe: REIHE[0] },
        { feld: 'reaktionen', titel: 'Reaktionen', farbe: REIHE[1] },
        { feld: 'sterne',     titel: 'Sterne',     farbe: REIHE[3] },
      ], g => 'KW ' + String(g.woche).slice(-2)),
      Bilder.saeulen('Mails je Art' + fenster, s.mails, [
        { feld: 'n',      titel: 'verschickt', farbe: REIHE[0] },
        // Platz 3 ist das Rot der Reihe. Nicht Platz 2 — das ist das Gelb,
        // und eine Mail, die nicht rausging, ist kein halber Erfolg.
        { feld: 'kaputt', titel: 'ging nicht raus', farbe: REIHE[2] },
      ], g => g.art.replace(/_/g, ' ')),
      /* Das Klopfen bekommt ein EIGENES Bild und keine dritte Säule im
         Mail-Diagramm. Die beiden Zahlen sehen vergleichbar aus und sind es
         nicht: eine Mail geht an eine Adresse, ein Push an jedes Gerät — wer
         die Tafel auf Handy und Rechner liegen hat, zählt zweimal. Nebenan
         gestellt lüde das zu einem Vergleich ein, den die Achse nicht
         hergibt. */
      Bilder.saeulen('Push je Art' + fenster, s.pushs || [], [
        { feld: 'n',      titel: 'angestoßene Geräte', farbe: REIHE[0] },
        { feld: 'kaputt', titel: 'nicht zugestellt',   farbe: REIHE[2] },
      ], g => g.art.replace(/_/g, ' ')),
      Bilder.saeulen('Seitenaufrufe je Tag, nach Nutzer' + fenster,
        s.aufrufe_je_tag || [], aufrufeReihen, g => nurTag(g.tag)),
      Bilder.liegend('Seitenaufrufe je Nutzer, insgesamt',
        s.aufrufe_je_nutzer || [], z => z.name, z => z.n, 'Aufrufe'));

    /* Jedes Bild bekommt seine Überschrift als Namen. `role="img"` ohne
       Beschriftung ist für einen Screenreader ein leeres Bild — und seit die
       Bilder ein Tabstop sind, landet man dort auch tatsächlich. An einer
       Stelle für alle sechs, statt sechsmal dasselbe Attribut. */
    [...ziel.querySelectorAll('.bild')].forEach(b => {
      const svg = b.querySelector('svg'), h3 = b.querySelector('h3');
      if (svg && h3) {
        svg.setAttribute('aria-label',
          h3.textContent + (svg.hasAttribute('tabindex')
            ? ' — mit den Pfeiltasten durch die Werte' : ''));
      }
    });

    const zz = $('zwei-zahlen');
    zz.textContent = '';
    const paar = (was, wert) => {
      const d = el('span');
      d.appendChild(el('b', null, wert));
      d.appendChild(document.createTextNode(' ' + was));
      zz.appendChild(d);
    };
    const w = s.wachstum.length ? s.wachstum[s.wachstum.length - 1].n : 0;
    paar('Angemeldete insgesamt', zahl(w));
    paar('von ' + zahl(s.postwillig.alle) + ' mit Adresse wollen noch Post',
      zahl(s.postwillig.willig));
    paar('Seitenaufrufe insgesamt', zahl(s.aufrufe_insgesamt || 0));
  }

  /* Ein Zeichen je Handlung. Keine Emoji: die kämen aus einer fremden
     Schrift, wären bunt und säßen auf einer Schiefertafel wie ein Aufkleber.
     Diese hier sind Zeichen, die auch ein Setzer gehabt hätte. */
  const LOG_ZEICHEN = {
    sperren:    ['⊘', 'rot'],
    entsperren: ['⊙', 'gruen'],
    rolle:      ['⇅', ''],
    entfernen:  ['✕', 'rot'],
    rundmail:   ['✉', ''],
    // Der Kreis ist die Farbe selbst, so gut es ein Schriftzeichen kann.
    farbe:      ['◍', ''],
    // Der Bogen für den Regenbogen — einmal für „X ist im Kreis", einmal für
    // den Schalter über allen.
    stolz:       ['◠', ''],
    stolz_regel: ['◠', ''],
  };

  /* Das Protokoll führt seit dem Versandprotokoll drei Quellen, und `quelle`
     entscheidet die Darstellung — nicht `aktion`. Der Grund ist eine Falle:
     „rundmail" ist BEIDES, eine Verwaltungshandlung im `admin_log` und eine
     Mailart im Ausgang. Ein Versand durchs Kontor erzeugte darum zwei Zeilen —
     „schnix → rundmail „Betreff"" und „Mail → rundmail · 6 Mails". Gedacht war
     das als zwei Auskünfte, gelesen wurde es als Doppelung, und die Lesart hat
     recht: es ist EIN Vorgang. Seit dem 2026-08-08 hängt die Zahl an der
     Verwaltungszeile, und der Worker lässt `rundmail` aus dem Mailteil der
     Union heraus — hier ist davon nichts mehr zu tun.

     Mail und Klopfen teilen sich das ✉ nicht: eine Mail liegt im Postfach,
     ein Push klopft und ist wieder weg. */
  const QUELL_ZEICHEN = { mail: ['✉', ''], push: ['✦', ''] };

  const logZeichen = z => z.quelle === 'admin'
    ? (LOG_ZEICHEN[z.aktion] || ['·', ''])
    : (QUELL_ZEICHEN[z.quelle] || ['·', '']);

  /* Die Spalte vor der Pille beantwortet „von wem" — und die Antwort ist bei
     der Verwaltung ein Mensch und beim Versand ein Weg.

     ERST STAND DORT GAR NICHTS. „Mail →" und „Push →" waren mit dem Pfeil
     verschwunden, weil der Weg ja schon im Zeichen ganz links steht (✉ oder
     ✦) und im gewählten Reiter darüber. Das war eine Zumutung: ein Zeichen
     ist kein Wort, und wer „3 Geräte" liest, muss aus einem vierzackigen
     Stern schließen, dass es ein Push war. Jetzt steht der Weg wieder da —
     klein und in Versalien wie das „FILTER" am Sieb, nicht mehr als
     gleichrangiges fettes Wort mit Pfeil. */
  const logWer = z => (z.quelle === 'admin' ? z.wer
    : (z.quelle === 'push' ? 'Push' : 'Mail'));

  /* Auslöser und Empfänger, seit migrations/0026 — die zwei Fragen, die ein
     Mensch an eine Protokollzeile stellt, sobald er sie überhaupt lesen kann:
     „PUSH · NOTRUF · 3 Geräte" beantwortete bis dahin weder von wem noch an
     wen.

     BEIDE STEHEN HINTER DER ZAHL, nicht davor, und sie sind grau. Die Zeile
     hat eine Rangfolge: WAS ist passiert (die Pille), WIE VIELE hat es
     betroffen (die Zahl), und erst dann wer und an wen. Wer die Liste
     überfliegt, sucht das Erste; wer stehenbleibt, liest den Rest.

     „von Jo" und nicht bloß „Jo": ohne das Wörtchen steht der Name
     unvermittelt neben einer Namensliste, und man liest ihn als weiteren
     Empfänger. Zwei Zeichen, die einen Satz aus einer Aufzählung machen.

     FEHLT ETWAS, STEHT NICHTS DA — kein „von —", kein „an niemanden". Alte
     Zeilen von vor 0026 kennen ihren Auslöser nicht, und der Anmeldelink hat
     bewusst keinen Empfänger (siehe den Kopf von 0025: eine Adresse ist dort
     verboten, und einen Namen gibt es noch nicht). Eine leere Stelle ist
     ehrlicher als ein Gedankenstrich, der Auskunft vortäuscht. */
  function logSpur(z) {
    const stuecke = [];
    if (z.ausloeser)  stuecke.push('von ' + z.ausloeser);
    if (z.empfaenger) stuecke.push('an ' + z.empfaenger);
    return stuecke.join(' · ');
  }

  /* Wen oder was die Handlung betraf, in einem Satzstück. Beim Versand ist es
     die Zahl — und zwar in Stück, nicht als nackte Ziffer: „6" allein neben
     „notruf" liest sich wie eine Id. Die Fehlerzahl steht nur da, wenn es
     eine gibt; „0 kaputt" an jeder Zeile wäre eine Beruhigung, die man nach
     dem dritten Mal nicht mehr liest. */
  const versandStueck = z => (z.quelle === 'push'
    ? (z.anzahl === 1 ? '1 Gerät' : z.anzahl + ' Geräte')
    : (z.anzahl === 1 ? '1 Mail' : z.anzahl + ' Mails'))
    + (z.kaputt ? ' · ' + z.kaputt + ' nicht zugestellt' : '');

  function logWen(z, kurz) {
    if (z.quelle === 'mail' || z.quelle === 'push') return versandStueck(z);
    /* Die Rundmail trägt beides in EINER Zeile: den Betreff, weil er sagt
       worum es ging, und die Zahl aus dem Ausgang, weil sie die einzige
       Auskunft war, für die es früher eine zweite Zeile brauchte. `anzahl`
       fehlt nur, wenn die Mails nicht aufzufinden waren — dann steht eben nur
       der Betreff da und nicht „0 Mails", was nach einem Fehlschlag aussähe,
       den es nicht gab.

       In der Vorschaukarte bleibt die Zahl weg. Dort ist eine drittel Karte
       breit, „Sommerpause" · 2 Mails · 1 nicht zugestellt" bricht auf zwei
       Zeilen um, und die Frage dort ist ohnehin nur, OB etwas war. Dasselbe
       Motiv wie beim „wer → was", das `kurz` schon weglässt. */
    if (z.aktion === 'rundmail') {
      return '„' + (z.detail || '') + '"'
        + (z.anzahl && !kurz ? ' · ' + versandStueck(z) : '');
    }
    /* Beim Umfärben steht im Protokoll die nackte Platzzahl — der Worker
       schreibt den Platz, und „Kai (5)" liest sich wie ein Zähler. Das Wort
       davor macht daraus eine Auskunft. „automatisch" bleibt, wie es ist. */
    if (z.aktion === 'farbe' && /^\d+$/.test(z.detail || '')) {
      return z.wen + ' (Farbe ' + (Number(z.detail) + 1) + ')';
    }
    /* Der Schalter über der Regenbogenvergabe gilt KEINEM Menschen — `ziel_id`
       ist null, und die Route fällt für „wen" dann auf das Detail zurück.
       Ohne diese Zeile stünde dort „an (an)". */
    if (z.aktion === 'stolz_regel') return 'Vergabe ' + (z.detail || '');
    return z.wen + (z.detail && z.aktion !== 'entfernen' ? ' (' + z.detail + ')' : '');
  }

  /* Die Art als Pille. EINE Pille je Zeile, nicht zwei: die Probe trug bis
     eben ein rotes „Test" NEBEN dem Wort „testmail", und das sagte dasselbe
     zweimal. Jetzt ist die Artpille selbst rot — die Tönung ist die Auskunft,
     nicht ein zweites Schild.

     DIE TÖNUNG FOLGT DEM ZEICHEN LINKS, sie erfindet keine zweite Ordnung:
     rot, wo das Zeichen rot ist (sperren, entfernen), grün beim Entsperren,
     sonst Kreide. Die Probe kommt dazu — sie ist die einzige Mailart, die
     eine eigene Farbe verdient, weil sie als einzige nichts bewirkt hat.

     KEINE FARBE JE QUELLE. Naheliegend wäre Mail in einem Ton, Push im
     anderen; das Ergebnis wäre eine Liste, in der jede Zeile leuchtet, und
     damit keine. Mail und Push trennt das Zeichen, und das genügt. */
  const istProbe = z => z.quelle === 'mail' && z.aktion === 'testmail';

  const logArtTon = z => istProbe(z) ? 'rot'
    : (z.quelle === 'admin' ? (LOG_ZEICHEN[z.aktion] || ['', ''])[1] : '');

  /* Was in der Pille STEHT. Fast immer der Schemaname selbst — die Unterstriche
     werden zu Leerzeichen, sonst läse sich `mailwechsel_warnung` als ein Wort.

     Die zwei Regenbogenhandlungen heißen in der Datenbank weiter `stolz`
     (dort steht seit Schema 29 nichts anderes, und alte Zeilen umzuschreiben
     wäre Geschichtsfälschung), im Protokoll aber **pride** — so nennt es die
     Runde. Und weil sie das Einzige sind, was hier bunt wird, kommt das Wort
     in einer eigenen Hülle: der Verlauf gehört über die Buchstaben und nicht
     über die 96 px breite Pille (siehe `.log .art .pride`). */
  const LOG_ART_WORT = { stolz: 'pride', stolz_regel: 'pride regel' };
  function logArtWort(z) {
    const wort = LOG_ART_WORT[z.quelle === 'admin' ? z.aktion : ''];
    if (!wort) return document.createTextNode(z.aktion.replace(/_/g, ' '));
    return el('span', 'pride', wort);
  }

  /* EINE Zeile für zwei Orte: das Protokollblatt und die Vorschaukarte auf der
     Übersicht. `kurz` lässt dort Name und Pille weg — in einer drittel Karte
     ist für drei Spalten kein Platz, und die Frage dort ist ohnehin nur, ob
     seit dem letzten Blick etwas passiert ist. */
  function logZeile(z, kurz) {
    const li = el('li');
    const [glyph, ton] = logZeichen(z);
    li.appendChild(el('span', 'zeichen ' + ton, glyph));
    const t = el('time', null, vorhin(z.wann));
    t.dateTime = z.wann;
    // Das genaue Datum bleibt erreichbar — im selben Kasten wie überall
    // sonst auf dieser Seite, nicht als grauer Systemtooltip.
    Bilder.tippAm(t, { titel: datum(z.wann), zeilen: [] });
    li.appendChild(t);
    if (!kurz) {
      const tat = el('span', 'tat');
      /* Beim Versand steht dort der Weg statt eines Namens, und der wird
         leiser gesetzt: ein Mensch, der etwas getan hat, wiegt schwerer als
         der Kanal, durch den etwas von selbst rausging. */
      tat.appendChild(el('span', z.quelle === 'admin' ? 'wer' : 'wer weg',
        logWer(z)));
      // Die Unterstriche der Artnamen sind Schema, nicht Sprache:
      // `mailwechsel_warnung` liest sich als „MAILWECHSEL WARNUNG".
      const pille = el('span', ('art ' + logArtTon(z)).trim());
      pille.appendChild(logArtWort(z));
      tat.appendChild(pille);
      li.appendChild(tat);
    }
    li.appendChild(el('span', kurz ? 'wen' : null, logWen(z, kurz)));
    // In der Vorschaukarte nicht: dort ist für drei Spalten schon kein Platz.
    if (!kurz) {
      const spur = logSpur(z);
      if (spur) li.appendChild(el('span', 'spur', spur));
    }
    return li;
  }

  /* Das Sieb über dem Protokoll, wortgleich zu dem über der Runde — dieselben
     Reiter, dieselben Zahlen, derselbe `.werkzeug`-Kasten. Es siebt nach
     `quelle`, weil das die einzige Trennung ist, die ein Mensch im Kopf hat:
     „hat jemand verwaltet", „ist Post rausgegangen", „hat es geklopft".

     ES SIEBT IM WORKER, NICHT HIER — anders als das über der Runde. Dort liegt
     die ganze Runde seit `laden()` im Speicher und ein Sieb ist eine
     `filter()`-Zeile; hier liegt immer nur die geladene Seite da. Ein Sieb auf
     der Seite hieße „mail 3 von den 20, die du gerade siehst", und das ist
     keine Zahl, das ist ein Zufallswert. Die `zaehler` der Route zählen über
     die ganze Geschichte.

     `verwaltet` STEHT IMMER DA, auch mit einer Null — als einziger Reiter
     neben `alle`. Die Regel in der Runde („leere Reiter stehen gar nicht erst
     da") ist hier eine Falle: die Verwaltung ist die seltenste der drei
     Quellen, und der Reiter verschwände genau in dem Moment, in dem man nach
     ihm greift. Eine Null ist eine Auskunft, ein fehlender Reiter ist keine —
     und seit die Zahlen über alles zählen, ist eine Null dort auch die
     Wahrheit und nicht nur die Wahrheit über ein Fenster. */
  const LOG_SIEBE = {
    alle:      { titel: 'alle',      quelle: null },
    verwaltet: { titel: 'verwaltet', quelle: 'admin' },
    mail:      { titel: 'mail',      quelle: 'mail' },
    push:      { titel: 'push',      quelle: 'push' },
  };
  const LOG_IMMER = ['alle', 'verwaltet'];
  const LOG_ZAEHLER = { alle: 'alle', verwaltet: 'admin', mail: 'mail', push: 'push' };

  let logSieb = 'alle';
  let logWort = '';                 // das Suchwort, siebt ebenfalls im Worker
  let logZeilen = [];               // nur die geladenen Seiten
  let logZaehler = null;            // über die ganze Geschichte, aus der Route
  let logWeiter = null;             // Marke für die nächste Seite, null = Ende
  let logLaedt = false;             // gegen zwei Nachladungen auf einmal
  let logSpaeher = null;            // der IntersectionObserver am Fuß
  let logAutoRest = 0;              // wie oft der Beobachter noch von selbst darf
  let logLauf = 0;                  // gegen Antworten, die einander überholen
  let logTipp = null;               // der Wecker der Suche

  function logFilterZeichnen() {
    const ziel = $('log-filter');
    ziel.textContent = '';
    // Ein Sieb über einem leeren Buch siebt nichts. Der Satz darunter sagt
    // schon alles, was es zu sagen gibt.
    if (!logZaehler || !logZaehler.alle) return;
    ziel.appendChild(el('span', 'wozu', 'filter'));
    Object.entries(LOG_SIEBE)
      .map(([k, v]) => [k, v, logZaehler[LOG_ZAEHLER[k]] || 0])
      .filter(([k, , n]) => n > 0 || LOG_IMMER.includes(k))
      .forEach(([k, v, n]) => {
        const b = el('button', k === logSieb ? 'an' : null, v.titel);
        b.type = 'button';
        b.appendChild(el('i', null, String(n)));
        b.addEventListener('click', () => { if (k !== logSieb) logSiebWaehlen(k); });
        ziel.appendChild(b);
      });
  }

  /* Der Fuß der Liste. Er ist zugleich der Auslöser fürs Nachladen: kommt er
     in Sicht, ist der Leser unten angekommen und will mehr. Ein Knopf stünde
     an derselben Stelle und verlangte einen Klick für etwas, das ohnehin
     jeder will — aber er bleibt als Rückfalltür stehen, weil ein Klick auf
     „mehr" immer geht und ein Beobachter, den der Browser nicht kennt, nicht.

     `rootMargin` zieht die Auslöselinie 300 px vor den Rand: so lädt die
     nächste Seite, während man noch liest, und nicht erst, wenn man vor dem
     Nichts steht.

     VON SELBST GEHT ES NUR EIN STÜCK WEIT. Nach `LOG_AUTO` Nachladungen in
     Folge hört der Beobachter auf und der Knopf bleibt allein zurück — dann
     stehen hundert Zeilen da und der nächste Schritt will gewollt sein. Ohne
     diese Grenze wäre es kein Nachladen, sondern ein Sog: wer den Finger auf
     dem Rad liegen lässt, zöge das ganze Protokoll in den Speicher, und jede
     dieser Zeilen bliebe dort auch liegen. Ein Klick setzt das Kontingent
     zurück, man kommt also überall hin — nur nicht aus Versehen. */
  const LOG_AUTO = 4;

  function logFussZeichnen() {
    if (logSpaeher) { logSpaeher.disconnect(); logSpaeher = null; }
    /* Erst den alten wegräumen. `protokollZeichnen` leert die Liste ohnehin,
       aber `logNachladen` ruft hier mitten im Lauf noch einmal rein, um „lädt…"
       zu zeigen — ohne diese Zeile stünden dann zwei Füße untereinander. */
    const alt = $('log').querySelector('.log-fuss');
    if (alt) alt.remove();
    if (!logWeiter) return;

    const fuss = el('li', 'log-fuss');
    const b = el('button', null, logLaedt ? 'lädt…' : 'mehr laden');
    b.type = 'button';
    b.disabled = logLaedt;
    // Ein Klick ist eine Ansage und füllt das Kontingent wieder auf.
    b.addEventListener('click', () => { logAutoRest = LOG_AUTO; logNachladen(); });
    fuss.appendChild(b);
    $('log').appendChild(fuss);

    // Ist das Kontingent leer, bleibt der Knopf allein stehen — kein zweiter
    // Beobachter, der beim nächsten Zeichnen doch wieder loslegt.
    if (logAutoRest <= 0 || !('IntersectionObserver' in window)) return;
    logSpaeher = new IntersectionObserver(eintraege => {
      if (!eintraege.some(e => e.isIntersecting)) return;
      /* Das Kontingent zahlt für GELADENE Seiten, nicht für Meldungen des
         Beobachters. Der meldet mehrmals, während eine Seite noch unterwegs
         ist — wurde damals gleich hier abgezogen, war es nach zwei Seiten
         aufgebraucht statt nach vier (gemessen: Halt bei 60 Zeilen). Die
         beiden Riegel von `logNachladen` stehen deshalb VOR dem Abzug. */
      if (logLaedt || !logWeiter || logAutoRest <= 0) return;
      logAutoRest--;
      logNachladen();
    }, { rootMargin: '300px' });
    logSpaeher.observe(fuss);
  }

  /* Zwanzig je Seite. Nicht sechzig auf einmal wie bis 2026-08-08: das war
     nicht „mehr Auskunft", sondern eine Rolle, an deren Ende die Geschichte
     ohne Vorwarnung aufhörte. Zwanzig füllen ein Blatt und lassen den Fuß in
     Reichweite. */
  const LOG_SEITE = 20;

  /* `q` MUSS AUCH AM NACHLADEN HÄNGEN, nicht nur an der ersten Seite: `vor`
     blättert durch dieselbe Frage weiter. Ritte das Wort nur beim ersten
     Abruf mit, käme Seite zwei ungesiebt zurück und hängte sich unter das
     Suchergebnis — lautlos, und die Zeilen sähen echt aus. */
  const logPfad = (vor) => '/api/admin/protokoll?limit=' + LOG_SEITE
    + (LOG_SIEBE[logSieb].quelle ? '&quelle=' + LOG_SIEBE[logSieb].quelle : '')
    + (logWort ? '&q=' + encodeURIComponent(logWort) : '')
    + (vor ? '&vor=' + encodeURIComponent(vor) : '');

  /* Das Suchwort. Anders als über der Runde fragt es den Worker — der Grund
     steht dort, wo gesiebt wird (`GET /api/admin/protokoll`): hier liegt immer
     nur die geladene Seite da.

     DESHALB DER WECKER. Über der Runde filtert jeder Tastendruck eine Liste im
     Speicher; hier wäre er ein Rundflug zur Datenbank, und zwar kein
     billiger — die Abfrage baut die ganze Union samt der korrelierten
     Unterabfragen des Verwaltungszweigs auf. Ein Viertelsekunde Ruhe ist die
     Grenze, ab der Tippen aufhört und Fragen anfängt. */
  $('log-suche').addEventListener('input', ev => {
    const w = ev.target.value.trim();
    if (w === logWort) return;      // Leerzeichen am Ende sind keine neue Frage
    logWort = w;
    clearTimeout(logTipp);
    logTipp = setTimeout(logNeuStellen, 250);
  });

  /* Ein Reiterwechsel und ein neues Suchwort sind dasselbe: eine neue Frage,
     keine Fortsetzung. Die Liste geht leer, die Marke auch, und die erste
     Seite kommt frisch. Die Zahlen an den Reitern bleiben stehen, während
     geladen wird — sie ändern sich dadurch ja nicht, und wegzunehmen was
     gleich wieder dasteht, ist Flackern ohne Auskunft.

     DAS ZÄHLWERK IST NICHT ZIERAT. `logLaedt` allein reicht hier nicht: es
     hält niemanden ab, eine zweite Frage zu stellen, und beim Tippen sind
     zwei erste Seiten schnell gleichzeitig unterwegs. Dann gewinnt die, die
     zuletzt ankommt — nicht die, die zuletzt gefragt wurde. Der Wecker
     verkleinert dieses Fenster, er schließt es nicht. */
  async function logNeuStellen() {
    // Auch der Reiterklick löscht den Wecker: sonst fragt der 250 ms später
    // dasselbe noch einmal.
    clearTimeout(logTipp);
    const lauf = ++logLauf;
    logZeilen = [];
    logWeiter = null;
    logAutoRest = LOG_AUTO;
    /* `logLaedt` steht hier nicht nur gegen den Doppelklick: es hält auch den
       Satz „Unter diesem Sieb steht nichts" zurück, der sonst für den einen
       Rundflug zur Datenbank aufblitzt und etwas behauptet, das noch niemand
       weiß. */
    logLaedt = true;
    protokollZeichnen();
    try {
      const d = await ruf(logPfad(null));
      if (lauf !== logLauf) return;
      protokoll(d);
    } catch (e) {
      if (lauf !== logLauf) return;
      logLaedt = false;
      protokollZeichnen();
      sagt('log-sagt', e.message, true);
    }
  }

  function logSiebWaehlen(k) {
    logSieb = k;
    logNeuStellen();
  }

  async function logNachladen() {
    if (logLaedt || !logWeiter) return;
    /* Kein `++`: eine Fortsetzung ist keine neue Frage. Sie merkt sich nur,
       zu welcher sie gehörte — kommt sie zurück, während längst nach etwas
       anderem gesucht wird, hängt sie sich nicht mehr darunter. */
    const lauf = logLauf;
    logLaedt = true;
    logFussZeichnen();                       // der Fuß sagt „lädt…"
    try {
      const d = await ruf(logPfad(logWeiter));
      if (lauf !== logLauf) return;
      logZeilen = logZeilen.concat(d.zeilen);
      logWeiter = d.weiter;
      logZaehler = d.zaehler;
      logLaedt = false;
      protokollZeichnen();
    } catch (e) {
      if (lauf !== logLauf) return;
      logLaedt = false;
      /* Die schon geladenen Zeilen bleiben stehen — ein Fehler beim Nachladen
         ist kein Grund, das Gelesene wegzuräumen. Nur der Fuß fällt weg, sonst
         versucht der Beobachter es endlos weiter. */
      logWeiter = null;
      protokollZeichnen();
      sagt('log-sagt', e.message, true);
    }
  }

  function protokollZeichnen() {
    logFilterZeichnen();
    const ziel = $('log');
    ziel.textContent = '';
    if (!logZeilen.length) {
      /* Solange geladen wird, steht hier gar nichts — siehe `logSiebWaehlen`.
         Sonst zwei Sätze, wie in der Runde: ein leeres Blatt unter einem
         gewählten Sieb ist etwas anderes als ein leeres Blatt. „Noch ist
         nichts passiert" wäre unter „push" schlicht gelogen. Und nicht mehr
         „noch hat niemand etwas verwaltet": das Blatt zeigt seit dem
         Versandprotokoll auch, was von selbst rausging. */
      if (!logLaedt) {
        ziel.appendChild(el('li', 'leer-hinweis',
          /* Das Wort zuerst: wer gesucht hat, will hören, dass SEIN Wort
             nichts findet — „Unter diesem Sieb steht nichts" schöbe es auf
             den Reiter, an dem er gar nicht war. */
          logWort ? 'Zu „' + logWort + '" steht nichts im Protokoll.'
            : logSieb === 'alle' ? 'Noch ist nichts passiert.'
              : 'Unter diesem Sieb steht nichts.'));
      }
      return;
    }
    logZeilen.forEach(z => ziel.appendChild(logZeile(z)));
    logFussZeichnen();
  }

  /* Die erste Seite, aus `laden()`. Sie setzt alles zurück — auch nach einer
     Verwaltungshandlung, denn danach ist die Geschichte eine andere und
     nachgeladene Seiten von vorhin stünden schief darunter. Das gewählte Sieb
     überlebt: `laden()` fragt die Route mit `logPfad(null)`, und wer im Blatt
     „push" stand, will nach dem Entsperren nicht wieder bei „alle" landen —
     das Suchwort ebenso, es hängt aus demselben Grund mit im Pfad.

     Das Zählwerk rückt eins weiter, weil eine frische erste Seite alles
     entwertet, was noch unterwegs ist: eine Fortsetzung von vorhin gehört zu
     einer Liste, die es nicht mehr gibt. */
  function protokoll(d) {
    logLauf++;
    logZeilen = d.zeilen;
    logZaehler = d.zaehler;
    logWeiter = d.weiter;
    logLaedt = false;
    logAutoRest = LOG_AUTO;
    sagt('log-sagt', '');
    protokollZeichnen();
  }

  // ==========================================================================
  // Die Querverweise auf der Übersicht
  //
  // Drei baugleiche Karten. Sie holen nichts nach: Protokoll und geplante
  // Rundmails liegen seit `laden()` ohnehin da, und das erste Jahr steht in
  // der Wachstumskurve. Sie ersparen nur das Durchblättern, um zu erfahren,
  // ob in einem der anderen Blätter überhaupt etwas wartet.
  //
  // Baugleich ist Absicht und keine Sparsamkeit: eine Karte mit eigenem
  // Anstrich oder eigenem Knopf läse sich wie eine Anzeige zwischen zwei
  // Auskünften.
  // ==========================================================================
  function querKarte(titel, inhalt, knopfWort, beiKlick) {
    const k = el('div', 'karte');
    k.appendChild(el('div', 'k-titel', titel));
    k.appendChild(inhalt);
    const b = el('button', 'spring', knopfWort);
    b.type = 'button';
    b.addEventListener('click', beiKlick);
    k.appendChild(b);
    return k;
  }

  function querZeichnen(verwaltet) {
    const ziel = $('quer');
    ziel.textContent = '';

    /* 1 — Der Jahresrückblick. Die Jahre kommen aus der Wachstumskurve: ihr
       erster Eintrag ist die erste Anmeldung überhaupt, und davor gab es
       nichts zu erzählen. Kein eigener Abruf dafür. */
    const jahre = rueckblickJahre();
    if (jahre.length) {
      const i = el('div');
      i.appendChild(el('div', 'k-name', 'Dein Jahr ' + jahre[0]));
      i.appendChild(el('p', 'k-mail', jahre.length === 1
        ? 'bis heute gezählt'
        : 'bis heute gezählt · auch ' + jahre.slice(1).join(' und ')));
      ziel.appendChild(querKarte('Jahresrückblick', i, 'Dein Jahr öffnen →', jahrWahlAuf));
    }

    /* 2 und 3 — Protokoll und Rundmail. Diese beiden Karten stehen IMMER da,
       auch wenn sie nichts zu berichten haben, und das ist keine Vorliebe:
       AUF DEM HANDY sind sie der einzige Weg zu den beiden Blättern, deren
       Zungen dort nicht mitlaufen (`.nur-breit`, siehe das Register). Eine
       Karte, die sich bei leerem Inhalt wegräumt, räumte den Weg mit weg —
       und man käme an die Rundmail nur noch heran, solange schon eine geplant
       ist. Am Rechner gibt es die Zunge daneben; die Karte bleibt trotzdem,
       weil sie etwas anderes tut als hinführen — sie sagt vorher, ob dort
       etwas wartet.

       Der Jahresrückblick oben darf dagegen fehlen: dorthin führt kein Blatt,
       nur ein Overlay, und ohne Jahre gibt es nichts zu zeigen. */

    /* 2 — Was zuletzt VERWALTET wurde. Drei Zeilen, mehr passt nicht in eine
       drittel Karte, und mehr beantwortet die Frage auch nicht.

       Die Karte bekommt seit dem Versandprotokoll eine eigene Liste
       (`verwaltet`) statt der ersten drei aus dem Blatt. Das Blatt führt jetzt
       auch Post und Klopfen, und ein einziger Notruf legt sieben Zeilen oben
       drauf — die Karte hieße dann zwar weiter „Zuletzt im Protokoll", zeigte
       aber nur noch Mailverkehr, und die Sperre von gestern wäre nirgends mehr
       zu sehen. Der Weg ins Blatt führt weiter zu allem. */
    let inhalt;
    if (verwaltet && verwaltet.length) {
      inhalt = el('ul', 'mini-log');
      verwaltet.slice(0, 3).forEach(z => inhalt.appendChild(logZeile(z, true)));
    } else {
      inhalt = el('p', 'leer-hinweis', 'Noch hat niemand etwas verwaltet.');
    }
    ziel.appendChild(querKarte('Zuletzt im Protokoll', inhalt,
      'zum Protokoll →', () => blattAuf('log-blatt')));

    // 3 — Die nächste geplante Rundmail.
    const naechste = geplant
      .filter(g => g.status === 'geplant')
      .sort((a, b) => new Date(a.versand_am) - new Date(b.versand_am))[0];
    const rm = el('div');
    if (naechste) {
      rm.appendChild(el('div', 'k-name', naechste.betreff));
      rm.appendChild(el('p', 'k-mail', 'geplant für ' + datum(naechste.versand_am)));
    } else {
      // Kein Werbesatz und keine Aufforderung — nur die Auskunft, dass hier
      // gerade nichts wartet. Der Knopf darunter bleibt trotzdem, er ist der
      // Weg zum Blatt.
      rm.appendChild(el('div', 'k-name', 'Nichts geplant'));
      rm.appendChild(el('p', 'k-mail', 'Es steht keine Rundmail aus.'));
    }
    ziel.appendChild(querKarte('Nächste Rundmail', rm,
      'zur Rundmail →', () => blattAuf('rund-blatt')));
  }

  // ==========================================================================
  // Die Jahr-Wahl
  //
  // Der Rückblick selbst liegt drüben auf der Tafel — er ist nichts, was man
  // verwaltet, und die Kacheln zweimal zu bauen hieße, sie beim nächsten Mal
  // an einer Stelle zu ändern. Das Kontor fragt nur, WELCHES Jahr, und
  // schickt einen mit `?wrapped=JAHR` hinüber.
  //
  // Dass es überhaupt geht, konnte der Worker längst: `GET /api/wrapped`
  // zählt beim laufenden Jahr bis heute. Gefehlt hat nur der Weg dorthin —
  // die Tafel zeigt ihren Knopf nur im Dezember, und die Chronik hängt ihre
  // Jahrgänge erst an ABGESCHLOSSENE Jahre.
  // ==========================================================================
  function rueckblickJahre() {
    const w = letzteStat && letzteStat.wachstum;
    if (!w || !w.length) return [];
    const erstes = Number(String(w[0].tag).slice(0, 4));
    const heuer = new Date().getFullYear();
    if (!erstes || erstes > heuer) return [heuer];
    // Absteigend: das laufende Jahr zuerst, wie es der Mock zeigt — danach
    // fragt man am häufigsten.
    return Array.from({ length: heuer - erstes + 1 }, (_, i) => heuer - i);
  }

  /* Der Rückweg. Der Rückblick liegt drüben, und sein × führt hierher zurück
     (`wrappedZu` in `index.html`) — nur stand man beim Weggehen nicht im
     Kontor, sondern in der Jahr-Wahl. Sie zugeklappt vorzufinden heißt, den
     einen Griff noch einmal zu tun; wer ein zweites Jahr ansehen will, will
     genau diese Liste.

     Dieselbe Bauart wie der Rückweg aus dem Deckel drüben (`ausDemDeckel` in
     `index.html`), und aus denselben Gründen: eine einmalige Marke im
     sessionStorage, kein Suchparameter. Sie fängt beide Wege zurück — das ×
     des Rückblicks und den Zurück-Knopf des Browsers. */
  const JAHRWAHL_SPEICHER = 'beerstock-kontor-jahrwahl';
  const jahrWahlMerken = () => { try { sessionStorage.setItem(JAHRWAHL_SPEICHER, '1'); } catch {} };
  const jahrWahlNehmen = () => {
    try {
      const da = !!sessionStorage.getItem(JAHRWAHL_SPEICHER);
      sessionStorage.removeItem(JAHRWAHL_SPEICHER);
      return da;
    } catch { return false; }
  };

  /* Am Ende von `laden()` gerufen, nicht davor: die Jahre kommen aus
     `letzteStat`, und die steht erst, seit `statistik()` gelaufen ist. Die
     zweite Bedingung ist kein Zierrat — die Marke schlägt die Liste sonst auch
     dann auf, wenn gar kein Jahr darin stünde. */
  function jahrWahlAusMarke() {
    if (jahrWahlNehmen() && rueckblickJahre().length) jahrWahlAuf();
  }

  /* Und der Fall, in dem das Skript kein zweites Mal läuft: holt der Browser
     das Kontor aus seinem Vor-/Zurück-Speicher zurück, steht die Liste noch
     offen, wie man sie verlassen hat. Dann ist nichts aufzuschlagen — aber die
     Marke muss weg, sonst geht sie beim nächsten Aufbau hoch. */
  window.addEventListener('pageshow', ev => { if (ev.persisted) jahrWahlNehmen(); });

  function jahrWahlAuf() {
    const liste = $('jahr-liste');
    liste.textContent = '';
    const heuer = new Date().getFullYear();
    const bisHeute = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
    rueckblickJahre().forEach(jahr => {
      const b = el('button', 'jahr-zeile');
      b.type = 'button';
      b.appendChild(el('b', null, String(jahr)));
      b.appendChild(el('span', null, jahr === heuer
        ? 'läuft noch — gezählt bis ' + bisHeute
        : 'abgeschlossen'));
