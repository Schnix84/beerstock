<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kontor — beerstock</title>
<style>
  /* ==========================================================================
     DAS KONTOR

     Das Hinterzimmer derselben Kneipe. Die Tafel (index.html) ist Kreide auf
     Schiefer; hier liegt das Kontorbuch des Wirts: Papier, Linien, Tinte.

     Warum es überhaupt anders aussehen darf: die Tafel ist die Gaststube und
     ein Gegenstand — ein zweiter Anstrich wäre eine andere Tafel. Das Kontor
     ist kein Gegenstand, sondern ein Buch, und es spart, den ganzen
     Kreide-Stil zu duplizieren.

     Die FARBWERTE sind dieselben Familien wie drüben, nur andersherum
     verwendet: Tinte auf Papier statt Kreide auf Schiefer. Grün, Sand und
     Braun stehen wortgleich schon in den Mails, die dieser Worker verschickt
     (schickeLink, meldeNeuenNutzer) — das Kontor sieht damit aus wie die Post,
     die aus ihm herausgeht.

     Kein Hell/Dunkel-Umschalter, wie drüben: ein Buch hat eine Farbe.
     ========================================================================== */
  :root {
    --papier:     #f4efe3;
    --papier-t:   #eae2d1;   /* der Rand, wo das Blatt aufliegt */
    --linie:      #d9cfb8;   /* die Linien im Kontorbuch        */
    --tinte:      #1d2a24;
    --tinte-matt: #47544d;
    --tinte-weg:  #6f6653;   /* verblasst: Nebentext            */
    --gruen:      #2f5d4a;   /* der Bezug, wie in den Mails     */
    --gelb:       #b8901f;   /* dieselbe Familie wie --gelb drüben, auf Papier lesbar */
    --rot:        #b04a38;   /* dieselbe Familie wie --rot drüben */
    --hand: 'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 14px 60px;
    background: var(--papier-t);
    color: var(--tinte);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .buch { max-width: 940px; margin: 0 auto; }

  /* Ein Block ist ein Blatt. Die Linien darin sind echt gezeichnet, nicht
     angedeutet: ein Kontorbuch ohne Linien ist ein Notizzettel.

     Zwei davon liegen im Hintergrund und nicht als Element: das Linienraster
     im Abstand von 26 px und der rote Randstrich links, den jedes Kontorbuch
     hat. Beide sind so blass, dass sie unter dem Text verschwinden — sie
     sollen das Blatt zu Papier machen, nicht zum Formular. Deshalb liegt
     links auch mehr Luft: der Text beginnt RECHTS vom Randstrich, sonst ist
     es kein Rand, sondern ein Strich mitten durch. */
  .blatt {
    background:
      linear-gradient(#b04a3830, #b04a3830) 13px 0 / 1px 100% no-repeat,
      repeating-linear-gradient(#0000 0 26px, #d9cfb85e 26px 27px),
      var(--papier);
    border: 1px solid var(--linie);
    border-radius: 3px;
    box-shadow: 0 1px 0 #00000008, 0 6px 18px #0000000d;
    padding: 16px 16px 18px 24px;
    margin-bottom: 16px;
    /* Die Blätter kommen nacheinander herein, nicht alle auf einmal: sie
       werden ja auch nacheinander aufgeschlagen. Vier Stufen reichen — was
       danach kommt, sieht ohnehin niemand mehr beim Erscheinen zu. */
    animation: aufschlagen .34s ease-out both;
  }
  .blatt:nth-of-type(2) { animation-delay: .05s; }
  .blatt:nth-of-type(3) { animation-delay: .10s; }
  .blatt:nth-of-type(n+4) { animation-delay: .15s; }
  @keyframes aufschlagen { from { opacity: 0; transform: translateY(5px); } }
  @media (prefers-reduced-motion: reduce) { .blatt { animation: none; } }
  h1 {
    font-family: var(--hand); font-size: 27px; font-weight: normal;
    margin: 0 0 2px; letter-spacing: .01em;
  }
  .unter { font-size: 12px; color: var(--tinte-weg); margin: 0 0 16px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--tinte-weg); margin: 0 0 12px;
    padding-bottom: 5px; border-bottom: 1px solid var(--linie);
  }
  h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--tinte-matt); }

  /* --- Der Kopf ------------------------------------------------------------
     Vier Zahlen und eine Ampel. Sie stehen ganz oben, weil sie die Frage
     beantworten, mit der man das Kontor überhaupt aufschlägt: läuft alles.
     --------------------------------------------------------------------- */
  .zahlen { display: flex; flex-wrap: wrap; gap: 10px; }
  .zahl {
    flex: 1 1 110px; padding: 10px 12px;
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffff66;
  }
  .zahl b { display: block; font-family: var(--hand); font-size: 26px; line-height: 1.1; }
  .zahl span { font-size: 11px; color: var(--tinte-weg); }
  .zahl.warn b { color: var(--rot); }
  /* Der Verlauf unter der Zahl. Eine einzelne Zahl sagt nicht, ob sie viel
     ist — „12 Mails" ist ein ruhiger Tag oder ein Ausbruch, je nachdem, was
     davor war. Die Linie steht nur an den Kacheln, für die es wirklich eine
     Reihe gibt; die übrigen bleiben nackt, statt eine zu erfinden. */
  .zahl svg { display: block; width: 100%; height: 22px; margin-top: 7px; }
  .zahl em { display: block; font-size: 10.5px; font-style: normal; color: var(--tinte-weg); }

  /* Die Ampel ist die wichtigste Auskunft des Kopfes und sah als Fließtext mit
     Punkten davor aus wie eine Aufzählung. Als Pillen ist sie eine Reihe von
     Lampen. Was der Worker wörtlich geantwortet hat, steht im Tooltip: eine
     rote Pille mit angehängtem Fehlertext wäre dreimal so lang wie die
     anderen und risse die Zeile auseinander. */
  .ampel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; font-size: 12px; }
  .ampel span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 9px; border-radius: 999px;
    border: 1px solid var(--linie); background: #ffffff80; color: var(--tinte-matt);
  }
  .ampel span::before { content: '●'; font-size: 9px; color: var(--gruen); }
  .ampel span.aus { border-color: #b04a3855; background: #b04a380f; color: #7d3527; }
  .ampel span.aus::before { color: var(--rot); }
  .ampel span.egal::before { color: var(--tinte-weg); }

  /* --- Die Runde -----------------------------------------------------------
     Eine Karte je Mensch, kein Tabellengitter. Zehn Spalten bekommt man auf
     einem Handy nicht unter, und zwei Fassungen (Tabelle breit, Karten schmal)
     wären zweimal dieselbe Wahrheit — das läuft auseinander. Die Karten
     ordnen sich ab 680 px zu zweit nebeneinander, mehr Unterschied braucht es
     nicht.
     --------------------------------------------------------------------- */
  .runde { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .runde { grid-template-columns: 1fr 1fr; } }

  /* --- Reiter --------------------------------------------------------------
     Zweimal dieselbe Form: der Filter über der Runde und der Zeitraum über
     den Bildern. Beides ist dieselbe Handlung — „zeig mir einen Ausschnitt" —
     und soll deshalb auch gleich aussehen. Sie stehen ÜBER dem, was sie
     filtern, weil man sonst erst liest und dann erfährt, dass man das Falsche
     gelesen hat.
     --------------------------------------------------------------------- */
  .reiter { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
  .reiter button {
    border-radius: 999px; padding: 4px 12px; background: #ffffff66;
    font-size: 12px; color: var(--tinte-weg);
  }
  .reiter button.an {
    background: var(--gruen); border-color: var(--gruen); color: var(--papier);
  }
  .reiter button.an:hover { background: #24493a; color: #fff; }
  .reiter button i { font-style: normal; opacity: .65; margin-left: 5px; }
  .reiter .wozu {
    align-self: center; font-size: 11px; color: var(--tinte-weg);
    letter-spacing: .08em; text-transform: uppercase; margin-right: 2px;
  }

  .karte {
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffff66;
    padding: 12px 13px 11px;
  }
  .karte.gesperrt { background: #b04a380d; border-color: #b04a3844; }
  .karte.weg { opacity: .55; }
  .k-kopf { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .k-name { font-family: var(--hand); font-size: 20px; }
  /* Das Monogramm. Nicht Zierde: die Karten unterscheiden sich sonst erst
     beim Lesen des Namens, und im Kontor sucht man eine bestimmte. Ein
     Buchstabe in Tinte ist das, was ein Wirt auch ins Buch schreiben würde —
     ein Foto hat hier niemand hinterlegt. */
  .k-mono {
    flex: 0 0 auto; align-self: center;
    width: 27px; height: 27px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--hand); font-size: 14px; line-height: 1;
    background: var(--gruen); color: var(--papier);
  }
  .karte.gesperrt .k-mono { background: var(--rot); }
  .karte.weg .k-mono { background: var(--tinte-weg); }
  .marke {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px;
    color: var(--tinte-weg);
  }
  .marke.admin { color: var(--gruen); }
  .marke.rot { color: var(--rot); }
  .marke.ich { color: var(--gelb); }
  .k-mail {
    font-size: 12px; color: var(--tinte-weg); margin: 3px 0 0; overflow-wrap: anywhere;
  }
  /* Die Zahlen einer Karte: Beschriftung klein darüber, Wert darunter. Als
     Gitter, damit sie in beiden Karten einer Zeile auf derselben Höhe stehen. */
  /* Drei feste Spalten, nicht `auto-fit`: sechs Zahlen ergeben so zwei saubere
     Reihen. Automatisch verteilt setzte die Karte je nach Breite fünf in die
     erste Zeile und eine allein darunter — das sieht aus wie ein Umbruchfehler. */
  .k-zahlen {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px; margin: 11px 0 0;
    padding-top: 10px; border-top: 1px solid var(--linie);
  }
  /* Auf einem schmalen Handy zwei statt drei. Nicht, weil es sonst überliefe
     — es läuft nicht über —, sondern weil „BEWERTET VON" bei drei Spalten
     umbricht und dann eine Zeile höher steht als seine Nachbarn. Zwei Spalten
     ergeben drei saubere Reihen; die Begründung für DREI oben gilt weiter,
     sie gilt nur nicht bei 390 px. */
  @media (max-width: 430px) { .k-zahlen { grid-template-columns: 1fr 1fr; } }
  .k-zahlen div { font-size: 15px; font-family: var(--hand); }
  .k-zahlen div span {
    display: block; font: 10px/1.3 system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase; color: var(--tinte-weg);
  }
  .k-grund {
    margin: 9px 0 0; padding: 7px 9px; font-size: 12px; line-height: 1.45;
    background: #b04a3814; border-left: 2px solid var(--rot); border-radius: 2px;
  }
  .k-tat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }

  /* --- Knöpfe --------------------------------------------------------------
     Ein Knopf ist hier klein und aus Tinte gezeichnet: die Seite ist eine
     Verwaltung, keine Bedienoberfläche. Wer eine zerstörende Handlung anfasst,
     bekommt den zweiten Klick in derselben Zeile — wie am Rad drüben, und
     ausdrücklich kein confirm(): ein Systemdialog reißt einen aus dem Blatt.
     --------------------------------------------------------------------- */
  button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--linie); border-radius: 3px;
    background: #ffffffaa; color: var(--tinte-matt);
    padding: 5px 10px;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #fff; border-color: var(--tinte-weg); color: var(--tinte); }
  button[disabled] { opacity: .4; cursor: default; }
  button.sicher { border-color: var(--rot); color: var(--rot); background: #b04a380f; }
  button.gross {
    font-size: 14px; padding: 9px 18px; font-family: var(--hand);
    background: var(--gruen); border-color: var(--gruen); color: var(--papier);
  }
  button.gross:hover { background: #24493a; color: #fff; }

  input[type="text"], input[type="email"], input[type="date"], input[type="time"],
  textarea {
    font: inherit; font-size: 14px; width: 100%;
    border: 1px solid var(--linie); border-radius: 3px; background: #ffffffcc;
    color: var(--tinte); padding: 7px 9px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gruen); }
  textarea { resize: vertical; min-height: 130px; line-height: 1.55; }
  label.feld-titel {
    display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--tinte-weg); margin: 12px 0 4px;
  }

  /* --- Die Mail-Vorschau ----------------------------------------------------
     Dasselbe Aussehen wie `mailRumpf`/`mailKnopf` im Worker
     (worker/src/index.js) - eine Mail wird in einem fremden Programm auf
     weissem Grund gelesen, nicht im Kontorbuch. Aendert sich dort etwas an
     Schrift oder Farbe, muss es hier nachgezogen werden, sonst luegt die
     Vorschau.
     --------------------------------------------------------------------- */
  .mail-vorschau {
    border: 1px solid var(--linie); border-radius: 3px; overflow: hidden;
    margin-top: 14px; background: #fff;
  }
  .mv-kopf {
    padding: 10px 16px; background: var(--papier); border-bottom: 1px solid var(--linie);
    font-size: 12px; color: var(--tinte-weg); display: flex; gap: 8px; align-items: baseline;
    flex-wrap: wrap;
  }
  .mv-kopf strong { font-size: 14px; color: var(--tinte); font-weight: 600; }
  .mv-rumpf {
    padding: 18px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6; color: #1d2a24;
  }
  .mv-bild { max-width: 100%; border-radius: 4px; display: block; margin: 0 0 12px; }
  .mv-knopf {
    display: inline-block; background: var(--gruen); color: var(--papier);
    padding: 12px 22px; border-radius: 3px; text-decoration: none;
    letter-spacing: .15em; text-transform: uppercase; font-size: 13px;
  }

  /* --- Die Grafiken --------------------------------------------------------
     Handgezeichnetes SVG, ohne Fremdbibliothek: die Seite darf keine externe
     Abhängigkeit bekommen, und `sparkline()` drüben zeigt, dass es reicht.
     Zwei nebeneinander ab 680 px.
     --------------------------------------------------------------------- */
  /* Das Raster der Bilder gehört der Seite: wie viele nebeneinander passen,
     weiß sie, nicht das Bild. Alles, was IN einem Bild steckt — Kärtchen,
     Legende, Tooltip — bringt `bilder.js` selbst mit, samt Farben aus der
     Palette, die `Bilder.aufsetzen` unten übergibt. */
  .bilder { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .bilder { grid-template-columns: 1fr 1fr; } }

  /* --- Das Skelett ---------------------------------------------------------
     Bis die vier Abrufe da sind, stand hier eine weiße Seite — die sieht aus
     wie ein Fehler. Ein paar graue Balken sagen „gleich", ohne etwas zu
     behaupten, was noch niemand weiß.
     --------------------------------------------------------------------- */
  .skelett b { display: block; height: 22px; width: 40%; margin-bottom: 14px; }
  .skelett i { display: block; height: 12px; margin-bottom: 9px; }
  .skelett b, .skelett i {
    border-radius: 2px;
    background: linear-gradient(90deg, #e9e0cc 25%, #f3ecdd 50%, #e9e0cc 75%);
    background-size: 280% 100%;
    animation: schimmer 1.5s linear infinite;
  }
  @keyframes schimmer { from { background-position: 140% 0; } to { background-position: -140% 0; } }
  @media (prefers-reduced-motion: reduce) { .skelett b, .skelett i { animation: none; } }

  .zwei-zahlen {
    display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 14px;
    padding-top: 12px; border-top: 1px solid var(--linie); font-size: 13px;
  }
  .zwei-zahlen b { font-family: var(--hand); font-size: 18px; font-weight: normal; }

  /* --- Das Protokoll -------------------------------------------------------
     Ein Verlauf, keine Tabelle. Deshalb steht vorn die Zeichnung der Handlung
     und dann „vor drei Stunden" — so liest ein Mensch eine Vorgeschichte. Das
     genaue Datum ist damit nicht weg, es steht im Tooltip: man braucht es
     selten, aber wenn, dann auf die Minute.
     --------------------------------------------------------------------- */
  .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px;
    padding: 7px 0; border-bottom: 1px solid var(--linie);
  }
  .log li:last-child { border-bottom: none; }
  .log time { font-size: 11px; color: var(--tinte-weg); flex: 0 0 92px; }
  .log .was { font-weight: 600; }
  .log .zeichen {
    flex: 0 0 17px; text-align: center; color: var(--tinte-weg); font-size: 13px;
  }
  .log .zeichen.rot { color: var(--rot); }
  .log .zeichen.gruen { color: var(--gruen); }

  .sagt {
    margin: 13px 0 0; padding: 9px 11px; border-radius: 3px; font-size: 13px;
    background: #2f5d4a12; border-left: 2px solid var(--gruen); line-height: 1.5;
  }
  .sagt.schlecht { background: #b04a3812; border-left-color: var(--rot); color: #7d3527; }
  .leer-hinweis { font-size: 13px; color: var(--tinte-weg); font-style: italic; }

  /* Wer hier nichts verloren hat, sieht das — und nicht eine leere Seite, die
     wie ein Fehler aussieht. Das Tor selbst sitzt im Worker, das hier ist die
     Auskunft darüber. */
  .tuer { text-align: center; padding: 50px 20px; }
  .tuer p { color: var(--tinte-weg); font-size: 14px; }
  .zurueck { display: inline-block; margin-top: 14px; color: var(--gruen); font-size: 13px; }
  /* Im Kopf steht er über dem Titel statt unter einem Absatz — dort ist der
     Abstand nach oben falsch herum. */
  #kopf-blatt .zurueck { margin: 0 0 8px; }
</style>
</head>
<body>
<div class="buch">

  <!-- Das einzige, was ohne `hidden` startet: bis der erste Abruf da ist, ist
       das hier die ganze Seite. Es verschwindet in `laden()`, egal ob Zahlen
       kommen oder die verschlossene Tür. -->
  <div class="blatt skelett" id="skelett">
    <b></b>
    <i style="width:88%"></i>
    <i style="width:64%"></i>
    <i style="width:76%"></i>
  </div>

  <div class="blatt" id="kopf-blatt" hidden>
    <!-- Der Weg zurück. Stand bisher nur auf der verschlossenen Tür — wer
         hereinkam, hatte keinen mehr und musste die Adresse von Hand kürzen.
         Über den Titel, weil man ihn dort sucht und nicht unter der Ampel. -->
    <a class="zurueck" href="./">← zurück zur Tafel</a>
    <h1>Kontor</h1>
    <p class="unter" id="wer"></p>
    <div class="zahlen" id="zahlen"></div>
    <div class="ampel" id="ampel"></div>
  </div>

  <div class="blatt" id="runde-blatt" hidden>
    <h2>Mitglieder</h2>
    <div class="reiter" id="filter"></div>
    <div class="runde" id="runde"></div>
    <p class="sagt" id="runde-sagt" hidden></p>
  </div>

  <div class="blatt" id="stat-blatt" hidden>
    <h2>Statistiken</h2>
    <div class="reiter" id="zeitraum"></div>
    <div class="bilder" id="bilder"></div>
    <div class="zwei-zahlen" id="zwei-zahlen"></div>
    <p class="sagt" id="stat-sagt" hidden></p>
  </div>

  <div class="blatt" id="rund-blatt" hidden>
    <h2>Rundmail</h2>
    <label class="feld-titel" for="r-betreff">Betreff</label>
    <input type="text" id="r-betreff" maxlength="120" placeholder="Freitag steht">
    <label class="feld-titel" for="r-text">Text</label>
    <textarea id="r-text" maxlength="4000"
              placeholder="Was der Wirt zu sagen hat. Leerzeile trennt Absätze."></textarea>
    <p class="unter" id="r-zaehler" style="margin:6px 0 0"></p>

    <label class="feld-titel" for="r-bild">Bild (Adresse, freiwillig)</label>
    <input type="text" id="r-bild" placeholder="https://…">

    <label class="feld-titel" for="r-knopf-text">Knopf (freiwillig)</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="r-knopf-text" maxlength="40" placeholder="Zur Tafel"
             style="flex:1 1 40%">
      <input type="text" id="r-knopf-link" placeholder="https://…" style="flex:1 1 60%">
    </div>

    <label class="feld-titel">Versand</label>
    <div class="reiter" id="r-wann"></div>
    <div id="r-spaeter" hidden style="display:flex;gap:8px;margin-top:4px">
      <input type="date" id="r-datum" style="flex:1 1 auto">
      <input type="time" id="r-zeit" style="flex:0 0 110px">
    </div>

    <div class="k-tat" style="margin-top:14px">
      <button class="gross" id="r-ab" type="button">Vorschau</button>
      <button id="r-test" type="button">Testmail an mich</button>
      <button id="r-weg" type="button" hidden>verwerfen</button>
    </div>
    <div id="r-vorschau" hidden></div>
    <p class="sagt" id="rund-sagt" hidden></p>

    <div id="r-geplant" hidden style="margin-top:22px;padding-top:14px;border-top:1px solid var(--linie)">
      <h3>Geplant</h3>
      <div id="r-geplant-liste" style="display:grid;gap:10px"></div>
    </div>
  </div>

  <div class="blatt" id="log-blatt" hidden>
    <h2>Protokoll</h2>
    <ul class="log" id="log"></ul>
  </div>

  <div class="blatt tuer" id="tuer" hidden>
    <h1>Nicht dein Zimmer</h1>
    <p id="tuer-text">Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.</p>
    <a class="zurueck" href="./">← zurück zur Tafel</a>
  </div>

</div>

<script src="bilder.js"></script>
<script>
  // ==========================================================================
  // Dieselbe Herkunft wie die Tafel, also DASSELBE localStorage und dasselbe
  // Token: wer dort angemeldet ist, ist es hier auch. Kein zweiter Login, kein
  // zweiter Anmeldeweg — und damit auch kein zweiter Angriffsweg.
  // ==========================================================================
  const API = location.hostname === 'localhost'
    ? 'http://localhost:8787'
    : 'https://beerstock-api.mc-schneider84.workers.dev';
  const SPEICHER = 'beerstock-token';
  const TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const NS = 'http://www.w3.org/2000/svg';

  const $ = id => document.getElementById(id);
  const el = (tag, klasse, text) => {
    const n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text != null) n.textContent = text;
    return n;
  };
  const s_el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const merke = () => { try { return localStorage.getItem(SPEICHER); } catch { return null; } };

  const mitToken = (kopf = {}) => {
    const t = merke();
    return t ? { ...kopf, Authorization: 'Bearer ' + t } : kopf;
  };

  /* Jeder Ruf geht hier durch — eine Stelle für Kopf, Fehlerform und die
     Umwandlung in eine Ausnahme, die oben als Satz landet. */
  async function ruf(pfad, rumpf) {
    const r = await fetch(API + pfad, {
      method: rumpf ? 'POST' : 'GET',
      headers: mitToken(rumpf
        ? { 'Content-Type': 'application/json', 'X-Tab': TAB }
        : {}),
      body: rumpf ? JSON.stringify(rumpf) : undefined,
      cache: 'no-store',
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fehler || 'Das ging nicht (' + r.status + ')');
    return d;
  }

  function sagt(id, text, schlecht) {
    const p = $(id);
    p.textContent = text;
    p.classList.toggle('schlecht', !!schlecht);
    p.hidden = !text;
  }

  const zahl = n => (n ?? 0).toLocaleString('de-DE');
  const datum = iso => iso
    ? new Date(iso).toLocaleString('de-DE',
        { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  const nurTag = iso => iso
    ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
    : '—';

  /* „vor drei Stunden" statt „03.08.26, 16:14". Im Protokoll ist die Frage
     nicht, wann etwas war, sondern wie lange es her ist — das genaue Datum
     steht daneben im Tooltip. Ab einer Woche kippt es zurück aufs Datum:
     „vor 23 Tagen" muss man umrechnen, um es einzuordnen. */
  function vorhin(iso) {
    if (!iso) return '—';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 90) return 'gerade eben';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'vor ' + Math.round(s / 3600) + ' h';
    if (s < 7 * 86400) {
      const t = Math.round(s / 86400);
      return t === 1 ? 'gestern' : 'vor ' + t + ' Tagen';
    }
    return nurTag(iso);
  }

  // ==========================================================================
  // Die Bilder kommen aus `bilder.js` — dieselbe Datei, die die Statistikseite
  // benutzt. Hier bekommen sie die Farben des Kontors: Tinte auf Papier.
  // Das ist zugleich die Vorgabe der Datei, steht aber trotzdem ausgeschrieben
  // da — sonst sieht die eine Seite so aus, als hätte sie keine Wahl gehabt.
  // ==========================================================================
  Bilder.aufsetzen({
    reihe:      ['#2f5d4a', '#b8901f', '#b04a38', '#4a6f8a', '#7a5c8f', '#6f6653'],
    linie:      '#d9cfb8',
    text:       '#47544d',
    textWeg:    '#6f6653',
    grund:      '#f4efe3',
    stark:      '#1d2a24',
    karteGrund: '#ffffff66',
    karteRand:  '#d9cfb8',
    tippGrund:  '#1d2a24',
    tippText:   '#ded7c8',
    tippKopf:   '#ffffff',
    ring:       '#2f5d4a',
    hand:       "'Chalkduster', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive",
  });
  const REIHE = Bilder.reihe;


  // ==========================================================================
  // Zeichnen
  // ==========================================================================
  let stand = null;        // die letzte Antwort von /api/admin/nutzer
  let mich = null;         // /api/me — für das Neuzeichnen des Kopfes
  let letzteAmpel = null;  // die letzte Antwort von /api/health, dito

  function kopfZeichnen(kopf, ich, health, s) {
    $('wer').textContent = 'Angemeldet als ' + (ich.name || 'namenlos') + ' · ' + ich.email;
    const z = $('zahlen');
    z.textContent = '';
    /* `reihe` ist freiwillig: nur zwei der fünf Kacheln haben wirklich eine
       Zeitreihe hinter sich. „Davon aktiv" und „gesperrt" sind Zustände, kein
       Verlauf — dort eine Linie hinzumalen hieße, eine zu erfinden. */
    const kachel = (wert, was, warn, reihe, dazu) => {
      const d = el('div', 'zahl' + (warn ? ' warn' : ''));
      d.appendChild(el('b', null, zahl(wert)));
      d.appendChild(el('span', null, was));
      if (reihe && reihe.length > 1) {
        d.appendChild(Bilder.funke(reihe, warn ? '#b04a38' : REIHE[0]));
        if (dazu) d.appendChild(el('em', null, dazu));
      }
      z.appendChild(d);
    };

    const tage = (s && s.tage) || zeitraum;
    const seit = `in ${tage} Tagen`;

    /* Wieviele davon in diesem Zeitraum dazugekommen sind: `wachstum` ist
       kumuliert, also ist es die Differenz zum letzten Stand VOR der Grenze —
       nicht die Summe der Tage im Fenster, denn die Reihe hat nur Einträge an
       Tagen, an denen sich überhaupt jemand angemeldet hat. */
    const w = (s && s.wachstum) || [];
    const grenze = new Date(Date.now() - tage * 864e5).toISOString().slice(0, 10);
    const davor = w.filter(x => x.tag <= grenze).pop();
    const neu = w.length ? w[w.length - 1].n - (davor ? davor.n : 0) : 0;

    const mails = ((s && s.mails_je_tag) || []).map(x => x.n);
    const mailSumme = mails.reduce((a, n) => a + n, 0);

    kachel(kopf.melder, 'Melder', false, w.map(x => x.n),
      (neu > 0 ? '+' + zahl(neu) : 'keiner dazu') + ' ' + seit);
    kachel(kopf.aktiv, 'davon aktiv');
    kachel(kopf.gesperrt, 'gesperrt', kopf.gesperrt > 0);
    kachel(kopf.mails_24h, 'Mails, 24 h', false, mails, zahl(mailSumme) + ' ' + seit);
    if (kopf.mails_kaputt_24h) kachel(kopf.mails_kaputt_24h, 'davon kaputt', true);

    /* Die Ampel: was der Worker über sich selbst sagt. `admin` und
       `mail_geheim` stehen dort seit dieser Ausbaustufe — ohne sie käme
       niemand ins Kontor und trüge keine Mail einen Abmeldelink, und beides
       sähe von außen wie ein Fehler im Browser aus. */
    const a = $('ampel');
    a.textContent = '';
    if (!health) {
      const s = el('span', 'egal', 'Zustand unbekannt');
      Bilder.tippAm(s, { titel: 'Zustand unbekannt', zeilen: [],
        fuss: '/api/health hat nicht geantwortet. Das ist die Ampel, nicht der Inhalt — '
            + 'die Zahlen daneben stimmen trotzdem.' });
      a.appendChild(s);
      return;
    }
    [['db', 'Datenbank'], ['mail', 'Mailversand'], ['admin', 'ADMIN_MAIL'],
     ['mail_geheim', 'MAIL_GEHEIM'], ['bilder', 'Bilder'], ['tafel', 'Verteiler']]
      .forEach(([k, titel]) => {
        const wert = String(health[k] ?? '');
        const gut = wert === 'ok' || wert === 'Schluessel liegt an';
        /* Die Pille bleibt kurz, der Wortlaut des Workers steht im Tooltip.
           Angehängt war er dreimal so lang wie die Pille selbst und schob die
           übrigen Lampen aus der Zeile. */
        const s = el('span', gut ? '' : 'aus', titel);
        Bilder.tippAm(s, {
          titel,
          zeilen: [{ farbe: gut ? '#2f5d4a' : '#b04a38', was: 'Antwort', wert: wert || '—' }],
        });
        a.appendChild(s);
      });
  }

  /* Der Filter über der Runde. Er steht erst da, seit die Runde wächst: bei
     drei Karten ist er Verwaltung von Verwaltung, ab einem Dutzend sucht man
     den einen Gesperrten sonst mit den Augen. Die Zahl in der Pille sagt, was
     einen erwartet — ein Reiter, der auf eine leere Liste führt, ist eine
     Falle. Leere Reiter stehen deshalb gar nicht erst da. */
  const SIEBE = {
    alle:     { titel: 'alle',     passt: () => true },
    aktiv:    { titel: 'aktiv',    passt: u => !u.gesperrt && !u.entfernt },
    gesperrt: { titel: 'gesperrt', passt: u => !!u.gesperrt },
    entfernt: { titel: 'entfernt', passt: u => !!u.entfernt },
  };
  let sieb = 'alle';

  function filterZeichnen(nutzer) {
    const ziel = $('filter');
    ziel.textContent = '';
    const sichtbar = Object.entries(SIEBE)
      .map(([k, v]) => [k, v, nutzer.filter(v.passt).length])
      .filter(([k, , n]) => n > 0 || k === 'alle');
    // Ein einziger Reiter ist kein Filter, sondern eine Beschriftung.
    if (sichtbar.length < 2) return;
    ziel.appendChild(el('span', 'wozu', 'zeige'));
    sichtbar.forEach(([k, v, n]) => {
      const b = el('button', k === sieb ? 'an' : null, v.titel);
      b.type = 'button';
      b.appendChild(el('i', null, String(n)));
      b.addEventListener('click', () => {
        sieb = k;
        runde(stand.nutzer);
      });
      ziel.appendChild(b);
    });
  }

  function runde(nutzer) {
    const ziel = $('runde');
    ziel.textContent = '';
    filterZeichnen(nutzer);
    nutzer.filter(SIEBE[sieb].passt).forEach(u => {
      const k = el('div', 'karte'
        + (u.gesperrt ? ' gesperrt' : '') + (u.entfernt ? ' weg' : ''));

      const kopf = el('div', 'k-kopf');
      // Der erste Buchstabe des Namens. `Array.from`, nicht `[0]`: ein Name
      // darf mit einem Zeichen anfangen, das aus zwei Codeeinheiten besteht.
      kopf.appendChild(el('span', 'k-mono',
        (Array.from(u.name || '?')[0] || '?').toUpperCase()));
      kopf.appendChild(el('span', 'k-name', u.name || 'Ehemaliger'));
      if (u.rolle === 'admin') kopf.appendChild(el('span', 'marke admin', 'Admin'));
      if (u.gemessen) kopf.appendChild(el('span', 'marke', 'gemessen'));
      if (u.ich) kopf.appendChild(el('span', 'marke ich', 'du'));
      if (u.gesperrt) kopf.appendChild(el('span', 'marke rot', 'gesperrt'));
      if (u.entfernt) kopf.appendChild(el('span', 'marke', 'entfernt'));
      if (u.stumm) kopf.appendChild(el('span', 'marke', 'stumm'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', u.email || (u.gemessen
        ? 'kein Postfach — meldet aus der Wohnung'
        : 'keine Adresse mehr')));

      if (u.gesperrt) {
        k.appendChild(el('p', 'k-grund',
          (u.gesperrt.grund || 'Ohne Grund gesperrt.')
          + ' — ' + u.gesperrt.von + ', ' + datum(u.gesperrt.seit)));
      }

      const zahlen = el('div', 'k-zahlen');
      const feld = (was, wert) => {
        const d = el('div');
        d.appendChild(el('span', null, was));
        d.appendChild(document.createTextNode(wert));
        zahlen.appendChild(d);
      };
      feld('Geräte', zahl(u.geraete));
      feld('Meldungen', zahl(u.meldungen));
      feld('zuletzt', u.zuletzt ? nurTag(u.zuletzt) : '—');
      feld('Kommentare', zahl(u.kommentare));
      feld('Gastgeber', zahl(u.gastgeber));
      feld('bewertet von', zahl(u.bewertet));
      k.appendChild(zahlen);

      if (!u.entfernt) k.appendChild(knoepfe(u));
      ziel.appendChild(k);
    });
  }

  /* Jede zerstörende Handlung fragt zurück — als zweiter Klick auf denselben
     Knopf, mit dem Namen im Satz darüber. Kein confirm(): der Systemdialog
     reißt einen aus dem Blatt, und man klickt ihn weg, ohne ihn zu lesen. */
  let sicher = null;   // 'id:aktion', solange die Rückfrage steht
  let sicherUhr = null;

  function knoepfe(u) {
    const zeile = el('div', 'k-tat');
    const tat = (aktion, wort, zerstoerend) => {
      const b = el('button', null, wort);
      const schluessel = u.id + ':' + aktion;
      if (sicher === schluessel) { b.className = 'sicher'; b.textContent = 'wirklich?'; }
      b.addEventListener('click', () => handeln(u, aktion, schluessel, zerstoerend));
      zeile.appendChild(b);
    };

    if (u.gesperrt) tat('entsperren', 'entsperren', false);
    else if (!u.ich) tat('sperren', 'sperren', true);

    if (!u.ich && !u.gemessen) {
      tat('rolle', u.rolle === 'admin' ? 'zu User machen' : 'zu Admin machen', true);
      tat('entfernen', 'entfernen', true);
    }

    // Das Feld für den Sperrgrund steht erst da, wenn die Rückfrage steht:
    // vorher wäre es ein leeres Kästchen an jeder Karte.
    if (sicher === u.id + ':sperren') {
      const f = el('input');
      f.type = 'text';
      f.id = 'grund-' + u.id;
      f.maxLength = 120;
      f.placeholder = 'Grund (freiwillig, er liest ihn)';
      f.style.marginTop = '6px';
      zeile.appendChild(f);
      setTimeout(() => f.focus(), 0);
    }
    return zeile;
  }

  async function handeln(u, aktion, schluessel, zerstoerend) {
    if (zerstoerend && sicher !== schluessel) {
      sicher = schluessel;
      clearTimeout(sicherUhr);
      // Die Rückfrage verfällt von selbst: ein „wirklich?" das eine Stunde
      // stehen bleibt, wird irgendwann versehentlich getroffen.
      sicherUhr = setTimeout(() => {
        sicher = null;
        runde(stand.nutzer);
        // Der Satz muss mit weg. Bleibt er stehen, während die Knöpfe schon
        // wieder harmlos aussehen, liest man ihn als Zustand statt als Frage.
        sagt('runde-sagt', '');
      }, 8000);
      runde(stand.nutzer);
      sagt('runde-sagt', worte(u, aktion));
      return;
    }
    const grundFeld = $('grund-' + u.id);
    const grund = grundFeld ? grundFeld.value : '';
    sicher = null;
    clearTimeout(sicherUhr);
    sagt('runde-sagt', '');
    try {
      await ruf('/api/admin/nutzer', { id: u.id, aktion, grund });
      await laden();
      sagt('runde-sagt', getan(u, aktion));
    } catch (e) {
      runde(stand.nutzer);
      sagt('runde-sagt', e.message, true);
    }
  }

  const worte = (u, aktion) => ({
    sperren: `${u.name} sperren? Er sieht die Tafel weiter, kann aber nichts mehr `
           + 'eintragen und fällt aus dem Rad.',
    rolle: u.rolle === 'admin'
      ? `${u.name} die Adminrechte nehmen?`
      : `${u.name} zum Admin machen? Er sieht dann alle Adressen und kann sperren.`,
    entfernen: `${u.name} entfernen? Name und Adresse verschwinden, seine Beiträge `
             + 'bleiben als „Ehemaliger" stehen. Zurückholen geht nicht.',
  }[aktion] || '');

  const getan = (u, aktion) => ({
    sperren: `${u.name} ist gesperrt.`,
    entsperren: `${u.name} darf wieder.`,
    rolle: `Die Rolle von ${u.name} ist getauscht.`,
    entfernen: `${u.name} ist entfernt. Die Beiträge stehen als „Ehemaliger" da.`,
  }[aktion] || 'Erledigt.');

  /* Der Zeitraum. Dieselbe Liste wie im Worker — sie steht an zwei Stellen,
     weil die Seite die Reiter zeichnen muss, bevor sie eine Antwort hat. Der
     Worker prüft trotzdem selbst: was von hier kommt, ist ein Wunsch, keine
     Erlaubnis. Was er tatsächlich genommen hat, sagt er in `tage` zurück, und
     danach richten sich die Überschriften.

     Die Wahl überlebt das Neuladen — wer sich für 90 Tage entschieden hat,
     will nicht bei jedem Aufschlagen wieder klicken. */
  const STAT_TAGE = [30, 60, 90];
  const ZEITRAUM_SPEICHER = 'beerstock-kontor-tage';
  let zeitraum = (() => {
    try {
      const g = Number(localStorage.getItem(ZEITRAUM_SPEICHER));
      return STAT_TAGE.includes(g) ? g : STAT_TAGE[0];
    } catch { return STAT_TAGE[0]; }
  })();

  function zeitraumZeichnen() {
    const ziel = $('zeitraum');
    ziel.textContent = '';
    ziel.appendChild(el('span', 'wozu', 'Zeitraum'));
    STAT_TAGE.forEach(t => {
      const b = el('button', t === zeitraum ? 'an' : null, t + ' Tage');
      b.type = 'button';
      b.addEventListener('click', () => zeitraumWechseln(t));
      ziel.appendChild(b);
    });
  }

  async function zeitraumWechseln(t) {
    if (t === zeitraum) return;
    zeitraum = t;
    try { localStorage.setItem(ZEITRAUM_SPEICHER, String(t)); } catch {}
    zeitraumZeichnen();
    /* Die alten Bilder bleiben blass stehen, statt zu verschwinden: ein
       Abschnitt, der beim Umschalten leer wird und dann wieder aufpoppt,
       springt — und die neuen Bilder stehen ohnehin an derselben Stelle. */
    const ziel = $('bilder');
    ziel.style.opacity = '.35';
    try {
      const s = await ruf('/api/admin/statistik?tage=' + t);
      statistik(s);
      // Der Kopf hängt mit dran: „+2 in 30 Tagen" unter der Melderzahl wäre
      // sonst der Satz zum vorigen Zeitraum.
      if (stand && mich) kopfZeichnen(stand.kopf, mich, letzteAmpel, s);
    } catch (e) {
      sagt('stat-sagt', 'Der Zeitraum ließ sich nicht wechseln: ' + e.message, true);
    } finally {
      ziel.style.opacity = '';
    }
  }

  function statistik(s) {
    zeitraumZeichnen();
    const ziel = $('bilder');
    ziel.textContent = '';
    /* Der Zeitraum steht in jeder einzelnen Überschrift, nicht nur oben am
       Schalter — und bei den beiden Ranglisten steht „insgesamt". Sie folgen
       dem Schalter absichtlich nicht (der Worker begründet es an der Route):
       wer der Gastgeber dieser Runde ist, beantworten 30 Tage nicht. Ohne das
       Wort in der Überschrift müsste man das raten. */
    // `s.tage` kommt vom Worker, `zeitraum` ist der Wunsch von hier. Der
    // Rückfall ist nicht theoretisch: zwischen Seiten-Push und Worker-Deploy
    // liegen Minuten, in denen die neue Seite die alte Antwort bekommt.
    const fenster = ', ' + (s.tage || zeitraum) + ' Tage';
    ziel.appendChild(Bilder.flaeche('Meldungen je Tag' + fenster,
      s.meldungen, z => z.n, z => nurTag(z.tag), 'Meldungen'));
    ziel.appendChild(Bilder.schar('Bestand je Melder' + fenster, s.bestand));
    // Direkt hinter dem Bestand: beide Kurven kommen aus derselben Meldung,
    // und nebeneinander sieht man, ob der Kühlschrank mit dem Nachlegen
    // hochgeht. `|| []` — die alte Antwort kennt das Feld noch nicht.
    ziel.appendChild(Bilder.grad('Temperatur je Melder' + fenster, s.grad || []));
    ziel.appendChild(Bilder.liegend('Wer war wie oft Gastgeber, insgesamt',
      s.gastgeber, z => z.name, z => z.n, 'Abende'));
    ziel.appendChild(Bilder.band('Ausgang der Ziehungen, insgesamt', s.lose));
    ziel.appendChild(Bilder.losJeMelder('Ausgang der Ziehungen je Melder, insgesamt',
      s.lose_je_melder || []));
    ziel.appendChild(Bilder.saeulen('Betrieb je Woche' + fenster, s.betrieb, [
      { feld: 'kommentare', titel: 'Kommentare', farbe: REIHE[0] },
      { feld: 'reaktionen', titel: 'Reaktionen', farbe: REIHE[1] },
      { feld: 'sterne',     titel: 'Sterne',     farbe: REIHE[3] },
    ], g => 'KW ' + String(g.woche).slice(-2)));
    ziel.appendChild(Bilder.saeulen('Mails je Art' + fenster, s.mails, [
      { feld: 'n',      titel: 'verschickt', farbe: REIHE[0] },
      { feld: 'kaputt', titel: 'ging nicht raus', farbe: REIHE[2] },
    ], g => g.art.replace(/_/g, ' ')));
    // Die Farbe kommt von hier, nicht vom Worker: der kennt die Palette des
    // Kontors nicht, nur die Reihenfolge (meistbeschaeftigt zuerst).
    const aufrufeReihen = (s.aufrufe_nutzer_reihen || [])
      .map((r, i) => ({ ...r, farbe: REIHE[i % REIHE.length] }));
    ziel.appendChild(Bilder.saeulen('Seitenaufrufe je Tag, nach Nutzer' + fenster,
      s.aufrufe_je_tag || [], aufrufeReihen, g => nurTag(g.tag)));
    ziel.appendChild(Bilder.liegend('Seitenaufrufe je Nutzer, insgesamt',
      s.aufrufe_je_nutzer || [], z => z.name, z => z.n, 'Aufrufe'));

    /* Jedes Bild bekommt seine Überschrift als Namen. `role="img"` ohne
       Beschriftung ist für einen Screenreader ein leeres Bild — und seit die
       Bilder ein Tabstop sind, landet man dort auch tatsächlich. An einer
       Stelle für alle sechs, statt sechsmal dasselbe Attribut. */
    [...ziel.querySelectorAll('.bild')].forEach(b => {
      const svg = b.querySelector('svg'), h3 = b.querySelector('h3');
      if (svg && h3) {
        svg.setAttribute('aria-label',
          h3.textContent + (svg.hasAttribute('tabindex')
            ? ' — mit den Pfeiltasten durch die Werte' : ''));
      }
    });

    const zz = $('zwei-zahlen');
    zz.textContent = '';
    const paar = (was, wert) => {
      const d = el('span');
      d.appendChild(el('b', null, wert));
      d.appendChild(document.createTextNode(' ' + was));
      zz.appendChild(d);
    };
    const w = s.wachstum.length ? s.wachstum[s.wachstum.length - 1].n : 0;
    paar('Angemeldete insgesamt', zahl(w));
    paar('von ' + zahl(s.postwillig.alle) + ' mit Adresse wollen noch Post',
      zahl(s.postwillig.willig));
    paar('Seitenaufrufe insgesamt', zahl(s.aufrufe_insgesamt || 0));
  }

  /* Ein Zeichen je Handlung. Keine Emoji: die kämen aus einer fremden
     Schrift, wären bunt und säßen auf einem Blatt Papier wie ein Aufkleber.
     Diese hier sind Zeichen, die auch ein Setzer gehabt hätte. */
  const LOG_ZEICHEN = {
    sperren:    ['⊘', 'rot'],
    entsperren: ['⊙', 'gruen'],
    rolle:      ['⇅', ''],
    entfernen:  ['✕', 'rot'],
    rundmail:   ['✉', ''],
  };

  function protokoll(zeilen) {
    const ziel = $('log');
    ziel.textContent = '';
    if (!zeilen.length) {
      ziel.appendChild(el('li', 'leer-hinweis', 'Noch hat niemand etwas verwaltet.'));
      return;
    }
    zeilen.forEach(z => {
      const li = el('li');
      const [glyph, ton] = LOG_ZEICHEN[z.aktion] || ['·', ''];
      li.appendChild(el('span', 'zeichen ' + ton, glyph));
      const t = el('time', null, vorhin(z.wann));
      t.dateTime = z.wann;
      // Das genaue Datum bleibt erreichbar — im selben Kasten wie überall
      // sonst auf dieser Seite, nicht als grauer Systemtooltip.
      Bilder.tippAm(t, { titel: datum(z.wann), zeilen: [] });
      li.appendChild(t);
      li.appendChild(el('span', 'was', z.wer + ' → ' + z.aktion));
      li.appendChild(el('span', null, z.aktion === 'rundmail'
        ? '„' + (z.detail || '') + '"'
        : z.wen + (z.detail && z.aktion !== 'entfernen' ? ' (' + z.detail + ')' : '')));
      ziel.appendChild(li);
    });
  }

  // ==========================================================================
  // Rundmail — Vorschau, dann erst der Versand mit der Zahl im Knopf.
  // Jetzt oder geplant, mit Bild und Knopf; die Vorschau sieht aus wie die
  // echte Mail (siehe .mail-vorschau), nicht wie das Kontorbuch drumherum.
  // ==========================================================================
  let vorschauSteht = false;
  let planModus = 'jetzt';   // 'jetzt' | 'spaeter'
  let geplantId = null;      // gesetzt beim Bearbeiten einer geplanten Rundmail
  let geplant = [];          // letzte Antwort von GET /api/admin/rundmail/geplant

  function zaehler() {
    const n = $('r-text').value.length;
    $('r-zaehler').textContent = n ? n + ' von 4000 Zeichen' : '';
  }
  ['r-text', 'r-betreff', 'r-bild', 'r-knopf-text', 'r-knopf-link', 'r-datum', 'r-zeit']
    .forEach(id => $(id).addEventListener('input', vorschauWeg));
  $('r-text').addEventListener('input', zaehler);

  function vorschauWeg() {
    if (!vorschauSteht) return;
    vorschauSteht = false;
    $('r-vorschau').hidden = true;
    $('r-weg').hidden = true;
    $('r-ab').textContent = 'Vorschau';
    sagt('rund-sagt', '');
  }

  $('r-weg').addEventListener('click', vorschauWeg);

  function planReiterZeichnen() {
    const ziel = $('r-wann');
    ziel.textContent = '';
    [['jetzt', 'Jetzt'], ['spaeter', 'Später planen']].forEach(([k, titel]) => {
      const b = el('button', k === planModus ? 'an' : null, titel);
      b.type = 'button';
      b.addEventListener('click', () => {
        if (planModus === k) return;
        planModus = k;
        planReiterZeichnen();
        $('r-spaeter').hidden = planModus !== 'spaeter';
        vorschauWeg();
      });
      ziel.appendChild(b);
    });
  }
  planReiterZeichnen();

  /* Aus einem Datum ('YYYY-MM-DD') und einer Uhrzeit ('HH:MM') den
     Zeitpunkt in UTC — dieselbe Rechnung wie auf der Tafel (`alsUTC`): ohne
     Zonenangabe liest der Browser das als Ortszeit, und genau das ist hier
     gewollt. */
  function alsUTC(tag, zeit) {
    if (!tag || !zeit) return null;
    const d = new Date(tag + 'T' + zeit + ':00');
    return isNaN(d) ? null : d.toISOString();
  }

  // Der Rückweg fürs Bearbeiten: aus einem UTC-Zeitpunkt wieder Datum und
  // Uhrzeit in ORTSZEIT für die beiden Felder — nicht über `toISOString`,
  // das würde auf UTC zurückrechnen und in der Nacht den falschen Tag zeigen.
  function ortsFelder(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return {
      datum: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      zeit: pad(d.getHours()) + ':' + pad(d.getMinutes()),
    };
  }

  function formZuruecksetzen() {
    $('r-betreff').value = '';
    $('r-text').value = '';
    $('r-bild').value = '';
    $('r-knopf-text').value = '';
    $('r-knopf-link').value = '';
    $('r-datum').value = '';
    $('r-zeit').value = '';
    geplantId = null;
    planModus = 'jetzt';
    planReiterZeichnen();
    $('r-spaeter').hidden = true;
    zaehler();
    vorschauWeg();
  }

  // Eine geplante Rundmail zum Bearbeiten in die Maske laden.
  function geplantInFormular(g) {
    $('r-betreff').value = g.betreff;
    $('r-text').value = g.text;
    $('r-bild').value = g.bild_url || '';
    $('r-knopf-text').value = g.knopf_text || '';
    $('r-knopf-link').value = g.knopf_link || '';
    geplantId = g.id;
    planModus = 'spaeter';
    planReiterZeichnen();
    $('r-spaeter').hidden = false;
    const f = ortsFelder(g.versand_am);
    $('r-datum').value = f.datum;
    $('r-zeit').value = f.zeit;
    zaehler();
    vorschauWeg();
    $('r-betreff').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* Der Rahmen um die Mail, wie `mailRumpf` im Worker sie schickt — serifenlos
     auf Weiß, damit die Vorschau zeigt, was tatsächlich im Postfach landet,
     nicht das Kontorbuch drumherum. Bild und Knopf kommen 1:1 aus denselben
     Feldern, die auch die API bekommt. */
  function mailVorschau({ betreff, text, bildUrl, knopfText, knopfLink }) {
    const kasten = el('div', 'mail-vorschau');
    const kopf = el('div', 'mv-kopf');
    kopf.appendChild(el('span', null, 'Betreff'));
    kopf.appendChild(el('strong', null, betreff));
    kasten.appendChild(kopf);

    const rumpf = el('div', 'mv-rumpf');
    if (bildUrl) {
      const img = document.createElement('img');
      img.src = bildUrl;
      img.alt = '';
      img.className = 'mv-bild';
      rumpf.appendChild(img);
    }
    text.split(/\n{2,}/).forEach(a => {
      const p = el('p');
      p.style.cssText = 'margin:0 0 12px';
      a.split('\n').forEach((zeile, i) => {
        if (i) p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode(zeile));
      });
      rumpf.appendChild(p);
    });
    if (knopfText && knopfLink) {
      const a = document.createElement('a');
      a.href = knopfLink;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'mv-knopf';
      a.textContent = knopfText;
      rumpf.appendChild(a);
    }
    kasten.appendChild(rumpf);
    return kasten;
  }

  // Testmail: geht nur an den eigenen Posteingang, an der Stundensperre
  // vorbei und ohne im Protokoll oder in der Mail-Statistik aufzutauchen
  // (siehe /api/admin/rundmail/test im Worker) - deshalb ohne den
  // Zwei-Klick-Umweg über die Vorschau, das Risiko ist ja nur die eigene Post.
  $('r-test').addEventListener('click', async () => {
    const betreff = $('r-betreff').value.trim();
    const text = $('r-text').value.trim();
    const bildUrl = $('r-bild').value.trim();
    const knopfText = $('r-knopf-text').value.trim();
    const knopfLink = $('r-knopf-link').value.trim();

    if (!betreff || !text) {
      sagt('rund-sagt', 'Betreff und Text wollen beide etwas.', true);
      return;
    }
    if (!!knopfText !== !!knopfLink) {
      sagt('rund-sagt', 'Der Knopf braucht Text UND Adresse, oder keins von beiden.', true);
      return;
    }

    $('r-test').disabled = true;
    try {
      const d = await ruf('/api/admin/rundmail/test', {
        betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
      });
      sagt('rund-sagt', 'Testmail raus an ' + d.email + '.');
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    } finally {
      $('r-test').disabled = false;
    }
  });

  $('r-ab').addEventListener('click', async () => {
    const betreff = $('r-betreff').value.trim();
    const text = $('r-text').value.trim();
    const bildUrl = $('r-bild').value.trim();
    const knopfText = $('r-knopf-text').value.trim();
    const knopfLink = $('r-knopf-link').value.trim();

    if (!betreff || !text) {
      sagt('rund-sagt', 'Betreff und Text wollen beide etwas.', true);
      return;
    }
    if (!!knopfText !== !!knopfLink) {
      sagt('rund-sagt', 'Der Knopf braucht Text UND Adresse, oder keins von beiden.', true);
      return;
    }

    let versandAm = null;
    if (planModus === 'spaeter') {
      versandAm = alsUTC($('r-datum').value, $('r-zeit').value);
      if (!versandAm) {
        sagt('rund-sagt', 'Datum und Uhrzeit wollen beide etwas.', true);
        return;
      }
      if (new Date(versandAm).getTime() <= Date.now() + 60000) {
        sagt('rund-sagt', 'Der Zeitpunkt muss in der Zukunft liegen.', true);
        return;
      }
    }

    /* Erst zeigen, dann schicken. Eine Rundmail an die ganze Runde ist die
       eine Handlung hier, die sich nicht zurücknehmen lässt — sie liegt
       binnen Sekunden in fünf Postfächern (oder wartet bis zum geplanten
       Zeitpunkt, was dasselbe Versprechen ist, nur später eingelöst). */
    if (!vorschauSteht) {
      const v = $('r-vorschau');
      v.textContent = '';
      v.hidden = false;
      v.appendChild(mailVorschau({ betreff, text, bildUrl, knopfText, knopfLink }));
      vorschauSteht = true;
      $('r-weg').hidden = false;
      if (planModus === 'jetzt') {
        const wieViele = stand ? stand.nutzer.filter(u =>
          !u.entfernt && !u.gesperrt && !u.stumm && u.email && u.mail.rundmail).length : 0;
        $('r-ab').textContent = wieViele === 1
          ? 'An 1 Melder schicken'
          : 'An ' + wieViele + ' Melder schicken';
      } else {
        $('r-ab').textContent = (geplantId ? 'Änderung speichern — ' : 'Planen für ')
          + datum(versandAm);
      }
      return;
    }

    $('r-ab').disabled = true;
    try {
      let erfolg;
      if (planModus === 'jetzt') {
        const d = await ruf('/api/admin/rundmail', {
          betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
        });
        erfolg = d.empfaenger === 1 ? 'Raus an einen Melder.' : 'Raus an ' + d.empfaenger + ' Melder.';
      } else if (geplantId) {
        await ruf('/api/admin/rundmail/geplant/aendern', {
          id: geplantId, betreff, text,
          bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
          versand_am: versandAm,
        });
        erfolg = 'Geändert — geplant für ' + datum(versandAm) + '.';
      } else {
        await ruf('/api/admin/rundmail/planen', {
          betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
          versand_am: versandAm,
        });
        erfolg = 'Geplant für ' + datum(versandAm) + '.';
      }
      // Erst zuruecksetzen (das raeumt auch die Vorschau und die alte
      // Nachricht weg), DANACH die neue Nachricht setzen - sonst loescht
      // `formZuruecksetzen` den Satz, den es gerade erst zu lesen gab.
      formZuruecksetzen();
      sagt('rund-sagt', erfolg);
      await laden();
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    } finally {
      $('r-ab').disabled = false;
    }
  });

  // --- Die geplanten Rundmails: bearbeiten oder verwerfen, solange sie noch
  //     anstehen. Verwerfen fragt zurück wie bei den Mitgliedern — zweiter
  //     Klick auf denselben Knopf, kein confirm(). ---------------------------
  let sicherGeplant = null;
  let sicherGeplantUhr = null;

  function geplantZeichnen(liste) {
    geplant = liste;
    const wrapper = $('r-geplant');
    const ziel = $('r-geplant-liste');
    ziel.textContent = '';
    wrapper.hidden = !liste.length;
    if (!liste.length) return;

    liste.forEach(g => {
      const k = el('div', 'karte' + (g.status === 'fehlgeschlagen' ? ' gesperrt' : ''));
      const kopf = el('div', 'k-kopf');
      kopf.appendChild(el('span', 'k-name', g.betreff));
      if (g.status === 'fehlgeschlagen') kopf.appendChild(el('span', 'marke rot', 'fehlgeschlagen'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', 'geplant für ' + datum(g.versand_am)
        + (g.status === 'fehlgeschlagen' && g.fehler ? ' — ' + g.fehler : '')));

      if (g.status === 'geplant') {
        const zeile = el('div', 'k-tat');
        const bearb = el('button', null, 'bearbeiten');
        bearb.type = 'button';
        bearb.addEventListener('click', () => geplantInFormular(g));
        zeile.appendChild(bearb);

        const schluessel = 'geplant:' + g.id;
        const weg = el('button', sicherGeplant === schluessel ? 'sicher' : null,
          sicherGeplant === schluessel ? 'wirklich?' : 'verwerfen');
        weg.type = 'button';
        weg.addEventListener('click', () => geplantVerwerfen(g, schluessel));
        zeile.appendChild(weg);
        k.appendChild(zeile);
      }
      ziel.appendChild(k);
    });
  }

  async function geplantVerwerfen(g, schluessel) {
    if (sicherGeplant !== schluessel) {
      sicherGeplant = schluessel;
      clearTimeout(sicherGeplantUhr);
      sicherGeplantUhr = setTimeout(() => { sicherGeplant = null; geplantZeichnen(geplant); }, 8000);
      geplantZeichnen(geplant);
      return;
    }
    sicherGeplant = null;
    clearTimeout(sicherGeplantUhr);
    try {
      await ruf('/api/admin/rundmail/geplant/aendern', { id: g.id, verwerfen: true });
      if (geplantId === g.id) formZuruecksetzen();
      sagt('rund-sagt', '„' + g.betreff + '" verworfen.');
      await laden();
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    }
  }

  // ==========================================================================
  // Laden
  // ==========================================================================
  const BLAETTER = ['kopf-blatt', 'runde-blatt', 'stat-blatt', 'rund-blatt', 'log-blatt'];

  function zeigeTuer(text) {
    $('skelett').hidden = true;
    BLAETTER.forEach(id => { $(id).hidden = true; });
    $('tuer').hidden = false;
    if (text) $('tuer-text').textContent = text;
  }

  async function laden() {
    if (!merke()) {
      zeigeTuer('Auf diesem Gerät ist niemand angemeldet. Melde dich auf der Tafel an — '
              + 'das Kontor benutzt dasselbe Token.');
      return;
    }
    try {
      mich = await ruf('/api/me');
    } catch {
      zeigeTuer('Die Anmeldung gilt hier nicht mehr. Melde dich auf der Tafel neu an.');
      return;
    }
    if (mich.rolle !== 'admin') {
      zeigeTuer('Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.');
      return;
    }

    /* Alle fünf auf einmal: sie hängen nicht voneinander ab, und
       nacheinander wäre das Kontor fünfmal so lange leer. `health` darf
       scheitern, ohne den Rest mitzureißen — es ist die Ampel, nicht der
       Inhalt. */
    const [leute, stat, log, geplantListe, health] = await Promise.all([
      ruf('/api/admin/nutzer'),
      ruf('/api/admin/statistik?tage=' + zeitraum),
      ruf('/api/admin/protokoll'),
      ruf('/api/admin/rundmail/geplant'),
      fetch(API + '/api/health', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
    ]);

    /* Die Blätter kommen erst JETZT, nicht schon vor dem Abruf: fünf leere
       Kästen mit Überschriften sind keine Auskunft, sondern eine Behauptung.
       Bis hierher stand das Skelett. Beim Nachladen nach einer Handlung
       ändert sich hier nichts — sichtbar bleibt sichtbar, kein Flackern. */
    $('skelett').hidden = true;
    $('tuer').hidden = true;
    BLAETTER.forEach(id => { $(id).hidden = false; });

    // Ein Tooltip, der noch offen steht, zeigt gleich auf einen Punkt, den es
    // nicht mehr gibt.
    Bilder.tippZu();

    stand = leute;
    letzteAmpel = health;
    kopfZeichnen(leute.kopf, mich, health, stat);
    runde(leute.nutzer);
    statistik(stat);
    protokoll(log.zeilen);
    geplantZeichnen(geplantListe.zeilen);
  }

  laden().catch(e => zeigeTuer('Das Kontor ließ sich nicht aufschlagen: ' + e.message));
</script>
</body>
</html>
