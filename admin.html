    if (planModus === 'jetzt') {
      const n = empfaengerZahl();
      b.textContent = n === 1 ? 'An 1 Melder schicken' : 'An ' + n + ' Melder schicken';
      return;
    }
    const wann = alsUTC($('r-datum').value, $('r-zeit').value);
    b.textContent = (geplantId ? 'Änderung speichern' : 'Planen')
      + (wann ? ' — ' + datum(wann) : '');
  }

  /* Die stehende Rückfrage. Sie verfällt von selbst: ein „wirklich?", das
     eine Stunde stehen bleibt, wird irgendwann versehentlich getroffen. */
  let abSicher = false;
  let abSicherUhr = null;

  function absicherungWeg() {
    if (!abSicher) return;
    abSicher = false;
    clearTimeout(abSicherUhr);
    $('r-ab').classList.remove('sicher');
    knopfBeschriften();
  }

  function planReiterZeichnen() {
    const ziel = $('r-wann');
    ziel.textContent = '';
    [['jetzt', 'Jetzt'], ['spaeter', 'Später planen']].forEach(([k, titel]) => {
      const b = el('button', k === planModus ? 'an' : null, titel);
      b.type = 'button';
      b.addEventListener('click', () => {
        if (planModus === k) return;
        planModus = k;
        planReiterZeichnen();
        $('r-spaeter').hidden = planModus !== 'spaeter';
        absicherungWeg();
        knopfBeschriften();
      });
      ziel.appendChild(b);
    });
  }
  planReiterZeichnen();
  // Einmal gleich, damit im leeren Blatt nicht ein weißes Nichts steht — und
  // der Knopf schon eine Beschriftung hat, bevor die Runde geladen ist.
  vorschauZeichnen();
  knopfBeschriften();

  /* Aus einem Datum ('YYYY-MM-DD') und einer Uhrzeit ('HH:MM') den
     Zeitpunkt in UTC — dieselbe Rechnung wie auf der Tafel (`alsUTC`): ohne
     Zonenangabe liest der Browser das als Ortszeit, und genau das ist hier
     gewollt. */
  function alsUTC(tag, zeit) {
    if (!tag || !zeit) return null;
    const d = new Date(tag + 'T' + zeit + ':00');
    return isNaN(d) ? null : d.toISOString();
  }

  // Der Rückweg fürs Bearbeiten: aus einem UTC-Zeitpunkt wieder Datum und
  // Uhrzeit in ORTSZEIT für die beiden Felder — nicht über `toISOString`,
  // das würde auf UTC zurückrechnen und in der Nacht den falschen Tag zeigen.
  function ortsFelder(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return {
      datum: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      zeit: pad(d.getHours()) + ':' + pad(d.getMinutes()),
    };
  }

  function formZuruecksetzen() {
    $('r-betreff').value = '';
    $('r-text').value = '';
    $('r-bild').value = '';
    $('r-knopf-text').value = '';
    $('r-knopf-link').value = '';
    $('r-datum').value = '';
    $('r-zeit').value = '';
    geplantId = null;
    planModus = 'jetzt';
    planReiterZeichnen();
    $('r-spaeter').hidden = true;
    zaehler();
    absicherungWeg();
    vorschauZeichnen();
    knopfBeschriften();
  }

  // Eine geplante Rundmail zum Bearbeiten in die Maske laden.
  function geplantInFormular(g) {
    $('r-betreff').value = g.betreff;
    $('r-text').value = g.text;
    $('r-bild').value = g.bild_url || '';
    $('r-knopf-text').value = g.knopf_text || '';
    $('r-knopf-link').value = g.knopf_link || '';
    geplantId = g.id;
    planModus = 'spaeter';
    planReiterZeichnen();
    $('r-spaeter').hidden = false;
    const f = ortsFelder(g.versand_am);
    $('r-datum').value = f.datum;
    $('r-zeit').value = f.zeit;
    zaehler();
    absicherungWeg();
    vorschauZeichnen();
    knopfBeschriften();
    $('r-betreff').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* Der Rahmen um die Mail, wie `mailRumpf` im Worker sie schickt — serifenlos
     auf Weiß, damit die Vorschau zeigt, was tatsächlich im Postfach landet,
     nicht das Kontorbuch drumherum. Bild und Knopf kommen 1:1 aus denselben
     Feldern, die auch die API bekommt. */
  function mailVorschau({ betreff, text, bildUrl, knopfText, knopfLink }) {
    const kasten = el('div', 'mail-vorschau');
    const kopf = el('div', 'mv-kopf');
    kopf.appendChild(el('span', null, 'Betreff'));
    kopf.appendChild(el('strong', null, betreff));
    kasten.appendChild(kopf);

    const rumpf = el('div', 'mv-rumpf');
    if (bildUrl) {
      const img = document.createElement('img');
      img.src = bildUrl;
      img.alt = '';
      img.className = 'mv-bild';
      rumpf.appendChild(img);
    }
    text.split(/\n{2,}/).forEach(a => {
      const p = el('p');
      p.style.cssText = 'margin:0 0 12px';
      a.split('\n').forEach((zeile, i) => {
        if (i) p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode(zeile));
      });
      rumpf.appendChild(p);
    });
    if (knopfText && knopfLink) {
      const a = document.createElement('a');
      a.href = knopfLink;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'mv-knopf';
      a.textContent = knopfText;
      rumpf.appendChild(a);
    }
    kasten.appendChild(rumpf);
    return kasten;
  }

  // Testmail: geht nur an den eigenen Posteingang, an der Stundensperre
  // vorbei und ohne im Protokoll oder in der Mail-Statistik aufzutauchen
  // (siehe /api/admin/rundmail/test im Worker) - deshalb ohne den
  // Zwei-Klick-Umweg über die Vorschau, das Risiko ist ja nur die eigene Post.
  $('r-test').addEventListener('click', async () => {
    const betreff = $('r-betreff').value.trim();
    const text = $('r-text').value.trim();
    const bildUrl = $('r-bild').value.trim();
    const knopfText = $('r-knopf-text').value.trim();
    const knopfLink = $('r-knopf-link').value.trim();

    if (!betreff || !text) {
      sagt('rund-sagt', 'Betreff und Text wollen beide etwas.', true);
      return;
    }
    if (!!knopfText !== !!knopfLink) {
      sagt('rund-sagt', 'Der Knopf braucht Text UND Adresse, oder keins von beiden.', true);
      return;
    }

    $('r-test').disabled = true;
    try {
      const d = await ruf('/api/admin/rundmail/test', {
        betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
      });
      sagt('rund-sagt', 'Testmail raus an ' + d.email + '.');
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    } finally {
      $('r-test').disabled = false;
    }
  });

  $('r-ab').addEventListener('click', async () => {
    const { betreff, text, bildUrl, knopfText, knopfLink } = rundmailFelder();

    if (!betreff || !text) {
      sagt('rund-sagt', 'Betreff und Text wollen beide etwas.', true);
      return;
    }
    if (!!knopfText !== !!knopfLink) {
      sagt('rund-sagt', 'Der Knopf braucht Text UND Adresse, oder keins von beiden.', true);
      return;
    }

    let versandAm = null;
    if (planModus === 'spaeter') {
      versandAm = alsUTC($('r-datum').value, $('r-zeit').value);
      if (!versandAm) {
        sagt('rund-sagt', 'Datum und Uhrzeit wollen beide etwas.', true);
        return;
      }
      if (new Date(versandAm).getTime() <= Date.now() + 60000) {
        sagt('rund-sagt', 'Der Zeitpunkt muss in der Zukunft liegen.', true);
        return;
      }
    }

    /* Die Rückfrage. Eine Rundmail an die ganze Runde ist die eine Handlung
       hier, die sich nicht zurücknehmen lässt — sie liegt binnen Sekunden in
       fünf Postfächern (oder wartet bis zum geplanten Zeitpunkt, was dasselbe
       Versprechen ist, nur später eingelöst). Was verschickt wird, steht
       daneben und muss nicht mehr erst aufgeschlagen werden; hier fehlt nur
       noch das Ja.

       Sie steht ACHT Sekunden, wie bei den Mitgliedern, und fällt bei jedem
       Tastendruck im Formular zurück — siehe `absicherungWeg`. */
    if (!abSicher) {
      abSicher = true;
      $('r-ab').classList.add('sicher');
      $('r-ab').textContent = planModus === 'jetzt'
        ? 'wirklich? an ' + empfaengerZahl() + ' raus'
        : 'wirklich? ' + datum(versandAm);
      sagt('rund-sagt', planModus === 'jetzt'
        ? 'Nochmal drücken, dann geht sie raus. Zurückholen geht nicht.'
        : 'Nochmal drücken, dann steht sie im Kalender.');
      clearTimeout(abSicherUhr);
      abSicherUhr = setTimeout(() => {
        absicherungWeg();
        // Der Satz muss mit weg. Bleibt er stehen, während der Knopf schon
        // wieder harmlos aussieht, liest man ihn als Zustand statt als Frage.
        sagt('rund-sagt', '');
      }, 8000);
      return;
    }
    absicherungWeg();
    sagt('rund-sagt', '');

    $('r-ab').disabled = true;
    try {
      let erfolg;
      if (planModus === 'jetzt') {
        const d = await ruf('/api/admin/rundmail', {
          betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
        });
        erfolg = d.empfaenger === 1 ? 'Raus an einen Melder.' : 'Raus an ' + d.empfaenger + ' Melder.';
      } else if (geplantId) {
        await ruf('/api/admin/rundmail/geplant/aendern', {
          id: geplantId, betreff, text,
          bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
          versand_am: versandAm,
        });
        erfolg = 'Geändert — geplant für ' + datum(versandAm) + '.';
      } else {
        await ruf('/api/admin/rundmail/planen', {
          betreff, text, bild_url: bildUrl, knopf_text: knopfText, knopf_link: knopfLink,
          versand_am: versandAm,
        });
        erfolg = 'Geplant für ' + datum(versandAm) + '.';
      }
      // Erst zuruecksetzen (das raeumt Felder, Vorschau und Rueckfrage weg),
      // DANACH die Nachricht setzen - andersherum stuende der Satz da,
      // waehrend die Maske noch den verschickten Text zeigt.
      formZuruecksetzen();
      sagt('rund-sagt', erfolg);
      await laden();
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    } finally {
      $('r-ab').disabled = false;
    }
  });

  // --- Die geplanten Rundmails: bearbeiten oder verwerfen, solange sie noch
  //     anstehen. Verwerfen fragt zurück wie bei den Mitgliedern — zweiter
  //     Klick auf denselben Knopf, kein confirm(). ---------------------------
  let sicherGeplant = null;
  let sicherGeplantUhr = null;

  function geplantZeichnen(liste) {
    geplant = liste;
    const wrapper = $('r-geplant');
    const ziel = $('r-geplant-liste');
    ziel.textContent = '';
    wrapper.hidden = !liste.length;
    if (!liste.length) return;

    liste.forEach(g => {
      const k = el('div', 'karte' + (g.status === 'fehlgeschlagen' ? ' gesperrt' : ''));
      const kopf = el('div', 'k-kopf');
      kopf.appendChild(el('span', 'k-name', g.betreff));
      if (g.status === 'fehlgeschlagen') kopf.appendChild(el('span', 'marke rot', 'fehlgeschlagen'));
      k.appendChild(kopf);

      k.appendChild(el('p', 'k-mail', 'geplant für ' + datum(g.versand_am)
        + (g.status === 'fehlgeschlagen' && g.fehler ? ' — ' + g.fehler : '')));

      if (g.status === 'geplant') {
        const zeile = el('div', 'k-tat');
        const bearb = el('button', null, 'bearbeiten');
        bearb.type = 'button';
        bearb.addEventListener('click', () => geplantInFormular(g));
        zeile.appendChild(bearb);

        const schluessel = 'geplant:' + g.id;
        const weg = el('button', sicherGeplant === schluessel ? 'sicher' : null,
          sicherGeplant === schluessel ? 'wirklich?' : 'verwerfen');
        weg.type = 'button';
        weg.addEventListener('click', () => geplantVerwerfen(g, schluessel));
        zeile.appendChild(weg);
        k.appendChild(zeile);
      }
      ziel.appendChild(k);
    });
  }

  async function geplantVerwerfen(g, schluessel) {
    if (sicherGeplant !== schluessel) {
      sicherGeplant = schluessel;
      clearTimeout(sicherGeplantUhr);
      sicherGeplantUhr = setTimeout(() => { sicherGeplant = null; geplantZeichnen(geplant); }, 8000);
      geplantZeichnen(geplant);
      return;
    }
    sicherGeplant = null;
    clearTimeout(sicherGeplantUhr);
    try {
      await ruf('/api/admin/rundmail/geplant/aendern', { id: g.id, verwerfen: true });
      if (geplantId === g.id) formZuruecksetzen();
      sagt('rund-sagt', '„' + g.betreff + '" verworfen.');
      await laden();
    } catch (e) {
      sagt('rund-sagt', e.message, true);
    }
  }

  // ==========================================================================
  // Das Register
  //
  // Fünf Blätter, eines davon aufgeschlagen. Vorher lagen sie alle
  // untereinander: wer ins Protokoll wollte, scrollte an elf Grafiken vorbei,
  // und wer eine Rundmail schrieb, hatte die Mitgliederliste über sich, die
  // ihn nichts anging.
  //
  // ZUNGEN trägt aber nur DREI davon. Protokoll und Rundmail haben auf der
  // Übersicht ohnehin schon eine Karte, die sagt, was dort wartet — und wer
  // dort steht, klickt den Knopf auf der Karte und nicht die Zunge darüber.
  // Zwei Wege zum selben Blatt sind einer zuviel, und die Karte ist der
  // bessere: sie beantwortet die Frage schon, für die man sonst erst
  // hingehen müsste. Was bleibt, sind die drei Blätter, die man ansteuert,
  // ohne vorher etwas gelesen zu haben.
  //
  // Steht eines der beiden zungenlosen Blätter offen, ist KEINE Zunge
  // hervorgehoben. Das ist richtig so — es lügt nicht, und der Weg zurück ist
  // „Übersicht", die erste Zunge, die dann ohnehin dasteht.
  //
  // Die Blätter selbst sind unverändert geblieben — das Register schaltet nur
  // `hidden`. Es zeichnet auch nichts nach: was aufgeschlagen war, bleibt es
  // beim Nachladen nach einer Handlung, sonst spränge man nach jedem Sperren
  // zurück auf die Übersicht.
  // ==========================================================================
  const BLAETTER = ['kopf-blatt', 'runde-blatt', 'stat-blatt', 'rund-blatt', 'log-blatt'];
  const ZUNGEN = [
    ['kopf-blatt',  'Übersicht'],
    ['runde-blatt', 'Mitglieder'],
    ['stat-blatt',  'Statistiken'],
  ];
  let offen = 'kopf-blatt';

  /* Die Zahl an einer Zunge sagt, was einen dort erwartet. Nur dort, wo sie
     etwas beantwortet: „Statistiken (11)" wäre die Anzahl der Grafiken und
     damit eine Auskunft über die Seite, nicht über die Runde. Die Zahl der
     geplanten Rundmails ist damit nicht weg — sie steht als Betreff und
     Zeitpunkt auf der Karte, und das ist mehr als eine Ziffer. */
  const zungenZahl = id => id === 'runde-blatt' && stand
    ? String(stand.nutzer.filter(u => !u.entfernt).length)
    : null;

  function registerZeichnen() {
    const ziel = $('register');
    ziel.textContent = '';
    ZUNGEN.forEach(([id, titel]) => {
      const b = el('button', id === offen ? 'an' : null, titel);
      b.type = 'button';
      b.setAttribute('aria-current', id === offen ? 'page' : 'false');
      const n = zungenZahl(id);
      if (n) b.appendChild(el('i', null, n));
      b.addEventListener('click', () => blattAuf(id));
      ziel.appendChild(b);
    });
    /* Der Weg hinaus. Er stand bisher als Link oben im Kopf-Blatt; dort war er
       nur von der Übersicht aus zu sehen, und wer im Protokoll stand, kürzte
       die Adresse von Hand. Als letzte Zunge gehört er zur Reihe, aber sein
       eigenes `margin-left: auto` rückt ihn ans andere Ende — die fünf
       Blatt-Zungen bleiben dadurch mittig.

       Der Pfeil steht für sich, das Wort hängt in einem eigenen `span`: auf
       schmalen Schirmen blendet das Blatt es aus, und die sechs Zungen passen
       dadurch in eine Reihe, wo sie sonst nicht hineinpassten. Der Name für
       Vorleseprogramme bleibt in BEIDEN Fällen derselbe — er enthält den
       sichtbaren Text, auch wenn der gerade nur ein Pfeil ist. */
    const raus = el('a', 'zur-tafel', '←');
    raus.appendChild(el('span', 'wort', ' zur Tafel'));
    raus.href = './';
    raus.setAttribute('aria-label', 'zurück zur Tafel');
    ziel.appendChild(raus);
  }

  function blattAuf(id) {
    offen = id;
    BLAETTER.forEach(b => { $(b).hidden = b !== id; });
    registerZeichnen();
    // Ein Tooltip aus dem Blatt, das gerade weggeklappt ist, stünde sonst
    // über dem neuen und zeigte auf nichts.
    Bilder.tippZu();
    scrollTo({ top: 0 });
  }

  // ==========================================================================
  // Laden
  // ==========================================================================
  function zeigeTuer(text) {
    $('skelett').hidden = true;
    $('register').hidden = true;
    BLAETTER.forEach(id => { $(id).hidden = true; });
    $('tuer').hidden = false;
    if (text) $('tuer-text').textContent = text;
  }

  async function laden() {
    if (!merke()) {
      zeigeTuer('Auf diesem Gerät ist niemand angemeldet. Melde dich auf der Tafel an — '
              + 'das Kontor benutzt dasselbe Token.');
      return;
    }
    try {
      mich = await ruf('/api/me');
    } catch {
      zeigeTuer('Die Anmeldung gilt hier nicht mehr. Melde dich auf der Tafel neu an.');
      return;
    }
    if (mich.rolle !== 'admin') {
      zeigeTuer('Hier verwaltet der Wirt. Du bist hier nur richtig, wenn du er bist.');
      return;
    }

    /* Alle fünf auf einmal: sie hängen nicht voneinander ab, und
       nacheinander wäre das Kontor fünfmal so lange leer. `health` darf
       scheitern, ohne den Rest mitzureißen — es ist die Ampel, nicht der
       Inhalt. */
    const [leute, stat, log, geplantListe, health] = await Promise.all([
      ruf('/api/admin/nutzer'),
      ruf('/api/admin/statistik?tage=' + zeitraum),
      ruf('/api/admin/protokoll'),
      ruf('/api/admin/rundmail/geplant'),
      fetch(API + '/api/health', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
    ]);

    /* Register und Blätter kommen erst JETZT, nicht schon vor dem Abruf: fünf
       Zungen über leeren Kästen sind keine Auskunft, sondern eine Behauptung.
       Bis hierher stand das Skelett. Beim Nachladen nach einer Handlung
       ändert sich hier nichts — was aufgeschlagen war, bleibt aufgeschlagen,
       kein Flackern und kein Sprung zurück auf die Übersicht. */
    $('skelett').hidden = true;
    $('tuer').hidden = true;
    $('register').hidden = false;
    BLAETTER.forEach(id => { $(id).hidden = id !== offen; });

    // Ein Tooltip, der noch offen steht, zeigt gleich auf einen Punkt, den es
    // nicht mehr gibt.
    Bilder.tippZu();

    stand = leute;
    letzteAmpel = health;
    kopfZeichnen(leute.kopf, mich, health, stat);
    runde(leute.nutzer);
    statistik(stat);
    protokoll(log.zeilen);
    geplantZeichnen(geplantListe.zeilen);
    // Die Empfängerzahl auf dem Versandknopf kommt aus `stand` — vor dem
    // ersten Abruf stand dort eine Null.
    knopfBeschriften();
    /* Zuletzt, nicht zuerst: die Zahlen an den Zungen kommen aus `stand` und
       `geplant`, und die stehen erst, seit die Zeilen darüber gelaufen sind.
       Die Querverweise auf der Übersicht hängen an denselben Daten. */
    querZeichnen(log.zeilen);
    registerZeichnen();
  }

  laden().catch(e => zeigeTuer('Das Kontor ließ sich nicht aufschlagen: ' + e.message));
</script>
</body>
</html>
