    // Über `bilderLeeren`, nicht über `textContent`: der Monatswähler wohnt im
    // Raster und soll es überleben - er ist hier nur verborgen, nicht fort.
    bilderLeeren();
    $('tuer').hidden = false;
    if (text) $('tuer-text').textContent = text;
  }

  async function laden() {
    if (!merke()) { zeigeTuer(); return; }
    if (!(G > 0)) {
      zeigeTuer('Welche Runde? Dieser Link kennt keine — geh über die Tafel hierher.');
      return;
    }
    let s;
    try {
      s = await ruf(anfrage());
    } catch (e) {
      if (e.status === 401) {
        zeigeTuer('Die Anmeldung gilt hier nicht mehr. Melde dich auf der Tafel neu an, '
                + 'dann steht der Verlauf wieder da.');
      } else if (e.status === 403) {
        // `statistik_an` ist abgeschaltet - der Einstieg verschwindet, die
        // Zahlen dahinter bleiben unangetastet (Entscheidung 18).
        zeigeTuer(e.message);
      } else {
        $('skelett').hidden = true;
        sagt('Die Zahlen ließen sich nicht holen: ' + e.message, true);
      }
      return;
    }
    // Erst jetzt weg: fünf leere Kästen mit Überschriften sind keine Auskunft.
    $('skelett').hidden = true;
    zeichnen(s);
  }

  /* --- Runterwischen führt hinaus -------------------------------------------
     Dieselbe Geste wie an den Bögen der Tafel („Runterwischen schließt" in
     `index.html`), dieselben vier Schwellen und dieselbe Uhr am Ende. HIER
     steht die Fassung für eine ganze Seite; `homeassistant.html` und
     `admin.html` tragen die Kopie davon, mit einem Verweis hierher.

     Drei Unterschiede zum Bogen, alle drei aus demselben Grund — eine Seite
     ist kein Blatt, das über etwas liegt:

     1. Gezogen wird NUR vom Griff aus. Am Bogen geht es zusätzlich von überall
        bei Scrollstand 0, weil dort das Blatt selbst der Scroller ist. Hier
        scrollt das Fenster, und ein Zug nach unten am oberen Anschlag gehört
        Chrome (Zum-Neuladen-Ziehen). Der Griff nimmt ihm die Geste per
        `touch-action: none` ganz ab; siehe den Stil.
     2. Kein Schirm blasst ab. Unter der Seite liegt nichts, was freizugeben
        wäre — ein Verlauf ins Nichts wäre eine Bewegung ohne Aussage.
     3. Der Abgang fährt um eine FENSTERHÖHE, nicht um die Höhe des Gezogenen.
        Das Brett ist auf dieser Seite ein paar tausend Pixel hoch; dieselbe
        Zahl wie am Bogen ergäbe in 220 ms einen Schmierstreifen.

     Hinausgeführt wird über den Klick auf die vorhandene, nur unsichtbare
     Pille — dieselbe Trennung wie drüben am ×. Damit gibt es genau EIN Ziel
     im Markup, und die Marke, die den Deckel auf der Tafel wieder aufschlägt
     (`beerstock-deckel-zurueck`), läuft unverändert weiter, denn für sie ist
     das ein ganz gewöhnlicher Aufruf von `./`.

     DER KLICK MUSS VERSCHLUCKT WERDEN. Ein kurzer Zug, der die Schwelle nicht
     erreicht, federt zurück — und der Browser schickt hinterher den
     synthetischen Klick auf den Griff, der dann doch hinausführte. Genau die
     Falle, die am Rückblick zwei Anläufe gekostet hat. `gezogen` fängt ihn;
     der nächste `touchstart` setzt den Merker wieder zurück.
     --------------------------------------------------------------------- */
  {
    const ZUG_AUF = 92, ZUG_SCHLUPF = 8, ZUG_VORSPRUNG = 1.5, ZUG_TAKT = 220;
    const ohneTakt = matchMedia('(prefers-reduced-motion: reduce)');
    const griff = document.querySelector('.raus-griff');
    const zieher = document.querySelector('.brett');
    let zug = null, gezogen = false;

    const raus = () => document.querySelector('.zur-tafel').click();

    /* --- Der Wechsel hinüber ------------------------------------------------
       Kann der Browser den dokumentübergreifenden Wechsel, übernimmt DER die
       restliche Strecke: die Tafel liegt dann schon darunter, während das
       Blatt wegfährt. Das eigene Wegfahren entfällt dabei — zwei Bewegungen
       hintereinander wären eine zu viel, und der Schnappschuss der alten Seite
       ist ohnehin genau so verschoben, wie der Finger sie hinterlassen hat.

       Gesagt wird der Tafel das über eine **einmalige Marke im
       `sessionStorage`**, genau wie beim Deckel-Rückweg (`ausDemDeckel` drüben).

       DER NAHELIEGENDE WEG WAR EIN ANDERER und ging nicht: die Norm sieht dafür
       `ev.viewTransition.types.add(…)` im `pageswap` vor, und das Set soll mit
       hinüberwandern. Gemessen (Chrome, Aug 2026) kommt es drüben LEER an — die
       Marke wurde nachweislich gesetzt (`wischtRaus=true`, `vt=true`), im
       `pagereveal` der Tafel war `types` trotzdem leer. Eine Geste, die von
       einer Norm abhängt, die der Browser halb umsetzt, ist keine; die Marke im
       Speicher tut dasselbe und ist nachweisbar.

       Ein Antippen des Griffs bleibt bewusst ohne Wechsel: was nicht gefahren
       ist, soll auch nicht nachfahren. Und herein geht es weiter ohne Wechsel —
       sonst bekäme der Weg VON der Tafel hierher die Vorgabe des Browsers, ein
       Überblenden. */
    const kannWechseln = () => 'onpagereveal' in window && !ohneTakt.matches;
    window.addEventListener('pagereveal', ev => {
      if (!ev.viewTransition) return;
      // `ready` platzt beim Abbrechen mit einem AbortError; unbeachtet stünde
      // er rot in der Konsole. Dieselbe Zeile steht drüben in `index.html`.
      ev.viewTransition.ready.catch(() => {});
      ev.viewTransition.skipTransition();
    });

    function zurueckfedern() {
      document.documentElement.classList.remove('zieht');
      zieher.style.transform = '';
      zug = null;
    }

    griff.addEventListener('click', () => {
      if (gezogen) { gezogen = false; return; }
      raus();
    });

    /* Die Zuhörer hängen unbedingt, nicht nur am Finger: ein Notebook mit
       Berührungsschirm meldet `pointer: fine` und hat trotzdem einen. Was die
       Medienabfrage entscheidet, ist allein, was zu SEHEN ist — dort die
       Pille, hier der Balken. Von einer Maus kommt ohnehin kein `touch`. */
    griff.addEventListener('touchstart', ev => {
      zug = null; gezogen = false;
      if (ev.touches.length !== 1) return;
      zug = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, achse: null, weg: 0 };
    }, { passive: true });

    // `passive: false`, weil das Gummiband des Browsers weg muss, sobald die
    // Bewegung uns gehört. Vorher NICHT — solange die Achse offen ist, könnte
    // es noch ein Querwisch werden.
    griff.addEventListener('touchmove', ev => {
      if (!zug) return;
      const t = ev.touches[0];
      const dx = t.clientX - zug.x, dy = t.clientY - zug.y;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) gezogen = true;
      if (zug.achse === null) {
        if (Math.abs(dx) > ZUG_SCHLUPF && Math.abs(dx) > Math.abs(dy)) { zug = null; return; }
        if (dy < -ZUG_SCHLUPF) { zug = null; return; }
        if (dy <= ZUG_SCHLUPF || dy <= Math.abs(dx) * ZUG_VORSPRUNG) return;
        zug.achse = 'runter';
        document.documentElement.classList.add('zieht');
      }
      ev.preventDefault();
      zug.weg = Math.max(0, dy - ZUG_SCHLUPF);
      zieher.style.transform = 'translateY(' + zug.weg + 'px)';
    }, { passive: false });

    griff.addEventListener('touchend', () => {
      if (!zug || zug.achse !== 'runter' || zug.weg < ZUG_AUF) { zurueckfedern(); return; }
      zug = null;
      document.documentElement.classList.remove('zieht');   // erst die Überblendung zurück, dann das Ziel
      if (navigator.vibrate) navigator.vibrate(12);
      if (ohneTakt.matches) { zurueckfedern(); raus(); return; }
      /* Die Verschiebung bleibt stehen, wo der Finger sie gelassen hat: der
         Wechsel drüben fährt von dort weiter. Siehe `kannWechseln` oben. */
      if (kannWechseln()) {
        try { sessionStorage.setItem('beerstock-wisch-raus', '1'); } catch (e) { /* Privatmodus */ }
        raus();
        return;
      }
      zieher.style.transform = 'translateY(' + window.innerHeight + 'px)';
      /* Eine Uhr, kein `transitionend`: fällt das Ereignis einmal aus, bliebe
         die Seite weggeschoben und leer stehen, ohne dass jemand hinauskäme. */
      setTimeout(raus, ZUG_TAKT);
    }, { passive: true });

    griff.addEventListener('touchcancel', zurueckfedern, { passive: true });
  }

  laden();
</script>
</body>
</html>
